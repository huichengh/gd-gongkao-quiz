<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>广东省考刷题 第009期 · 2026-11-22</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#15181f; --sub:#6b7280; --line:#e6e8ec;
  --primary:#2563eb; --primary-soft:#eff4ff;
  --ok:#15803d; --ok-bg:#f0fdf4; --ok-line:#86efac;
  --bad:#b91c1c; --bad-bg:#fef2f2; --bad-line:#fca5a5;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.6;
  font-family:"Microsoft YaHei","微软雅黑",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:30;background:rgba(244,245,247,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
}
.htop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{font-size:16px;font-weight:650;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:2px;letter-spacing:0}
.hstat{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.hstat b{font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.hstat .rate{font-weight:600;font-variant-numeric:tabular-nums}
.pbar{height:3px;background:#e3e5ea;border-radius:0 0 3px 3px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--primary);transition:width .35s ease}

/* ---------- 分组 ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#4b5563;
  padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;
  transition:.15s;
}
.tab:hover{border-color:#c9ced8}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- 题目卡 ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 22px 18px}
.qmeta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin-bottom:12px}
.qmeta .no{font-weight:600;color:var(--primary);background:var(--primary-soft);padding:2px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
.qmeta .sec{padding:2px 9px;background:#f3f4f6;border-radius:6px}
.star{
  margin-left:auto;background:none;border:0;padding:2px 6px;border-radius:7px;
  font-size:19px;line-height:1;color:#c3c8d2;cursor:pointer;transition:.15s;
  font-family:inherit;
}
.star:hover{background:#f3f4f6;color:#f59e0b}
.star.on{color:#f59e0b}
.qtext{font-size:17px;line-height:1.8;font-weight:500;letter-spacing:.1px;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:#fff;border:1.5px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:15.5px;line-height:1.65;color:var(--ink);
  cursor:pointer;transition:.14s;font-family:inherit;
}
.opt:hover:not(.done){border-color:#b9c2d0;background:#fafbfc}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:50%;background:#f1f2f4;color:#4b5563;
  font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;
  margin-top:1px;transition:.14s;
}
.opt .t{flex:1}
.opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.62}
.opt.done{cursor:default}

/* ---------- 解析 ---------- */
.exp{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px;display:none}
.exp.show{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.verdict{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:10px;padding:6px 11px;border-radius:8px;width:fit-content}
.verdict.ok{color:#166534;background:#dcfce7}
.verdict.bad{color:#b91c1c;background:#fee2e2}
.verdict .badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.75);color:#4b5563}
.expline{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.expline .lbl{
  flex:0 0 auto;font-size:11.5px;font-weight:600;color:#6b7280;background:#f3f4f6;
  padding:2px 7px;border-radius:5px;margin-top:2px;
}
.expline .val{font-size:14.5px;line-height:1.8;color:#111827}
.redo{margin-top:14px;font-size:12.5px;color:#4b5563;background:#f3f4f6;border:0;border-radius:7px;padding:6px 12px;cursor:pointer;font-family:inherit}
.redo:hover{background:#e9ebef}

/* ---------- 底部操作 ---------- */
footer{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));
}
.finner{max-width:820px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
  padding:10px 16px;font-size:14px;font-weight:550;cursor:pointer;font-family:inherit;
  transition:.14s;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:#b9c2d0;background:#fafbfc}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);flex:1}
.btn.primary:hover{background:#000}
.btn.ghost{flex:1}
.btn.icon{padding:10px 13px}

/* ---------- 答题卡 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,18,25,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex;animation:fade .18s ease}
.sheet{
  background:#fff;width:100%;max-width:820px;border-radius:18px 18px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;
}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;padding-bottom:2px;z-index:2}
.sheet h3{margin:0;font-size:15px;font-weight:650}
.sheet .close{font-size:12.5px;color:#4b5563;background:#f3f4f6;border-radius:7px;padding:5px 11px;cursor:pointer;user-select:none}
.sheet .close:hover{background:#e9ebef}
.sheet .legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin:8px 0 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.cell{
  position:relative;aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:#fbfbfc;
  font-size:12px;color:#6b7280;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-variant-numeric:tabular-nums;transition:.12s;
}
.cell:hover{transform:translateY(-1px)}
.cell.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok);font-weight:600}
.cell.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad);font-weight:600}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.fav::after{content:'★';position:absolute;top:0;right:2px;font-size:7.5px;color:#f59e0b;line-height:1.4}
.sheetbar{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:0;background:#fff;padding:12px 0 2px;box-shadow:0 -10px 18px 6px #fff}
.sheetbar .btn{flex:1;justify-content:center}
.hint{text-align:center;font-size:11.5px;color:#9ca3af;margin-top:14px;line-height:1.7}

@media (max-width:560px){
  .qcard{padding:18px 16px 14px;border-radius:14px}
  .qtext{font-size:16px}
  .opt{font-size:15px;padding:11px 12px}
  .grid{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>

</div>

州南沙","深圳前海","珠海横琴","东莞滨海湾"],"ans":"D","tag":"广东自贸区","exp":"广东自贸试验区由广州南沙、深圳前海蛇口、珠海横琴三个片区组成，东莞滨海湾新区不属于自贸区片区。"},{"n":17,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"深圳中国特色社会主义先行示范区的战略定位之一是（　）。","opts":["高质量发展高地","国际航运中心","国际金融中心","国际贸易中心"],"ans":"A","tag":"深圳先行示范区","exp":"深圳先行示范区五大战略定位为高质量发展高地、法治城市示范、城市文明典范、民生幸福标杆、可持续发展先锋。"},{"n":18,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"横琴粤澳深度合作区的发展定位之一是（　）。","opts":["促进澳门经济适度多元发展的新平台","国际航空枢纽","国际能源交易中心","国际粮食储运中心"],"ans":"A","tag":"横琴定位","exp":"横琴合作区四大定位为促进澳门经济适度多元发展的新平台、便利澳门居民生活就业的新空间、丰富“一国两制”实践的新示范、推动粤港澳大湾区建设的新高地。"},{"n":19,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东是著名侨乡，祖籍广东的海外华侨华人约（　）万人。","opts":["1000","2000","3000","4000"],"ans":"C","tag":"广东侨情","exp":"广东籍海外华侨华人约 3000 万人，分布在世界 160 多个国家和地区。"},{"n":20,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东“双十”战略性产业集群中，属于十大战略性支柱产业集群的是（　）。","opts":["半导体与集成电路","智能机器人","汽车","区块链与量子信息"],"ans":"C","tag":"广东双十集群","exp":"十大战略性支柱产业集群包括新一代电子信息、绿色石化、智能家电、汽车、先进材料等；半导体、机器人、区块链属于十大战略性新兴产业集群。"},{"n":21,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东的“三江”指（　）。","opts":["东江、西江、北江","韩江、榕江、练江","珠江、长江、韩江","北江、绥江、鉴江"],"ans":"A","tag":"广东水系","exp":"广东主要水系为珠江水系的东江、西江、北江，另有韩江、鉴江等独立入海水系。"},{"n":22,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东的最高峰是（　）。","opts":["石坑崆","罗浮山","丹霞山","白云山"],"ans":"A","tag":"广东地理","exp":"石坑崆位于韶关乳源与湖南交界，海拔 1902 米，是广东最高峰。"},{"n":23,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东被列入世界自然遗产的是（　）。","opts":["丹霞山","罗浮山","鼎湖山","西樵山"],"ans":"A","tag":"广东世界遗产","exp":"丹霞山 2010 年作为“中国丹霞”组成部分列入世界自然遗产；开平碉楼与村落列入世界文化遗产。"},{"n":24,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"“南海Ⅰ号”南宋沉船整体打捞后安放在（　）。","opts":["阳江","湛江","汕头","珠海"],"ans":"A","tag":"广东海丝","exp":"“南海Ⅰ号”安放在阳江广东海上丝绸之路博物馆，是海上丝绸之路重要史迹。"},{"n":25,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东少数民族人口最多的民族是（　）。","opts":["瑶族","壮族","畲族","回族"],"ans":"B","tag":"广东民族","exp":"广东少数民族人口以壮族最多，主要分布在粤北、粤西，连山、连南为壮族瑶族自治县。"},{"n":26,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东的“粤东西北”中，粤东地区不包括（　）。","opts":["汕头","潮州","揭阳","梅州"],"ans":"D","tag":"广东区域划分","exp":"梅州属粤北地区；粤东指汕头、汕尾、潮州、揭阳四市。"},{"n":27,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"深圳建设中国特色社会主义先行示范区提出的“五个率先”中，不包括（　）。","opts":["率先建设体现高质量发展要求的现代化经济体系","率先营造彰显公平正义的民主法治环境","率先塑造展现社会主义文化繁荣兴盛的现代城市文明","率先实现全域城市化"],"ans":"D","tag":"深圳五个率先","exp":"“五个率先”为现代化经济体系、民主法治环境、现代城市文明、共建共治共享共同富裕的民生发展格局、人与自然和谐共生的美丽中国典范，不含全域城市化。"},{"n":28,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东自贸试验区中，广州南沙片区的战略定位重点是（　）。","opts":["面向世界的粤港澳全面合作示范区","国际旅游岛","中医药科技产业园","国际能源交易中心"],"ans":"A","tag":"南沙定位","exp":"南沙片区打造粤港澳全面合作示范区、国际航运枢纽；前海蛇口重点在现代服务业和金融创新；横琴重点在中医药科技产业园、文旅等。"},{"n":29,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"港珠澳大桥连接的城市是（　）。","opts":["香港、珠海、澳门","香港、深圳、澳门","香港、中山、澳门","深圳、珠海、澳门"],"ans":"A","tag":"港珠澳大桥","exp":"港珠澳大桥东起香港口岸人工岛，西至珠海、澳门，全长 55 公里，2018 年 10 月通车。"},{"n":30,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东的重大合作平台中，位于汕头的是（　）。","opts":["前海深港现代服务业合作区","南沙粤港澳全面合作示范区","华侨经济文化合作试验区","横琴粤澳深度合作区"],"ans":"C","tag":"广东合作平台","exp":"汕头华侨经济文化合作试验区是全国唯一以“华侨”和“文化”为核心概念的国家级发展平台。"},{"n":31,"part":"常识判断","sec":"法律常识","q":"《民法典》规定，自然人的民事权利能力始于（　）。","opts":["出生","满 8 周岁","满 18 周岁","取得户籍"],"ans":"A","tag":"民法典 民事权利能力","exp":"自然人从出生时起到死亡时止具有民事权利能力，一律平等。"},{"n":32,"part":"常识判断","sec":"法律常识","q":"《民法典》规定，8 周岁以上的未成年人为（　）。","opts":["无民事行为能力人","限制民事行为能力人","完全民事行为能力人","视为完全民事行为能力人"],"ans":"B","tag":"民法典 行为能力","exp":"8 周岁以上未成年人为限制民事行为能力人；不满 8 周岁为无民事行为能力人。"},{"n":33,"part":"常识判断","sec":"法律常识","q":"《民法典》规定，失踪人下落不明满（　）年的，利害关系人可以申请宣告失踪。","opts":["1","2","3","4"],"ans":"B","tag":"民法典 宣告失踪","exp":"下落不明满 2 年可申请宣告失踪；满 4 年或因意外事故下落不明满 2 年可申请宣告死亡。"},{"n":34,"part":"常识判断","sec":"法律常识","q":"《民法典》规定，一般诉讼时效期间为（　）年。","opts":["1","2","3","5"],"ans":"C","tag":"民法典 诉讼时效","exp":"向人民法院请求保护民事权利的诉讼时效期间为 3 年，自权利人知道或应当知道权利受损害及义务人之日起计算。"},{"n":35,"part":"常识判断","sec":"法律常识","q":"《民法典》规定，下列属于用益物权的是（　）。","opts":["抵押权","质权","土地承包经营权","留置权"],"ans":"C","tag":"民法典 物权类型","exp":"用益物权包括土地承包经营权、建设用地使用权、宅基地使用权、居住权、地役权；抵押、质权、留置为担保物权。"},{"n":36,"part":"常识判断","sec":"法律常识","q":"《民法典》规定，居住权自（　）时设立。","opts":["合同成立","登记","交付","公证"],"ans":"B","tag":"民法典 居住权","exp":"设立居住权的，应当向登记机构申请居住权登记，居住权自登记时设立。"},{"n":37,"part":"常识判断","sec":"法律常识","q":"《民法典》规定，不动产物权的设立、变更、转让和消灭，经依法（　）发生效力。","opts":["交付","登记","公证","合同生效"],"ans":"B","tag":"民法典 不动产登记","exp":"不动产物权变动以登记为生效要件；动产物权变动以交付为生效要件。"},{"n":38,"part":"常识判断","sec":"法律常识","q":"《民法典》规定，下列遗嘱形式中只能在危急情况下设立的是（　）。","opts":["自书遗嘱","代书遗嘱","打印遗嘱","口头遗嘱"],"ans":"D","tag":"民法典 遗嘱形式","exp":"口头遗嘱只能在危急情况下设立，危急情况消除后能以书面或录音录像形式立遗嘱的，口头遗嘱无效。"},{"n":39,"part":"常识判断","sec":"法律常识","q":"《民法典》规定，法定继承第一顺序继承人是（　）。","opts":["配偶、子女、父母","兄弟姐妹、祖父母","外祖父母、孙子女","配偶、兄弟姐妹"],"ans":"A","tag":"民法典 法定继承","exp":"第一顺序为配偶、子女、父母；第二顺序为兄弟姐妹、祖父母、外祖父母。"},{"n":40,"part":"常识判断","sec":"法律常识","q":"《民法典》规定，离婚冷静期为（　）日。","opts":["15","30","45","60"],"ans":"B","tag":"民法典 离婚冷静期","exp":"自婚姻登记机关收到离婚登记申请之日起 30 日内，任何一方不愿离婚的可以撤回申请。"},{"n":41,"part":"常识判断","sec":"法律常识","q":"《行政许可法》规定，除可以当场作出行政许可决定的外，行政机关应当自受理申请之日起（　）日内作出决定。","opts":["10","15","20","30"],"ans":"C","tag":"行政许可法 期限","exp":"一般应当自受理之日起 20 日内作出行政许可决定，法律、法规另有规定的除外。"},{"n":42,"part":"常识判断","sec":"法律常识","q":"《行政许可法》规定，下列事项可以不设行政许可的是（　）。","opts":["直接关系人身健康的产品","有限自然资源开发利用","公民能够自主决定的事项","直接关系公共安全的活动"],"ans":"C","tag":"行政许可法 设定范围","exp":"公民、法人或其他组织能够自主决定的，市场竞争机制能够有效调节的，行业组织能够自律管理的，可不设行政许可。"},{"n":43,"part":"常识判断","sec":"法律常识","q":"《行政处罚法》规定，违法行为在（　）年内未被发现的，一般不再给予行政处罚。","opts":["1","2","3","5"],"ans":"B","tag":"行政处罚法 追责时效","exp":"一般违法行为 2 年内未被发现不再处罚；涉及公民生命健康安全、金融安全且有危害后果的为 5 年。"},{"n":44,"part":"常识判断","sec":"法律常识","q":"《行政处罚法》规定，限制人身自由的行政处罚权只能由（　）行使。","opts":["公安机关","人民法院","人民检察院","行政机关"],"ans":"A","tag":"行政处罚法 人身自由","exp":"限制人身自由的行政处罚权只能由公安机关和法律规定的其他机关行使。"},{"n":45,"part":"常识判断","sec":"法律常识","q":"《行政强制法》规定，查封、扣押的期限一般不得超过（　）日。","opts":["15","30","45","60"],"ans":"B","tag":"行政强制法 期限","exp":"查封、扣押期限不得超过 30 日，情况复杂的经批准可以延长，延长期限不得超过 30 日。"},{"n":46,"part":"常识判断","sec":"法律常识","q":"《行政复议法》规定，公民认为行政行为侵犯其合法权益的，可以自知道该行为之日起（　）日内申请行政复议。","opts":["30","60","90","180"],"ans":"B","tag":"行政复议法 申请期限","exp":"申请行政复议的期限为自知道该行政行为之日起 60 日内。"},{"n":47,"part":"常识判断","sec":"法律常识","q":"《行政诉讼法》规定，直接向人民法院起诉的，应当自知道或者应当知道作出行政行为之日起（　）个月内提出。","opts":["3","6","9","12"],"ans":"B","tag":"行政诉讼法 起诉期限","exp":"直接起诉的期限为 6 个月；经复议的，自收到复议决定书之日起 15 日内起诉。"},{"n":48,"part":"常识判断","sec":"法律常识","q":"我国宪法规定，全国人民代表大会每届任期（　）年。","opts":["3","4","5","6"],"ans":"C","tag":"宪法 全国人大任期","exp":"全国人大每届任期 5 年，全国人大常委会委员长、副委员长连续任职不得超过两届。"},{"n":49,"part":"常识判断","sec":"法律常识","q":"我国宪法规定，有权修改宪法的机关是（　）。","opts":["全国人民代表大会","全国人大常委会","国家主席","国务院"],"ans":"A","tag":"宪法 修宪权","exp":"全国人大有权修改宪法，由全国人大常委会或五分之一以上全国人大代表提议，经全体代表三分之二以上多数通过。"},{"n":50,"part":"常识判断","sec":"法律常识","q":"我国宪法规定，“人身自由不受侵犯”属于公民基本权利中的（　）。","opts":["政治权利","人身自由权","社会经济权利","文化教育权利"],"ans":"B","tag":"宪法 基本权利","exp":"人身自由权包括人身自由不受侵犯、人格尊严不受侵犯、住宅不受侵犯、通信自由和通信秘密受法律保护。"},{"n":51,"part":"常识判断","sec":"经济常识","q":"在其他条件不变的情况下，某商品价格上升，其需求量一般会（　）。","opts":["增加","减少","不变","先增后减"],"ans":"B","tag":"微观 需求定律","exp":"需求定律表明价格与需求量反向变动（吉芬商品等例外）。"},{"n":52,"part":"常识判断","sec":"经济常识","q":"当某商品的替代品价格上升时，该商品的需求量一般会（　）。","opts":["增加","减少","不变","无法判断"],"ans":"A","tag":"微观 替代品","exp":"替代品价格上升，消费者转向购买该商品，需求增加。"},{"n":53,"part":"常识判断","sec":"经济常识","q":"国内生产总值（GDP）核算中，下列不计入当年 GDP 的是（　）。","opts":["当年新生产的汽车","当年提供的家政服务","二手车交易额","当年出口的商品"],"ans":"C","tag":"宏观 GDP 核算","exp":"GDP 只核算当年新生产的最终产品和劳务，二手车交易只计中介服务费增量。"},{"n":54,"part":"常识判断","sec":"经济常识","q":"衡量居民生活消费品价格水平变动的指标是（　）。","opts":["CPI","PPI","GDP 平减指数","PMI"],"ans":"A","tag":"宏观 CPI","exp":"CPI 为居民消费价格指数，反映居民购买生活消费品和服务价格水平的变动。"},{"n":55,"part":"常识判断","sec":"经济常识","q":"中央银行提高存款准备金率，通常属于（　）政策。","opts":["扩张性货币","紧缩性货币","扩张性财政","紧缩性财政"],"ans":"B","tag":"宏观 货币政策","exp":"提高存款准备金率减少商业银行可贷资金，属于紧缩性货币政策。"},{"n":56,"part":"常识判断","sec":"经济常识","q":"政府增加基础设施投资、减少税收，属于（　）政策。","opts":["扩张性财政","紧缩性财政","扩张性货币","紧缩性货币"],"ans":"A","tag":"宏观 财政政策","exp":"增加政府支出、减税属于扩张性（积极）财政政策。"},{"n":57,"part":"常识判断","sec":"经济常识","q":"通货膨胀时期，一般不宜采取的措施是（　）。","opts":["提高利率","减少政府支出","增加货币供应量","提高存款准备金率"],"ans":"C","tag":"宏观 通胀治理","exp":"通胀时应收紧货币供应，增加货币供应会进一步推高物价。"},{"n":58,"part":"常识判断","sec":"经济常识","q":"在国际收支中，货物和服务的进出口记录在（　）账户。","opts":["经常","资本","金融","储备"],"ans":"A","tag":"国际 国际收支","exp":"经常账户包括货物、服务、初次收入和二次收入；资本与金融账户记录资本转移和投资。"},{"n":59,"part":"常识判断","sec":"经济常识","q":"人民币汇率上升（升值），对出口的影响一般是（　）。","opts":["有利","不利","无影响","先利后不利"],"ans":"B","tag":"国际 汇率","exp":"本币升值使出口商品外币价格上升，削弱出口竞争力。"},{"n":60,"part":"常识判断","sec":"经济常识","q":"下列属于财政政策工具的是（　）。","opts":["公开市场操作","再贴现率","政府购买","存款准备金率"],"ans":"C","tag":"宏观 财政工具","exp":"财政政策工具包括税收、政府购买、转移支付、国债；其余三项属货币政策工具。"},{"n":61,"part":"常识判断","sec":"科技与生活","q":"我国“北斗三号”全球卫星导航系统正式建成开通是在（　）年。","opts":["2018","2020","2021","2022"],"ans":"B","tag":"航天 北斗系统","exp":"2020 年 7 月 31 日北斗三号全球卫星导航系统正式开通。"},{"n":62,"part":"常识判断","sec":"科技与生活","q":"“天问一号”火星探测器的着陆巡视器名为（　）。","opts":["玉兔号","祝融号","嫦娥号","悟空号"],"ans":"B","tag":"航天 火星探测","exp":"天问一号着陆巡视器为“祝融号”火星车；“玉兔”为月球车。"},{"n":63,"part":"常识判断","sec":"科技与生活","q":"我国空间站的基本构型为（　）舱段。","opts":["两舱","三舱","四舱","五舱"],"ans":"B","tag":"航天 空间站","exp":"中国空间站基本构型为天和核心舱、问天实验舱、梦天实验舱三舱 T 字构型。"},{"n":64,"part":"常识判断","sec":"科技与生活","q":"“奋斗者”号载人潜水器最大下潜深度超过（　）米。","opts":["7000","8000","10000","11000"],"ans":"C","tag":"深海探测","exp":"“奋斗者”号 2020 年在马里亚纳海沟坐底 10909 米。"},{"n":65,"part":"常识判断","sec":"科技与生活","q":"我国自主研制的“华龙一号”属于（　）。","opts":["第三代核电技术","第二代核电技术","第四代核电技术","聚变堆技术"],"ans":"A","tag":"能源 核电","exp":"华龙一号是我国具有完全自主知识产权的三代压水堆核电技术。"},{"n":66,"part":"常识判断","sec":"科技与生活","q":"光伏发电的核心原理是（　）。","opts":["光电效应","热电效应","电磁感应","压电效应"],"ans":"A","tag":"新能源 光伏","exp":"光伏电池利用半导体 PN 结的光生伏特效应（光电效应）把光能直接转换为电能。"},{"n":67,"part":"常识判断","sec":"科技与生活","q":"下列不属于新污染物治理重点的是（　）。","opts":["持久性有机污染物","内分泌干扰物","抗生素","二氧化碳"],"ans":"D","tag":"生态 新污染物","exp":"新污染物治理重点包括持久性有机污染物、内分泌干扰物、抗生素、微塑料；二氧化碳属温室气体，另按碳达峰碳中和路径管理。"},{"n":68,"part":"常识判断","sec":"科技与生活","q":"人体最大的器官是（　）。","opts":["肝脏","皮肤","肺","小肠"],"ans":"B","tag":"生物 人体","exp":"皮肤是人体面积最大、重量最大的器官。"},{"n":69,"part":"常识判断","sec":"科技与生活","q":"正常情况下，成年人的心脏每分钟跳动约（　）次。","opts":["30—50","60—100","100—120","120—150"],"ans":"B","tag":"生物 人体","exp":"成年人静息心率正常范围为 60—100 次/分。"},{"n":70,"part":"常识判断","sec":"科技与生活","q":"流感疫苗建议每年接种，主要原因是（　）。","opts":["疫苗有效期仅一年","流感病毒易发生变异","接种后免疫力逐年下降至零","每年病毒种类完全不同"],"ans":"B","tag":"生物 免疫","exp":"流感病毒抗原变异快，每年流行株可能不同，因此需每年接种当季疫苗。"},{"n":71,"part":"常识判断","sec":"科技与生活","q":"下列生活常识正确的是（　）。","opts":["铁锅炒菜后应及时清洗并擦干","铝制餐具可长期盛放酸性食物","不锈钢容器可长时间存放食醋","彩色陶瓷餐具均可放入微波炉"],"ans":"A","tag":"生活 化学","exp":"铁锅用后擦干可防锈；铝制餐具不宜盛放酸性食物，不锈钢不宜长时间存放酸性食品。"},{"n":72,"part":"常识判断","sec":"科技与生活","q":"地震发生时，若在室内高层，正确的避险方式是（　）。","opts":["躲到坚固家具旁或承重墙角落","乘电梯迅速下楼","跳窗逃生","站在窗户旁观察"],"ans":"A","tag":"生活 应急","exp":"室内避险应伏地、遮挡、手抓牢，躲在坚固家具旁或承重墙内墙角，不可乘电梯、不可跳窗。"},{"n":73,"part":"常识判断","sec":"人文历史","q":"“罢黜百家，独尊儒术”的提出者是（　）。","opts":["司马迁","贾谊","董仲舒","公孙弘"],"ans":"C","tag":"汉代 思想","exp":"董仲舒向汉武帝提出“罢黜百家，独尊儒术”，儒学成为正统思想。"},{"n":74,"part":"常识判断","sec":"人文历史","q":"西汉时期出使西域、开辟丝绸之路的是（　）。","opts":["班超","卫青","张骞","霍去病"],"ans":"C","tag":"汉代 丝绸之路","exp":"张骞两次出使西域（前 138 年、前 119 年），为丝绸之路开辟奠定基础。"},{"n":75,"part":"常识判断","sec":"人文历史","q":"《史记》的作者是（　）。","opts":["班固","司马光","司马迁","陈寿"],"ans":"C","tag":"汉代 史学","exp":"《史记》为司马迁所著，是我国第一部纪传体通史；《汉书》为班固，《资治通鉴》为司马光。"},{"n":76,"part":"常识判断","sec":"人文历史","q":"唐朝推行的、改变以人丁为主征税标准的赋税制度是（　）。","opts":["均田制","一条鞭法","两税法","摊丁入亩"],"ans":"C","tag":"唐代 两税法","exp":"唐德宗时杨炎推行两税法，按资产和田亩征税，改变了以人丁为主的征税标准。"},{"n":77,"part":"常识判断","sec":"人文历史","q":"我国现存最早的一部完整农书是（　）。","opts":["《天工开物》","《农政全书》","《齐民要术》","《本草纲目》"],"ans":"C","tag":"古代科技","exp":"北魏贾思勰《齐民要术》是我国现存最早最完整的农书。"},{"n":78,"part":"常识判断","sec":"人文历史","q":"北宋王安石变法中，意在增加政府收入、限制高利贷的措施是（　）。","opts":["将兵法","保甲法","青苗法","科举改革"],"ans":"C","tag":"宋代 王安石变法","exp":"青苗法在青黄不接时由官府贷款给农民，收取二分利息，既抑制高利贷又增加财政收入。"},{"n":79,"part":"常识判断","sec":"人文历史","q":"明代郑和下西洋最远到达（　）。","opts":["印度洋沿岸","美洲西海岸","非洲东海岸和红海沿岸","地中海沿岸"],"ans":"C","tag":"明代 郑和下西洋","exp":"郑和七下西洋（1405—1433），最远到达非洲东海岸和红海沿岸。"},{"n":80,"part":"常识判断","sec":"人文历史","q":"《南京条约》中被割让给英国的是（　）。","opts":["九龙","澳门","香港岛","台湾岛"],"ans":"C","tag":"近代 南京条约","exp":"1842 年《南京条约》割香港岛给英国；1860 年《北京条约》割九龙司地方一区。"},{"n":81,"part":"常识判断","sec":"人文历史","q":"新文化运动兴起的标志是（　）。","opts":["北京大学成立","五四运动爆发","《狂人日记》发表","《新青年》创刊"],"ans":"D","tag":"近代 新文化运动","exp":"1915 年陈独秀在上海创办《青年杂志》（后改名《新青年》），标志新文化运动兴起。"},{"n":82,"part":"常识判断","sec":"人文历史","q":"被誉 （　）。","opts":["理性认识依赖于感性认识，感性认识有待于上升为理性认识","感性认识依赖于理性认识","二者相互排斥","二者没有联系"],"ans":"A","tag":"马原 认识过程","exp":"感性认识是认识的初级阶段，理性认识是高级阶段，二者相互依赖、相互渗透。"},{"n":124,"part":"政治理论","sec":"马克思主义基本原理","q":"检验真理的唯一标准是（　）。","opts":["实践","多数人的意见","权威的判断","逻辑的自洽"],"ans":"A","tag":"马原 真理标准","exp":"实践是检验真理的唯一标准，这是由真理的本性和实践的特点决定的。"},{"n":125,"part":"政治理论","sec":"马克思主义基本原理","q":"社会存在与社会意识的关系是（　）。","opts":["社会存在决定社会意识，社会意识具有相对独立性","社会意识决定社会存在","二者平行发展","社会意识总是滞后于社会存在"],"ans":"A","tag":"马原 唯物史观","exp":"社会存在决定社会意识，社会意识反作用于社会存在，具有相对独立性。"},{"n":126,"part":"政治理论","sec":"马克思主义基本原理","q":"人类社会存在和发展的基础是（　）。","opts":["物质资料生产","人口生产","自然环境","社会意识"],"ans":"A","tag":"马原 社会存在","exp":"物质资料生产是人类社会存在和发展的基础，人口和地理环境是必要条件。"},{"n":127,"part":"政治理论","sec":"马克思主义基本原理","q":"生产关系中起决定作用的是（　）。","opts":["产品分配关系","生产资料所有制关系","人们在生产中的地位","交换关系"],"ans":"B","tag":"马原 生产关系","exp":"生产关系包括生产资料所有制、人们在生产中的地位和相互关系、产品分配关系，其中所有制是基础。"},{"n":128,"part":"政治理论","sec":"马克思主义基本原理","q":"社会基本矛盾是（　）。","opts":["阶级斗争的矛盾","生产力和生产关系、经济基础和上层建筑的矛盾","城乡之间的矛盾","脑力劳动和体力劳动的矛盾"],"ans":"B","tag":"马原 社会基本矛盾","exp":"社会基本矛盾是生产力和生产关系、经济基础和上层建筑的矛盾，是社会发展的根本动力。"},{"n":129,"part":"政治理论","sec":"马克思主义基本原理","q":"马克思主义政治经济学的核心是（　）。","opts":["劳动价值论","剩余价值理论","资本积累理论","经济危机理论"],"ans":"B","tag":"马原 剩余价值","exp":"剩余价值理论是马克思政治经济学的基石和核心，揭示了资本主义剥削的实质。"},{"n":130,"part":"政治理论","sec":"马克思主义基本原理","q":"绝对剩余价值生产与相对剩余价值生产的区别在于（　）。","opts":["前者靠提高劳动生产率，后者靠延长工作日","前者靠延长工作日，后者靠提高劳动生产率","二者完全相同","前者只存在于早期资本主义"],"ans":"B","tag":"马原 剩余价值生产","exp":"绝对剩余价值靠延长工作日或提高劳动强度；相对剩余价值靠提高社会劳动生产率、缩短必要劳动时间。"},{"n":131,"part":"政治理论","sec":"毛泽东思想","q":"毛泽东思想活的灵魂是（　）。","opts":["实事求是、艰苦奋斗、自力更生","实事求是、群众路线、独立自主","解放思想、实事求是、与时俱进","理论联系实际、密切联系群众、批评与自我批评"],"ans":"B","tag":"毛概 活的灵魂","exp":"毛泽东思想活的灵魂是实事求是、群众路线、独立自主，其中实事求是是精髓、群众路线是根本工作路线、独立自主是根本立足点。"},{"n":132,"part":"政治理论","sec":"毛泽东思想","q":"中国新民主主义革命的三大法宝是（　）。","opts":["土地革命、武装斗争、根据地建设","统一战线、武装斗争、党的建设","实事求是、群众路线、独立自主","农村包围城市、武装夺取政权"],"ans":"B","tag":"毛概 三大法宝","exp":"统一战线、武装斗争、党的建设是中国革命克敌制胜的三大法宝。"},{"n":133,"part":"政治理论","sec":"毛泽东思想","q":"中国革命的中心问题是（　）。","opts":["农民问题","无产阶级领导权问题","武装斗争问题","统一战线问题"],"ans":"B","tag":"毛概 领导权","exp":"无产阶级领导权是中国革命的中心问题，也是新民主主义革命理论的核心问题。"},{"n":134,"part":"政治理论","sec":"毛泽东思想","q":"新民主主义革命经济纲领中，没收官僚资本归国家所有具有（　）。","opts":["只具有民主革命性质","民主革命和社会主义革命的双重性质","只具有社会主义革命性质","只有政治意义"],"ans":"B","tag":"毛概 经济纲领","exp":"没收官僚资本具有双重性质：一方面属于民主革命，另一方面带有社会主义革命性质，因为官僚资本是垄断资本。"},{"n":135,"part":"政治理论","sec":"毛泽东思想","q":"“农村包围城市、武装夺取政权”道路形成的现实依据是（　）。","opts":["苏联经验的直接移植","中国半殖民地半封建社会的基本国情","共产国际的指示","西方民主革命的一般规律"],"ans":"B","tag":"毛概 革命道路","exp":"中国政治经济发展不平衡、敌人统治力量在城市强大而在农村薄弱，决定了农村包围城市道路。"},{"n":136,"part":"政治理论","sec":"毛泽东思想","q":"我国社会主义改造中，对资本主义工商业采取的政策是（　）。","opts":["无偿没收","和平赎买","强制征购","放任自流"],"ans":"B","tag":"毛概 三大改造","exp":"对资本主义工商业采取利用、限制、改造的政策，实行和平赎买，通过国家资本主义形式逐步过渡。"},{"n":137,"part":"政治理论","sec":"毛泽东思想","q":"《论十大关系》提出的基本方针是（　）。","opts":["以阶级斗争为纲","调动一切积极因素为社会主义事业服务","以农业为基础","按劳分配"],"ans":"B","tag":"毛概 论十大关系","exp":"1956 年《论十大关系》提出调动一切积极因素为社会主义事业服务的基本方针，标志着党开始探索中国自己的建设道路。"},{"n":138,"part":"政治理论","sec":"毛泽东思想","q":"《关于正确处理人民内部矛盾的问题》指出，社会主义社会的基本矛盾是（　）。","opts":["阶级斗争的矛盾","生产关系和生产力、上层建筑和经济基础之间的矛盾","敌我矛盾","城乡矛盾"],"ans":"B","tag":"毛概 两类矛盾","exp":"毛泽东指出社会主义社会基本矛盾仍然是生产关系和生产力、上层建筑和经济基础之间的矛盾，但性质不同，可以经过社会主义制度本身不断调整。"},{"n":139,"part":"政治理论","sec":"毛泽东思想","q":"党的群众路线的核心内容是（　）。","opts":["谦虚谨慎，戒骄戒躁","一切为了群众，一切依靠群众，从群众中来，到群众中去","自力更生，艰苦奋斗","批评与自我批评"],"ans":"B","tag":"毛概 群众路线","exp":"群众路线即一切为了群众、一切依靠群众，从群众中来、到群众中去。"},{"n":140,"part":"政治理论","sec":"毛泽东思想","q":"毛泽东思想被确立为党的指导思想是在（　）。","opts":["党的六大","党的七大","党的八大","遵义会议"],"ans":"B","tag":"毛概 七大","exp":"1945 年党的七大确立毛泽东思想为党的指导思想并写入党章。"},{"n":141,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"中国特色社会主义理论体系不包括（　）。","opts":["邓小平理论","三个代表重要思想","科学发展观","毛泽东思想"],"ans":"D","tag":"中特 体系范围","exp":"中国特色社会主义理论体系包括邓小平理论、三个代表重要思想、科学发展观、习近平新时代中国特色社会主义思想，不含毛泽东思想。"},{"n":142,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"社会主义的本质是（　）。","opts":["以公有制为主体","解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕","按劳分配","人民当家作主"],"ans":"B","tag":"中特 社会主义本质","exp":"1992 年南方谈话中邓小平概括社会主义本质为解放生产力、发展生产力，消灭剥削、消除两极分化，最终达到共同富裕。"},{"n":143,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"我国经济体制改革的目标是建立（　）。","opts":["计划经济体制","社会主义市场经济体制","自由市场经济体制","混合经济体制"],"ans":"B","tag":"中特 市场经济","exp":"党的十四大确立我国经济体制改革的目标是建立社会主义市场经济体制。"},{"n":144,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"“三个代表”重要思想的本质是（　）。","opts":["解放思想、实事求是","立党为公、执政为民","与时俱进","依法治国"],"ans":"B","tag":"中特 三个代表","exp":"“三个代表”重要思想的核心是保持党的先进性，本质是立党为公、执政为民。"},{"n":145,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"科学发展观的核心是（　）。","opts":["全面协调可持续","以人为本","统筹兼顾","发展"],"ans":"B","tag":"中特 科学发展观","exp":"科学发展观第一要义是发展，核心是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。"},{"n":146,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"邓小平提出的“三步走”发展战略中，第二步目标是（　）。","opts":["解决温饱","达到小康","达到中等发达国家水平","基本实现现代化"],"ans":"B","tag":"中特 三步走","exp":"第一步 1981—1990 解决温饱，第二步 1991—20 世纪末达到小康，第三步到下世纪中叶达到中等发达国家水平。"},{"n":147,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"我国社会主义初级阶段的基本经济制度是（　）。","opts":["单一公有制","公有制为主体、多种所有制经济共同发展","完全私有化","以个体经济为主体"],"ans":"B","tag":"中特 基本经济制度","exp":"公有制为主体、多种所有制经济共同发展是我国基本经济制度。"},{"n":148,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"党的基本路线的核心内容是（　）。","opts":["四项基本原则","一个中心、两个基本点","改革开放","自力更生"],"ans":"B","tag":"中特 基本路线","exp":"基本路线核心是一个中心、两个基本点，即以经济建设为中心，坚持四项基本原则、坚持改革开放。"},{"n":149,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"“一国两制”构想最早是为解决（　）问题提出的。","opts":["香港","台湾","澳门","西藏"],"ans":"B","tag":"中特 一国两制","exp":"“一国两制”构想最初为解决台湾问题提出，首先运用于香港、澳门回归。"},{"n":150,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"社会主义民主政治的本质和核心是（　）。","opts":["依法治国","人民当家作主","党的领导","民主集中制"],"ans":"B","tag":"中特 民主政治","exp":"人民当家作主是社会主义民主政治的本质和核心，党的领导是根本保证，依法治国是基本方式。"},{"n":151,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"中国特色社会主义最本质的特征是（　）。","opts":["公有制为主体","中国共产党领导","人民当家作主","共同富裕"],"ans":"B","tag":"习思想 党的领导","exp":"中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导。"},{"n":152,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"我国社会主要矛盾在新时代已转化为（　）。","opts":["人民日益增长的物质文化需要同落后的社会生产之间的矛盾","人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","阶级矛盾","生产力与生产关系的矛盾"],"ans":"B","tag":"习思想 主要矛盾","exp":"党的十九大作出判断：我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。"},{"n":153,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"新时代我国发展的总任务是（　）。","opts":["实现共同富裕","全面建成小康社会","实现社会主义现代化和中华民族伟大复兴","建设现代化经济体系"],"ans":"C","tag":"习思想 总任务","exp":"坚持和发展中国特色社会主义的总任务是实现社会主义现代化和中华民族伟大复兴，在本世纪中叶建成社会主义现代化强国。"},{"n":154,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"全面建成社会主义现代化强国分两步走，第一步是（　）。","opts":["从 2035 年到 2045 年建成中等发达国家","从 2020 年到 2030 年建成现代化经济体系","从 2020 年到 2035 年基本实现社会主义现代化","从 2020 年到 2025 年实现共同富裕"],"ans":"C","tag":"习思想 两步走","exp":"第一步 2020—2035 基本实现社会主义现代化；第二步 2035—本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。"},{"n":155,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"新发展理念的内容是（　）。","opts":["改革、发展、稳定、和谐","创新、协调、绿色、开放、共赢","创新、协调、绿色、开放、共享","高质量、高效率、公平、可持续"],"ans":"C","tag":"习思想 新发展理念","exp":"新发展理念为创新、协调、绿色、开放、共享，是管全局、管根本、管长远的导向。"},{"n":156,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"构建新发展格局的战略基点是（　）。","opts":["增加投资","扩大出口","扩大内需","引进外资"],"ans":"C","tag":"习思想 新发展格局","exp":"构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，战略基点是扩大内需。"},{"n":157,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"推动高质量发展的主题和主线分别是（　）。","opts":["主题是发展，主线是开放","主题是改革，主线是创新","主题是高质量发展，主线是深化供给侧结构性改革","主题是共同富裕，主线是扩大内需"],"ans":"C","tag":"习思想 高质量发展","exp":"以推动高质量发展为主题，以深化供给侧结构性改革为主线，以改革创新为根本动力。"},{"n":158,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"全面依法治国的总目标是（　）。","opts":["建立完备的法律规范","实现司法独立","建设中国特色社会主义法治体系、建设社会主义法治国家","实现人人守法"],"ans":"C","tag":"习思想 依法治国","exp":"全面依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。"},{"n":159,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"“四个全面”战略布局中居于引领地位的是（　）。","opts":["全面依法治国","全面深化改革","全面建设社会主义现代化国家","全面从严治党"],"ans":"C","tag":"习思想 四个全面","exp":"全面建设社会主义现代化国家是战略目标，居于引领地位；全面深化改革、全面依法治国、全面从严治党是三大战略举措。"},{"n":160,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"总体国家安全观的宗旨是（　）。","opts":["经济安全","政治安全","人民安全","军事安全"],"ans":"C","tag":"习思想 国家安全","exp":"总体国家安全观以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事科技文化社会安全为保障，以促进国际安全为依托。"},{"n":161,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"总体国家安全观的根本是（　）。","opts":["经济安全","人民安全","政治安全","社会安全"],"ans":"C","tag":"习思想 政治安全","exp":"以政治安全为根本，核心是政权安全和制度安全。"},{"n":162,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"“两个确立” const KEY = 'gdquiz-' + QUIZ.meta.id;
const $ = s => document.querySelector(s);

const FKEY = KEY + '-fav';

let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ answers = {}; }

let favs = {};
try { favs = JSON.parse(localStorage.getItem(FKEY) || '{}'); } catch(e){ favs = {}; }

let list = QUIZ.questions.slice();   // 当前筛选后的题序
let pos = 0;                          // 在 list 中的位置
let filter = 'all';                   // all / 小节名 / fav
let favTab = null;

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(answers)); }catch(e){} }
function saveFav(){ try{ localStorage.setItem(FKEY, JSON.stringify(favs)); }catch(e){} }

function stats(){
  const total = QUIZ.questions.length;
  let done = 0, right = 0;
  QUIZ.questions.forEach(q => {
    const a = answers[q.n];
    if(a){ done++; if(a === q.ans) right++; }
  });
  return {total, done, right, rate: done ? Math.round(right/done*100) : null};
}

function refreshHeader(){
  const s = stats();
  $('#totalN').textContent = s.total;
  $('#doneN').textContent = s.done;
  const r = $('#rate');
  if(s.rate === null){ r.textContent = '—'; r.style.color = '#9ca3af'; }
  else {
    r.textContent = s.rate + '%';
    r.style.color = s.rate >= 80 ? '#15803d' : (s.rate >= 60 ? '#b45309' : '#b91c1c');
  }
  $('#pbar').style.width = (s.done / s.total * 100).toFixed(1) + '%';
  if(favTab){ favTab.textContent = '★ 收藏 ' + Object.keys(favs).length; }
}

function buildTabs(){
  const box = $('#tabs');
  const all = document.createElement('button');
  all.className = 'tab on'; all.textContent = '全部 ' + QUIZ.questions.length;
  all.onclick = () => { filter = 'all'; list = QUIZ.questions.slice(); pos = 0; render(); markTab(all); };
  box.appendChild(all);

  favTab = document.createElement('button');
  favTab.className = 'tab';
  favTab.textContent = '★ 收藏 ' + Object.keys(favs).length;
  favTab.onclick = () => {
    filter = 'fav';
    list = QUIZ.questions.filter(q => favs[q.n]);
    pos = 0; render(); markTab(favTab);
  };
  box.appendChild(favTab);

  QUIZ.sections.forEach(sec => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.textContent = sec.short;
    b.onclick = () => {
      filter = sec.name;
      list = QUIZ.questions.filter(q => q.sec === sec.name);
      pos = 0; render(); markTab(b);
    };
    box.appendChild(b);
  });
}
function markTab(el){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === el));
}

function renderEmpty(){
  $('#qno').textContent = '—';
  $('#qsec').textContent = '暂无题目';
  $('#qtext').textContent = '这里还没有题目。点题卡右上角的 ☆ 可以把想反复看的题收藏起来，之后在这里集中复习。';
  $('#opts').innerHTML = '';
  $('#exp').classList.remove('show');
  $('#star').style.visibility = 'hidden';
  $('#prev').disabled = true;
  $('#next').disabled = true;
  refreshHeader();
  buildGrid();
}

function render(){
  if(!list.length){ renderEmpty(); return; }
  const q = list[pos];
  const sel = answers[q.n];

  const st = $('#star');
  st.style.visibility = 'visible';
  const isFav = !!favs[q.n];
  st.textContent = isFav ? '★' : '☆';
  st.classList.toggle('on', isFav);
  st.onclick = () => {
    if(favs[q.n]) delete favs[q.n]; else favs[q.n] = 1;
    saveFav();
    if(filter === 'fav'){
      list = QUIZ.questions.filter(x => favs[x.n]);
      if(pos > list.length - 1) pos = Math.max(0, list.length - 1);
    }
    render();
  };

  $('#qno').textContent = '第 ' + q.n + ' 题';
  $('#qsec').textContent = q.sec;
  $('#qtext').textContent = q.q;

  const box = $('#opts');
  box.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((text, i) => {
    const k = letters[i];
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="k">' + k + '</span><span class="t"></span>';
    b.querySelector('.t').textContent = text;
    if(sel){
      b.classList.add('done');
      if(k === q.ans) b.classList.add('correct');
      else if(k === sel) b.classList.add('wrong');
      else b.classList.add('dim');
    } else {
      b.onclick = () => choose(k);
    }
    box.appendChild(b);
  });

  const exp = $('#exp');
  if(sel){
    exp.classList.add('show');
    const ok = sel === q.ans;
    const v = $('#verdict');
    v.className = 'verdict ' + (ok ? 'ok' : 'bad');
    v.innerHTML = (ok ? '✓ 回答正确' : '✗ 回答错误')
      + '<span class="badge">正确答案 ' + q.ans + '</span>';
    $('#tag').textContent = q.tag || '—';
    $('#expl').textContent = q.exp || '';
  } else {
    exp.classList.remove('show');
  }

  $('#redo').onclick = () => { delete answers[q.n]; save(); render(); };

  $('#prev').disabled = pos === 0;
  $('#next').disabled = pos === list.length - 1;
  $('#sheetBtn').textContent = '答题卡 ' + stats().done + '/' + stats().total;
  refreshHeader();
  buildGrid();
  window.scrollTo({top:0, behavior:'smooth'});
}

function choose(k){
  const q = list[pos];
  if(answers[q.n]) return;
  answers[q.n] = k;
  save();
  render();
}

function go(d){
  const np = pos + d;
  if(np < 0 || np >= list.length) return;
  pos = np; render();
}

function buildGrid(){
  const g = $('#grid');
  if(!g.dataset.built){
    g.dataset.built = '1';
  }
  g.innerHTML = '';
  const cur = list[pos] ? list[pos].n : -1;
  list.forEach(q => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.textContent = q.n;
    const a = answers[q.n];
    if(a) c.classList.add(a === q.ans ? 'ok' : 'bad');
    if(favs[q.n]) c.classList.add('fav');
    if(q.n === cur) c.classList.add('cur');
    c.onclick = () => { pos = list.findIndex(x => x.n === q.n); render(); closeSheet(); };
    g.appendChild(c);
  });
}

function openSheet(){ $('#mask').classList.add('show'); document.body.style.overflow='hidden'; buildGrid(); }
function closeSheet(){ $('#mask').classList.remove('show'); document.body.style.overflow=''; }

$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#sheetBtn').onclick = openSheet;
$('#closeSheet').onclick = closeSheet;
$('#closeTop').onclick = closeSheet;
$('#mask').onclick = e => { if(e.target === $('#mask')) closeSheet(); };

$('#jumpWrong').onclick = () => {
  const wrongIdx = list.findIndex((q, i) => i > pos && answers[q.n] && answers[q.n] !== q.ans);
  if(wrongIdx >= 0){ pos = wrongIdx; render(); closeSheet(); }
  else {
    const any = list.findIndex(q => answers[q.n] && answers[q.n] !== q.ans);
    if(any >= 0){ pos = any; render(); closeSheet(); }
    else alert('当前范围内没有错题。');
  }
};

$('#resetAll').onclick = () => {
  if(confirm('清空本期的全部答题记录？')){
    answers = {}; save(); pos = 0; render();
  }
};

document.addEventListener('keydown', e => {
  const k = e.key.toUpperCase();
  if(['1','2','3','4'].includes(k)) choose(['A','B','C','D'][+k - 1]);
  else if(['A','B','C','D'].includes(k)) choose(k);
  else if(k === 'F'){ const b = $('#star'); if(b && b.style.visibility !== 'hidden') b.click(); }
  else if(e.key === 'ArrowLeft') go(-1);
  else if(e.key === 'ArrowRight') go(1);
  else if(e.key === 'Escape') closeSheet();
});

$('#sub').textContent = QUIZ.meta.label;
buildTabs();
render();
</script>
</body>
</html>
