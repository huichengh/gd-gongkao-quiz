<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>广东省考刷题 第008期 · 2026-11-21</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#15181f; --sub:#6b7280; --line:#e6e8ec;
  --primary:#2563eb; --primary-soft:#eff4ff;
  --ok:#15803d; --ok-bg:#f0fdf4; --ok-line:#86efac;
  --bad:#b91c1c; --bad-bg:#fef2f2; --bad-line:#fca5a5;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.6;
  font-family:"Microsoft YaHei","微软雅黑",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:30;background:rgba(244,245,247,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
}
.htop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{font-size:16px;font-weight:650;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:2px;letter-spacing:0}
.hstat{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.hstat b{font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.hstat .rate{font-weight:600;font-variant-numeric:tabular-nums}
.pbar{height:3px;background:#e3e5ea;border-radius:0 0 3px 3px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--primary);transition:width .35s ease}

/* ---------- 分组 ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#4b5563;
  padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;
  transition:.15s;
}
.tab:hover{border-color:#c9ced8}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- 题目卡 ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 22px 18px}
.qmeta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin-bottom:12px}
.qmeta .no{font-weight:600;color:var(--primary);background:var(--primary-soft);padding:2px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
.qmeta .sec{padding:2px 9px;background:#f3f4f6;border-radius:6px}
.star{
  margin-left:auto;background:none;border:0;padding:2px 6px;border-radius:7px;
  font-size:19px;line-height:1;color:#c3c8d2;cursor:pointer;transition:.15s;
  font-family:inherit;
}
.star:hover{background:#f3f4f6;color:#f59e0b}
.star.on{color:#f59e0b}
.qtext{font-size:17px;line-height:1.8;font-weight:500;letter-spacing:.1px;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:#fff;border:1.5px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:15.5px;line-height:1.65;color:var(--ink);
  cursor:pointer;transition:.14s;font-family:inherit;
}
.opt:hover:not(.done){border-color:#b9c2d0;background:#fafbfc}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:50%;background:#f1f2f4;color:#4b5563;
  font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;
  margin-top:1px;transition:.14s;
}
.opt .t{flex:1}
.opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.62}
.opt.done{cursor:default}

/* ---------- 解析 ---------- */
.exp{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px;display:none}
.exp.show{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.verdict{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:10px;padding:6px 11px;border-radius:8px;width:fit-content}
.verdict.ok{color:#166534;background:#dcfce7}
.verdict.bad{color:#b91c1c;background:#fee2e2}
.verdict .badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.75);color:#4b5563}
.expline{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.expline .lbl{
  flex:0 0 auto;font-size:11.5px;font-weight:600;color:#6b7280;background:#f3f4f6;
  padding:2px 7px;border-radius:5px;margin-top:2px;
}
.expline .val{font-size:14.5px;line-height:1.8;color:#111827}
.redo{margin-top:14px;font-size:12.5px;color:#4b5563;background:#f3f4f6;border:0;border-radius:7px;padding:6px 12px;cursor:pointer;font-family:inherit}
.redo:hover{background:#e9ebef}

/* ---------- 底部操作 ---------- */
footer{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));
}
.finner{max-width:820px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
  padding:10px 16px;font-size:14px;font-weight:550;cursor:pointer;font-family:inherit;
  transition:.14s;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:#b9c2d0;background:#fafbfc}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);flex:1}
.btn.primary:hover{background:#000}
.btn.ghost{flex:1}
.btn.icon{padding:10px 13px}

/* ---------- 答题卡 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,18,25,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex;animation:fade .18s ease}
.sheet{
  background:#fff;width:100%;max-width:820px;border-radius:18px 18px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;
}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;padding-bottom:2px;z-index:2}
.sheet h3{margin:0;font-size:15px;font-weight:650}
.sheet .close{font-size:12.5px;color:#4b5563;background:#f3f4f6;border-radius:7px;padding:5px 11px;cursor:pointer;user-select:none}
.sheet .close:hover{background:#e9ebef}
.sheet .legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin:8px 0 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.cell{
  position:relative;aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:#fbfbfc;
  font-size:12px;color:#6b7280;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-variant-numeric:tabular-nums;transition:.12s;
}
.cell:hover{transform:translateY(-1px)}
.cell.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok);font-weight:600}
.cell.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad);font-weight:600}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.fav::after{content:'★';position:absolute;top:0;right:2px;font-size:7.5px;color:#f59e0b;line-height:1.4}
.sheetbar{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:0;background:#fff;padding:12px 0 2px;box-shadow:0 -10px 18px 6px #fff}
.sheetbar .btn{flex:1;justify-content:center}
.hint{text-align:center;font-size:11.5px;color:#9ca3af;margin-top:14px;line-height:1.7}

@media (max-width:560px){
  .qcard{padding:18px 16px 14px;border-radius:14px}
  .qtext{font-size:16px}
  .opt{font-size:15px;padding:11px 12px}
  .grid{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>

  </div>
</div>

点领域，其中前 7 个集中在社会建设领域"],"ans":"D","tag":"C1-11 规划建议结构","exp":"全文约 2 万字、15 个部分、三大板块；分论 12 个重点领域，其中前 7 个集中在经济建设领域。D 把“经济建设”偷换成“社会建设”。"},{"n":5,"part":"常识判断","sec":"时政与广东政策","q":"关于“十五五”时期高水平对外开放的部署，下列不属于其内容的是（　）。","opts":["稳步扩大制度型开放","以扩大出口规模为导向，实行出口补贴常态化","拓展国际循环，高质量共建“一带一路”","维护多边贸易体制"],"ans":"B","tag":"C1-09 高水平对外开放","exp":"部署是稳步扩大制度型开放、维护多边贸易体制、拓展国际循环、高质量共建“一带一路”。以出口规模为导向搞出口补贴常态化，与“制度型开放”的方向相反。"},{"n":6,"part":"常识判断","sec":"时政与广东政策","q":"关于 2026 年 5 月第 10 期《求是》文章《做强做优做大实体经济》，下列表述错误的是（　）。","opts":["“十五五”时期必须把因地制宜发展新质生产力摆在更加突出的战略位置","以科技创新为引领、以实体经济为根基","坚持把扩大金融业规模作为主攻方向，推动资源要素向金融领域集中","坚持全面推进传统产业转型升级、积极发展新兴产业、超前布局未来产业并举"],"ans":"C","tag":"C15-01《做强做优做大实体经济》","exp":"主攻方向是“把做实做强做优实体经济作为主攻方向，一手抓传统产业转型升级，一手抓战略性新兴产业发展壮大”。D 把主攻方向换成“扩大金融业规模”，正好把抓手弄反。"},{"n":7,"part":"常识判断","sec":"时政与广东政策","q":"关于 2026 年 5 月国务院常务会议的部署，下列表述错误的是（　）。","opts":["要坚持把“三农”工作作为重中之重，不断夯实基础、提高发展质效","要锚定 2035 年建成教育强国目标任务","要全面提升基础教育质量","要锚定 2050 年建成教育强国目标任务"],"ans":"D","tag":"C15-03 国务院常务会议（5 月）","exp":"原文是“锚定 2035 年建成教育强国目标任务”；讲义把“2050 年”标注为常见错误项，本题即以此设错。"},{"n":8,"part":"常识判断","sec":"时政与广东政策","q":"关于《美丽中国建设成效考核办法》，下列表述错误的是（　）。","opts":["考核工作每年开展 1 次","考核原则上于次年 6 月底前完成","综合评价工作于次年 3 月底前基本完成","考核工作每半年开展 1 次，综合评价于当年年底前完成"],"ans":"D","tag":"C15-04 美丽中国建设成效考核办法","exp":"考核每年开展 1 次，原则上次年 6 月底前完成，综合评价次年 3 月底前基本完成。D 把频次从“每年 1 次”改成“每半年 1 次”，时限也一并改错。"},{"n":9,"part":"常识判断","sec":"时政与广东政策","q":"按照《国务院关于推行常住地提供基本公共服务的实施意见》，下列表述错误的是（　）。","opts":["全面取消在就业地参加职工社会保险的户籍限制","对供需矛盾突出的基本公共服务，可通过积分制等方式，以学历、职称、纳税贡献为主要条件实行梯度供给","完善临时救助政策，取消户籍地、居住地申请限制，在急难发生地按规定给予临时救助","着力提高随迁子女就读公办初中比例，九年一贯制学校校内直升政策对随迁子女、当地户籍学生同等对待"],"ans":"B","tag":"C15-05 常住地基本公共服务","exp":"原文对积分制的规定是“以就业、居住等时间因素为主要条件”，不是学历、职称、纳税贡献。A 项的“全面取消”是原文表述，注意与“逐步取消”的错误选项区分。"},{"n":10,"part":"常识判断","sec":"时政与广东政策","q":"关于城市更新“十五五”规划，下列表述错误的是（　）。","opts":["坚持保护第一、应保尽保、以用促保","到 2030 年，城市更新行动取得重要进展，城市开发建设方式转型初见成效","到 2035 年，创新、宜居、美丽、韧性、文明、智慧的现代化人民城市全面建成","构建中央统筹、省负总责、城市抓落实的工作格局"],"ans":"C","tag":"C15-06 城市更新“十五五”规划","exp":"2035 年目标是“现代化人民城市基本建成”，不是“全面建成”。这是本板块最容易被“全面建成”四个字带走的题。"},{"n":11,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"《广东省优化营商环境条例》的施行时间是（　）。","opts":["2020 年 1 月 1 日","2021 年 1 月 1 日","2022 年 1 月 1 日","2023 年 1 月 1 日"],"ans":"C","tag":"广东营商环境立法","exp":"《广东省优化营商环境条例》2022 年 1 月 1 日起施行，是广东营商环境领域的基础性地方性法规。"},{"n":12,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东“数字政府”改革中，面向企业提供涉企服务的移动政务平台是（　）。","opts":["粤省事","粤智助","粤政易","粤商通"],"ans":"D","tag":"粤商通","exp":"“粤省事”面向个人，“粤商通”面向企业，“粤政易”面向公职人员，“粤智助”是基层自助终端。"},{"n":13,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东全面实施市场准入负面清单制度，其基本要求是（　）。","opts":["所有行业、领域、业务一律实行备案管理","清单以外的行业、领域、业务等，须经审批后方可进入","清单以内的行业、领域、业务等，各类市场主体皆可平等进入","清单以外的行业、领域、业务等，各类市场主体皆可依法平等进入"],"ans":"D","tag":"市场准入负面清单","exp":"清单以外“非禁即入”，各类市场主体皆可依法平等进入。B 把“非禁即入”改成“须经审批”，C 把“清单以外”与“清单以内”对调。"},{"n":14,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东自由贸易试验区建设的核心定位是（　）。","opts":["制度创新高地","税收优惠洼地","加工贸易基地","货物中转口岸"],"ans":"A","tag":"广东自贸试验区","exp":"自贸试验区的核心是制度创新，不是税收优惠，这是与保税区、开发区最根本的区别。"},{"n":15,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"世界银行新一轮营商环境评估体系的名称是（　）。","opts":["Doing Business","BEE","B-READY","Ease of Doing Business"],"ans":"C","tag":"世行营商环境评估","exp":"世界银行新一轮评估体系名为 B-READY（Business Ready），已取代此前的 Doing Business。"},{"n":16,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"2020 年深圳获批开展中国特色社会主义先行示范区综合改革试点，其首批授权事项清单共（　）。","opts":["27 条","40 条","56 条","68 条"],"ans":"B","tag":"深圳综合改革试点","exp":"2020 年《深圳建设中国特色社会主义先行示范区综合改革试点实施方案（2020—2025 年）》同步推出首批授权事项清单 40 条。"},{"n":17,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"国务院确定开展国家营商环境创新试点的城市中，广东入选的是（　）。","opts":["深圳、东莞","广州、珠海","广州、深圳","广州、佛山"],"ans":"C","tag":"国家营商环境创新试点","exp":"2021 年国务院确定北京、上海、重庆、杭州、广州、深圳 6 个城市开展创新试点，广东入选的是广州、深圳。"},{"n":18,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东推行惠企政策“免申即享”，其含义是（　）。","opts":["企业免于接受任何监管检查","企业免除全部税费","企业无需申报，符合条件即可直接享受政策","企业免缴社会保险费"],"ans":"C","tag":"免申即享","exp":"指企业无需主动申报，符合条件即由政府部门直接兑现政策，是“政策找企业”的具体形态。"},{"n":19,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"《区域全面经济伙伴关系协定》（RCEP）正式生效的时间是（　）。","opts":["2020 年 11 月 15 日","2021 年 1 月 1 日","2022 年 1 月 1 日","2023 年 6 月 2 日"],"ans":"C","tag":"RCEP","exp":"2020 年 11 月 15 日签署，2022 年 1 月 1 日对文莱、柬埔寨、老挝、新加坡、泰国、越南及中日新澳等 10 国生效。签署日与生效日是两个高频混淆点。"},{"n":20,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"“跨境理财通”业务中，港澳居民投资内地银行销售的理财产品的渠道称为（　）。","opts":["南向通","双向通","东向通","北向通"],"ans":"D","tag":"跨境理财通","exp":"港澳居民投资内地银行销售的理财产品为“北向通”，内地居民投资港澳为“南向通”，方向按资金流向命名。"},{"n":21,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"粤港澳大湾区建设中被称为“湾区标准”的，是指（　）。","opts":["由单个企业自行制定的企业标准","由国家标准化管理委员会统一发布的国家标准","由国际标准化组织发布的国际标准","粤港澳三地共同制定、共同实施的团体标准"],"ans":"D","tag":"“湾区标准”","exp":"由粤港澳三地共同制定、共同实施的团体标准，属于规则衔接的制度成果，不是国家标准或国际标准。"},{"n":22,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"港澳律师在大湾区内地九市执业，须通过（　）。","opts":["粤港澳大湾区律师执业考试","国家统一法律职业资格考试","港澳律师执业资格互认考核","内地律师执业实习考核"],"ans":"A","tag":"大湾区律师执业考试","exp":"港澳律师通过粤港澳大湾区律师执业考试并取得律师执业证书（粤港澳大湾区），可在内地九市办理适用内地法律的部分民商事法律事务。"},{"n":23,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"深汕特别合作区的运作模式是（　）。","opts":["深汕两市轮流主导","汕尾全面主导、深圳积极配合","广东省直管、两市共建","深圳全面主导、汕尾积极配合"],"ans":"D","tag":"深汕特别合作区","exp":"2018 年 12 月揭牌，由深圳全面主导、汕尾积极配合，是“飞地经济”的制度样本。"},{"n":24,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"港珠澳大桥正式开通的时间是（　）。","opts":["2017 年 7 月 1 日","2018 年 10 月 24 日","2019 年 2 月 18 日","2020 年 6 月 30 日"],"ans":"B","tag":"港珠澳大桥","exp":"2018 年 10 月 24 日正式开通，全长 55 公里，是粤港澳大湾区互联互通的标志性工程。"},{"n":25,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"横琴粤澳深度合作区对澳门机动车入出横琴实行的政策是（　）。","opts":["全面放开，无需办理任何手续","仅限公务车辆入出","一律禁止入出","实行便利化通关管理，逐步扩大准入范围"],"ans":"D","tag":"横琴单牌车","exp":"对澳门机动车入出横琴实行便利化通关管理，配额与准入范围逐步扩大，并非无条件全面放开。"},{"n":26,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东市场主体总量在全国的位次是（　）。","opts":["第一","第二","第三","第五"],"ans":"A","tag":"广东市场主体","exp":"广东市场主体总量长期居全国第一，是营商环境最直接的量化指标。"},{"n":27,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东持续深化“放管服”改革，“放管服”是指（　）。","opts":["放开市场、管住价格、服务企业","简政放权、放管结合、优化服务","下放审批、管好资金、服从大局","放宽准入、管控风险、服务民生"],"ans":"B","tag":"“放管服”","exp":"简政放权、放管结合、优化服务，三者是同一改革链条上的三个环节，不可拆开理解。"},{"n":28,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东“数字政府”改革中的“一网通办”，主要解决的是（　）。","opts":["政府内部公文流转","政务服务事项跨部门、跨层级协同办理","政府采购招标管理","公务员考核管理"],"ans":"B","tag":"一网通办","exp":"核心是政务服务事项跨部门、跨层级协同办理，让数据多跑路、群众少跑腿。"},{"n":29,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东推进粤港澳大湾区规则衔接机制对接，其重点领域不包括（　）。","opts":["职业资格互认","标准互认","政务数据共享","货币发行统一"],"ans":"D","tag":"大湾区规则衔接","exp":"职业资格互认、标准互认、政务数据共享都是已推进的领域；货币发行属国家主权事项，不在规则衔接范围内。"},{"n":30,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东省委“1310”具体部署中的“10”，是指（　）。","opts":["十项重点行动","十个新突破","十个万亿级产业集群","十件民生实事"],"ans":"B","tag":"“1310”","exp":"“1”是一个总目标（在推进中国式现代化建设中走在前列），“3”是改革、开放、创新三大动力，“10”是十个新突破。"},{"n":31,"part":"常识判断","sec":"法律常识","q":"行政许可，是指行政机关根据公民、法人或者其他组织的申请，经依法审查，（　）的行为。","opts":["确认其民事权利","赋予其行政主体资格","准予其从事特定活动","免除其法定义务"],"ans":"C","tag":"行政许可定义","exp":"行政许可的实质是“解禁”，即行政机关依申请审查后准予相对人从事特定活动。"},{"n":32,"part":"常识判断","sec":"法律常识","q":"关于行政许可的设定权限，下列表述正确的是（　）。","opts":["法律、行政法规、地方性法规、省级人民政府规章可以依法设定行政许可","部门规章可以设定行政许可","设区的市人民政府规章可以设定行政许可","县级以上人民政府规范性文件可以设定行政许可"],"ans":"A","tag":"行政许可设定权","exp":"法律、行政法规、地方性法规、省级政府规章可依法设定；部门规章、设区的市政府规章、其他规范性文件一律不得设定行政许可。"},{"n":33,"part":"常识判断","sec":"法律常识","q":"尚未制定法律、行政法规的，省级人民政府规章可以设定临时性行政许可；该许可实施满（　）需要继续实施的，应当提请本级人民代表大会及其常务委员会制定地方性法规。","opts":["6 个月","12 个月","24 个月","36 个月"],"ans":"B","tag":"临时性行政许可","exp":"省级政府规章设定的临时性行政许可实施满 1 年需要继续实施的，应提请本级人大及其常委会制定地方性法规。"},{"n":34,"part":"常识判断","sec":"法律常识","q":"下列情形中，可以不设行政许可的是（　）。","opts":["直接关系人身健康、生命财产安全的重要设备、设施","有限自然资源开发利用、公共资源配置","市场竞争机制能够有效调节的","企业或者其他组织的设立等需要确定主体资格的"],"ans":"C","tag":"可不设行政许可的情形","exp":"公民、法人能自主决定的，市场竞争机制能有效调节的，行业组织或中介机构能自律管理的，行政机关采用事后监督等其他方式能解决的，可以不设行政许可。A、B、D 均属可以设定行政许可的事项。"},{"n":35,"part":"常识判断","sec":"法律常识","q":"行政许可需要行政机关内设的多个机构办理的，该行政机关应当（　）。","opts":["确定一个机构统一受理行政许可申请、统一送达行政许可决定","由各机构分别受理、分别送达","由申请人自行选择受理机构","报请上级机关指定受理机构"],"ans":"A","tag":"一个窗口对外","exp":"行政许可需内设多个机构办理的，应确定一个机构统一受理申请、统一送达决定，避免申请人多头跑。"},{"n":36,"part":"常识判断","sec":"法律常识","q":"行政机关对行政许可申请进行审查后，除当场作出行政许可决定的外，应当自受理行政许可申请之日起（　）内作出行政许可决定。","opts":["10 日","15 日","20 日","30 日"],"ans":"C","tag":"许可决定期限","exp":"除当场决定外，自受理之日起 20 日内作出决定。"},{"n":37,"part":"常识判断","sec":"法律常识","q":"行政机关在法定期限内不能作出行政许可决定，经本行政机关负责人批准，可以延长（　），并应当将延长期限的理由告知申请人。","opts":["5 日","10 日","15 日","20 日"],"ans":"B","tag":"期限延长","exp":"20 日内不能作出决定的，经本行政机关负责人批准可以延长 10 日，并告知理由。"},{"n":38,"part":"常识判断","sec":"法律常识","q":"行政许可采取统一办理或者联合办理、集中办理的，办理的时间不得超过（　）。","opts":["30 日","45 日","60 日","90 日"],"ans":"B","tag":"统一办理、联合办理、集中办理期限","exp":"办理时间不得超过 45 日；45 日内不能办结的，经本级人民政府负责人批准可延长 15 日。"},{"n":39,"part":"常识判断","sec":"法律常识","q":"申请材料不齐全或者不符合法定形式的，行政机关应当（　）。","opts":["当场或者在 5 日内一次告知申请人需要补正的全部内容","直接作出不予受理的决定","分次告知申请人需要补正的内容","退回申请并注销受理登记"],"ans":"A","tag":"一次告知","exp":"申请材料不齐全或不符合法定形式的，应当当场或在 5 日内一次告知需要补正的全部内容，不得分次告知。"},{"n":40,"part":"常识判断","sec":"法律常识","q":"被许可人需要延续依法取得的行政许可的有效期的，应当在该行政许可有效期届满（　）前向作出行政许可决定的行政机关提出申请。","opts":["15 日","30 日","60 日","90 日"],"ans":"B","tag":"许可延续","exp":"应在有效期届满 30 日前提出延续申请。"},{"n":41,"part":"常识判断","sec":"法律常识","q":"关于行政许可的听证，下列表述错误的是（　）。","opts":["法律、法规、规章规定实施行政许可应当听证的事项，行政机关应当向社会公告并举行听证","行政机关认为需要听证的其他涉及公共利益的重大行政许可事项，应当向社会公告并举行听证","申请人、利害关系人在被告知听证权利之日起 5 日内提出听证申请的，行政机关应当在 20 日内组织听证","听证费用由申请听证的申请人、利害关系人承担"],"ans":"D","tag":"许可听证","exp":"行政机关提供听证程序不收取费用，听证费用由行政机关承担，D 项错误。"},{"n":42,"part":"常识判断","sec":"法律常识","q":"行政许可所依据的法律、法规、规章修改或者废止，或者准予行政许可所依据的客观情况发生重大变化，为了公共利益的需要，行政机关可以依法变更或者撤回已经生效的行政许可；由此给公民、法人或者其他组织造成财产损失的，行政机关应当依法（　）。","opts":["给予赔偿","给予补偿","不予处理","返还申请费用"],"ans":"B","tag":"信赖保护与补偿","exp":"因公共利益变更或撤回已生效许可造成财产损失的，给予“补偿”而非“赔偿”，二者法律性质不同。"},{"n":43,"part":"常识判断","sec":"法律常识","q":"被许可人以欺骗、贿赂等不正当手段取得行政许可的，行政机关应当依法（　）。","opts":["予以注销","予以撤销","予以变更","予以撤回"],"ans":"B","tag":"撤销许可","exp":"以欺骗、贿赂等不正当手段取得行政许可的，应当予以撤销。"},{"n":44,"part":"常识判断","sec":"法律常识","q":"下列不属于行政许可注销情形的是（　）。","opts":["行政许可有效期届满未延续的","赋予公民特定资格的行政许可，该公民死亡或者丧失行为能力的","法人或者其他组织依法终止的","行政许可所依据的客观情况发生重大变化，为了公共利益需要变更许可的"],"ans":"D","tag":"注销与撤回的区别","exp":"D 项属于“撤回”的情形；注销适用于有效期届满未延续、公民死亡或丧失行为能力、法人终止、许可被撤销撤回吊销、不可抗力导致无法实施等。"},{"n":45,"part":"常识判断","sec":"法律常识","q":"行政机关实施行政许可和对行政许可事项进行监督检查，（　）。","opts":["可以按成本收取费用","不得收取任何费用，但法律、行政法规另有规定的除外","可以收取工本费","由省级财政部门核定收费标准"],"ans":"B","tag":"许可收费","exp":"原则上不得收费，例外须由法律、行政法规规定。"},{"n":46,"part":"常识判断","sec":"法律常识","q":"行政机关实施行政许可，不得（　）。","opts":["要求申请人提交与其申请的行政许可事项无关的技术资料和其他材料","在法定期限内作出行政许可决定","一次性告知申请人需要补正的全部内容","公开准予行政许可的决定"],"ans":"A","tag":"申请材料限制","exp":"行政机关不得要求提交与申请事项无关的技术资料和其他材料。"},{"n":47,"part":"常识判断","sec":"法律常识","q":"法律、法规授权的具有管理公共事务职能的组织，在法定授权范围内，（　）实施行政许可。","opts":["以同级人民政府的名义","以授权机关的名义","以自己的名义","以上级主管部门的名义"],"ans":"C","tag":"授权实施","exp":"法律、法规授权的组织在法定授权范围内以自己的名义实施行政许可，并承担相应法律责任。"},{"n":48,"part":"常识判断","sec":"法律常识","q":"行政机关在其法定职权范围内，依照法律、法规、规章的规定，可以委托（　）实施行政许可。","opts":["任何社会组织","其他行政机关","中介服务机构","个人"],"ans":"B","tag":"委托实施","exp":"行政许可只能委托其他行政机关，不得委托其他组织或个人。"},{"n":49,"part":"常识判断","sec":"法律常识","q":"《市场监督管理行政处罚裁量规定》将行政处罚裁量划分为（　）个阶次，并统一“初次违法”“违法行为轻微”的认定标准。","opts":["3 个","4 个","5 个","6 个"],"ans":"C","tag":"C9-12 行政处罚裁量","exp":"《市场监督管理行政处罚裁量规定》将裁量划分为五个阶次，统一“初次违法”“违法行为轻微”认定标准。"},{"n":50,"part":"常识判断","sec":"法律常识","q":"《党政领导干部生态环境损害责任追究办法》规定，生态环境损害责任追究方式（　）。","opts":["可以单独使用，也可以依据规定合并使用","只能合并使用","只能单独使用","由纪检监察机关决定是否使用"],"ans":"A","tag":"生态环境损害责任追究","exp":"追究方式包括谈话提醒、批评教育、责令检查、诫勉，组织调整或组织处理，党纪政务处分；可单独使用，也可依据规定合并使用。"},{"n":51,"part":"常识判断","sec":"经济常识","q":"国内生产总值的核算方法包括（　）。","opts":["支出法、比较法、重置法","生产法、成本法、比较法","收入法、支出法、成本法","生产法、收入法、支出法"],"ans":"D","tag":"GDP 核算","exp":"生产法（增加值法）、收入法（分配法）、支出法（使用法）三种方法，理论上结果一致。"},{"n":52,"part":"常识判断","sec":"经济常识","q":"居民消费价格指数（CPI）主要反映（　）。","opts":["固定资产投资价格的变动","工业生产者出厂价格的变动","居民购买的消费品和服务项目价格的变动","进出口商品价格的变动"],"ans":"C","tag":"CPI","exp":"反映居民购买的消费品和服务项目价格水平的变动，是衡量通货膨胀的主要指标。"},{"n":53,"part":"常识判断","sec":"经济常识","q":"下列属于扩张性财政政策的是（　）。","opts":["提高再贴现率","减少政府支出、增加税收","提高存款准备金率","增加政府支出、减少税收"],"ans":"D","tag":"扩张性财政政策","exp":"增支减税扩大总需求；C、D 属紧缩性货币政策工具。"},{"n":54,"part":"常识判断","sec":"经济常识","q":"中央银行在公开市场上买入有价证券，通常会使（　）。","opts":["货币供应量减少","货币供应量增加","市场利率上升","商业银行准备金减少"],"ans":"B","tag":"公开市场业务","exp":"央行买入有价证券投放基础货币，货币供应量增加、市场利率下降。"},{"n":55,"part":"常识判断","sec":"经济常识","q":"在其他条件不变的情况下，某商品价格上升，其需求量减少。这体现的是（　）。","opts":["供给定律","需求定律","边际效用递增规律","规模报酬递增规律"],"ans":"B","tag":"需求定律","exp":"价格与需求量反向变动，注意与供给定律（同向）区分。"},{"n":56,"part":"常识判断","sec":"经济常识","q":"当某商品的边际效用降为零时，总效用（　）。","opts":["达到最大","等于零","为负值","仍持续递增"],"ans":"A","tag":"总效用与边际效用","exp":"边际效用为零时总效用达到最大，边际效用转负后总效用开始下降。"},{"n":57,"part":"常识判断","sec":"经济常识","q":"完全竞争市场的特征不包括（　）。","opts":["单个厂商能够影响市场价格","产品同质、无差异","厂商可以自由进出市场","厂商数量众多且规模较小"],"ans":"A","tag":"完全竞争市场","exp":"单个厂商是价格接受者，不能影响市场价格；D 项是完全垄断的特征。"},{"n":58,"part":"常识判断","sec":"经济常识","q":"按照比较优势理论，一国应专业化生产并出口（　）。","opts":["相对成本较低的产品","绝对成本最低的产品","技术水平最高的产品","国内需求规模最大的产品"],"ans":"A","tag":"比较优势理论","exp":"按相对成本（机会成本）较低者专业化生产并出口，而非绝对成本最低。"},{"n":59,"part":"常识判断","sec":"经济常识","q":"本币贬值对国际收支的直接影响通常是（　）。","opts":["抑制出口、有利于进口","有利于出口、抑制进口","进出口同时减少","对进出口没有影响"],"ans":"B","tag":"汇率变动","exp":"本币贬值使出口商品以外币计价变便宜、进口商品以本币计价变贵，通常有利于出口、抑制进口。"},{"n":60,"part":"常识判断","sec":"经济常识","q":"一国国际收支中，经常项目不包括（　）。","opts":["货物贸易","直接投资","收益和经常转移","服务贸易"],"ans":"B","tag":"国际收支经常项目","exp":"包括货物、服务、收益、经常转移；直接投资属资本与金融项目。"},{"n":61,"part":"常识判断","sec":"科技与生活","q":"量子纠缠指的是（　）。","opts":["两个量子在空间位置上完全重合","两个或多个量子之间存在非定域关联，对其中一个的测量会确定性地影响另一个的状态描述","量子始终处于能量最低的状态","量子之间通过经典信道传递信息"],"ans":"B","tag":"量子纠缠","exp":"非定域的关联性，测量一个会确定性影响另一个的状态描述，但不能用于超光速传递信息。"},{"n":62,"part":"常识判断","sec":"科技与生活","q":"量子不可克隆定理表明（　）。","opts":["任意未知量子态不能被精确复制","量子态可以被无限次精确复制","量子比特只能取 0 或 1","量子计算无法实现并行运算"],"ans":"A","tag":"不可克隆定理","exp":"未知量子态无法精确复制，这是量子密钥分发安全性的理论基础。"},{"n":63,"part":"常识判断","sec":"科技与生活","q":"我国于 2016 年发射的世界首颗量子科学实验卫星是（　）。","opts":["“悟空号”","“墨子号”","“慧眼号”","“天问一号”"],"ans":"B","tag":"“墨子号”","exp":"2016 年 8 月发射的世界首颗量子科学实验卫星；“悟空号”是暗物质粒子探测卫星。"},{"n":64,"part":"常识判断","sec":"科技与生活","q":"我国实现“量子计算优越性”的光量子计算原型机是（　）。","opts":["“神威”","“天河”","“九章”","“曙光”"],"ans":"C","tag":"“九章”","exp":"光量子计算原型机；“祖冲之号”是超导量子计算原型机，两者技术路线不同。"},{"n":65,"part":"常识判断","sec":"科技与生活","q":"与经典比特相比，量子比特的根本特点是（　）。","opts":["可以处于 0 和 1 的叠加态","只能表示 0","运算速度必然更快","不受环境噪声影响"],"ans":"A","tag":"量子比特","exp":"可处于 0 与 1 的叠加态，这是量子并行计算能力的来源。"},{"n":66,"part":"常识判断","sec":"科技与生活","q":"海森堡不确定性原理指出（　）。","opts":["粒子的质量会随时间衰变","粒子的能量必然守恒","粒子的速度不能超过光速","粒子的位置与动量不能同时被任意精确地确定"],"ans":"D","tag":"不确定性原理","exp":"位置与动量不能同时被任意精确确定，是量子力学的基石之一。"},{"n":67,"part":"常识判断","sec":"科技与生活","q":"扫描隧道显微镜能够观测固体表面原子级形貌，其原理主要基于（　）。","opts":["量子隧穿效应","光电效应","电磁感应","核磁共振"],"ans":"A","tag":"量子隧穿","exp":"电子穿越势垒形成隧道电流，扫描隧道显微镜据此实现原子级分辨。"},{"n":68,"part":"常识判断","sec":"科技与生活","q":"超导体在临界温度以下表现出的特性是（　）。","opts":["电导率降为零","电阻急剧增大","电阻为零并具有完全抗磁性","外部磁场完全穿透材料内部"],"ans":"C","tag":"超导特性","exp":"零电阻与完全抗磁性（迈斯纳效应）是两个基本特征。"},{"n":69,"part":"常识判断","sec":"科技与生活","q":"光纤通信中，光信号在纤芯内长距离传输主要依靠（　）。","opts":["全反射","折射","衍射","散射"],"ans":"A","tag":"光纤通信","exp":"光在纤芯与包层界面上发生全反射，实现低损耗长距离传输。"},{"n":70,"part":"常识判断","sec":"科技与生活","q":"与 5G 相比，6G 的主要演进方向是（　）。","opts":["仅扩大基站数量","仅提高语音通话质量","更高速率、更低时延、空天地一体化覆盖","退回低频段传输"],"ans":"C","tag":"6G","exp":"更高速率、更低时延、更大连接密度与空天地一体化覆盖。"},{"n":71,"part":"常识判断","sec":"科技与生活","q":"摩尔定律描述的是（　）。","opts":["芯片价格每年下降一半","计算机运算速度每年提高十倍","集成电路上可容纳的晶体管数目约每 18—24 个月翻一番","存储器容量每十年翻一番"],"ans":"C","tag":"摩尔定律","exp":"集成电路上可容纳的晶体管数目约每 18—24 个月翻一番，本质是成本与集成度的经验规律。"},{"n":72,"part":"常识判断","sec":"科技与生活","q":"计算机存储容量单位中，1 GB 等于（　）。","opts":["1000 MB","1024 MB","1024 KB","1024 TB"],"ans":"B","tag":"存储单位","exp":"1 GB = 1024 MB，1 MB = 1024 KB，按 1024 进制换算。"},{"n":73,"part":"常识判断","sec":"人文历史","q":"提出“仁者爱人”“为政以德”，主张“克己复礼为仁”的思想家是（　）。","opts":["墨子","孟子","荀子","孔子"],"ans":"D","tag":"孔子","exp":"核心是“仁”与“礼”，主张为政以德、克己复礼。"},{"n":74,"part":"常识判断","sec":"人文历史","q":"提出“民为贵，社稷次之，君为轻”，主张“性善论”的先秦思想家是（　）。","opts":["庄子","荀子","孟子","韩非"],"ans":"C","tag":"孟子","exp":"性善论、仁政、民贵君轻，被尊为“亚圣”。"},{"n":75,"part":"常识判断","sec":"人文历史","q":"提出“人之性恶，其善者伪也”，强调“隆礼重法”的先秦思想家是（　）。","opts":["老子","孟子","墨子","荀子"],"ans":"D","tag":"荀子","exp":"性恶论，主张“化性起伪”、隆礼重法，是先秦儒家中最重制度的一支。"},{"n":76,"part":"常识判断","sec":"人文历史","q":"“祸兮福之所倚，福兮祸之所伏”出自（　）。","opts":["《孟子》","《论语》","《道德经》","《韩非子》"],"ans":"C","tag":"《道德经》","exp":"老子以祸福相倚说明对立面相互转化的辩证智慧。"},{"n":77,"part":"常识判断","sec":"人文历史","q":"主张“兼相爱、交相利”，提出“非攻”“尚贤”主张的学派是（　）。","opts":["法家","道家","墨家","名家"],"ans":"C","tag":"墨家","exp":"兼爱、非攻、尚贤、节用，代表小生产者利益。"},{"n":78,"part":"常识判断","sec":"人文历史","q":"集法家思想之大成，提出“法、术、势”相结合的思想家是（　）。","opts":["李斯","商鞅","申不害","韩非"],"ans":"D","tag":"韩非","exp":"集法、术、势于一体，是法家思想的集大成者。"},{"n":79,"part":"常识判断","sec":"人文历史","q":"“白马非马”这一著名命题的提出者是（　）。","opts":["邹衍","惠施","公孙龙","庄周"],"ans":"C","tag":"公孙龙","exp":"名家代表人物，“白马非马”讨论一般与个别的关系。"},{"n":80,"part":"常识判断","sec":"人文历史","q":"提出“知彼知己，百战不殆”的兵家著作《孙子兵法》，其作者是（　）。","opts":["孙武","孙膑","吴起","尉缭"],"ans":"A","tag":"孙武","exp":"春秋末期齐国人，《孙子兵法》十三篇；孙膑是战国时期另一人物，著有《孙膑兵法》。"},{"n":81,"part":"常识判断","sec":"人文历史","q":"先秦儒家所说的“六艺”教育内容是（　）。","opts":["礼、义、廉、耻、忠、孝","诗、书、礼、乐、易、春秋","仁、义、礼、智、信、勇","礼、乐、射、御、书、数"],"ans":"D","tag":"六艺与六经","exp":"六艺指礼、乐、射、御、书、数，属教育科目；诗、书、礼、乐、易、春秋是六经，属典籍，二者不可混。"},{"n":82,"part":"常识判断","sec":"人文历史","q":"禅宗六祖惠能的故里在广东（　）。","opts":["曲江","新兴","潮阳","高要"],"ans":"B","tag":"惠能","exp":"禅宗六祖，广东新州（今新兴）人，主张“直指人心，见性成佛”。"},{"n":83,"part":"常识判断","sec":"人文历史","q":"明代心学代表人物陈献章（陈白沙）是广东（　）人。","opts":["顺德","南海","新会","番禺"],"ans":"C","tag":"陈白沙","exp":"陈献章，广东新会白沙里人，明代心学开山，主张“学贵自得”。"},{"n":84,"part":"常识判断","sec":"人文历史","q":"清代记录岭南风物、被称为“广东百科全书”的著作是（　）。","opts":["《广东通志》","《岭外代答》","《粤海关志》","《广东新语》"],"ans":"D","tag":"《广东新语》","exp":"屈大均所著，记录岭南天文地理、物产风俗，被誉为“广东百科全书”。"},{"n":85,"part":"常识判断","sec":"地理国情","q":"我国地势第二级阶梯与第三级阶梯的分界线是（　）。","opts":["天山—阴山—燕山","昆仑山—祁连山—横断山","大兴安岭—太行山—巫山—雪峰山","秦岭—淮河一线"],"ans":"C","tag":"地势阶梯","exp":"第二、三级阶梯分界为大兴安岭—太行山—巫山—雪峰山；B 是第一、二级阶梯分界。"},{"n":86,"part":"常识判断","sec":"地理国情","q":"秦岭—淮河一线是我国重要的地理分界线，它大致对应（　）。","opts":["1 月 10℃ 等温线和 400 毫米年等降水量线","7 月 0℃ 等温线和 1600 毫米年等降水量线","1 月 0℃ 等温线和 800 毫米年等降水量线","年平均 20℃ 等温线和 200 毫米年等降水量线"],"ans":"C","tag":"秦岭—淮河线","exp":"大致与 1 月 0℃ 等温线、800 毫米年等降水量线重合，是南北方分界线。"},{"n":87,"part":"常识判断","sec":"地理国情","q":"珠江水系的主干是（　）。","opts":["东江","北江","西江","韩江"],"ans":"C","tag":"珠江水系","exp":"西江为主干，与北江、东江共同构成珠江水系。"},{"n":88,"part":"常识判断","sec":"地理国情","q":"广东的地形特征可概括为（　）。","opts":["沙漠与草原相间","平原为主，山地稀少","高原为主，盆地广布","山地丘陵为主，平原狭小"],"ans":"D","tag":"广东地形","exp":"以山地丘陵为主，平原狭小，素有“七山一水二分田”之说。"},{"n":89,"part":"常识判断","sec":"地理国情","q":"北回归线穿过广东省的城市是（　）。","opts":["梅州","湛江","韶关","汕头"],"ans":"D","tag":"北回归线","exp":"穿过汕头、广州从化、肇庆封开等地，广东因此建有多个北回归线标志塔。"},{"n":90,"part":"常识判断","sec":"地理国情","q":"世界上面积最大的高原是（　）。","opts":["青藏高原","巴西高原","蒙古高原","东非高原"],"ans":"B","tag":"世界最大高原","exp":"巴西高原面积约 500 万平方公里，居世界首位；青藏高原是世界最高的高原。"},{"n":91,"part":"常识判断","sec":"地理国情","q":"我国面积最大的省级行政区是（　）。","opts":["内蒙古自治区","西藏自治区","新疆维吾尔自治区","青海省"],"ans":"C","tag":"面积最大省级行政区","exp":"新疆约 166 万平方公里，居全国第一。"},{"n":92,"part":"常识判断","sec":"地理国情","q":"夏季影响广东最为严重的自然灾害是（　）。","opts":["台风","沙尘暴","寒潮","凌汛"],"ans":"A","tag":"广东自然灾害","exp":"台风是夏季影响广东最严重的气象灾害，常伴狂风、暴雨和风暴潮。"},{"n":93,"part":"常识判断","sec":"公文与管理","q":"下列公文文种中，适用于向上级机关请求指示、批准的是（　）。","opts":["请示","报告","意见","函"],"ans":"A","tag":"请示","exp":"适用于向上级机关请求指示、批准；报告用于汇报工作、反映情况，不得夹带请示事项。"},{"n":94,"part":"常识判断","sec":"公文与管理","q":"关于请示与报告的区别，下列表述正确的是（　）。","opts":["报告中可以夹带请示事项","请示和报告都需要上级机关答复","请示需要上级机关答复，报告不需要答复","请示可以在事后再补报"],"ans":"C","tag":"请示与报告","exp":"请示必须事前行文、需要答复；报告不需答复，且不得夹带请示事项。"},{"n":95,"part":"常识判断","sec":"公文与管理","q":"公文的成文日期应当使用（　）。","opts":["汉字数字","阿拉伯数字","罗马数字","英文缩写"],"ans":"B","tag":"成文日期","exp":"《党政机关公文格式》规定用阿拉伯数字标注年、月、日。"},{"n":96,"part":"常识判断","sec":"公文与管理","q":"发文字号由（　）组成。","opts":["发文机关名称、密级、紧急程度","发文机关代字、年份、发文顺序号","主题词、抄送机关、印发日期","签发人、成文日期、页码"],"ans":"B","tag":"发文字号","exp":"由发文机关代字、年份、发文顺序号组成，年份用六角括号标注。"},{"n":97,"part":"常识判断","sec":"公文与管理","q":"公文的密级分为（　）。","opts":["绝密、机密、秘密","特密、机密、秘密","绝密、机要、秘密","一级、二级、三级"],"ans":"A","tag":"密级","exp":"分绝密、机密、秘密三级。"},{"n":98,"part":"常识判断","sec":"公文与管理","q":"向上级机关行文，原则上主送一个上级机关；如需同时送其他机关，应当采用（　）。","opts":["联合行文","主送形式","抄送形式","越级行文"],"ans":"C","tag":"抄送规则","exp":"上行文原则上主送一个上级机关，需同时送其他机关的用抄送，且不得抄送下级机关。"},{"n":99,"part":"常识判断","sec":"公文与管理","q":"收文办理的主要程序是（　）。","opts":["签收、登记、初审、承办、传阅、催办、答复","拟稿、审核、签发、复核、登记、印制、核发","立卷、归档、销毁、移交","起草、会签、公布、备案"],"ans":"A","tag":"收文办理","exp":"签收、登记、初审、承办、传阅、催办、答复；B 项是发文办理程序。"},{"n":100,"part":"常识判断","sec":"公文与管理","q":"适用于在一定范围内公布应当遵守或者周知事项的公文文种是（　）。","opts":["公告","通告","通知","通报"],"ans":"B","tag":"通告","exp":"适用于在一定范围内公布应当遵守或者周知的事项；公告面向国内外宣布重要事项，通知用于发布、传达要求下级机关执行和有关单位周知的事项。"},{"n":101,"part":"政治理论","sec":"最新时政","q":"关于“十五五”时期的历史方位，下列表述错误的是（　）。","opts":["是基本实现社会主义现代化夯实基础、全面发力的关键时期","在基本实现社会主义现代化进程中具有承前启后的重要地位","是全面建成小康社会、实现第一个百年奋斗目标的决胜时期","这一判断出自党的二十届四中全会审议通过的“十五五”规划建议"],"ans":"C","tag":"C1-02 “十五五”历史方位","exp":"定位是“基本实现社会主义现代化夯实基础、全面发力的关键时期”，具有承前启后重要地位。C 把“决胜全面建成小康社会”这一“十三五”时期的表述套用过来，时间坐标整体错位。"},{"n":102,"part":"政治理论","sec":"最新时政","q":"关于“十五五”时期扩大内需的部署，下列表述错误的是（　）。","opts":["坚持以扩大出口为主导，把国际循环作为经济发展的立足点","坚持惠民生和促消费、投资于物和投资于人紧密结合","坚决破除阻碍全国统一大市场建设的卡点堵点","坚持扩大内需这个战略基点"],"ans":"A","tag":"C1-07 扩大内需","exp":"战略基点是扩大内需，并以国内大循环为主体，D 把“国际循环”抬为立足点，方向颠倒。"},{"n":103,"part":"政治理论","sec":"最新时政","q":"党的二十届四中全会提出的 2035 年目标中，关于经济发展水平的表述是（　）。","opts":["人均国内生产总值达到中等发达国家水平","人均国内生产总值达到发达国家平均水平","国内生产总值比 2020 年翻两番","居民人均可支配收入达到高收入国家水平"],"ans":"A","tag":"C1-04 2035 年目标","exp":"人均国内生产总值达到中等发达国家水平。“中等发达国家”与“发达国家平均水平”是两个不同量级，后者是常见偷换。"},{"n":104,"part":"政治理论","sec":"最新时政","q":"关于“十五五”时期的科技创新部署，下列表述错误的是（　）。","opts":["以引进消化吸收国外先进技术作为提升自主创新能力的主渠道","提升国家创新体系整体效能","抢占科技发展制高点，不断催生新质生产力","统筹教育强国、科技强国、人才强国建设"],"ans":"A","tag":"C1-06 科技创新","exp":"部署是统筹教育强国、科技强国、人才强国建设，提升国家创新体系整体效能，抢占科技发展制高点。D 把“自主创新”替换为“引进消化吸收”，与“科技自立自强”背道而驰。"},{"n":105,"part":"政治理论","sec":"最新时政","q":"2026 年 3 月，国务院编制“十五五”规划纲要（草案），细化提出的主要指标共（　）。","opts":["15 项","20 项","25 项","30 项"],"ans":"B","tag":"C1-12 规划纲要指标","exp":"2026 年 3 月 5 日政府工作报告提出国务院编制“十五五”规划纲要（草案），细化 20 项主要指标；3 月 12 日十四届全国人大四次会议批准纲要。"},{"n":106,"part":"政治理论","sec":"最新时政","q":"2026 年 5 月加强基础研究座谈会强调，要进一步明确基础研究的主攻方向和重点领域，必须坚持的战略导向是（　）。","opts":["“四个面向”","“三个面向”","“以人为本”","“四个全面”"],"ans":"A","tag":"C15-02 基础研究座谈会","exp":"坚持“四个面向”战略导向（面向世界科技前沿、面向经济主战场、面向国家重大需求、面向人民生命健康），讲义把“以人为本”标注为错误方向。"},{"n":107,"part":"政治理论","sec":"最新时政","q":"按照《中国共产党发展党员工作细则》，下列表述错误的是（　）。","opts":["按照控制总量、优化结构、提高质量、发挥作用的总要求发展党员","始终把政治标准放在首位","入党积极分子工作、学习所在单位或者居住地发生变动，培养教育时间可以连续计算","坚持入党自愿原则和集体发展原则，成熟一批、发展一批"],"ans":"D","tag":"C15-08 发展党员工作细则","exp":"原文是“坚持入党自愿原则和个别吸收原则，成熟一个，发展一个”，C 改成“集体发展、成熟一批”，把个别吸收改成了批量发展。"},{"n":108,"part":"政治理论","sec":"最新时政","q":"关于用好乡镇（街道）履行职责事项清单，下列表述错误的是（　）。","opts":["省级党委和政府研究涉及乡镇（街道）的规划计划、政策文件、重大工作等，应以履职事项清单作为重要依据","县级党委和政府研究涉及乡镇（街道）的规划计划、政策文件、重大工作等，应以履职事项清单作为重要依据","除党中央、国务院及省级党委和政府统一部署外，上级部门不得将未列入清单的职责事项擅自向乡镇（街道）下放","建立健全履职事项清单动态调整机制，坚持“大稳定、小调整”"],"ans":"A","tag":"C15-09 乡镇履职事项清单","exp":"原文规定的是“县级党委和政府”研究涉及乡镇（街道）的规划计划、政策文件、重大工作时以清单为重要依据，B 把层级抬到省级。"},{"n":109,"part":"政治理论","sec":"最新时政","q":"《美丽中国建设成效考核办法》规定，对各省（自治区、直辖市）党委和政府美丽中国建设成效的考核内容不包括（　）。","opts":["美丽中国建设责任落实情况","美丽中国建设年度主要目标完成情况","资金使用绩效情况","地区生产总值增长速度及排名情况"],"ans":"D","tag":"C15-04 考核内容","exp":"考核内容包括责任落实、年度主要目标完成、年度重点任务完成、资金使用绩效、群众满意程度五项。地区生产总值增速及排名不在其中，这正是“不以 GDP 论英雄”的考核导向。"},{"n":110,"part":"政治理论","sec":"最新时政","q":"城市更新“十五五”规划要求发挥各类金融机构作用，引导金融机构按照市场化、法治化原则为城市更新项目提供金融服务，同时明确（　）。","opts":["不得新增地方政府隐性债务","可以适度新增地方政府隐性债务","项目债务由中央财政统借统还","允许以政府信用为项目融资提供担保"],"ans":"A","tag":"C15-06 城市更新融资","exp":"明确要求引导金融机构按市场化、法治化原则提供服务，不得新增地方政府隐性债务。"},{"n":111,"part":"政治理论","sec":"马克思主义基本原理","q":"物质的唯一特性是（　）。","opts":["客观实在性","运动性","可知性","可分性"],"ans":"A","tag":"物质定义","exp":"客观实在性是物质的唯一特性，运动是物质的根本属性和存在方式，二者不可混淆。"},{"n":112,"part":"政治理论","sec":"马克思主义基本原理","q":"关于意识的本质，下列表述正确的是（　）。","opts":["意识是人脑自身分泌的物质","意识是人脑的机能，是客观存在的主观映象","意识是主观自生的，与客观存在无关","意识与物质是两种彼此独立的实体"],"ans":"B","tag":"意识本质","exp":"意识是人脑的机能，是客观存在的主观映象，是主观形式与客观内容的统一。"},{"n":113,"part":"政治理论","sec":"马克思主义基本原理","q":"实践是检验真理的唯一标准，这是由（　）决定的。","opts":["逻辑推演的严密性","权威机关的认定","多数人的认同","真理的本性和实践的特点"],"ans":"D","tag":"真理标准","exp":"真理的本性在于主观与客观相符合，实践的特点在于直接现实性，二者共同决定实践是检验真理的唯一标准。"},{"n":114,"part":"政治理论","sec":"马克思主义基本原理","q":"“一般寓于个别之中，个别一定与一般相联系而存在。”这一论断体现的哲理是（　）。","opts":["必然与偶然的辩证关系","量变与质变的辩证关系","原因与结果的辩证关系","矛盾普遍性与特殊性的辩证关系"],"ans":"D","tag":"矛盾普遍性与特殊性","exp":"共性寓于个性之中，个性中包含共性，这是“具体问题具体分析”的哲学依据。"},{"n":115,"part":"政治理论","sec":"马克思主义基本原理","q":"在量变过程中，事物保持自身质的稳定性的数量界限称为（　）。","opts":["度","关节点","质","量"],"ans":"A","tag":"度","exp":"度是保持事物质稳定性的量的限度，度的两端是关节点。"},{"n":116,"part":"政治理论","sec":"马克思主义基本原理","q":"事物发展经过“肯定—否定—否定之否定”三个阶段，呈现出（　）的过程。","opts":["无序涨落","直线式前进","圆圈式循环","螺旋式上升、波浪式前进"],"ans":"D","tag":"否定之否定","exp":"事物发展是螺旋式上升、波浪式前进，不是直线前进，也不是简单循环。"},{"n":117,"part":"政治理论","sec":"马克思主义基本原理","q":"在生产方式中，生产力与生产关系的关系是（　）。","opts":["生产关系决定生产力，生产力反作用于生产关系","生产力决定生产关系，生产关系反作用于生产力","二者各自独立、互不影响","二者始终完全适应"],"ans":"B","tag":"生产力与生产关系","exp":"生产力决定生产关系，生产关系对生产力具有反作用，这是唯物史观的基本原理。"},{"n":118,"part":"政治理论","sec":"马克思主义基本原理","q":"社会存在与社会意识的关系是（　）。","opts":["二者平行发展、互不作用","社会意识决定社会存在","社会存在决定社会意识，社会意识具有相对独立性","社会意识始终滞后于社会存在，不存在超前情况"],"ans":"C","tag":"社会存在与社会意识","exp":"社会存在决定社会意识，社会意识具有相对独立性，可能超前或滞后于社会存在。"},{"n":119,"part":"政治理论","sec":"马克思主义基本原理","q":"唯物史观认为，社会历史发展的决定力量是（　）。","opts":["人民群众","英雄人物","地理环境","人口数量"],"ans":"A","tag":"人民群众","exp":"人民群众是历史的创造者，是社会物质财富、精神财富的创造者和社会变革的决定力量。"},{"n":120,"part":"政治理论","sec":"马克思主义基本原理","q":"商品是用来交换的劳动产品，其二因素是（　）。","opts":["具体劳动和抽象劳动","使用价值和价值","价值和交换价值","价格和价值"],"ans":"B","tag":"商品二因素","exp":"使用价值与价值；具体劳动与抽象劳动是劳动二重性，不是商品二因素，这是最易混的一对概念。"},{"n":121,"part":"政治理论","sec":"马克思主义基本原理","q":"生产商品的劳动二重性中，形成商品价值的是（　）。","opts":["抽象劳动","具体劳动","私人劳动","社会劳动"],"ans":"A","tag":"劳动二重性","exp":"具体劳动创造使用价值，抽象劳动形成价值。"},{"n":122,"part":"政治理论","sec":"马克思主义基本原理","q":"价值规律在商品经济中的表现形式是（　）。","opts":["价格围绕价值上下波动","价格始终等于价值","价格只升不降","价格由供求单方面决定"],"ans":"A","tag":"价值规律","exp":"价格受供求影响围绕价值上下波动，正是价值规律发生作用的表现形式。"},{"n":123,"part":"政治理论","sec":"马克思主义基本原理","q":"剩余价值的唯一源泉是（　）。","opts":["商品的自然属性","资本家的经营管理","先进的生产设备","雇佣工人的剩余劳动"],"ans":"D","tag":"剩余价值源泉","exp":"剩余价值来源于雇佣工人的剩余劳动，机器设备只是转移价值，不创造价值。"},{"n":124,"part":"政治理论","sec":"马克思主义基本原理","q":"产业资本循环依次经历的三个阶段是（　）。","opts":["购买阶段、生产阶段、销售阶段","生产阶段、购买阶段、销售阶段","销售阶段、生产阶段、购买阶段","购买阶段、销售阶段、生产阶段"],"ans":"A","tag":"资本循环","exp":"购买（货币资本）—生产（生产资本）—销售（商品资本）三阶段，对应三种职能形式。"},{"n":125,"part":"政治理论","sec":"马克思主义基本原理","q":"由于土地肥沃程度和地理位置不同而形成的级差地租，其产生的原因是（　）。","opts":["土地私有权的垄断","土地的资本主义经营垄断","农业资本有机构成高于工业","农产品价值低于生产价格"],"ans":"B","tag":"级差地租","exp":"由土地的资本主义经营垄断产生；绝对地租由土地私有权的垄断产生。"},{"n":126,"part":"政治理论","sec":"马克思主义基本原理","q":"关于真理的绝对性与相对性，下列表述正确的是（　）。","opts":["任何真理都是绝对性与相对性的统一","真理要么是绝对的，要么是相对的","相对真理中不包含绝对真理的成分","绝对真理是可以一次完成的"],"ans":"A","tag":"真理的绝对性与相对性","exp":"任何真理都是绝对性与相对性的统一，相对真理中包含绝对真理的颗粒。"},{"n":127,"part":"政治理论","sec":"马克思主义基本原理","q":"感性认识与理性认识的关系是（　）。","opts":["理性认识可以脱离感性认识凭空产生","感性认识比理性认识更深刻、更正确","二者互相排斥，不能并存","理性认识依赖于感性认识，感性认识有待于发展为理性认识"],"ans":"D","tag":"感性认识与理性认识","exp":"理性认识依赖于感性认识，感性认识有待于上升为理性认识，二者在实践基础上统一。"},{"n":128,"part":"政治理论","sec":"马克思主义基本原理","q":"必然性与偶然性的关系是（　）。","opts":["承认必然性就意味着否认偶然性","必然性与偶然性互不相干","偶然性纯粹由外部原因造成，与必然性无关","必然性通过偶然性为自己开辟道路，偶然性背后隐藏着必然性"],"ans":"D","tag":"必然与偶然","exp":"必然性通过偶然性开辟道路，偶然性背后隐藏着必然性，二者相互依存。"},{"n":129,"part":"政治理论","sec":"马克思主义基本原理","q":"现象与本质的关系是（　）。","opts":["现象是本质的外部表现，本质通过现象表现出来","现象与本质完全一致","本质可以直接感知","假象与本质毫无关系"],"ans":"A","tag":"现象与本质","exp":"现象是本质的外在表现，本质通过现象表现，假象也是本质的一种歪曲表现。"},{"n":130,"part":"政治理论","sec":"马克思主义基本原理","q":"整体与部分的关系中，下列表述正确的是（　）。","opts":["整体可以脱离部分独立存在","部分的功能总和必然等于整体的功能","整体由部分构成，整体功能可能大于各部分功能之和","部分对整体没有任何影响"],"ans":"C","tag":"整体与部分","exp":"整体由部分构成，结构优化时整体功能可大于部分功能之和，结构不合理时则可能小于。"},{"n":131,"part":"政治理论","sec":"毛泽东思想","q":"新民主主义革命的总路线中，革命的领导力量是（　）。","opts":["无产阶级","农民阶级","城市小资产阶级","民族资产阶级"],"ans":"A","tag":"新民主主义革命总路线","exp":"无产阶级领导的、人民大众的、反对帝国主义封建主义官僚资本主义的革命，领导力量是无产阶级。"},{"n":132,"part":"政治理论","sec":"毛泽东思想","q":"毛泽东在《〈共产党人〉发刊词》中总结的中国革命的“三大法宝”是（　）。","opts":["土地革命、武装斗争、根据地建设","实事求是、群众路线、独立自主","统一战线、武装斗争、党的建设","政治建军、思想建党、组织强党"],"ans":"C","tag":"三大法宝","exp":"统一战线、武装斗争、党的建设，出自《〈共产党人〉发刊词》。"},{"n":133,"part":"政治理论","sec":"毛泽东思想","q":"中国革命走“农村包围城市、武装夺取政权”道路的根本原因是（　）。","opts":["农民占人口多数且觉悟最高","共产国际的直接指示","城市工人阶级力量过于强大","中国是一个半殖民地半封建的大国，政治经济发展不平衡"],"ans":"D","tag":"农村包围城市道路","exp":"根本原因是中国是半殖民地半封建大国，政治经济发展不平衡，敌人统治力量集中在城市、农村相对薄弱。"},{"n":134,"part":"政治理论","sec":"毛泽东思想","q":"党在过渡时期总路线的核心内容是（　）。","opts":["以阶级斗争为纲，开展社会主义教育运动","逐步实现国家的社会主义工业化，逐步实现对农业、手工业和资本主义工商业的社会主义改造","多快好省地建设社会主义","调整、巩固、充实、提高"],"ans":"B","tag":"过渡时期总路线","exp":"“一化三改”，即逐步实现社会主义工业化，逐步实现对农业、手工业和资本主义工商业的社会主义改造。"},{"n":135,"part":"政治理论","sec":"毛泽东思想","q":"我国社会主义改造基本完成、社会主义制度基本建立的时间是（　）。","opts":["1949 年","1958 年","1962 年","1956 年"],"ans":"D","tag":"社会主义制度建立","exp":"1956 年三大改造基本完成，标志社会主义制度在我国基本建立。"},{"n":136,"part":"政治理论","sec":"毛泽东思想","q":"1956 年毛泽东发表《论十大关系》，其根本指导思想是（　）。","opts":["以阶级斗争为纲","全面照搬苏联模式","以重工业为中心高速发展","以苏为鉴，探索适合中国情况的社会主义建设道路"],"ans":"D","tag":"《论十大关系》","exp":"1956 年 4 月，基本方针是“以苏为鉴”，探索适合中国情况的社会主义建设道路。"},{"n":137,"part":"政治理论","sec":"毛泽东思想","q":"1957 年毛泽东在《关于正确处理人民内部矛盾的问题》中提出，社会主义社会的基本矛盾是（　）。","opts":["生产关系和生产力、上层建筑和经济基础之间的矛盾","无产阶级和资产阶级之间的矛盾","人民日益增长的物质文化需要同落后的社会生产之间的矛盾","城乡之间的矛盾"],"ans":"A","tag":"社会主义社会基本矛盾","exp":"仍是生产关系和生产力、上层建筑和经济基础之间的矛盾，但性质是非对抗性的，可以经过社会主义制度本身不断调整解决。"},{"n":138,"part":"政治理论","sec":"毛泽东思想","q":"毛泽东思想活的灵魂是（　）。","opts":["解放思想、实事求是、与时俱进","实事求是、群众路线、独立自主","统一战线、武装斗争、党的建设","自力更生、艰苦奋斗、勤俭建国"],"ans":"B","tag":"活的灵魂","exp":"实事求是、群众路线、独立自主，是贯穿毛泽东思想各个组成部分的立场观点方法。"},{"n":139,"part":"政治理论","sec":"毛泽东思想","q":"毛泽东系统阐述实事求是、从实际出发思想，并赋予“实事求是”哲学含义的著作是（　）。","opts":["《论持久战》","《改造我们的学习》","《新民主主义论》","《论联合政府》"],"ans":"B","tag":"《改造我们的学习》","exp":"1941 年发表，对“实事求是”作了哲学阐释：“'实事'就是客观存在着的一切事物，'是'就是客观事物的内部联系，即规律性，'求'就是我们去研究。”"},{"n":140,"part":"政治理论","sec":"毛泽东思想","q":"党的群众路线的基本内容是（　）。","opts":["相信群众、依靠群众、教育群众、改造群众","一切为了群众，一切依靠群众，从群众中来，到群众中去","从实践中来，到实践中去","民主集中、个别酝酿、会议决定"],"ans":"B","tag":"群众路线","exp":"一切为了群众，一切依靠群众，从群众中来，到群众中去。"},{"n":141,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"邓小平指出，社会主义的本质是（　）。","opts":["实现社会公平正义和人的全面发展","公有制为主体、多种所有制经济共同发展","按劳分配为主体、多种分配方式并存","解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕"],"ans":"D","tag":"社会主义本质","exp":"解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。"},{"n":142,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"“三个有利于”标准不包括（　）。","opts":["是否有利于发展社会主义社会的生产力","是否有利于扩大国有经济的比重","是否有利于提高人民的生活水平","是否有利于增强社会主义国家的综合国力"],"ans":"B","tag":"“三个有利于”","exp":"是否有利于发展社会主义社会的生产力、增强社会主义国家的综合国力、提高人民的生活水平。扩大国有经济比重不属于其中。"},{"n":143,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"我国社会主义初级阶段是指（　）。","opts":["任何国家进入社会主义都会经历的起始阶段","从新中国成立到社会主义改造完成的过渡时期","从改革开放到全面建成小康社会的时期","从社会主义改造基本完成到基本实现社会主义现代化的整个历史阶段"],"ans":"D","tag":"社会主义初级阶段","exp":"特指我国在生产力落后、商品经济不发达条件下建设社会主义必然要经历的特定阶段，从社会主义改造基本完成到基本实现社会主义现代化。"},{"n":144,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"我国社会主义现代化建设“三步走”战略中，第二步的目标是（　）。","opts":[" 党的二十大报告强调必须站在人与自然和谐共生的高度谋划发展。"},{"n":153,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"中国式现代化的重要特征之一，是（　）。","opts":["先污染后治理的现代化","人与自然和谐共生的现代化","以资源消耗换增长的现代化","以生态保护替代经济发展的现代化"],"ans":"B","tag":"中国式现代化特征","exp":"人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路五个特征之一。"},{"n":154,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"中国特色社会主义事业“五位一体”总体布局中，与经济建设、政治建设、文化建设、社会建设并列的是（　）。","opts":["生态文明建设","党的建设","国防和军队建设","法治建设"],"ans":"A","tag":"“五位一体”","exp":"经济建设、政治建设、文化建设、社会建设、生态文明建设。"},{"n":155,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"山水林田湖草沙一体化保护和系统治理，体现的哲学方法论是（　）。","opts":["用外部力量替代内因","孤立、静止地看问题","只抓主要矛盾、不顾次要矛盾","系统观念和普遍联系的观点"],"ans":"D","tag":"系统观念","exp":"山水林田湖草沙是一个生命共同体，必须统筹山水林田湖草沙系统治理，体现普遍联系与系统优化的方法。"},{"n":156,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"我国提出的“双碳”目标是（　）。","opts":["2025 年前实现碳达峰、2050 年前实现碳中和","2035 年前实现碳达峰、2060 年前实现碳中和","2030 年前实现碳达峰、2060 年前实现碳中和","2030 年前实现碳中和、2060 年前实现碳达峰"],"ans":"C","tag":"“双碳”目标","exp":"2030 年前实现碳达峰、2060 年前实现碳中和。两个年份与两个目标不能对调。"},{"n":157,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"我国设立的“全国生态日”是每年的（　）。","opts":["6 月 5 日","8 月 15 日","4 月 22 日","3 月 12 日"],"ans":"B","tag":"全国生态日","exp":"每年 8 月 15 日，2023 年首个全国生态日。6 月 5 日是世界环境日，4 月 22 日是世界地球日，3 月 12 日是植树节。"},{"n":158,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"推动长江经济带发展，必须坚持（　）。","opts":["全面开发、重点保护","先开发、后保护","共抓大保护、不搞大开发","以航运开发为中心"],"ans":"C","tag":"长江经济带","exp":"共抓大保护、不搞大开发，把修复长江生态环境摆在压倒性位置。"},{"n":159,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"黄河流域生态保护和高质量发展的首要任务是（　）。","opts":["能源开发","经济增速","城市建设","生态保护"],"ans":"D","tag":"黄河流域","exp":"生态保护是首要任务，坚持生态优先、绿色发展。"},{"n":160,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"生态保护红线的作用是（　）。","opts":["规定基本农田的保护面积","划定可开发的工业用地范围","限定城市建设用地的上限","划定并严守生态空间保护边界，保障国家生态安全"],"ans":"D","tag":"生态保护红线","exp":"在生态空间范围内具有特殊重要生态功能、必须强制性严格保护的区域，是保障国家生态安全的底线。"},{"n":161,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"我国国土空间开发保护的基础性制度是（　）。","opts":["建设用地审批制度","土地招拍挂制度","主体功能区战略和制度","不动产统一登记制度"],"ans":"C","tag":"主体功能区","exp":"以资源环境承载能力为基础，划定优化开发、重点开发、限制开发、禁止开发区域，是国土空间开发保护的基础 const KEY = 'gdquiz-' + QUIZ.meta.id;
const $ = s => document.querySelector(s);

const FKEY = KEY + '-fav';

let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ answers = {}; }

let favs = {};
try { favs = JSON.parse(localStorage.getItem(FKEY) || '{}'); } catch(e){ favs = {}; }

let list = QUIZ.questions.slice();   // 当前筛选后的题序
let pos = 0;                          // 在 list 中的位置
let filter = 'all';                   // all / 小节名 / fav
let favTab = null;

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(answers)); }catch(e){} }
function saveFav(){ try{ localStorage.setItem(FKEY, JSON.stringify(favs)); }catch(e){} }

function stats(){
  const total = QUIZ.questions.length;
  let done = 0, right = 0;
  QUIZ.questions.forEach(q => {
    const a = answers[q.n];
    if(a){ done++; if(a === q.ans) right++; }
  });
  return {total, done, right, rate: done ? Math.round(right/done*100) : null};
}

function refreshHeader(){
  const s = stats();
  $('#totalN').textContent = s.total;
  $('#doneN').textContent = s.done;
  const r = $('#rate');
  if(s.rate === null){ r.textContent = '—'; r.style.color = '#9ca3af'; }
  else {
    r.textContent = s.rate + '%';
    r.style.color = s.rate >= 80 ? '#15803d' : (s.rate >= 60 ? '#b45309' : '#b91c1c');
  }
  $('#pbar').style.width = (s.done / s.total * 100).toFixed(1) + '%';
  if(favTab){ favTab.textContent = '★ 收藏 ' + Object.keys(favs).length; }
}

function buildTabs(){
  const box = $('#tabs');
  const all = document.createElement('button');
  all.className = 'tab on'; all.textContent = '全部 ' + QUIZ.questions.length;
  all.onclick = () => { filter = 'all'; list = QUIZ.questions.slice(); pos = 0; render(); markTab(all); };
  box.appendChild(all);

  favTab = document.createElement('button');
  favTab.className = 'tab';
  favTab.textContent = '★ 收藏 ' + Object.keys(favs).length;
  favTab.onclick = () => {
    filter = 'fav';
    list = QUIZ.questions.filter(q => favs[q.n]);
    pos = 0; render(); markTab(favTab);
  };
  box.appendChild(favTab);

  QUIZ.sections.forEach(sec => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.textContent = sec.short;
    b.onclick = () => {
      filter = sec.name;
      list = QUIZ.questions.filter(q => q.sec === sec.name);
      pos = 0; render(); markTab(b);
    };
    box.appendChild(b);
  });
}
function markTab(el){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === el));
}

function renderEmpty(){
  $('#qno').textContent = '—';
  $('#qsec').textContent = '暂无题目';
  $('#qtext').textContent = '这里还没有题目。点题卡右上角的 ☆ 可以把想反复看的题收藏起来，之后在这里集中复习。';
  $('#opts').innerHTML = '';
  $('#exp').classList.remove('show');
  $('#star').style.visibility = 'hidden';
  $('#prev').disabled = true;
  $('#next').disabled = true;
  refreshHeader();
  buildGrid();
}

function render(){
  if(!list.length){ renderEmpty(); return; }
  const q = list[pos];
  const sel = answers[q.n];

  const st = $('#star');
  st.style.visibility = 'visible';
  const isFav = !!favs[q.n];
  st.textContent = isFav ? '★' : '☆';
  st.classList.toggle('on', isFav);
  st.onclick = () => {
    if(favs[q.n]) delete favs[q.n]; else favs[q.n] = 1;
    saveFav();
    if(filter === 'fav'){
      list = QUIZ.questions.filter(x => favs[x.n]);
      if(pos > list.length - 1) pos = Math.max(0, list.length - 1);
    }
    render();
  };

  $('#qno').textContent = '第 ' + q.n + ' 题';
  $('#qsec').textContent = q.sec;
  $('#qtext').textContent = q.q;

  const box = $('#opts');
  box.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((text, i) => {
    const k = letters[i];
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="k">' + k + '</span><span class="t"></span>';
    b.querySelector('.t').textContent = text;
    if(sel){
      b.classList.add('done');
      if(k === q.ans) b.classList.add('correct');
      else if(k === sel) b.classList.add('wrong');
      else b.classList.add('dim');
    } else {
      b.onclick = () => choose(k);
    }
    box.appendChild(b);
  });

  const exp = $('#exp');
  if(sel){
    exp.classList.add('show');
    const ok = sel === q.ans;
    const v = $('#verdict');
    v.className = 'verdict ' + (ok ? 'ok' : 'bad');
    v.innerHTML = (ok ? '✓ 回答正确' : '✗ 回答错误')
      + '<span class="badge">正确答案 ' + q.ans + '</span>';
    $('#tag').textContent = q.tag || '—';
    $('#expl').textContent = q.exp || '';
  } else {
    exp.classList.remove('show');
  }

  $('#redo').onclick = () => { delete answers[q.n]; save(); render(); };

  $('#prev').disabled = pos === 0;
  $('#next').disabled = pos === list.length - 1;
  $('#sheetBtn').textContent = '答题卡 ' + stats().done + '/' + stats().total;
  refreshHeader();
  buildGrid();
  window.scrollTo({top:0, behavior:'smooth'});
}

function choose(k){
  const q = list[pos];
  if(answers[q.n]) return;
  answers[q.n] = k;
  save();
  render();
}

function go(d){
  const np = pos + d;
  if(np < 0 || np >= list.length) return;
  pos = np; render();
}

function buildGrid(){
  const g = $('#grid');
  if(!g.dataset.built){
    g.dataset.built = '1';
  }
  g.innerHTML = '';
  const cur = list[pos] ? list[pos].n : -1;
  list.forEach(q => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.textContent = q.n;
    const a = answers[q.n];
    if(a) c.classList.add(a === q.ans ? 'ok' : 'bad');
    if(favs[q.n]) c.classList.add('fav');
    if(q.n === cur) c.classList.add('cur');
    c.onclick = () => { pos = list.findIndex(x => x.n === q.n); render(); closeSheet(); };
    g.appendChild(c);
  });
}

function openSheet(){ $('#mask').classList.add('show'); document.body.style.overflow='hidden'; buildGrid(); }
function closeSheet(){ $('#mask').classList.remove('show'); document.body.style.overflow=''; }

$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#sheetBtn').onclick = openSheet;
$('#closeSheet').onclick = closeSheet;
$('#closeTop').onclick = closeSheet;
$('#mask').onclick = e => { if(e.target === $('#mask')) closeSheet(); };

$('#jumpWrong').onclick = () => {
  const wrongIdx = list.findIndex((q, i) => i > pos && answers[q.n] && answers[q.n] !== q.ans);
  if(wrongIdx >= 0){ pos = wrongIdx; render(); closeSheet(); }
  else {
    const any = list.findIndex(q => answers[q.n] && answers[q.n] !== q.ans);
    if(any >= 0){ pos = any; render(); closeSheet(); }
    else alert('当前范围内没有错题。');
  }
};

$('#resetAll').onclick = () => {
  if(confirm('清空本期的全部答题记录？')){
    answers = {}; save(); pos = 0; render();
  }
};

document.addEventListener('keydown', e => {
  const k = e.key.toUpperCase();
  if(['1','2','3','4'].includes(k)) choose(['A','B','C','D'][+k - 1]);
  else if(['A','B','C','D'].includes(k)) choose(k);
  else if(k === 'F'){ const b = $('#star'); if(b && b.style.visibility !== 'hidden') b.click(); }
  else if(e.key === 'ArrowLeft') go(-1);
  else if(e.key === 'ArrowRight') go(1);
  else if(e.key === 'Escape') closeSheet();
});

$('#sub').textContent = QUIZ.meta.label;
buildTabs();
render();
</script>
</body>
</html>
