<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>高频成语速记</title>
<style>
:root{
  --ink:#111827; --sub:#6b7280; --line:#e6e8ec; --bg:#f5f6f8;
  --card:#fff; --accent:#b45309; --gold:#f59e0b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.7}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.htop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{font-size:17px;font-weight:700;letter-spacing:.3px}
.brand small{display:block;font-size:11.5px;font-weight:400;color:var(--sub);margin-top:3px;letter-spacing:0}
.hstat{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.xlink{font-size:11px;font-weight:600;color:#b45309;text-decoration:none;margin-left:9px;
  border:1px solid #fde68a;background:#fffbeb;padding:1px 7px;border-radius:8px;vertical-align:2px}
.xlink:hover{background:#fef3c7}
.hstat b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.hstat .fav{color:var(--accent)}
.sync{display:inline-block;margin-top:3px;font-size:10.5px;padding:1px 7px;border-radius:9px;
  border:1px solid var(--line);color:#9ca3af;background:#fafafa}
.sync.ok{color:#15803d;border-color:#bbf7d0;background:#f0fdf4}
.sync.off{color:#b91c1c;border-color:#fecaca;background:#fef2f2}

.bar{display:flex;gap:8px;align-items:center;padding-bottom:10px;flex-wrap:wrap}
.search{flex:1;min-width:150px;position:relative}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:14px;background:#fff;outline:none}
.search input:focus{border-color:#c7cdd6;box-shadow:0 0 0 3px #eef1f5}
.seg{display:flex;background:#eceef2;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;
  color:var(--sub);cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--sub);
  padding:5px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

main{max-width:760px;margin:0 auto;padding:18px 16px 120px}

/* 卡片模式 */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:26px 22px 20px;box-shadow:0 1px 2px rgba(16,24,40,.04);position:relative;min-height:260px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.card .word{font-size:42px;font-weight:700;letter-spacing:6px;line-height:1.4;padding-left:6px}
.card .hintline{margin-top:18px;font-size:12.5px;color:#9ca3af}
.card .def{display:none;margin-top:16px;font-size:15.5px;line-height:1.95;color:#1f2937;
  text-align:left;width:100%;border-top:1px dashed var(--line);padding-top:16px}
.card.open .def{display:block}
.card.open .hintline{display:none}
.card .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;width:100%}
.card .tagrow span{font-size:11px;color:var(--sub);background:#f3f4f6;border-radius:6px;padding:2px 8px}
.star{position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:50%;border:0;
  background:transparent;font-size:22px;line-height:1;color:#d1d5db;cursor:pointer}
.star.on{color:var(--gold)}
.nav{display:flex;gap:10px;align-items:center;margin-top:14px}
.nav .btn{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:#fff;
  font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit}
.nav .btn:disabled{color:#c7cbd1}
.nav .btn.main{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.pos{text-align:center;font-size:12px;color:var(--sub);margin-top:10px}

/* 全览模式 */
.grid{display:grid;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;
  position:relative;cursor:pointer}
.item .w{font-size:17px;font-weight:700;letter-spacing:1px;padding-right:26px}
.item .d{font-size:13.5px;line-height:1.85;color:#374151;margin-top:5px}
.item .s{font-size:11px;color:#9ca3af;margin-top:6px}
.item .k{position:absolute;top:9px;right:11px;font-size:16px;color:#d1d5db}
.item .k.on{color:var(--gold)}
.item.clip .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:#9ca3af;font-size:13.5px;padding:60px 0}
.foot{max-width:760px;margin:0 auto;padding:0 16px 40px;text-align:center;font-size:11.5px;color:#9ca3af;line-height:1.8}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="htop">
      <div class="brand">高频成语速记<a class="xlink" href="省考平台.html#quiz">每日刷题 ↗</a><small id="sub"></small></div>
      <div class="hstat">
        <div><b id="totalN">0</b> 条　<span class="fav" id="favN">★ 0</span></div>
        <span class="sync" id="sync">连接中…</span>
      </div>
    </div>
    <div class="bar">
      <div class="search"><input id="q" type="search" placeholder="搜成语或释义里的字…" autocomplete="off"></div>
      <div class="seg">
        <button id="mCard" class="on">卡片</button>
        <button id="mList">全览</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main>
  <section id="cardView">
    <div class="card" id="card">
      <button class="star" id="star" title="收藏（F）">☆</button>
      <div class="word" id="word">—</div>
      <div class="hintline">点击卡片看释义　·　空格翻面</div>
      <div class="def" id="def"></div>
      <div class="tagrow" id="tags"></div>
    </div>
    <div class="nav">
      <button class="btn" id="prev">上一个</button>
      <button class="btn main" id="next">下一个</button>
    </div>
    <div class="nav">
      <button class="btn" id="shuffle">随机一条</button>
      <button class="btn" id="reveal">显示释义</button>
    </div>
    <div class="pos" id="pos"></div>
  </section>

  <section id="listView" style="display:none">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">没有符合条件的成语</div>
  </section>
</main>

<p class="foot">释义整理自《高频800词记忆版》，OCR 提取后人工校验；★ 收藏存在本地服务器，换浏览器也不会丢</p>

<script>
const DATA = [{"w":"一以贯之","d":"指做人做事，按照一个道理，从始至终都不会改变。贯：一直，习惯。"},{"w":"一劳永逸","d":"逸：安逸。指辛苦一次把事情办好，以后就不用费力了。"},{"w":"一叶知秋","d":"看见一片落叶，就知道秋天将临。比喻发现一点预兆就知道事物将来的发展趋向。也作“落叶知秋”“叶落知秋”。（侧重从预兆推知未来）"},{"w":"一叶障目","d":"眼晴被一片树叶挡住，指看不到事物的全貌。"},{"w":"一孔之见","d":"从一个小孔里看到的事物。比喻片面的观点见解。多谦称自己的看法。"},{"w":"一成不变","d":"成：形成。指事物一形成就不再改变。多用于否定句中。"},{"w":"一挥而就","d":"原义是一挥笔就能成功（就：完成）。指才思敏捷，写字、作文或画画速度很快。"},{"w":"一文不名","d":"形容人非常穷困，一文钱都没有。"},{"w":"一无所知","d":"意思是什么也不知道。"},{"w":"一日千里","d":"一日千里一天跑一千里。也比喻进步、发展很快。"},{"w":"一板一眼","d":"比喻言语、行动有条理或合规矩。有时也比喻做事死板，不懂得灵活掌握。"},{"w":"一概而论","d":"用同一标准来对待或处理（多用于否定）：不能。"},{"w":"一步登天","d":"比喻一下达到很高的境界、程度。也比喻人一下子爬上高位。（多含贬义。）"},{"w":"一气呵成","d":"形容文章的气势首尾贯通。形容完成整个工作的过程中不间断，不松懈。"},{"w":"一目了然","d":"一眼就看得很清楚。形容事物、事情原委很清晰，一看就知道是怎么回事。"},{"w":"一穷二白","d":"穷：指物质基础差；白：指文化和科学落后。比喻基础差，底子薄。"},{"w":"一筹莫展","d":"筹：计策。展：施展。一点计策也施展不出。形容没有一点办法。"},{"w":"一脉相承","d":"一脉：指一个血统或一个派系。相承：相续传承。由一个血统或一个派别世代相传承袭下来。比喻人或事物间的传承关系。也作“一脉相传”“一脉相通”。"},{"w":"一衣带水","d":"原形容像一条衣带那样狭窄的河流。现比喻仅隔一水，极其邻近。"},{"w":"一览无余","d":"览：看。余：剩余。形容一下子就可以看清楚。同“一览无遗”“一览而尽”。（侧重看的全）"},{"w":"一语中的","d":"意思是指一句话就说中要害，一句话就说清了事情的重点。"},{"w":"一语成識","d":"就是一句（不好的）话说中了，就是“不幸而言中”（不吉利的事情，诅咒别人似的）。"},{"w":"一豌而就","d":"就：踏；就：成功。踏一步就可以获得成功，比事情很容易做。同“一而得”。（多用于否定句中。）"},{"w":"一针见血","d":"意思是比喻说话直截了当，切中要害。"},{"w":"一马当先","d":"策马走在最前面。形容率先、领先。"},{"w":"一鼓作气","d":"原意是作战擂响第一声战鼓时，士气最为高涨，比喻趁劲头大的时候鼓起千劲，一口气把工作做完。"},{"w":"万人空巷","d":"空巷：街道里弄里的人全部走空。指家家户户的人都从巷里出来了。多形容庆祝、欢迎等盛况。"},{"w":"上行下效","d":"行：做。效：效法。指上面的人怎么做，下面的人就跟着怎么千。"},{"w":"不一而足","d":"不是一事一物能够使之满足的。后也用来形容所说的事物或现象不止一种，而是很多，不能一一列举。"},{"w":"不分轩轻","d":"意思是不分高下、轻重。比喻对待二者的态度或看法差不多。"},{"w":"不刊之论","d":"刊：削，修改。不可改动或不可磨灭的言论。"},{"w":"不可思议","d":"原有神秘奥妙的意思，是佛教用语。现多指无法想象，难以理解。"},{"w":"不容置喙","d":"喙：嘴。不容许插嘴。"},{"w":"不容置疑","d":"容：允许。不允许加以怀疑。指绝对真实可信。"},{"w":"不屑一顾","d":"不屑：认为不值得。顾：回头看。不值得一看，表示轻视、看不起。"},{"w":"不拘一格","d":"不拘一格指不拘泥于一种规格、方式，比喻打破常规。"},{"w":"不易之论","d":"易：更改。指不可更改的言论。"},{"w":"不期而至","d":"指事先没有约定而意外到来，没有预料地到来。"},{"w":"不期而遇","d":"没约定而意外相遇。"},{"w":"不求甚解","d":"甚：很，极。原指读书只领会要旨，不必在一字一句上下功夫。后指只求懂个大概，不去深入理会。"},{"w":"不浮众望","d":"孚：信服。不能使群众信服。"},{"w":"不甚了了","d":"意思是指心里不太明白，不是很清楚。"},{"w":"不知所措","d":"措：处置，安排。不知道应该怎么办。"},{"w":"不约而同","d":"原意是事先没有约定而一齐前来会合。后用来指没有事先商量约定而彼此的看法或言行相同。（侧重行为上）"},{"w":"不绝如缕","d":"缕：线。像一根细线那样连着，差一点儿就要断了。1形容形势十分危急。2形容声音微弱而悠长。（现在用法有改变，常被用来形容不断绝）"},{"w":"不置可否","d":"置：搁置，安放；可否：可以不可以。不说可以，也不说不可以。指不表明自己的态度。"},{"w":"不胜枚举","d":"胜：尽。枚：量词，个。举：列举。不能够一个一个地全部列举出来。形容数量很多。（多用于形容举例子枚举时）"},{"w":"不落案白","d":"意为不落俗套，有独创风格（多用于形容文章或艺术作品）。"},{"w":"不言而喻","d":"喻：明白。不用说什么就能明白。也作“不言自明”。"},{"w":"不谋而合","d":"谋：商量；合：相同。事先没有商量而彼此的做法或意见却相同。也作“不谋而同”。（侧重思想上）"},{"w":"不负众望","d":"意思是指为人所信服，很争气，，不幸负大家的期望。"},{"w":"不足为奇","d":"不值得奇怪。指某些现象或事物很平常，没有什么特别的。"},{"w":"不露声色","d":"意思是心里面的计划或者想法并不通过言语和面部表情直接表现出来。"},{"w":"与时俱进","d":"时：时间。俱：一起，一同。进：前进。与时间一起前进。指不断进取，永不停滞。"},{"w":"与虎谋皮","d":"跟老虎商量取下它的皮来，比喻跟坏人商量要其牺牲自己的利益，是绝对办不到的。"},{"w":"专心致志","d":"致：尽。志：志向，志趣。把心思全部放在上面。形容一心一意，精神集中。"},{"w":"东施效犁","d":"比喻盲目地胡乱模仿，效果适得其反。"},{"w":"临渊美鱼","d":"比有欲望想得到某种东西，但却没有实际行动。"},{"w":"临渴掘井","d":"临；接近。感到口渴才挖井。比喻平时没有准备，事到临头才想办法。"},{"w":"举一反三","d":"反：类推，推论。指举出一件事，就可以触类旁通，类推出许多同类事物来。（侧重于具象的事物层面）（侧重类推）"},{"w":"举步维艰","d":"抬脚行走十分困难。形容已陷入十分艰难的处境。"},{"w":"举足轻重","d":"形容有实力，地位重要，能左右局势的发展。"},{"w":"义不容辞","d":"义：道义。辞：推辞。道义上不容许推辞。指理应接受。（侧重良心、道义上）"},{"w":"乏善可陈","d":"善：良好成绩；陈：陈述，告诉。意思是没有什么好的可以称道的。"},{"w":"乐此不疲","d":"因酷爱干某事而不感觉厌烦。形容对某事特别爱好而沉浸其中。"},{"w":"习以为常","d":"常做某种事情或常见某种现象，成了习惯，就觉得很平常了。"},{"w":"习焉不察","d":"习：习惯；焉：语气词，有“于此”的意思；察：觉察。指经常接触某种事物，反而觉察不到其中存在的问题。"},{"w":"买模还珠","d":"木匣子。还：退还。比喻没有眼光，不识货，取舍失当。"},{"w":"了如指掌","d":"了：明了，明白。指掌：指着手掌。指对事物的了解非常清楚，像把东西放在手掌里让人看一样。"},{"w":"事与愿违","d":"事：事实。愿：心愿，愿望。事实与主观愿望相反。（侧重没达到）"},{"w":"事半功倍","d":"事：所要做的事情，指措施。功：功效。形容费力小，收效大。"},{"w":"事必躬亲","d":"亲：亲自做。凡事都一定要自己亲自去做。"},{"w":"于事无补","d":"指某种言行对于解决问题没有帮助。"},{"w":"互为表里","d":"甲为乙的外表，乙为甲的内里；比喻互相依存，互相接受。"},{"w":"五花八门","d":"原指五行阵和八门阵。这是古代两种战术变化很多的阵势。比喻变化多端或花样繁多。"},{"w":"亘古不变","d":"从古至今永远也不会改变。多袭义"},{"w":"亡羊补牢","d":"意指丢失了再去修补羊圈，还不算晚。后用来比喻出了问题以后及时想法补救，以免继续受损失。也指出了问题才想法补救，已经太晚了。"},{"w":"交相辉映","d":"各种光亮、色彩相互照耀、映射。常用语形容美好的景象。"},{"w":"亦步亦趋","d":"步：走。趋：快走。比喻因缺乏主见，任何事都模仿、追随他人。（侧重行动）"},{"w":"亲历亲为","d":"亲自参与，不由别人来代替。"},{"w":"人云亦云","d":"云：说。人家怎么说，自己也跟着怎么说。指没有主见或创见。（侧重于说）"},{"w":"人声鼎沸","d":"鼎：古代煮食器；沸：沸腾。形容人群的声音吵吵，就象煮开了锅一样。"},{"w":"人尽皆知","d":"一定范围内的人都知道了。也就是说大家都知道了。"},{"w":"人山人海","d":"形容聚集的人非常多。"},{"w":"人心所向","d":"意思指的是人民群众所拥护的、向往的事物或者方向。"},{"w":"人浮于事","d":"意思是原指任事人的职位高于所得禄的等级。人浮于食，后作人浮于事，指人员的数目超过工作的需要。"},{"w":"人迹罕至","d":"罕：少。指偏僻荒凉、少有人到的地方。（侧重偏僻荒凉）"},{"w":"今非昔比","d":"现在不能和过去相比。形容变化大。（多形容现在比过去好）"},{"w":"从善如流","d":"从：听从；善：好的，正确的；如流：好像流水向下，形容迅速。形容能迅速地接受别人的好意见。"},{"w":"从容不迫","d":"从容：不慌不忙，很镇静；不迫：不急促。不慌不忙，沉着镇定。"},{"w":"从谏如流","d":"谏：直言规劝。听从规劝像流水一样自然。形容乐于接受别人的批评意见。"},{"w":"以一持万","d":"用来形容抓住了关键的环节或因素，从而能够控制和影响整个局面。它强调的是在处理问题时识别并把握住核心部分的重要性，以此来驾驭复杂的情况或者广泛的领域。"},{"w":"以偏概全","d":"以：用；偏：片面；概：概括；全：全部。用片面的观点看待整体问题"},{"w":"以小见大","d":"从小的可以看出大的，指通过小事可以看出大节，或通过一小部分看出整体。（侧重大小对比）"},{"w":"以身作则","d":"身：自身。则：榜样。自己以行动给大家做出榜样。"},{"w":"以邻为垦","d":"壑：深沟。意为把邻国当成排洪水的沟壑。后用来比喻把困难、灾祸推给别人。（多宏观语境，国家、城市、地区等）"},{"w":"休戚与共","d":"休：欢乐，吉庆。戚：忧愁，悲哀。指忧喜祸福彼此共同承担。形容关系密切同甘共苦。"},{"w":"休戚相关","d":"休：喜悦，吉利。戚：忧愁，悲哀。欢乐、忧愁彼此相关联。形容关系密切，利害相关。同“休戚与共”。"},{"w":"众望所归","d":"意思是用于形容某人威望很高，受到大家敬仰和信赖。"},{"w":"众说纷绘","d":"纷绘：多而姑乱。人多嘴杂，议论纷纷。（前面可加主语，也可不加主语；有时可做形容词）（侧重观点多）"},{"w":"优胜劣汰","d":"指生物在生存竞争中适应力强的保存下来，适应力差的被淘汰。"},{"w":"伯仲之间","d":"伯仲，兄弟排行的次第，伯是老大，仲是老二；间，中间。比喻差不多，难分优劣。"},{"w":"作壁上观","d":"原指双方交战，自己站在壁垒上旁观。后多比喻站在一旁看着，不动手帮助。"},{"w":"作茧自缚","d":"蚕吐丝作茧，把自己包在里面。比喻自己束缚了自己或使自己陷入困境"},{"w":"佶屈擎牙","d":"佶屈：曲折；聲牙：不顺口。指文章读起来不顺口。"},{"w":"侃侃而谈","d":"“侃侃”指理直气壮，从容不迫。该成语可以表示一个人在说话时表现出的自信和从容，也可以形容一个人善于交谈、风度翩翩。（袭义词）"},{"w":"保驾护航","d":"保护某事物能让其能正常发展。"},{"w":"信口雌黄","d":"信：任凭，听任；雌黄：即鸡冠石，黄色矿物，用作颜料。古人用黄纸写字，写错了，用雌黄涂抹后改写。比喻不顾事实，随口乱说。"},{"w":"信手括来","d":"信手：随手；括：用两三个手指头捏东西。随手拿来，多指写文章时能自由纯熟地选用词语或应用典故、素材，用不着怎么思考。（多用于引用资料、数据、典故等）（也可形容做事不费力）"},{"w":"俯拾皆是","d":"形容到处都有，很容易取得。"},{"w":"倚马可待","d":"倚靠着即将出征的战马起草文件，却可以立等完稿。形容文思敏捷，文章写得快。"},{"w":"偃旗息鼓","d":"偃：放倒。息：停息。放倒旗帜，停止击鼓，指军队为不暴露目标而隐蔽行动或停止作战。后也比喻事情中止。也作“掩旗息鼓”。"},{"w":"偷梁换柱","d":"比喻暗中耍手段改变事物内容，以假代真，以劣代优。"},{"w":"充耳不闻","d":"充：塞住。形容故意不听别人的话。也形容对某些事漠不关心。也作“听而不闻”。（主观上故意或不重视）"},{"w":"克己奉公","d":"克己：约束自己；奉公：以公事为重。克制自己的私心，一心为公。"},{"w":"入木三分","d":"形容书法笔力强劲。后也比喻看问题精辟、深刻。（也可形容对人物的描写刻画形象深刻）"},{"w":"兴师动众","d":"意思是指大规模出兵。现多指动用很多人力做某件事。"},{"w":"具体而微","d":"用于描述事物的各个部分大体具备，但规模或形状较小，具有积极的含义。（不属于该分类，记住意义即可）"},{"w":"养尊处优","d":"养：指生活。指生活在有人伺候、条件优裕的环境中。"},{"w":"兼容并蓄","d":"并：一起。蓄：积聚，储存。对不同的人或事物都能同时收容保留。"},{"w":"凤毛麟角","d":"凤毛：凤凰的毛。麟角：麒麟的角。比喻珍贵而稀少的人或事物。"},{"w":"出类拔萃","d":"出：超出。类：同类。拔：高出。萃：指聚在一起的人或物。指人的品德才能出众，高出同类之上。（侧重能力或品德）（高于同类）"},{"w":"分崩离析","d":"分：分开。崩：倒塌。离析：离散。形容家庭、集团、组织或国家分裂瓦解。"},{"w":"分庭抗礼","d":"庭：庭院。抗：对等。客人与主人分立在庭的两侧，以平等的地位相对行礼。后用来比喻彼此地位或势力相等，平起平坐或互相对立。"},{"w":"刚惊自用","d":"任性；刚：强硬固执；自用：自以为是。十分固执自信，不考虑别人的意见。"},{"w":"删繁就简","d":"意思是去掉删除繁杂部分，使它趋于简明。"},{"w":"判若云泥","d":"意思是高低差别就像天上的云彩和地下的泥土那样悬殊。"},{"w":"刨根问底","d":"比喻追究底细。"},{"w":"别出心裁","d":"心裁：内心的决断。另外想出与众不同的办法、主意。也作“独出心裁”。（侧重想法构思巧妙）"},{"w":"别开生面","d":"比喻另外开创新的局面或新的形式。"},{"w":"刻舟求剑","d":"求：寻找。比喻拘泥、不变通，不懂得根据实际情况处理问题。也比喻徒劳无功，达不到目的。"},{"w":"削足适履","d":"履：鞋。鞋小脚大，把脚削去一块来凑合鞋的大小。比喻不合理地迁就合或不顾具体条件，生搬硬套。"},{"w":"前仆后继","d":"意思是指前面的人倒下了，后面的人继续跟上去。英勇斗争，不怕牺牲"},{"w":"剑走偏锋","d":"指不走常规，找一些新的、不同以往的办法来解决问题，以求出奇制胜。"},{"w":"力不从心","d":"心里想做，可是力量够不上。"},{"w":"力有未逮","d":"指有意愿却做不到。"},{"w":"功亏一贪","d":"盛土的筐，指一筐土。后用来比喻做事情只差最后一点而前功尽弃"},{"w":"功败垂成","d":"垂：接近，将要。事情在将要成功的时候失败了。含婉惜意。同“事败垂成"},{"w":"劳民伤财","d":"意思是既使人民劳苦，又耗费钱财；现也指滥用人力物力。"},{"w":"势在必行","d":"势：形势。客观形势决定必须这样做。"},{"w":"势如破竹","d":"势：形势。破竹：劈开竹子。形势如同劈竹子一样，劈开头上几节，下面各节就顺着刀口裂开了。后用来形容节节胜利，毫无阻碍。"},{"w":"勇往直前","d":"往：去。勇敢地一直前进。"},{"w":"勇毅前行","d":"意思是勇敢并且坚毅地向前进步或发展。"},{"w":"包罗万象","d":"包罗：包括；万象：宇宙间的一切景象，指各种事物。形容内容丰富，应有尽有。"},{"w":"化为乌有","d":"乌有：虚幻，不存在。指变得什么都没有。"},{"w":"匠心独运","d":"匠心：精巧的心思。具有独到的创造性。多指文学艺术的创作构思。同“独具匠心”“匠心独运”。（侧重文艺创作的心思巧妙）"},{"w":"匪夷所思","d":"形容人的思想、言谈、技艺、事情等离奇，超出寻常，指行为举止离奇古怪，超出常情，不是一般人根据常理所能想象的。"},{"w":"千篇一律","d":"一千篇文章都一个样。指文章公式化。也比喻办事按一个格式，非常机械。"},{"w":"南辕北辙","d":"辕：车辕，车前驾牲口的直木。辙：车轮经过留下的痕迹。本要往南边去却驾车向北。比喻行动和目的截然相反。（多形容同一个主语、侧重目标与做法相反）"},{"w":"博大精深","d":"博大：广大。精深：精湛深刻。形容学识、思想、理论广博丰富，精湛深刻。"},{"w":"博采众长","d":"博采：广泛搜集采纳。从多方面吸取各家的长处。"},{"w":"危在旦夕","d":"旦夕：早晨和晚上，形容时间短。形容危险就在眼前。"},{"w":"危如累卵","d":"比喻形势非常危险，如同堆起来的蛋，随时都有塌下打碎的可能。"},{"w":"危若朝露","d":"意思是危险得像清早的露水一样，太阳一出就要消失，形容面临灭亡，情况危急。"},{"w":"卷土重来","d":"卷土：卷起尘土。形容人马奔跑之状。比喻失败以后又重新恢复势力也比喻消失了的人或事物重新出现。（中性，多贬义）"},{"w":"卷性浩繁","d":"形容书籍很多或一部书的篇幅很长。"},{"w":"历久弥新","d":"弥：更加。指经历长久的时间而更加鲜活，更加有活力，更显价值。"},{"w":"厉兵袜马","d":"厉：同“砺”，磨；兵：兵器；秭：喂牲口。磨好兵器，喂好马。形容准备战斗。"},{"w":"厚积薄发","d":"厚积：充分积累。薄发：少量地慢慢地释放。形容积累丰富的学问而不轻易表现出来。"},{"w":"去芜存菁","d":"意思是除去杂质、保留精华。"},{"w":"参差不齐","d":"参差：高低、长短、大小不齐的样子。形容不一致、有差别。（多搭配水平、质量、进展等）"},{"w":"双峰并峙","d":"意思通常指的是两座高大的山峰彼此对立地耸立着。这个成语不仅用来形容自然界的景观，也常用于比喻在某一领域或文化上同时达到极高成就的两个人物或事物。"},{"w":"双管齐下","d":"管：笔管。比喻一件事同时采用两种办法或两件事同时进行。"},{"w":"发发可危","d":"山高陡峭，就要倒下的样子。形容非常危险，快要倾覆或灭亡。"},{"w":"变幻莫测","d":"变幻：没有规则地改变。变化奇特，不可预测。"},{"w":"口耳相传","d":"口说耳听，递相传授。"},{"w":"口若悬河","d":"“悬河”指瀑布。意为说话滔滔不绝，像河水倾泄一样，形容能说善辩，话语不断。"},{"w":"另辟跨径","d":"意思是另外开辟一条路。比喻另创一种风格或方法。"},{"w":"只言片语","d":"简短零碎的话语、文字。形容语言文字数量极少。"},{"w":"司空见惯","d":"原指司空看惯了某事以为平淡；后比喻常见之事；不足为奇。"},{"w":"叹为观止","d":"叹：赞叹。观止：看到这里就停止，不再看别的了，称赞所看的事物尽善尽美。赞美所看到的事物好到了极点。"},{"w":"各执一词","d":"指不同的人或群体持有不同的说法或观点，且这些观点往往相互对立，强调多方观点的对立与争论。核心在于展现不同立场间的矛盾冲突，常用于描述公开争论或复杂局面。"},{"w":"各持己见","d":"持：抓住不放。各人都坚持自己的意见。"},{"w":"各有千秋","d":"千秋：千年，指久远。各自有其可以长久流传的价值。也比喻各有各的优点和特色。"},{"w":"各自为政","d":"各人按自己的主张办事。（多用来形容工作，单位之间、部门之间）"},{"w":"各行其是","d":"指各人按照自己认为正确的去做。"},{"w":"吉光片羽","d":"吉光：古代神话中的神兽名；片羽：一片毛。比残存的珍贵文物。"},{"w":"同心同德","d":"思想统一，信念一致。形容大家团结一条心。"},{"w":"同日而语","d":"指相提并论。（侧重于强调时间上的对比，多形容与自身的比较。现有时也有例外）（多用于否定句中）"},{"w":"同流合污","d":"泛指臭味相投的人结合在一起。原指言行与不良的习俗、世道相合。后指跟坏人一起干坏事。"},{"w":"同舟共济","d":"济：渡过。同乘一条船过河。比喻齐心协力渡过困难。"},{"w":"名噪一时","d":"意思是一时名声很大。指名声传扬于一个时期。"},{"w":"名声大噪","d":"名声广泛地传播开去。噪：传扬。"},{"w":"后继无人","d":"继：继续，继承。没有继承的人。形容事业缺少接班人。"},{"w":"吐故纳新","d":"纳：使进入，吸入。道家的养生术，吐出浊气，吸进新鲜空气。后多比喻杨弃旧的，吸收新的。（多形容事物在发展中呈现新的面貌）"},{"w":"呕心沥血","d":"呕：吐。沥：滴。形容费尽心思。"},{"w":"命悬一线","d":"处境危险，随时可能丧失生命。"},{"w":"和衷共济","d":"衷：内心。和衷：指同心。大家同心渡过江河。比喻同心协力，渡过难关。现也可比喻齐心协力。"},{"w":"和风细雨","d":"意思是比喻耐心地和颜悦色地批评或劝说。"},{"w":"哗众取宠","d":"用浮夸的言词或做作的行动去迎合群众，以博取好感和支持。"},{"w":"唇齿相依","d":"嘴唇与牙齿互相依存。比喻关系极为密切。"},{"w":"唯利是图","d":"唯：只有；图：图谋，追求。只要有利可图，什么事都干。"},{"w":"喜闻乐见","d":"意思是喜欢听，乐意看。形容很受欢迎。"},{"w":"喧宾夺主","d":"喧：吵吵。客人的声音压倒了主人的声音。比喻外来的或次要的事物占据了原有的或主要的事物的位置。"},{"w":"喽之以鼻","d":"笑。用鼻子发出笑声，表示轻蔑，不以为然。"},{"w":"回天乏术","d":"回天：比喻力量大，能移转极难挽回的时势；乏之术：缺少方法。比喻局势或病情严重，已无法挽救。"},{"w":"因势利导","d":"因：顺着。势：趋势。利导：引导。指顺着事物的发展趋势而加以引导。（襄义）"},{"w":"因地制宜","d":"根据不同地方的基本情况，制定相应的办法。"},{"w":"因小失大","d":"因：为了。指为了小的利益造成大的损失。"},{"w":"因循守旧","d":"因循：沿用旧办法。指一直沿用旧办法而不加改变。（侧重新与旧）"},{"w":"因陋就简","d":"指在条件有限的情况下，利用现有简陋条件将就办事，强调适应环境而非追求完善。该成语袭贬取决于“简”的合理性一灵活务实则袭，降低标准则贬。"},{"w":"固执己见","d":"顽固地坚持自己的意见，不肯改变。"},{"w":"固步自封","d":"封：限制在一定的范围内。比喻因循守旧，安于现状，不求创新进取。（侧重开放与封闭）"},{"w":"国泰民安","d":"泰：太平。国家太平，人民生活安定。形容社会安定，人民生活幸福。"},{"w":"圆图吞枣","d":"圆图：整个的。把枣子整个吞下。比喻笼统地接受，不加分析、甄别，不求甚解。"},{"w":"土崩瓦解","d":"瓦解：制瓦时先把陶土制成圆筒形，分解为四，即成瓦，比喻事物的分裂。象土崩塌，瓦破碎一样，不可收拾。比喻彻底垮台。"},{"w":"坐井观天","d":"比喻眼界不开阔，见识不广。"},{"w":"坐享其成","d":"意思为自己不出力而享受别人取得的成果。"},{"w":"坐收渔利","d":"比喻利用别人的矛盾而从中获利。"},{"w":"坐而论道","d":"意思是坐着空谈大道理。指口头说说，不见行动。"},{"w":"坚定不移","d":"意思是稳定坚强，毫不动摇；不放弃，不改变自己的想法。"},{"w":"堂而皇之","d":"形容公然而毫不掩饰（多含贬义），强调表面上的正当性或气势宏大，可能隐含虚伪或掩饰。"},{"w":"墨守成规","d":"形容因循守旧，不肯改变。"},{"w":"声名鹊起","d":"鹊起：喻指名声大作。形容名声迅速提高。"},{"w":"夕惕若厉","d":"若：如；厉：危。朝夕戒惧，如临危境，不敢稍懈。"},{"w":"夙兴夜寨","d":"夙：早。兴：起来。：睡觉。早起晚睡，形容勤奋辛劳。"},{"w":"夜以继日","d":"日夜不停地做某事。多形容十分勤奋、勤忌、忙碌。"},{"w":"夜郎自大","d":"夜郎：汉代时位于我国西南部的一个小国。比喻妄自尊大。"},{"w":"大义凛然","d":"大义：正义。凛然：令人敬畏的样子。形容为了坚持真理而表现出的严峻不可侵犯的样子。"},{"w":"大势所趋","d":"大势：整个局势。趋：趋向。整个局势发展的方向。"},{"w":"大同小异","d":"指事物大体相同，略有差异。"},{"w":"大张旗鼓","d":"形容进攻的声势和规模很大；也形容群众活动声势和规模很大。"},{"w":"大显身手","d":"显：表露，表现；身手：指本领。充分显示出本领和才能。"},{"w":"大有可为","d":"比喻指前途极有希望，值得去做。"},{"w":"大相径庭","d":"径：门外小路。庭：厅堂前得院子。指彼此相差很远或截然不同。"},{"w":"大而化之","d":"原意是指大行其道，使天下化之。后来这个成语的意思演变成了形容做事情不够谨慎，疏忽大意。"},{"w":"大行其道","d":"新潮事物流行成为一种风尚。（中性，多贬义）"},{"w":"天壤之别","d":"指高天和平地的区别。极言差别之大。"},{"w":"天经地义","d":"指天地间理所当然而不能改变的道理；也指理所当然，不容置疑的问题"},{"w":"天翻地覆","d":"覆：翻过来。形容变化巨大。也形容闹得很凶。"},{"w":"太阿倒持","d":"倒拿着剑，把剑柄给别人。比喻把大权交给别人，自己反受其害。"},{"w":"失之交臂","d":"交臂：胳膊碰胳膊，指擦肩而过。形容当面错过。"},{"w":"夸夸其谈","d":"说话或写文章浮夸、不切实际。"},{"w":"奉为圭泉","d":"奉：信奉，尊奉。圭桌：古代用以测日影的仪器，比喻法度或准则。指把某些事物或言论尊奉为准则。"},{"w":"奋样争先","d":"意思是奋力划动船桨的人争先恐后走在前头。"},{"w":"好大喜功","d":"喜欢做大事、立大功。多形容浮夸、不切实际的行为。"},{"w":"好高骜远","d":"骜：通“务”，追求。指不切实际地追求过高、过远的目标。"},{"w":"如出一辙","d":"辙：车辙。好像出自同一车辙。比喻两种事物非常相似。（或两种以上事物）"},{"w":"如坐针毡","d":"像坐在插着针的毡子上。形容心神不定，坐立不安。"},{"w":"如履薄冰","d":"履：踩，走过。形容战战蔬、小心谨慎的样子。"},{"w":"如影随形","d":"好像影子总是跟着身体一样。比喻两个人关系亲密，常在一起。"},{"w":"如数家珍","d":"家珍：家中收藏的珍宝。如同数自己家藏的珍宝那样清楚。形容对所讲述的东西非常熟悉。"},{"w":"如日中天","d":"像太阳正运行到正午。比喻正发展到最兴盛的阶段。"},{"w":"如沐春风","d":"通常用来形容人感到非常舒适和愉悦。它的意思是像沐浴在春风里一样，感受到舒适的感觉。"},{"w":"如火如茶","d":"原比喻军容之盛，现在形容旺盛、热烈或激烈。"},{"w":"如芒在背","d":"如同芒刺扎于背上，形容焦躁的心情。"},{"w":"如蚁附腹","d":"附：趋附；體：羊肉的气味。象蚂蚁趋附羊肉一般。比喻许多臭味相投的人追求不好的事物。也比许多人依附有钱有势的人。"},{"w":"如雷贯耳","d":"形容人的名声很大。"},{"w":"如鱼得水","d":"好像鱼得到水一样。比喻得到跟自己非常投合的人或对自己很适合的环境。"},{"w":"妄自菲薄","d":"妄：不合理地，无根据地。菲薄：轻视，瞧不起。毫无根据地小看自己。形容自轻自贱。"},{"w":"妇孺皆知","d":"孺：小孩。妇女、小孩全都知道。指众所周知。"},{"w":"委曲求全","d":"曲意迁就，以求事成，或保全大局。"},{"w":"娓娓道来","d":"是一种说话的方式，意思是不紧不慢地、从容地讲述。"},{"w":"子然一身","d":"子然：孤单的样子。指孤身一人。（常用袭义，形容追寻事业或理想）"},{"w":"子虚乌有","d":"指假设的、不存在的事情。"},{"w":"字字珠玑","d":"比喻说话或文章的词句非常优美，就像每个字都是珍贵的珍珠一样。"},{"w":"孜孜不倦","d":"孜孜：勤奋的样子。形容勤奋、不知疲倦。"},{"w":"孜孜以求","d":"孜孜：勤勉的样子。意思是不知疲倦地探求。"},{"w":"孜孜砭死","d":"zizikiki，意思是勤勉不懈的样子。"},{"w":"守望相助","d":"守：防守。望：望。指彼此关照，互相帮助。"},{"w":"守株待兔","d":"株：树桩子。比喻心存侥幸，不劳而获。也比喻死守狭隘经验，不知变通。"},{"w":"安之若素","d":"素：平常。指身处逆境、遭到困难或遭受挫折时能泰然处之，跟平常一样。"},{"w":"安土重迁","d":"土：乡土；重：看得重，不轻易。安于本乡本土，不愿轻易迁移。"},{"w":"安居乐业","d":"安：安定；乐：喜爱，愉快；业：职业。指安定愉快地生活和劳动。"},{"w":"安贫乐道","d":"道：主张，思想。安于贫穷，以坚持自己的信念为乐。旧时士大夫所主张的为人处世之道。"},{"w":"审时度势","d":"审：详查，观察。时：当前情况。度：估计。势：发展趋势。观察时机，估计发展趋势。用来指对形势有洞察力。也作“审时定势”、“审几度势”。"},{"w":"家喻户晓","d":"喻：知道，明白。家家尸尸都知道。形容人人皆知。"},{"w":"寅吃卯粮","d":"寅、卯：古代用于纪年等的十二地支中的两个，寅在卯之前。寅年吃了卯年的粮食。比喻经济困难，入不敷出。同“寅支卯粮”。（侧重由于有困难而提前预支，只顾眼前不顾未来）"},{"w":"富丽堂皇","d":"形容建筑物宏伟豪华。"},{"w":"寝食难安","d":"形容放心不下眼前的事，焦急到了极点，都到了睡也睡不着，吃也吃不好的地步了。"},{"w":"寸步难行","d":"寸步：很短的距离。一步也难以行走。形容行走十分困难。也形容陷入困难境地，无法进行活动。（程度较重）"},{"w":"对症下药","d":"医生针对病症开方用药。比喻针对问题所在确定解决方法。"},{"w":"尾大不掉","d":"掉：摇动，摆动。比喻属下势力强大，不服从指挥调度。也比喻事情前轻后重，难以驾驭的现象。"},{"w":"层出不穷","d":"层出：接连出现。穷：尽。接连出现，没有穷尽。（主语是事物）"},{"w":"居安思危","d":"处在安定的环境时而能想到可能会出现的危难。"},{"w":"屈指可数","d":"屈指：弯着手指头计算数日。弯着手指就可以数出来。形容数目很少。"},{"w":"屡见不鲜","d":"鲜：新鲜。经常见到，并不新鲜。同“数见不鲜”。"},{"w":"崇若寒蝉","d":"崇：闭口不作声。象深秋的蝉那样一声不叽。比因害怕有所顾虑而不敢说话。"},{"w":"川流不息","d":"形容行人、车马很多，像水流一样连续不断。"},{"w":"巧夺天工","d":"夺：压倒，胜过。人工的精巧胜过天然。形容技艺精妙高超。"},{"w":"巧舌如簧","d":"意思是舌头灵巧，能言善辩，形容能说会道，善于狡辨。"},{"w":"巧言令色","d":"用来形容那些擅长使用花言巧语和伪善的面容来取悦他人的人。（含贬义）"},{"w":"差强人意","d":"差：尚，稍微。强：振奋。还算能振奋心意。形容大致上还能够令人满意。（现多误用，辨析词义）"},{"w":"常备不懈","d":"意思是时刻准备着，毫不松懈。"},{"w":"平分秋色","d":"原指登和夜平均分占秋天景色。后比喻双方各得一半。也比喻两方平手，不分上下。"},{"w":"并行不悖","d":"悖：违反，违背。指同时进行而互相不违背。"},{"w":"并驾齐驱","d":"并驾：几匹马并排在一起拉车。齐驱：共同快跑。比喻相互之间不相上下。"},{"w":"广开言路","d":"广：扩大；言路：进言的道路。指尽量给下面创造发表意见的条件。"},{"w":"应接不暇","d":"暇：空闲。原指景物很多，顾不上观赏。后形容太繁忙，应付不过来。（主语是人）（侧重人或事物太多忙不过来）"},{"w":"应运而生","d":"应运：应天命。指顺应天命而降生。后泛指顺应时机而产生。"},{"w":"废寝忘食","d":"顾不上睡觉，忘记了吃饭。形容对某事专心致志。"},{"w":"廣续前行","d":"意思是指不断地延续和发展，保持进步的态度和生活方式。"},{"w":"开源节流","d":"开发财源，节省支出，以储蓄财力。"},{"w":"开诚布公","d":"开诚：开胸怀，表示诚意。布公：公正无私地发表自己的见解。表示坦白无私，真诚相待，能诚悬坦率地提出自己的看法。"},{"w":"异军突起","d":"异军：另一支军队。比喻一支新生力量突然崛起。（侧重新生事物）"},{"w":"异曲同工","d":"曲：曲调。工：工巧，精致。比喻不同人的文艺作品同样精彩。也比喻不同的做法有同样的好的效果。"},{"w":"弃旧图新","d":"意思是抛弃旧的，谋求新的。多指由坏的转向好的，离开错误的道路走向正确的道路。"},{"w":"引人入胜","d":"引：吸引。胜：胜地。带人进入风景优美的地方。形容风景、作品很吸引人。"},{"w":"张冠李戴","d":"冠：帽子。比喻弄错了事实或对象。（主观上故意或者不故意）"},{"w":"弱肉强食","d":"弱者的肉是强者的食物。比喻弱者被强者所欺凌、吞并等。（（常用于形容竞争）"},{"w":"弹冠相庆","d":"弹冠：掸掉帽子上的灰尘。指即将做官而互相庆贺，多用于贬义。"},{"w":"当仁不让","d":"当：面对。仁：符合道义的事。后指遇到应该做的事，勇于承当，不推诱。（侧重情理上）"},{"w":"形单影只","d":"只：指单独。形容孤独，没有伴侣。"},{"w":"形影相吊","d":"吊：慰问。只有自己的身体和影子相互慰问。形容无依无靠，非常孤单。"},{"w":"彰明较著","d":"形容极其明显，很容易看清楚。"},{"w":"得不偿失","d":"所得到的抵不上所失去的。"},{"w":"得心应手","d":"得心：指摸索到规律；应：适应。谓心手相应，运用自如。形容技艺纯熟，心手相应，或学识融会贯通。"},{"w":"循序渐进","d":"循：顺，按照。序：次序。指事物的发展或学习工作等按照一定的步骤逐渐深入或提高。"},{"w":"循循善诱","d":"循循：有次序的样子。诱：引导。指善于有步骤地引导别人。多形容教育得法。"},{"w":"循规拘礼","d":"遵循规则，拘泥礼节。"},{"w":"循规蹈矩","d":"循：依照。规：圆规。蹈：踩。矩：曲尺。规、矩是定方圆的标准规则，借指行为的准则。原指遵守规矩，不敢违反。后指拘守旧准则，不敢稍作变动。（中性词）"},{"w":"微言大义","d":"意思是包含在精微语言里的深刻的道理。"},{"w":"心向往之","d":"对某个人或事物心里很向往。"},{"w":"心无旁鹭","d":"旁；另外的。骜：追求。心思没有另外的追求，形容心思集中，专心致志。"},{"w":"心驰神往","d":"驰：奔驰。心神奔向所向往的事物。形容一心向往。"},{"w":"忧如隔世","d":"恍：仿佛；世：三十年为一世。仿佛隔了一个时代。指一种因人事或景物变化很大而引起的感触。"},{"w":"急功近利","d":"功：成功；近：眼前的。急于求成，贪图眼前的成效和利益。"},{"w":"怨天尤人","d":"怨：怨恨。天：指命运。无：责怪。指遇到挫折、麻烦时一味抱怨命运和别人，而不寻找自身的原因。（埋怨他人）"},{"w":"恬恶不峻","d":"恬：依靠，依仗；峻：改过，悔改。坚持作恶，不肯悔改。"},{"w":"息息相关","d":"息：呼吸进出的气息。呼吸时进出的气息相互关连。形容关系或联系非常密切。同“息息相通”。"},{"w":"惜墨如全","d":"意思是爱惜墨就像金子一样，指不轻易动笔。"},{"w":"惟妙惟肖","d":"惟：语气助词。肖：相像。形容描写、模仿得非常逼真。"},{"w":"戎马侄您","d":"戎马：本指战马，借指军事；侄：繁忙。形容军务繁忙。"},{"w":"成风化人","d":"成风，侣树一种社会风气。化人，感染人、影响人、教育人。通过倡导树立一种社会风气来影响、教育感化社会大众。"},{"w":"手不释卷","d":"卷：古代指抄写的卷，即书籍。手中一直拿着书籍片刻不放。形容勤勉好学或读书入迷"},{"w":"手到擒来","d":"擒：捉拿。一出手就把人捉住。形容做事毫不费力或很有把握。"},{"w":"手足无措","d":"措：安放。手脚不知放到哪里才好。形容举止慌乱，或无法应对。"},{"w":"扬汤止沸","d":"把开水从锅中出来，再倒回去，以阻止锅中的水沸腾。比不能解决根本问题的做法。"},{"w":"承上启下","d":"接续上面的，引起下面的。也指诗文中连接沟通文字的字句，使文字自然过渡。"},{"w":"投其所好","d":"意思是迎合别人的喜好。"},{"w":"投闲置散","d":"投：置放。放在闲散的位置上。指不被重用。"},{"w":"投鼠忌器","d":"投：用东西去掷；忌：怕，有所顾虑。想用东西打老鼠，又怕打坏了近旁的器物。比喻做事有顾忌，不敢放手干。"},{"w":"披星戴月","d":"身披星光，头顶月色。形容早出晚归或连夜赶路。也作“披星带月”戴月披星”。"},{"w":"披沙栋全","d":"从大量数据中筛选有价值信息。"},{"w":"披肝沥胆","d":"披：剖露。沥：滴下。露出肝脏，滴出胆汁。比喻对人对事非常忠诚。"},{"w":"抱残守缺","d":"残、缺：不完整。1固守陈旧残缺的东西不放，形容保守，不知改进。2保存虽有残缺但仍有价值的古物。"},{"w":"抽丝剥茧","d":"意思是丝得一根一根地抽，茧得一层一层地剥；形容分析事物极为细致，而且一步一步很有层次。"},{"w":"拔云见日","d":"拔开乌云见到太阳。比喻冲破黑暗见到光明。也比喻疑团消除，心里顿时明白。"},{"w":"拔苗助长","d":"比喻违反事物的发展规律，急于求成，反而坏事。也作“堰苗助长”。"},{"w":"拾人牙慧","d":"拾：捡取。牙慧：指别人说过的话。比袭用他人的意见或言论。"},{"w":"按图索骥","d":"索：寻找。骥：良马。照着图像去寻找良马。比喻做事死守教条，而不懂得变通。也比喻依据一定的线索去寻找事物。（中性词）"},{"w":"按部就班","d":"部：类别。班：次序。原指写文章按类别安排文义，按顺序组织文辞。后指按照一定的次序或部置进行。（中性词）"},{"w":"挖空心思","d":"想方设法，费尽心机（多含贬义）"},{"w":"挺身而出","d":"形容面对着艰难或危险的事情，勇敢地站出来。"},{"w":"捉襟见肘","d":"捉襟：整理衣襟。肘：胳膊肘儿。形容衣裳破旧。也比喻困难很多，应付不过来。（侧重人力、物力等资源有限）"},{"w":"捕风捉影","d":"比说话或做事时用似是而非的迹象做根据。"},{"w":"推心置腹","d":"意思是把赤诚的心交给人家。比喻真心待人。"},{"w":"推波助澜","d":"澜：大的波浪。比喻推动、助长事物的声势及发展。（中性词）"},{"w":"推陈出新","d":"推去旧的，产生新的。后多指在文化艺术方面去掉旧的糟粕，吸取其精华，创造出新的来。（多形容文化但不绝对）"},{"w":"掩耳盗铃","d":"掩：掩盖，遮盖。比喻自欺欺人。同“掩耳偷铃”。"},{"w":"提纲挚领","d":"意思是抓住事物的关键部分或者核心要点，然后用简洁明了的方式进行概述或表达。"},{"w":"摩顶放距","d":"意思是从头顶到脚跟都擦伤了；形容不辞劳苦，不顾身体。"},{"w":"改头换面","d":"1原为佛教语。指众生在轮回中形变神不变。2指改变面目。3指改正错误。4比只改变形式，而内容、实质不变。"},{"w":"改弦易辙","d":"改弦：更换琴弦。易：改变。辙：车轮压过的痕迹，指道路。比喻改变方向或做法。同“更弦易辙”“改辕易辙”。"},{"w":"改弦更张","d":"更：改换；张：给乐器上弦。改、调整乐器上的弦，使声音和谐。比喻改革制度或变更计划、方法。"},{"w":"敬而远之","d":"表示尊敬却有所顾虑不愿接近。橘里局气公众号"},{"w":"数不胜数","d":"数：计算。胜：尽。形容数量极多，数也数不完。"},{"w":"敷衍塞责","d":"敷衍：马虎应付。塞责：塘塞责任。做事马虎，应付一下以塘塞责任。"},{"w":"文不加点","d":"点：古人写文章在字的右上角涂一点，表示删去。文章不用涂改，一气写成。形容文思敏捷，写作技巧高超。"},{"w":"文过饰非","d":"文、饰：掩饰；过、非：错误。用漂亮的言词掩饰自己的过失和错误。"},{"w":"斗转星移","d":"斗：北斗星。1表示一夜之间时间的推移。后也指岁月流逝。"},{"w":"断章取义","d":"引用他人文章或谈话，只截取其中一段的意思，而不顾全文和原意。"},{"w":"方兴未艾","d":"意思是事物正在发展，尚未达到止境。"},{"w":"无与伦比","d":"意思是指事物非常完美，没有能够与它相比的同类的东西。"},{"w":"无人问津","d":"津：渡口。没有人来询问渡口。比喻没人过问、受到冷落。（形容某事物受冷落、无人理踩。程度较重）"},{"w":"无可厚非","d":"意为不可过分指责，表示虽有缺点，但是可以理解或原谅。也说未可厚非。"},{"w":"无可非议","d":"意思是没有什么可以指责的，表示言行合乎情理。可用来形容人、事、思想、行动、品质等。"},{"w":"无孔不入","d":"比喻见空子就钻；利用一切漏洞或机会（多指做坏事）。"},{"w":"无影无踪","d":"没有一点踪影。形容完全消失，不知去向。"},{"w":"无所适从","d":"适：往。从：跟随。不知听从哪一个好。指不知该怎么办。（侧重面临选择）"},{"w":"无根之木","d":"意思是比喻没有根据或基础的事物。"},{"w":"无独有偶","d":"意思是虽然罕见，但是不止一个，还有可以配对的，表示两件事或两个人十分相似。"},{"w":"无足轻重","d":"没有它并不轻些，有它也并不重些。指无关紧要。"},{"w":"日新月异","d":"形容发展变化很快，新事物、新气象不断出现。"},{"w":"日渐式微","d":"事物逐渐地由兴盛而衰落。"},{"w":"时过境迁","d":"境：环境。迁：变迁。时间过去了，环境或情况也随之改变了。"},{"w":"明哲保身","d":"明哲：聪明有智慧。指聪明有智慧之人，善于趋安避危，保全自身。也指为保全个人利益而回避原则问题的处世态度。"},{"w":"明察秋毫","d":"本义为视力好到能查辨秋天乌兽的细毛（明：视觉敏锐。察：看。秋毫：乌兽秋天新长出的细毛）；后多形容人精明，目光敏锐，能洞察一切。"},{"w":"明目张胆","d":"强调公开、毫无顾忌地做坏事，带有明显的贬义。"},{"w":"昙花一现","d":"比喻人或事物存在的时间很短，刚一出现就迅速消失了。"},{"w":"星罗棋布","d":"意思是像天空中的星星和棋盘上的棋子一样罗列、分布着。形容数量众多，散布的范围很广。"},{"w":"春秋笔法","d":"即用笔曲折而意含袭贬的写作手法。"},{"w":"春风化雨","d":"宜于万物生长的和风，适时的雨。后用来比喻良好的教育。多用来称颂师长对学生及晚辈潜移默化的教海。（也可用来形容文化或教育等对人的影响）"},{"w":"昭然若揭","d":"昭然：明显、显著的样子。揭：原意为高举，现也指揭开。意思是形容真相毕露，所有一切都已显现了出来。"},{"w":"显而易见","d":"事情或道理非常明显，极容易看清楚。"},{"w":"暗度陈仓","d":"意思是指暗中进行某种活动。"},{"w":"曲意逢迎","d":"曲意：违背本意。违背自己的本心，千万百计迎合或讨好别人。"},{"w":"曲突徙薪","d":"原义是把烟圆改建成弯的，把灶旁的柴草搬走；比喻事先采取措施，才能防止灾祸；在句子中可充当作谓语、定语。"},{"w":"曲高和寡","d":"曲：音乐曲调。高：高深。和：跟着唱。意为曲调越高深，能跟着唱的人越少。比喻思想、言行、文艺作品等高深，不能为多数人所理解接受"},{"w":"有声有色","d":"形容说话或表演精彩生动。"},{"w":"有备无患","d":"指事先有准备，才可以避免祸患。"},{"w":"有恃无恐","d":"因有所依仗而毫不害怕。"},{"w":"有条不紊","d":"条：条理。紊：乱。形容办事很有条理。"},{"w":"有的放矢","d":"的：箭靶。矢：箭。对着靶子射箭。比目的性强，有针对性。"},{"w":"有目共赌","d":"形容人人都可以看到，极其明显。"},{"w":"望其项背","d":"项：脖子的后部。能够看到别人的颈项和脊背。比喻有能力赶得上。（常用于否定句：难以、无法、不能）"},{"w":"望尘莫及","d":"莫：不能。及：到，赶上。指望见前面人马扬起的尘土而追赶不上。比谕远远落在后面，相差甚远。也用以表示自谦。"},{"w":"望洋兴叹","d":"望洋：仰视的样子。仰望海神而兴叹。原指在伟大事物面前感叹自己的渺小。现多比喻做事时因为不胜任或没有条件而感到无可奈何。"},{"w":"望而却步","d":"却步：不敢前进，往后退。形容遇到危险、困难或力所不及的事就往后退缩。（侧重行为上退却，多因为害怕、惊、震撼、犹豫、顾虑"},{"w":"望而生畏","d":"指看见了就害怕。（侧重情绪上的害怕）"},{"w":"朝乾夕惕","d":"乾：乾乾，即自强不息；惕：小心谨慎。形容一天到晚勤奋谨慎，没有一点疏忽懈怠。"},{"w":"朝令夕改","d":"早上颁布的政令，晚上就改了。形容政令无常。也形容主张、办法等经常改变。"},{"w":"未雨绸缪","d":"绸缪：缠绕，引中指修缮。比喻事先做好防备工作。"},{"w":"本末倒置","d":"本：树根。末：树梢。比把事情的轻重主次颠倒了过来。"},{"w":"杀鸡取卵","d":"卵：蛋。为了要得到蛋，不惜把鸡杀了。比喻贪图眼前微小的好处而损害长远的利益。"},{"w":"李代桃僵","d":"李：李树。桃：桃树。僵：枯死。李树代桃树而死。比喻兄弟相爱相助，患难与共。也比喻以此代彼（多贬义）或代人受过。"},{"w":"束之高阁","d":"阁：放东西的架子。把东西捆绑起来，放在高高的架子上。比喻弃置不用。（多形容有价值的东西）"},{"w":"束手无策","d":"策：办法。手被捆住，无法应对。形容遇到问题没有解决的办法。"},{"w":"条分缕析","d":"缕：线。一条条分析。形容分析得有条理，很细致。"},{"w":"杯弓蛇影","d":"将映在酒杯里的弓影误认为蛇。比喻因疑神疑鬼而引起恐惧。"},{"w":"林林总总","d":"林林：众多的样子；总总：众多而杂乱的样子。形容众多。"},{"w":"柳暗花明","d":"垂柳浓密，鲜花夺目。形容柳树成荫，繁花似锦的春天景象。也比喻在困难中遇到转机。"},{"w":"标新立异","d":"标：表明。异：独特，与众不同。原意为表明新颖的义理，提出与众不同的见解。后指故意提出新奇的见解，表示自己与众不同。（主观上故意性；辨析感情色彩）"},{"w":"标本兼治","d":"标本：事物的枝节和根本。从枝节和根本方面都得到治理。"},{"w":"根深蒂固","d":"蒂：草木之根。比喻基础稳固。（中性）（侧重深）"},{"w":"棚棚如生","d":"棚棚：生动的样子。指艺术形象非常逼真，如同活的一样。"},{"w":"模棱两可","d":"模棱：含糊，不明确；两可：可以这样，也可以那样。指不表示明确的态度，或没有明确的主张。"},{"w":"横空出世","d":"形容人或物高大，横在空中，浮出人世，或比喻卓尔不群。（侧重突出、明显）"},{"w":"欲盖弥彰","d":"盖：遮掩；弥：更加；彰：明显。想掩盖坏事的真相，结果反而更明显地暴露出来。"},{"w":"欲速不达","d":"指违背规律、一味求快，反而达不到目的。"},{"w":"正本清源","d":"正本：从根本上整顿；清源：从源头上清理。从根本上整顿，从源头上清理。比喻从根本上加以整顿清理。"},{"w":"此消彼长","d":"指这个下降，那个上升。"},{"w":"此起彼伏","d":"这里起来，那里落下。表示频繁地出现或产生。同“此起彼落”。（多形容声音或事物接连不断出现）"},{"w":"死灰复燃","d":"死灰：冷却了的灰。燃：烧。冷却的灰又重新烧起来。比喻失势的人又重新得势。也比已经消亡的事物又重新活动起来。多含贬义。"},{"w":"殊途同归","d":"殊：不同的；途：道路，途径；归：趋向。从不同的道路，走到同一个目的地。比喻采取不同的方法而得到相同的结果。"},{"w":"毋庸置疑","d":"毋：无。庸：用。置疑：怀疑。用不着怀疑。"},{"w":"每况愈下","d":"指情况越来越坏，越来越糟糕。（也可形容身体或精神越来越糖糕）"},{"w":"毛举细故","d":"毛：琐碎；细故：小事。指烦琐地列举小事情，加以责难或攻击。"},{"w":"民不聊生","d":"聊：依靠，依赖。百姓没有办法生活下去。形容生活极端困苦。（多形容整体社会环境）"},{"w":"水中捞月","d":"指在水中捞月亮；比喻去做根本做不到的事情，只能徒劳无功。含贬义"},{"w":"水乳交融","d":"水和乳汁融合在一起。比喻意气相投、感情融洽。（侧重融合）"},{"w":"水到渠成","d":"意思是当水流到某处时，自然会形成一条水道。这个成语用来比喻当条件成熟时，事情会自然成功，并不需要强求。"},{"w":"水涨船高","d":"水位上涨，船体也随着上升。比喻事物随着它所凭借的基础而增长。"},{"w":"汗牛充栋","d":"充：装满。栋：栋宇，房屋。形容藏书或者著作极多。"},{"w":"江心补涌","d":"指船到江心才补漏洞。比喻临到紧急关头才设法补救，为时已晚。偏正式结构；在句中一般作谓语、定语。"},{"w":"江河日下","d":"长江大河的水，日夜流向下流而不止。比喻事物日趋衰落，情况一天不如一天。（多指国势等事物发展趋势）"},{"w":"沉思翰藻","d":"构思深刻，辞藻华丽。"},{"w":"沉渣泛起","d":"渣：渣淬。泛：浮。已经沉到水底的渣淬又漂浮了起来。比喻已经绝迹了的腐朽、陈旧事物又重新出现。（贬义）"},{"w":"沧海桑田","d":"沧海：大海。桑田：种桑树的地。大海变为桑田，桑田变为大海。比喻世事变化非常大。"},{"w":"沸反盈天","d":"沸：沸腾。反：翻转。盈：充满。像沸腾的水那样翻滚着，响声充满了空间。形容喧哗吵闹，一片混乱。（程度稍重）"},{"w":"沽名钓誉","d":"比喻故意矫情做作，用手段猎取名声或赞誉。"},{"w":"波澜壮阔","d":"原形容水面辽阔，现比喻声势雄壮或规模宏大。"},{"w":"泥沙俱下","d":"俱：都。泥土和沙子一同随水冲了下来。比人或事物好坏混杂在一起。（侧重量大且好坏都有）"},{"w":"泰然处之","d":"泰然：安然，不以为意的样子；处：处理，对待。形容毫不在意，沉着镇定。"},{"w":"泾渭分明","d":"泾、渭：甘肃、陕西境内的两条河。古人认为泾水清、渭水浊。泾水流入渭水时，清浊不混。比界限清楚、是非分明。"},{"w":"洋洋大观","d":"洋洋：盛大、众多的样子；大观：丰富多采的景象。形容美好的事物众多丰盛。"},{"w":"洗心革面","d":"洗心：指清除坏思想。革面：改变旧面貌。比喻彻底悔改。"},{"w":"洞若观火","d":"洞：透彻。指清楚得就像看火一样，形容观察事物透彻分明。"},{"w":"津津乐道","d":"指很有兴趣地谈论。"},{"w":"活灵活现","d":"意思是形容神情逼真、传神，使人有亲眼所见的感觉。"},{"w":"流口常谈","d":"流：传播；口：人们的嘴巴；常：经常；谈：谈论。意为某个话题或某个人的事迹被人们广泛传播和谈论，成为大家经常谈论的对象"},{"w":"流离失所","d":"失所：失去安身之处。形容到处流浪，没有安身的地方。（多指因灾荒、战乱等导致的失去居所）"},{"w":"浅尝轭止","d":"轭：立即，就。只略微尝试一下就停止。比喻做事不求深入。（侧重停止"},{"w":"浩如烟海","d":"浩：广大。烟海：雾气弥漫的大海。形容事物（多指书籍、文献等）数量繁多，极其丰富。"},{"w":"浮光掠影","d":"浮光：水面上的反光。掠影：一闪而过的影子。比喻因事物很快消逝而使人对它的印象不深。（侧重抽象语境）"},{"w":"海市属楼","d":"比喻虚无缥缈而不实际存在的事物，也比喻不可企及的虚无的梦想。"},{"w":"海晏河清","d":"晏：平静。黄河水清了，大海没有浪了。比喻天下太平。"},{"w":"润物无声","d":"指有大胸怀者，做了贡献而不张扬，默默奉献。（也指文化教育等对人的潜移默化的影响）"},{"w":"深入人心","d":"指思想、理论等广泛地得到人们的理解和接受。"},{"w":"深入浅出","d":"指讲话或文章的内容深刻，语言文字却浅显易懂。"},{"w":"深谋远虑","d":"计谋深远，考虑周密。"},{"w":"渊淳岳峙","d":"比喻人品德如渊水深沉，如高山耸立。"},{"w":"游刃有余","d":"比喻工作熟练，实际经验很丰富，解决困难问题毫不费事。近应付自如。"},{"w":"源远流长","d":"源头远，水流长。也比喻历史悠久。"},{"w":"滥竿充数","d":"滥：失实，不真实。竿：一种簧管乐器。比喻没有真实本领的人，混在行家队伍里充数。也比喻以次充好。（可用于自谦）"},{"w":"潜移默化","d":"潜：暗中。默：毫无声息。指受到外来影响而在不知不觉中发生变化（侧重长时间）"},{"w":"激浊扬清","d":"强调通过主动干预清除负面因素并弘扬正面价值，侧重点在于“激”与“扬”的联动作用，既包含对浑浊、消极现象的批判与清除，又包含对清澈、积极价值的彰显与推广。"},{"w":"灰飞烟灭","d":"比喻人或事物迅即消失。"},{"w":"炉火纯青","d":"意思是认为炼到炉里发出纯青色的火焰就算成功了，后用来比喻功夫达到了纯熟完美的境界。"},{"w":"炙手可热","d":"炙：烤。手一靠近就感觉很烫，比喻气焰盛，权势大。"},{"w":"烂熟于心","d":"烂：程度很深。心中有数，十分熟悉"},{"w":"烟消云散","d":"比喻事物全部消失。同“烟消雾散”。"},{"w":"焚膏继暑","d":"焚：点燃；膏：灯油或烛；继：接续；暑：日影、日光。意思是点燃灯烛来接替日光照明，形容夜以继日地用功读书或努力工作。"},{"w":"煊赫一时","d":"意思是在一段时期内名声威势很盛，含贬意。"},{"w":"照本宣科","d":"原指照着书本或讲稿逐字宣读。引申为机械执行既定规则或文本内容，完全依赖书面指示而缺乏实际调整，批评其缺乏创造性。"},{"w":"熟视无赌","d":"熟视：细看，经常看。赌：看见。看惯了就像没看见一样。也指对眼前的事物或现象漠不关心。"},{"w":"爱不释手","d":"释：放下。喜爱得舍不得放手。"},{"w":"爱莫能助","d":"爱：爱惜；莫：不。虽然心中关切同情，却没有力量帮助。"},{"w":"独善其身","d":"意思是不得志时也要注意自身的修养。后指只顾保持自身修养而不顾他人或全局。（语境要素：个人与外部的对比、保全保护）"},{"w":"独当一面","d":"意思是指单独负责一个方面的工作或任务。"},{"w":"独木难支","d":"一根木头支不住高大的房子。比喻一个人的力量单薄，维持不住全局。"},{"w":"独树一帜","d":"单独树起一面旗帜。比喻创造独特风格，自成一家。同“别树一帜”。（侧重风格）"},{"w":"珠联璧合","d":"珠联：像珍珠一样串在一起。璧合：像碧玉一样合在一起。原指一种日月重合、五星相联的天相。后多比美好的人及事物凑在一起。同“珠连璧合”。（侧重结合）"},{"w":"理所当然","d":"指从道理上讲，应该如此。"},{"w":"琳琅满目","d":"琳琅：美玉。所见皆美玉。比喻杰出人才、好文章或精美物品很多。（多形容商品）"},{"w":"瑕瑜互见","d":"见：通“现”，显现。比喻优点、缺点都有。"},{"w":"甚嚣尘上","d":"甚：很。嚣：喧闹。尘上：尘土飞扬。形容对某事议论纷纷。（中性词，多贬义）"},{"w":"画地为牢","d":"牢：牢狱。在地上画个圈儿，作为牢狱。比喻局限在小圈子里活动。"},{"w":"画饼充饥","d":"画个饼子来解饿。本比喻徒有虚名而于实际无好处。后多用来比喻以空想来安慰自己。"},{"w":"畏蕙不前","d":"畏惧退缩，不敢前进。"},{"w":"畏首畏尾","d":"形容做事胆小，多所猜忌顾虑，畏缩不前"},{"w":"登堂入室","d":"堂、室：古代宫室前为堂后为室。比喻学识由浅入深，逐步达到很高的成就。同“升堂入室”。"},{"w":"登峰造极","d":"意思是登上顶峰，指到达最高点；比喻学问、技艺等已达到最高的境界"},{"w":"白云苍狗","d":"苍：青色，泛指青黑色。比喻世事变化无常。也作“白衣苍狗”。"},{"w":"百家争鸣","d":"比喻各种学术派别竞相争辩鸣放。"},{"w":"百家齐放","d":"各色的鲜花一齐开放。后多比喻文艺上不同的形式和风格自由地发展。"},{"w":"皓首穷经","d":"皓：白。穷经：彻底钻研经书。钻研经籍直到人老头白。也作“白首穷经”。（也可形容长期钻研）"},{"w":"皮里阳秋","d":"意思是藏在心里不说出来的言论，表面上不直接发表评论，但实际上内心有看袭贬不同的看法。"},{"w":"盛气凌人","d":"盛气：骄横的气势。凌：欺负。指以骄横的气势欺负人。"},{"w":"目不暇接","d":"暇：空闲。接：接触。眼晴来不及看。形容吸引人的事物很多，看不过来。（主语是人）"},{"w":"目不窥园","d":"窥：看。形容学习专心致志，十分刻苦。"},{"w":"目无全牛","d":"比喻技艺熟练到了得心应手的境界。"},{"w":"盲人摸象","d":"比喻看问题不全面，以偏概全。（现更多用字面义，形容做一件事毫无头绪地摸索）"},{"w":"相去甚远","d":"互相之间存在很大差异和距离。"},{"w":"相形见细","d":"形：对照，比较。：不够，不足。跟同类的人或同类事物相比较，显出很不足。"},{"w":"相得益彰","d":"相得：互相投合。益：更加。彰：明显。两个人或两件事相互配合，双方的能力和作用更能显示出来。"},{"w":"相提并论","d":"把不同的人或不同的事情放在一起谈论或看待。（侧重于评价几个人或事物之间有没有差距能否比得上。多用于否定句中）"},{"w":"相映成趣","d":"映：映衬。趣：意趣。相互衬托着，显得很有情趣，很有意思。"},{"w":"相辅相成","d":"辅：辅助，帮助。指两种事物互相辅助，互相促成，缺一不可。"},{"w":"真知灼见","d":"（灼：明白，透彻）指正确而透彻的认识，高明的见解。"},{"w":"眼花缭乱","d":"缭乱：纷乱。因看到繁杂的事物而感到迷乱。（王语是人）"},{"w":"睡手可得","d":"睡手：往手上吐睡沫。比喻极容易得到。"},{"w":"瞬息万变","d":"瞬：一眼。息：一呼吸。在极短时间里就发生很多变化。形容变化很多很快。"},{"w":"瞻前顾后","d":"多用于形容顾虑太多，犹豫不决。"},{"w":"矢志不渝","d":"矢志不渝（矢：琶；渝：改变）指立下志愿，绝不改变。"},{"w":"矫柱过正","d":"矫枉：矫正弯曲。指纠正偏失错误，超过了应有的限度。"},{"w":"砥砺前行","d":"经历磨炼，克服困难，往前进步的意思。也作“砥砺奋进”。"},{"w":"神色自若","d":"外表神态自然，不显露紧张或慌乱，侧重于外在表情的平稳，不因外界影响而变化。"},{"w":"积习难改","d":"积习：指多年养成的习惯。长期形成的某种习惯，很难改变。"},{"w":"积贫积弱","d":"意思是长期积累的贫困衰弱，形容极度的贫困和弱小。或指以前的行为导致现在的衰弱局面。"},{"w":"积重难返","d":"积：积习。返：返回，回头。积习深重，难以改变。多指长期存在的恶习，弊端已经发展到了难以革除的地步。（侧重时间久）"},{"w":"移花接木","d":"把枝条、嫩芽从一种花木嫁接到另一种花木上。比喻暗中更换。"},{"w":"稍纵即逝","d":"纵：放松。逝：消失。稍微一放松就消失了。形容时间或机会很容易丢失。"},{"w":"稗官野史","d":"稗官：古代专门给帝王讲述街谈巷议、风俗故事的小官，后作为小说的代称。野史：私家记载的逸闻琐事之作。后用来称小说及不见经传的逸闻琐事的著述。"},{"w":"空中楼阁","d":"悬在空中的楼阁。比崇高通达。后多用来比喻虚构的事物或脱离实际的空想。"},{"w":"穿云裂石","d":"穿破云天，震裂石头。形容声音高亢嗪亮。"},{"w":"穿凿附会","d":"意思是把讲不通的或不相千的道理、事情硬扯在一起进行解释。"},{"w":"穿针引线","d":"使线的一头通过针眼。比喻从中联系、拉拢。"},{"w":"突飞猛进","d":"形容发展十分迅速。"},{"w":"立竿见影","d":"在阳光下竖起竹竿，立刻就能看到它的影子。比喻效果显著迅速。"},{"w":"竭泽而渔","d":"排尽湖中或池中的水捕鱼。比喻取利只顾眼前，不作长远打算。"},{"w":"等量齐观","d":"等：同等。齐：一样。把不同的事物一律同等看待。"},{"w":"管中窥豹","d":"管：竹管。从管中看豹。比喻见识狭小，看不到全面。（也可以比喻只看事物的一部分而推测全貌一最近多用）（中性词）（侧重整体与部分对比）"},{"w":"管窥藜测","d":"管：竹管。窥：从孔隙中看。蠡：瓢。测：测量。管中视天，以瓢量海水，喻眼光狭小，见识不广或不自量力。（中性词）（侧重整体与部分对比）"},{"w":"粉墨登场","d":"粉墨：傅粉施墨，指化妆。场：戏场，舞台。化好妆登台演戏。也比喻登上政治舞台，含讥讽义。（字面义时为中性词，比喻义时为贬义词）"},{"w":"粗制滥造","d":"意思是写文章或做东西马虎草率，只求数量，不顾质量。"},{"w":"粗枝大叶","d":"意思是比喻工作粗糙，不认真细致，马虎大意。"},{"w":"精打细算","d":"意思是精密地计划，详细地计算。指在使用人力、物力时计算得很精细。"},{"w":"精益求精","d":"原意是已经很精致了，还要更加精致。精：完美，好；益：更加。比喻已经很好还求更好。"},{"w":"精雕细琢","d":"精心细致地雕刻琢磨。形容做事仔细用心。多指艺术品的创作。"},{"w":"纲举目张","d":"指提起大网的总绳一撒，所有的网眼就都张开。比喻抓住事物的主要环节，就可带动一切。"},{"w":"纵横掸阁","d":"纵横：用游说来联合。掸阖：开合。指在政治、外交上运用手段进行联合或分化。"},{"w":"纷至查来","d":"纷：众多。杏：又多又重复。形容连续不断地纷纷到来。"},{"w":"纸上谈兵","d":"兵：用兵之道。比喻空谈理论，不能解决实际问题。（侧重只有理论而没有行动）"},{"w":"细枝末节","d":"末节：小事情，小节。细小的树枝，微末的环节。比喻事情或问题的细小而无关紧要的部分。"},{"w":"细水长流","d":"比喻节约使用财物，使经常不缺用。也比喻一点一滴不间断地做某件事，精细安排，长远打算。"},{"w":"经久不息","d":"经过长时间停不下来。"},{"w":"经久不衰","d":"1精神饱满的状态，身体健壮的外表，或幼年期到成年期之间的时期的精神特征；青年人的活力或朝气。2形容某事或某人经历很长时间仍旧保持较高的旺盛状态事例。"},{"w":"绒口不言","d":"绒：封闭；言：说话。封住嘴巴；不开口说话。"},{"w":"绘声绘色","d":"绘：描绘。形容描写、叙事生动逼真。同“绘声绘影”“绘影绘声”。"},{"w":"络绎不绝","d":"络绎：前后相接、连续不断的样子。形容车船人马等前后相接，往来不断。"},{"w":"统筹兼顾","d":"意思是统一筹划，全面照顾。"},{"w":"继往开来","d":"继承前人的事业，开辟未来的道路。"},{"w":"缘木求鱼","d":"缘木：爬树。比喻方向、方法不对，就不可能达到目的。（侧重方法错误）"},{"w":"置之不理","d":"置：放置。理：理。指放在一边而不予理踩。也作“置之不顾”。"},{"w":"置若罔闻","d":"置：放，指放在一边。若：好像。罔：没有。放在一边，好像没有听到。指不加理踩。"},{"w":"置身事外","d":"置：安放。把自己放在事情之外。形容毫不关心。"},{"w":"美轮美灸","d":"多用于形容建筑物雄伟壮观，富丽堂皇；也用来形容雕刻或建筑艺术的精美效果。"},{"w":"老生常谈","d":"老书生经常讲的话。比喻听厌了的没有新鲜意思的话（也做中性）"},{"w":"老调重弹","d":"调：调子；曲调。陈旧的曲调重新弹奏。比喻已经说过的话再说过；也指说话或文章没有新意。"},{"w":"耳提面命","d":"“耳提”，提着耳朵叮；“面命”，当面指教，形容教殷切。多指（长辈对晚辈、上级对下级）恩切地教导。"},{"w":"耳熟能详","d":"详：详细地说出来。指听得多了，也就能详尽地讲述出来。"},{"w":"聚精会神","d":"形容专心致志，注意力高度集中的样子。"},{"w":"肆意妄为","d":"妄：胡乱，非分的，出了常规的。妄为：胡作非为。指不顾一切由着自己的性子胡作非为。亦作“肆意妄行”。"},{"w":"肆无忌婵","d":"肆：放肆。忌：顾忌。婵：惧怕。非常放肆，毫无顾忌和畏惧。"},{"w":"肥马轻裘","d":"裘：皮衣。骑肥壮的马，穿轻暖的皮衣。形容阔绰。"},{"w":"肼手脏足","d":"意思是手脚生茧。形容劳动十分辛勤。"},{"w":"背井离乡","d":"背：离开。井：古制八家为井，这里指家宅。指被迫离开家乡，到外地求生。（也指主动离开家乡，到外地生活工作）"},{"w":"背道而驰","d":"背：逆着。道：道路。向着相反的道路奔驰。比喻彼此方向目标完全相反。也比喻背离正确的目标，朝相反的方向走。"},{"w":"脍炙人口","d":"脍：切得很细的肉。炙：烤熟的肉。美味的食品人人爱吃。比喻好的诗文或事物为众人所喜爱和传诵。"},{"w":"脚踏实地","d":"比做事踏实，认真。"},{"w":"脱胎换骨","d":"原为道教用语。指修道者得道以后，就转凡胎为圣胎，换凡骨为仙骨。现比喻通过教育，思想得到彻底改造。"},{"w":"脱颖而出","d":"颖：细长物体的尖端。比喻才能完全显露出来。（侧重能力）（明显地）"},{"w":"自怨自艾","d":"自怨：悔恨自己的错误。自艾：改正自己的错误。原指悔恨并且改正自己的错误，后多指悔恨。（埋怨自己）"},{"w":"自惭形移","d":"惭：惭愧。形：形象，模样。：邪恶，丑陋。因为自己模样丑陋而感到渐愧。也泛指自己觉得不如别人而感到惭愧。"},{"w":"自成一家","d":"意思是指在某一方面的学问或技术有独到的见解或独特的做法，能自成体系。"},{"w":"自暴自弃","d":"暴：损害。弃：抛弃。指自己糟蹋自己，自己看不起自己，甘心于落后。（程度较重）"},{"w":"自然而然","d":"意思是自由发展，必然这样。指非人力千预而自然如此。"},{"w":"舍本逐末","d":"舍：放弃。本：根本。逐：追求。末：枝节。比喻放弃根本，追求末节，轻重主次倒置。"},{"w":"舜精竭虑","d":"竭尽。用尽精力和心思。"},{"w":"良券不齐","d":"莠：狗尾草，比喻坏人。指好人、坏人混在一起。同“良不一”。（现在用法不止形容人，也可形容事物）"},{"w":"苦口婆心","d":"用来形容一个人善意且耐心地反复劝导他人。"},{"w":"苦心孤诣","d":"苦心：用尽心思。谐：（学业、技能等）所达到的程度。孤谐：别人达不到的程度。指尽心竭力钻研，达到了别人所达不到的地步。也指为了达到目的而费尽心思。"},{"w":"荔荔业业","d":"原形容畏惧的样子。后多用来形容小心谨慎、不敢解怠的样子。"},{"w":"莫衷一是","d":"莫：不能。衷：折衷，判断。是：对。不能断定哪个对，哪个不对。也指意见纷绘，分歧很大，不能得出一致的结论，侧重观点难以统一。"},{"w":"萍水相逢","d":"比喻从不认识的人偶然相遇。"},{"w":"蒸蒸日上","d":"蒸蒸：热气上升的样子。形容事业一天天地向上发展。（常搭配事业、国家、人民生活等，侧重向上）"},{"w":"蔚为大观","d":"蔚：茂盛；大观：盛大的景象。发展成为盛大壮观的景象。形容事物美好繁多，给人一种盛大的印象。"},{"w":"蔚然成风","d":"蔚然：草木茂盛的样子。形容一种事物逐渐发展流行，形成风气。（多含襄义）"},{"w":"薪火相传","d":"意思是比喻学问和技艺代代相传。比喻师生授受不绝，或种族、血统、文化精神的传承，绵延不尽。"},{"w":"薪露头角","d":"蕲：高出。比喻突出地显露出才能。（侧重能力）"},{"w":"虚与委蛇","d":"虚：不真实，假意。与：跟。委蛇：敷衍。指对人虚情假意，敷衍应酬。"},{"w":"虚怀若谷","d":"虚：谦虚；谷：山谷。胸怀象山谷一样深广。形容十分谦虚，能容纳别人的意见。"},{"w":"蜂拥而至","d":"像一窝蜂似地一拥而来。形容很多人乱哄哄地朝一个地方聚拢。"},{"w":"蜘踊不前","d":"意思为迟疑不决，不敢前进。"},{"w":"蜻蜓点水","d":"比喻进行某些动作时只轻轻接触表面。也比喻肤浅不深入。"},{"w":"融会贯通","d":"融会：融合。贯通：全面透彻地了解。指把各方面的知识、道理融合贯穿，从而获得对事物全面、透彻地理解和领悟。（侧重融合）"},{"w":"血脉相通","d":"血脉：血统。原指有血缘亲属关系。也比喻极亲近的关系。"},{"w":"行之有效","d":"之：代词，它，指办法、措施等；效：成效，效果。实行起来有成效。指某种方法或措施已经实行过，证明很有效用。"},{"w":"街谈巷议","d":"指人们在街头巷尾闲谈议论。也指街头巷尾人们的议论。"},{"w":"衣钵相传","d":"衣：佛教僧尼穿的袭装。钵：僧尼化缘盛饭的钵孟。原为佛家语。中国禅宗师父将道法传授给徒弟时常常举行授予衣钵的仪式。现用以比喻一般师徒、父子之间思想、技能、学问的继承和传授。"},{"w":"袖手旁观","d":"袖手：把手瑞在袖子里。比喻置身事外，既不过问，也不协助别人。（侧重从旁边看）"},{"w":"裹足不前","d":"比喻因心存顾虑而停止行动或不敢向前，与蜘竭不前相比停滞程度更彻底，暗示难以突破。"},{"w":"见仁见智","d":"对同一事物或问题，不同的人因立场、角度或认知差异会产生不同的理解和看法。强调观点的主观性和多样性，常用于表达对分歧的包容态度。"},{"w":"见微知著","d":"微：小，指事物微小的迹象。著：显明，指事物的发展。谓看到事物的苗头，就能知道它的未来发展趋势和实质。同“赌微知著”。（侧重大小对比）"},{"w":"见怪不怪","d":"看到奇异的事物，镇定自若，不大惊小怪。"},{"w":"见贤思齐","d":"指见到有才德的人就想着与他齐平"},{"w":"视死如归","d":"把死看得像回家一样平常。形容不怕牺牲生命。"},{"w":"视而不见","d":"着眼晴看，却什么也没看见。指不注意，不重视。也指不理踩，看见了当作没看见。常与“听而不闻”连用。"},{"w":"视若珍宝","d":"形容十分珍爱，将其当成无价之宝。"},{"w":"触手可及","d":"伸手便可接触到。形容距离很近。"},{"w":"触类旁通","d":"触：接触。通：通晓。指掌握了某一事物的规律或知识，就能够以此类推，了解同类的其他事物。（侧重于抽象的思维层面。）（侧重类推）"},{"w":"讳莫如深","d":"原意为事件重大，讳而不言。后指把事情隐满得很紧。"},{"w":"语焉不详","d":"是指虽然提到了，但说得不详细。"},{"w":"谈虎色变","d":"色：脸色。比喻一提起可怕的事情，脸色就变了。"},{"w":"责无旁贷","d":"责：责任。贷：推卸。指自己应尽的责任，不能推给别人。（侧重责任、职责上）"},{"w":"赏心悦目","d":"悦目：看了舒服。指看到美好的景色而心情愉快。"},{"w":"走马观花","d":"走马：骑马快跑。比喻观察事物或者了解情况不深入细致。（侧重于用眼看具体事物的过程）（一般不形容读书）"},{"w":"越粗代厄","d":"越：超过。粗：古代盛牛羊等祭品的器具。厄：厨师。比喻处理超过自己职权范围的事情。"},{"w":"趋之若鹭","d":"鹭：鸭子。像鸭子一样成群地跑过去。比喻很多人争相追逐、趋附。含贬义。（现在有时非贬义）"},{"w":"趋炎附势","d":"趋：奔走；炎：热，比喻权势。奉承和依附有权有势的人。"},{"w":"身体力行","d":"身：亲身。体：体验。指亲身体验，努力实践。"},{"w":"身无长物","d":"除自身外再没有多余的东西。形容贫穷。"},{"w":"车水马龙","d":"车像流水，马如游龙。形容车马来来往往的热闹景象。同“马龙车水”"},{"w":"车载斗量","d":"能用车载，能用斗量，比喻数量多，不可胜数，多指不足为奇，很常见"},{"w":"轻车熟路","d":"轻车：负载轻的车子。驾着负载很轻的车子，走熟悉的道路。比喻事情又轻松又熟悉，办起来很容易。"},{"w":"过江之卿","d":"比喻某种事物非常流行或时兴，数量众多，并且往往带有盲目跟风的意味。"},{"w":"过犹不及","d":"过：过分。不及：不够。事情做得过了头，就跟做得不够一样，都不合适。"},{"w":"迎刃而解","d":"刃：刀刃。解：分开。把竹子劈开口，下面的一段竹子就迎着刀刃裂开了。比喻主要问题解决了，其他的问题就很容易解决。（常搭配“问题”）"},{"w":"进退两难","d":"前进和后退都难。比喻事情无法决定，因而难以行动。"},{"w":"进退失据","d":"（侧重很难扶择）"},{"w":"进退维谷","d":"谷：困窘。指前进或后退都处于困难境地。形容进退两难。同“进退两难”“进退失据”。（侧重很难扶择）"},{"w":"连篇累膜","d":"形容篇幅过多，文词穴长。"},{"w":"连绵不绝","d":"意思是连续而不中断。"},{"w":"适得其反","d":"适：恰好。结果与愿望恰好相反。（侧重取得反面结果）"},{"w":"逸闻轶事","d":"指世人不大知道而感兴趣的传闻和故事。"},{"w":"道听途说","d":"途：道路。在路上听来的话，又在路上向人传播。指没有根据的传言。"},{"w":"邯郸学步","d":"比喻一味地模仿别人，不仅没学到本事，反而把原来的本事也丢了。"},{"w":"醍醐灌顶","d":"醍醐：从牛乳中提炼出的纯酥油，佛教比喻最高的佛法。灌：浇。顶：头顶。比喻给人灌输智慧，使人从迷惑中醒悟或彻底觉悟。也比喻舒适畅快。"},{"w":"重蹈覆辙","d":"本义为再走翻过车的老路（蹈：踏上；覆：翻倒；辙：车轮轧出的痕迹），比喻不吸取失败的教训，重犯以前的错误。"},{"w":"量体裁衣","d":"按身材裁剪衣服。也比与按实际情况办事。"},{"w":"量入为出","d":"入：收入。根据收入的情况来安排支出。"},{"w":"量力而行","d":"意思是指根据自身的实际能力和条件来决定行动的范围，做事不要超过自己的能力范围，以免出现意外问题。"},{"w":"釜底抽薪","d":"釜：锅。薪：柴。从锅底下抽出柴火。比喻从根本上解决问题。"},{"w":"针锋相对","d":"意思是针尖对锋芒。比喻双方在策略、论点及行动方式等方面尖锐对立"},{"w":"钟灵毓秀","d":"钟：凝聚，集中；毓：养育。凝聚了天地间的灵气，孕育着优秀的人物。指山川秀美，人才辈出。"},{"w":"钟鸣鼎食","d":"钟：古代乐器；鼎：古代炊器。击钟列鼎而食。形容贵族的豪华排场。"},{"w":"铺天盖地","d":"形容来势猛，声势大，到处都是。"},{"w":"销声匿迹","d":"销声：消除声音。匿迹：隐匿踪迹。指隐藏起来或不公开露面。同“消声匿迹”“匿迹销声”。"},{"w":"错落有致","d":"意思是形容事物的布局虽然参差不齐，但却极有情趣，使人看了有好感"},{"w":"锦上添花","d":"指在有彩色花纹的丝织品上再绣上花朵。比喻美上加美，喜上加喜。"},{"w":"镜花水月","d":"镜子里的花，水里的月亮。比喻虚幻的东西。"},{"w":"长盛不衰","d":"长久兴盛而不哀败，比喻长时间保持旺盛的势头。"},{"w":"门可罗雀","d":"罗：张网捕捉。大门之前可以张起网来捕麻雀。形容十分冷落，宾客稀少。"},{"w":"门庭冷落","d":"形容十分冷落，宾客稀少。"},{"w":"门庭若市","d":"门庭：门口和庭院。若：如，好像。门口和庭院就像集市寻样公热闹非凡。形容往来的人很多。"},{"w":"闪烁其词","d":"指说话故意含糊其辞、回避真相或要害问题，带有遮掩或推诱的意味。"},{"w":"闭目塞听","d":"塞：堵塞。闭着眼晴，堵住耳朵。指不与外界接触，脱离实际。"},{"w":"闭门造车","d":"关起门来造车子。比喻不管客观情况如何，只凭主观愿望办事。（多形容不开放、自我封闭）"},{"w":"闻名遐迩","d":"形容名声很大，主要指远近闻名。"},{"w":"闻过则喜","d":"过：过失；则：就。听到别人批评自己的缺点或错误，表示欢迎和高兴。指虚心接受意见。"},{"w":"阪上走丸","d":"（阪：斜坡；丸：弹丸）指在斜坡上滚弹丸，比喻形势发展迅速或工作进行顺利。"},{"w":"防微杜渐","d":"微：细小，指事物的苗头。杜：杜绝，堵塞。渐：事物的开头。指在不良的事物刚刚露出苗头时，就加以制止和杜绝，不让它发展下去。"},{"w":"防患未然","d":"患：灾祸。未然：没有这样，指没有发生。在祸患还没有发生之前就进行防备。"},{"w":"阳春白雪","d":"原为战国时楚国的深奥高雅的歌曲。后泛指高雅、不通俗的文学艺术。"},{"w":"阿谏奉承","d":"阿：为讨好而说好听的话。奉承：恭维别人。为讨好而说好听的话恭维别人。也作“阿谏逢迎”。"},{"w":"附庸风雅","d":"附庸：依傍，追随；风雅：泛指诗歌。指缺乏文化修养的人为了装点门面而结交文人，参加有关文化活动，以示自己有一定的文化素养（装文化人）。"},{"w":"陈词滥调","d":"陈词：陈旧的不合实用的言词；滥：空泛；失真。陈旧、空泛、不切实际的论调。"},{"w":"陈陈相因","d":"粮仓里的米谷一年接一年地堆积起来。比喻沿袭老一套，没有改进。"},{"w":"降本增效","d":"含义是在企业管理中通过一系列措施来实现成本的降低和效益的增加。"},{"w":"除旧布新","d":"意思是清除旧的，建立新的；以新的代替旧的。"},{"w":"随波逐流","d":"随：跟着。逐：追赶。随着波浪起伏，跟着流水漂荡。比喻自己没有主见，只是随着别人走。同“随波逐浪”。"},{"w":"随遇而安","d":"随：顺从。遇：境遇。安：安然。处在任何环境中，都能安然自得，感到满足。"},{"w":"隔岸观火","d":"指站在对岸观望火灾；用来比喻对别人的急难不加救助，而采取看热闹的态度。"},{"w":"隔靴搔痒","d":"比喻说话、做事、写文章不中肯，没有抓住关键。"},{"w":"难以为继","d":"（关于事）指难以持续下去。同“难乎为继”。"},{"w":"集思广益","d":"集：积重。思：想法，智慧。广：扩大。益：益处，效果。指集中众人的智慧，可以收到更好的效果。"},{"w":"雕梁画柱","d":"彩绘装饰得十分华丽的房屋。"},{"w":"雨后春笋","d":"春天下雨后竹笋长得又多又快，比喻新生事物大量涌现和蓬勃发展。（侧重数量多）"},{"w":"震耳欲聋","d":"形容声音很大，耳朵都快震聋了。"},{"w":"靖厉奋发","d":"辟chuo，形容精神振奋，斗志昂扬。"},{"w":"靡然成风","d":"指相互跟风，群起效尤而成风气，义词，多指不好的风气。"},{"w":"面面俱到","d":"各方面都照顾得很周到。也指不仅各方面都照顾到，而且每一个方面都处理得很得当。"},{"w":"革故鼎新","d":"革：除去。鼎新：立新。指革除旧的，建立新的。多指改朝换代或重大变革。（多政治角度）"},{"w":"革路蓝缕","d":"革路：柴车。蓝缕：又旧又破的衣服。意思是驾着柴车穿着破旧衣服去开辟山林。现用来形容创业的艰难与辛苦。也作“革路蓝缕”。（词义有拓展，也可形容事情发展的初期阶段）"},{"w":"革门圭窦","d":"革门：柴门（用竹条或树枝编成的门）。圭窦：上尖下方的圭形的门洞。形容住室极其简陋。旧指穷人住处。"},{"w":"鞭辟入里","d":"形容做学问切实。今多形容分析问题透彻，切中要害。"},{"w":"鞭长莫及","d":"及：到。原意是鞭子虽长，也不能打马肚子。比喻相隔太远，力量达不到。（有时会用于形容“虽有能力，但能力有限”）"},{"w":"顺其自然","d":"意思是顺着事物本来的性质自然发展。"},{"w":"顺势而为","d":"顺应形势做事情。"},{"w":"顺水推舟","d":"丹：船。顺着水流的方向推船。比喻顺应某个趋势说话办事。"},{"w":"顺理成章","d":"意思是写文章、做事情顺着条理就能做好。比喻随着某种情况的发展而自然产生的结果。"},{"w":"顺藤摸瓜","d":"摸：寻找。比喻按照某个线索查究事情。"},{"w":"顾此失彼","d":"顾了这个，丢了那个。形容忙乱或慌张的情景。（侧重考虑不周全）"},{"w":"额手相庆","d":"额手：把手举到额头上。把手举到额头上互相庆贺。"},{"w":"颠沛流离","d":"颠沛：跌倒，比喻困顿，受挫折。流离：流转离散。形容生活困苦，流落异乡，无安身之所。（可指人，也可指物）"},{"w":"风云变幻","d":"风、云：风和云，比喻变幻动荡的局势。变幻：变化不定。像风和云那样变化莫测。比喻局势多变或情况复杂。"},{"w":"风清气正","d":"形容要求我们讲道德，重操守，严纪律，不谋私，顾大局，淡名利，讲友爱，重团结，多奉献。"},{"w":"风起云涌","d":"形容雄浑磅磷之势；也比喻事物迅速发展，声势浩大。"},{"w":"风雨飘摇","d":"飘摇：飘荡。在风雨中飘荡不定。比喻局势动荡不安，很不稳定。"},{"w":"风靡一时","d":"靡：倒下。风靡：风一吹，就随之倒下。形容某一种事物在一个时期内非常流行。（中性）"},{"w":"风餐露宿","d":"在风中吃饭，在露天住宿。形容旅途中的辛苦劳累。"},{"w":"食古不化","d":"意思是读书、作画一味学习古人，拘泥陈法，不善于灵活运用。指对所学的古代知识理解得不透，不善于按现在的情况来运用。"},{"w":"饮鸠止渴","d":"鸠：毒酒。比喻用有害的方法解决面临的困难，而不顾后果。"},{"w":"驾轻就熟","d":"比喻对所做的事情熟悉，办起来容易。"},{"w":"骇人听闻","d":"骇：震惊。使人听了非常吃惊、害怕。"},{"w":"骑虎难下","d":"骑在虎背上难以下来。比喻事情遇到困难，迫于形势不能中止，陷入进退两难的境地。（侧重同一件事已经开始了就难以停止）"},{"w":"骞若晨星","d":"稀少得好像清晨的星星一样。形容很少。"},{"w":"骞骞无几","d":"寒寒：很少。很少，没有几个。形容数量极少。"},{"w":"高屋建鎮","d":"建：倾倒。：水瓶。从高屋脊上往下倒瓶中的水。形容居高临下，不可阻挡的形势。"},{"w":"高枕无忧","d":"垫高枕头睡觉，无所忧虑。"},{"w":"高歌猛进","d":"意思是高声歌唱，勇猛前进；形容在前进的道路上，充满乐观精神。"},{"w":"高瞻远瞩","d":"瞻：望。瞩：注视。登高望远。形容目光远大。（更宏观）"},{"w":"高谈阔论","d":"指漫无边际地大发言论（多含贬义）。"},{"w":"鬼斧神工","d":"形容技艺高超神妙。同“神工鬼斧”。（侧重非人工的）"},{"w":"魂牵梦崇","d":"在梦魂中还牵挂崇绕着。形容思念深切，无法排遣。"},{"w":"鱼目混珠","d":"用鱼眼晴假冒珍珠。比喻以假乱真。（也可指以次充好）"},{"w":"鱼龙混杂","d":"比坏人和好人混在一起。同“龙蛇混杂”。（现在用法不止形容人，也可形容事物）"},{"w":"鲜为人知","d":"鲜：少。为：被。知：知道。很少有人知道。"},{"w":"鳞次栉比","d":"鳞：鱼鳞。次：次序。栉：梳子和篦子的总称。比：排列。像鱼鳞或梳篦的齿那样紧密地排列着。形容建筑物等密集、排列整齐的样子。"},{"w":"默默无闻","d":"意思是指做事无声无息，无人知晓，做了好事不声张，不图名利，没人知道。"},{"w":"齐头并进","d":"指几方面同时前进。"},{"w":"交融","d":"多用来突出气氛或情感。强调不同事物相互渗透形成新整体。"},{"w":"介入","d":"指外部力量主动干预或参与。"},{"w":"代表","d":"直接指代或替代某一事物，强调明确的对应关系；通常用于具体事物或概念的指代。"},{"w":"以传","d":"把本来就不正确的话又错误地传出去，结果越传越错。"},{"w":"侵蚀","d":"指逐渐侵害使变坏，多指从外部对物体进行侵害，通常包含“由外及里”的过程，程度稍轻。"},{"w":"催化","d":"指通过催化剂改变化学反应速率（加快或减慢）而自身不被消耗的过程，比喻某种因素加速事态发展或转变。"},{"w":"催生","d":"指通过外部力量促使新事物产生或加速发展，强调人为干千预或客观条件推动的生成过程。广泛用于政策、经济、科技等领域，是描述创新发展过程的精准用词。"},{"w":"共鸣","d":"一指物体因共振而发声的现象，二指由别人的某种思想感情引起相同的思想感情。"},{"w":"凝固","d":"原指在温度降低时，物质由液态变为固态的过程，引申为形容事物因某种原因（如情绪、氛围等）变得固定、停滞或不再变化，多用来描述氛围、表情、时间感等。"},{"w":"凝结","d":"程逐渐固定、形成。"},{"w":"凝聚","d":"侧重指通过吸引力或共同作用，使思想、力量、情感等抽象事物聚集在一起。"},{"w":"凝视","d":"指聚精会神地观看，不眼晴，神情专注。适用多种语境，后面可接抽象和具体名词。"},{"w":"凸显","d":"本义是凸出显露。"},{"w":"制约","d":"强调因阻碍而使进程变慢甚至停滞，侧重动作的持续性和阻碍的强度，常用于水流、交通、进程等。指事物之间相互限制、约束，强调一种客观的因果关系或条件限制。"},{"w":"刻画","d":"本义指通过雕刻和绘画等艺术手段在物体上创造出图案或形象。通常用来形容通过文字、绘画或其他艺术形式对人物、景象等进行细致入微的描绘，以突出其形象和性格特征"},{"w":"勾勒","d":"本义指通过透明纸覆盖在原件上，按照可见的线条或文字进行复制，如描摹图画、版画或手抄本。在文学创作中，描摹指通过文字细腻地描绘人物、场景、情感等，使读者能够形象地感受到所描述的内容。这种技巧强调对细节的捕捉和生动的表达，以增强作品的表现力和感染力指用线条画出轮廊，也表示用简单的笔墨描写事物的大致情况。"},{"w":"包蕴","d":"与“蕴含”相近，但更强调“包容性”，多用于文学或哲学语境（抽象内容）；书面语色彩较强，侧重整体包含复杂内容。"},{"w":"印证","d":"通过其他事物进一步证明。"},{"w":"反映","d":"本义把情况或意见等向上级转达、报告，比喻把客观事物的实质表现或显示出来。"},{"w":"发扬","d":"主要表示发展、推广、提升某种事物，使其更加显著、壮大或广泛传播。"},{"w":"囊括","d":"强调全部包含，要求无遗漏；多用于竞赛、全集等需绝对完整的语境"},{"w":"培育","d":"本意为培养幼小的生物，使它发育成长，常用于人才、经济、精神等成长"},{"w":"契合","d":"指十分符合，也可用于表示意气相投。"},{"w":"妨碍","d":"侧重指干扰、阻碍，使事情不能顺利进行，对象可以是具体行为或抽象事物，语气相对较轻。"},{"w":"媒介","d":"指在两种事物之间起传递、连接作用的中介物或手段。它可以是具体的物质载体，也可以是抽象的传播方式。"},{"w":"媲美","d":"指用语言文字等艺术手段猫写形象，或对原材料或已有的事物进行改造或加工，使其呈现出新的形态或特征；亦指用石膏、黏土等做成人或物的形象。用于积极的语境。指美好的程度可以相比，类似比美之意。一般都用于一种东西可以和另一种东西相比。"},{"w":"子立","d":"孤单，无依靠。子立：孤立。形容一个人孤苦伶仃，无依无靠。"},{"w":"孕育","d":"本义指对生命或事物的养育和滋养，使其得以成长和发展。多用于比喻在既存的事物中酿着新事物，如思想、文化、艺术作品等的形成和发展。"},{"w":"审慎","d":"指周密谨慎、细致稳重，强调在决策、行动前要权衡利弊，妥善行动。"},{"w":"审视","d":"指仔细地看，含一定的思考意味。"},{"w":"延伸","d":"指在原有基础上延长、扩展或发展"},{"w":"开端","d":"本义是指古代车辆在出发前，需要拿掉支住车轮的木头，使车辆能够开始行驶。借指开始行动或启程，常用于描述旅行、行程的开始，比喻事物的起始阶段，强调某事的开始或初创状态，常用于描述新事物、新局面的出现。指事物或事件的起始阶段，强调某事的起始点或初始状态。"},{"w":"式微","d":"指事物由兴盛而衰落，强调渐进性的衰落过程。"},{"w":"引导","d":"本义是指通过行为帮人走出困境，或是带着人向某个目标集体行动，通过行为帮人走出困境。侧重从旁指点路径。"},{"w":"引擎","d":"本义指把（如热能、化学能、核能、辐射能和升高的水的势能等形式的）能量转变为机械力和运动的机器。现在常引中为推动事物发展的动力。一般用于积极语境。"},{"w":"引领","d":"引导；带领，侧重在前带头开路。"},{"w":"弘扬","d":"意思是广泛宣传、发扬光大，通常用于精神、文化、思想等抽象事物的传播与推广。"},{"w":"彰显","d":"显赫，明显，显著，鲜明地显示。"},{"w":"意蕴","d":"指事物内在的含义或情调；强调抽象的美感或深层意义，常用于艺术、文学领域。"},{"w":"成就","d":"作为名词指取得的成绩，作为动词指完成。"},{"w":"承载","d":"支撑，托着物体，承受它的重量，也指某种事物（如文化、情感、信息等依托于另一事物存在或表达。"},{"w":"投射","d":"指光线、影子等直接投向物体，或心理学术语中“将自身特质归因于他人的心理机制，强调“主动投向”的动作。"},{"w":"折射","d":"原指光线从一种介质进入另一种介质时，因速度变化而改变传播方向，导致影像变形，侧重物理现象或抽象层面的“间接反映”（如通过现象看本质）。"},{"w":"推动","d":"通过提供动力或创造条件促使事物发展，对象可以是具体行动（如政策实施）或抽象概念（如科技创新）。"},{"w":"描绘","d":"强调画出，描画，描述。"},{"w":"擎画","d":"指对事物进行规划、设计和安排，常用于形容对重大事务的宏观布局和细致规划，对事情有深远的考虑和计划，含有策略性和智慧性的意味。"},{"w":"支撑","d":"指让物体不倒塌，让事物发展不失败、不崩溃，用于积极的语境。"},{"w":"映射","d":"原指数学中元素与元素的对应关系，引中为“通过某种方式将一事物的特征对应到另一事物上”，强调“对应关系”。"},{"w":"映照","d":"侧重客观呈现物体的影像或状态，常用于自然现象或具体场景。"},{"w":"束缚","d":"指陈旧的模式或规矩，多用于批评思维或行为的僵化；强调对创新或突破的阻碍，常与“传统”“习惯”关联；常用于突破创新场景。原指脚手，比喻严重的束缚（如思想、制度）；强调强烈的限制性，多用于抽象层面的压抑；常用于形容严重束缚的场景。本义为篱，比喻界限或隔阅（如文化、国家关系）；中性词，可指保护性屏障或需要突破的障碍；常用于跨越界限的场景。侧重指因情感、关系或责任产生的牵连，既有牵挂的温暖感，也可能带来一定限制。强调用强制手段限制自由，带有明显的负面色彩，侧重外界的压迫或规则的禁铟。"},{"w":"枢纽","d":"指主门户开合之枢与提系器物之纽。引中义比喻事物中起决定性作用的部分。"},{"w":"标志","d":"显示出来的现象；表现出来的特征。"},{"w":"桥梁","d":"指跨越障碍物（如河流、山谷、道路等）的建筑物，用于连接两地，使交通畅通。比喻义指在人与人、群体与群体、文化与文化之间起连接作用的事物或角色。"},{"w":"汇聚","d":"侧重指像水流一样从多个方向集中到一处，强调动态的“汇合过程”，对象多为水流、人群、力量等，带有较强的方向性和流动性。"},{"w":"汇集","d":"更侧重把分散的事物收集、整合到一起，强调“集中的结果”，适用范围较广。"},{"w":"沉淀","d":"情感等抽象事物在经历后慢慢凝结、稳定，侧重自然积累或筛选的过程"},{"w":"沿袭","d":"依照旧传统或原有规定办事。"},{"w":"泥沼","d":"本义指湿软的沼泽地，比喻难以摆脱的困境或复杂局面；强调陷入后难以脱身，带有被动性和挣扎感；常用于形容在困境中挣扎。"},{"w":"浸润","d":"指液体缓慢渗入固体物质中的自然过程。引中义指的是思想和文化的熏陶，情感和氛围的渗透。"},{"w":"涵养","d":"表示内在修养，也指道德、学问等方面的修养。"},{"w":"涵盖","d":"侧重范围覆盖允许部分缺失；常见于学术、展览等描述广泛领域的场景"},{"w":"渗入","d":"指液体慢慢地透过孔隙或缝隙进入另一种物质内部。例如，雨水渗入土壤，墨水渗入纸张等，也表示某种思想、文化、影响等逐渐进入或渗透到某个领域或群体中。"},{"w":"渗透","d":"本义为液体缓慢透入。现多比喻事物或势力逐渐进入，或军队利用敌部署的间隙或有利地形秘密渗入敌纵深或后方的作战行动的军事术语。"},{"w":"滋养","d":"提供养分，促进生长，指通过物质或精神养料使生物或事物健康成长。其次指维持生命活力，强调持续供给生存所需的根本养分。"},{"w":"滋润","d":"形容湿润、不干燥状态，指物体含有适量水分，舒适饱满的状态。补充水分，使不干燥。形容生活舒适、富足，形容生活宽裕、惬意、手里钱财宽裕。"},{"w":"滋生","d":"指生物（多指微生物或有害生物）产生、繁殖的过程。引中义指的是引发不良现象，导致负面事物产生或蔓延。"},{"w":"滥筋","d":"原指江河发源处。现比喻事物的开始或起源，在某些文献中，“滥筋”也有波及、影响的意思，指某事对周围事物产生的影响，在某些情况下，滥筋”还有泛滥、过分的意思，用于描述某事过度发展或超出控制。"},{"w":"演变","d":"指的是历时较久的发展变化，侧重于描述事物在时间推移中发生的变化；适用于描述各种事物在长时间内发生的变化，无论这种变化是积极的还是消极的。"},{"w":"演绎","d":"在逻辑学和数学领域指一种从一般到特殊的推理方法，即从普遍认可的前提中必然推出结论。在表演和文化领域指演员或艺术家对角色、作品的诠。“，非““，“，“"},{"w":"演进","d":"指逐渐地进化，强调的是事物在长久发展变化中向好的方向推进；常用于描述科技、文化、社会制度等方面在长时间内逐渐进步、完善的过程。"},{"w":"潼灭","d":"通常指彻底消失或毁灭，强调事物从存在到不存在的不可逆过程。"},{"w":"激励","d":"指通过刺激和正面鼓励使其奋发，通常侧重需要鼓励。"},{"w":"激发","d":"指给予刺激使其奋发出原有的潜力。"},{"w":"烘托","d":"原意是国画的一种画法，用水墨或淡的色彩涂抹画面，以加强艺术效果，多用来比喻夸大的形容或者对事物突出的描写和烘托。原意是国画的一种画法，用水墨或淡的色彩点染轮廊外部，使物象鲜明，"},{"w":"牢笼","d":"指具体的囚禁工具（如笼子），比喻束缚自由的环境或制度；强调物理或精神上的禁铟，带有强制性，形容在困境中挣扎。"},{"w":"秉承","d":"强调接受、承接，按指示办事或处理问题。更侧重于“继承”的意味，常用于正式场合。"},{"w":"秉持","d":"强调个体或集体在行动中所坚守的原则或持有的态度。更侧重于“持有”的意味，适用于各种语境。"},{"w":"积淀","d":"本义是指（风、流水等）把别的东西卷入，使随着移动。现比喻（形势、潮流等）把人卷进去，迫使侧重指长期积累后形成的文化、经验、传统等抽象事物，强调过程的漫长性和结果的厚重感，多用于精神层面。"},{"w":"积累","d":"指通过不断收集、聚集具体或抽象的事物，侧重数量的增加，使用范围更广泛。"},{"w":"纽带","d":"指用于捆束或连接物品的带子，如绳索、系带等。引中义比喻能够联系、维系人或事物的关系或因素，强调其连接、团结的作用。"},{"w":"聚集","d":"强调“从各处集合到某一地点”，侧重空间上的集中，对象可以是人和物"},{"w":"肇始","d":"指事物或事件的起源和起始阶段，强调某事的初创或初始状态。"},{"w":"腐蚀","d":"引中为人在坏的思想、行为、环境等因素影响下逐渐变质堕落；多用于比俞人的思想或行为的变质；这通常是一个“由里及外”的过程，可能表示更严重的变质或破坏。"},{"w":"蔓延","d":"指心中犹疑，要走不走的样子。指悠闲自在地漫步，带有享受、闲适的意味，多用于描写人在特定环境中的惬意状态。表示在一个地方来回走动，或比喻犹豫不决，也比喻事物在某个范围内来回波动、起伏。本义指蔓草一类植物不断向四周延伸、扩展。本义适用于“草”。词义引申，“蔓延”也指向周围扩散、延伸，速度一般较快。"},{"w":"蕴含","d":"指事物内部包含拍象的思想、情感或意义；多用于精神层面，如哲理、情感、深意等（抽象内容）。"},{"w":"蕴藏","d":"指具体资源或潜在事物隐藏在内部，未被发掘。"},{"w":"蜕变","d":"原指蝉蜕壳变，后比喻形质的改变、转化；用于形容彻底而剧烈的质变。"},{"w":"融入","d":"侧重一方主动适应或加入另体系。"},{"w":"融合","d":"指不同元素结合后失去原有界限，形成统一体。"},{"w":"衍生","d":"指从原有事物中自然发展出新的事物，强调派生关系和自然延仲的特性。"},{"w":"见证","d":"本义证明证据指证人或证物"},{"w":"观照","d":"指人对事物特性进行观察、体验、判断等特有的心理活动。现泛指仔细观察，审视。"},{"w":"诠释","d":"说明，解释，多用于书面。"},{"w":"象征","d":"用具体事物表现某些抽象意义。"},{"w":"贯穿","d":"强调事物在空间或逻辑上的连通性，既可指具体事物穿过或连接空间（如铁路贯穿全国），也可指逻辑或时间维度的持续关联（如主题贯穿始终）"},{"w":"贯通","d":"更侧重对事物的全面掌握或深层连接；既包含透彻理解，表示对知识体系的全盘掌握（如贯通中西文化），也可指复杂结构的整体连通（如工程贯通多个节点）。"},{"w":"转化","d":"指事物性质、形态、功能或归属发生改变的过程，强调从一种状态转变为另一种状态。广泛适用于自然科学、社会科学及日常生活。"},{"w":"载体","d":"指某些能传递能量或承载其他物质的物质。现也泛指一切能够承载其他事物的事物。"},{"w":"进化","d":"指生物或事物由简单到复杂、由低级到高级逐渐发展变化的过程，强调向更高级、更优化的方向变化。"},{"w":"重塑","d":"侧重指在原有基础上进行改造、更新，使形态、结构或形象发生根本性变化，强调“从旧到新的转型”。"},{"w":"重构","d":"侧重指对事物的结构、框架或系统进行根本性的调整或重新设计，强调从底层逻辑或组织形式上优化，常用于技术、理论、流程等理性场景。"},{"w":"铭刻","d":"高频实词积累100词记忆版解释侧重指在器物、石碑等表面刻下文字或图案，也常用于抽象语境，如将情感、记忆深深记在心中。"},{"w":"镌刻","d":"强调用工具在坚硬物体上精细雕刻，侧重“雕刻”的动作本身，多用于艺术创作、碑文等正式场景。"},{"w":"阐释","d":"阐述并解释。"},{"w":"不分域","d":"域：范围，界限。不分界限、范围。也比喻不分彼此。"},{"w":"人不倦","d":"海：教海，教导。教导人时很有耐心而不知疲倦。"},{"w":"人听闻","d":"惊动。指故意夸大或捏造事实，使人听后感到震惊。"},{"w":"人头动","d":"原指人很多，且频繁的在移动。，一般用于形容某些地方人口密度较大，但程度不如人山人海高。"},{"w":"以邻为","d":"深沟。意为把邻国当成排洪水的沟。后用来比喻把困难、灾祸推给别人。（多宏观语境，国家、城市、地区等）"},{"w":"分道扬","d":"道：道路。：马嚼子。分开道路，驱马前进。指分道而行。也比喻思想、志趣不同而各人干各人的事。也作“扬分路”。"},{"w":"因废食","d":"废：停止。比喻因为碰到挫折，连该做的事情也不做了。"},{"w":"字句酌","d":"用来形容人在写作或说话时的态度非常认真和细致，对于每一个字词和句子都会进行仔细地考虑和推敲。"},{"w":"左支右","d":"支：支持；：屈曲，引申为不足。原指弯弓射箭的姿势，左手支持，右手屈曲。指力量不足，应付了这方面，那方面又出了问题。（侧重能力有限，应付不过来）"},{"w":"庵一息","d":"奄奄：呼吸微弱的样子。只剩下一口气。形容临近死亡。"},{"w":"庸讳言","d":"意思是指用不着隐讳，可以直说的内容。丹庸指不用。"},{"w":"振聋发","d":"比喻唤醒糊涂麻木之人。"},{"w":"接而至","d":"意思是指人们前脚跟着后脚，接连不断地来，形容人接连而来或事情持续发生。"},{"w":"桑枢瓮","d":"枢：门上的转轴；瓮：简陋的窗户。用桑树做门轴，用瓦罐做窗户，比贫苦之家。"},{"w":"波诡云","d":"好象云彩和水波那样，形态不可捉摸。"},{"w":"熙熙壤","d":"熙熙：和乐的样子。：乱纷纷的样子。形容人来人往，纷杂拥挤。"},{"w":"相以沫","d":"沾湿，浸润。沫：唾沫。意为泉水干，鱼用唾沫相互湿润。后比喻在困境中用微薄的力量相互帮助。"},{"w":"笃行不","d":"意思是切实履行自己所学的内容，不感到倦怠。"},{"w":"耳目染","d":"沾染。因经常听到看到而不知不觉受到影响。同“耳染目”“染耳”“目耳染”。（侧重身处某种外在环境中）"},{"w":"视如散","d":"澈：破鞋子。像破烂鞋子一样看待。比喻非常轻视。"},{"w":"运筹雌","d":"筹：谋划。惟：古代军队中的帐幕。指在帐幕中谋划计策。后指在后方指挥、筹划。"},{"w":"风沐雨","d":"栉：梳头。沐：洗头。形容人辛苦地四处奔波。"}];
const API = 'http://127.0.0.1:8760/api/vocab';
const FKEY = 'gdvocab-favs', FUK = 'gdvocab-updated';
const $ = s => document.querySelector(s);

let favs = {};
try { favs = JSON.parse(localStorage.getItem(FKEY) || '{}'); } catch(e){ favs = {}; }
let localAt = Number(localStorage.getItem(FUK) || 0) || 0;

let mode = 'card';
let filter = 'all';
let kw = '';
let list = [];
let pos = 0;
let opened = false;

/* ---------- 同步 ---------- */
let pushTimer = null, retryTimer = null, pushing = false;

function setSync(state, msg){
  const el = $('#sync');
  el.className = 'sync ' + state;
  el.textContent = msg;
}

function saveLocal(){
  try{
    localStorage.setItem(FKEY, JSON.stringify(favs));
    localStorage.setItem(FUK, String(localAt));
  }catch(e){}
}

function save(){
  localAt = Date.now();
  saveLocal();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 350);
}

function push(){
  if(pushing){ retryTimer = setTimeout(push, 800); return; }
  pushing = true;
  fetch(API, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ answers:{}, favs, updatedAt: localAt })
  })
  .then(r => r.json())
  .then(res => {
    pushing = false;
    clearTimeout(retryTimer);
    if(res && res.stale){ adopt(res); setSync('ok','已同步'); return; }
    setSync('ok','已同步 ' + new Date().toLocaleTimeString('zh-CN',{hour12:false}));
  })
  .catch(() => {
    pushing = false;
    setSync('off','未连服务器');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(push, 8000);
  });
}

function adopt(snap){
  favs = (snap && snap.favs && typeof snap.favs === 'object') ? snap.favs : {};
  localAt = Number(snap && snap.updatedAt || 0) || 0;
  saveLocal();
  buildChips();
  build(); render();
}

function pull(){
  fetch(API + '?t=' + Date.now(), {cache:'no-store'})
    .then(r => { if(!r.ok) throw 0; return r.json(); })
    .then(snap => {
      const remoteAt = Number(snap.updatedAt || 0) || 0;
      if(remoteAt > localAt + 500){
        adopt(snap);
        setSync('ok','已同步');
      } else {
        setSync('ok','已同步 ' + new Date().toLocaleTimeString('zh-CN',{hour12:false}));
        if(localAt > remoteAt) save();
      }
    })
    .catch(() => setSync('off','未连服务器'));
}

/* ---------- 列表构建 ---------- */
function build(){
  list = DATA.filter(it => {
    if(filter === 'fav' && !favs[it.w]) return false;
    if(filter === 'len4' && it.w.length !== 4) return false;
    if(filter === 'len2' && it.w.length !== 2) return false;
    if(filter === 'other' && (it.w.length === 4 || it.w.length === 2)) return false;
    if(kw){
      const k = kw.toLowerCase();
      if(!(it.w.includes(kw) || it.d.toLowerCase().includes(k))) return false;
    }
    return true;
  });
  if(pos > list.length - 1) pos = 0;
}

function buildChips(){
  const box = $('#chips');
  box.innerHTML = '';
  const cats = [
    ['all', '全部 ' + DATA.length],
    ['fav', '★ 收藏 ' + Object.keys(favs).length],
    ['len4', '四字成语'],
    ['len2', '两字词'],
    ['other', '其他']
  ];
  cats.forEach(([c, label]) => {
    const b = document.createElement('button');
    b.className = 'chip' + (filter === c ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { filter = c; pos = 0; buildChips(); build(); render(); };
    box.appendChild(b);
  });
}

/* ---------- 渲染 ---------- */
function render(){
  $('#totalN').textContent = DATA.length;
  $('#favN').textContent = '★ ' + Object.keys(favs).length;
  const names = {all:'全部', fav:'只看收藏', len4:'四字成语', len2:'两字词', other:'其他长度'};
  $('#sub').textContent = names[filter] || '全部';

  if(mode === 'card'){ $('#cardView').style.display = ''; $('#listView').style.display = 'none'; renderCard(); }
  else { $('#cardView').style.display = 'none'; $('#listView').style.display = ''; renderList(); }
}

function renderCard(){
  const it = list[pos];
  const card = $('#card');
  if(!it){
    $('#word').textContent = '—';
    $('#def').textContent = '';
    $('#tags').innerHTML = '';
    $('#pos').textContent = '没有符合条件的成语';
    $('#star').style.visibility = 'hidden';
    card.classList.remove('open');
    return;
  }
  $('#star').style.visibility = 'visible';
  const on = !!favs[it.w];
  $('#star').textContent = on ? '★' : '☆';
  $('#star').classList.toggle('on', on);

  $('#word').textContent = it.w;
  $('#def').textContent = it.d;
  const kind = it.w.length === 4 ? '四字成语' : (it.w.length === 2 ? '两字词' : it.w.length + ' 字');
  $('#tags').innerHTML = '<span></span>';
  $('#tags').querySelector('span').textContent = kind;

  card.classList.toggle('open', opened);
  $('#pos').textContent = (pos + 1) + ' / ' + list.length;
}

function renderList(){
  const g = $('#grid');
  g.innerHTML = '';
  $('#empty').style.display = list.length ? 'none' : '';
  const frag = document.createDocumentFragment();
  list.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'item clip';
    const on = !!favs[it.w];
    d.innerHTML = '<div class="w"></div><div class="d"></div>' +
                  '<span class="k' + (on ? ' on' : '') + '">' + (on ? '★' : '☆') + '</span>';
    d.querySelector('.w').textContent = it.w;
    d.querySelector('.d').textContent = it.d;
    d.onclick = e => {
      if(e.target.classList.contains('k')){ toggleFav(it.w); return; }
      d.classList.toggle('clip');
    };
    frag.appendChild(d);
  });
  g.appendChild(frag);
}

function toggleFav(w){
  if(favs[w]) delete favs[w]; else favs[w] = 1;
  save();
  buildChips();
  if(filter === 'fav'){ build(); if(pos > list.length - 1) pos = Math.max(0, list.length - 1); }
  render();
}

/* ---------- 交互 ---------- */
function go(step){
  if(!list.length) return;
  pos = (pos + step + list.length) % list.length;
  opened = false;
  renderCard();
}

function randomOne(){
  if(!list.length) return;
  pos = Math.floor(Math.random() * list.length);
  opened = false;
  renderCard();
}

$('#card').onclick = e => {
  if(e.target.id === 'star') return;
  opened = !opened;
  $('#card').classList.toggle('open', opened);
};
$('#star').onclick = e => { e.stopPropagation(); if(list[pos]) toggleFav(list[pos].w); };
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#shuffle').onclick = randomOne;
$('#reveal').onclick = () => { opened = !opened; $('#card').classList.toggle('open', opened); };

$('#mCard').onclick = () => { mode = 'card'; $('#mCard').classList.add('on'); $('#mList').classList.remove('on'); render(); };
$('#mList').onclick = () => { mode = 'list'; $('#mList').classList.add('on'); $('#mCard').classList.remove('on'); render(); };

$('#q').oninput = e => { kw = e.target.value.trim(); pos = 0; build(); render(); };

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  const k = e.key;
  if(k === 'ArrowLeft') go(-1);
  else if(k === 'ArrowRight') go(1);
  else if(k === ' '){ e.preventDefault(); opened = !opened; $('#card').classList.toggle('open', opened); }
  else if(k === 'f' || k === 'F'){ if(list[pos]) toggleFav(list[pos].w); }
});

buildChips();
build();
render();
pull();
setInterval(pull, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) pull(); });
</script>
</body>
</html>
