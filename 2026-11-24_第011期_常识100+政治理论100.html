<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>广东省考刷题 第011期 · 2026-11-24</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#15181f; --sub:#6b7280; --line:#e6e8ec;
  --primary:#2563eb; --primary-soft:#eff4ff;
  --ok:#15803d; --ok-bg:#f0fdf4; --ok-line:#86efac;
  --bad:#b91c1c; --bad-bg:#fef2f2; --bad-line:#fca5a5;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.6;
  font-family:"Microsoft YaHei","微软雅黑",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:30;background:rgba(244,245,247,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
}
.htop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{font-size:16px;font-weight:650;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:2px;letter-spacing:0}
.hstat{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.hstat b{font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.hstat .rate{font-weight:600;font-variant-numeric:tabular-nums}
.pbar{height:3px;background:#e3e5ea;border-radius:0 0 3px 3px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--primary);transition:width .35s ease}

/* ---------- 分组 ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#4b5563;
  padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;
  transition:.15s;
}
.tab:hover{border-color:#c9ced8}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- 题目卡 ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 22px 18px}
.qmeta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin-bottom:12px}
.qmeta .no{font-weight:600;color:var(--primary);background:var(--primary-soft);padding:2px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
.qmeta .sec{padding:2px 9px;background:#f3f4f6;border-radius:6px}
.star{
  margin-left:auto;background:none;border:0;padding:2px 6px;border-radius:7px;
  font-size:19px;line-height:1;color:#c3c8d2;cursor:pointer;transition:.15s;
  font-family:inherit;
}
.star:hover{background:#f3f4f6;color:#f59e0b}
.star.on{color:#f59e0b}
.qtext{font-size:17px;line-height:1.8;font-weight:500;letter-spacing:.1px;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:#fff;border:1.5px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:15.5px;line-height:1.65;color:var(--ink);
  cursor:pointer;transition:.14s;font-family:inherit;
}
.opt:hover:not(.done){border-color:#b9c2d0;background:#fafbfc}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:50%;background:#f1f2f4;color:#4b5563;
  font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;
  margin-top:1px;transition:.14s;
}
.opt .t{flex:1}
.opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.62}
.opt.done{cursor:default}

/* ---------- 解析 ---------- */
.exp{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px;display:none}
.exp.show{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.verdict{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:10px;padding:6px 11px;border-radius:8px;width:fit-content}
.verdict.ok{color:#166534;background:#dcfce7}
.verdict.bad{color:#b91c1c;background:#fee2e2}
.verdict .badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.75);color:#4b5563}
.expline{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.expline .lbl{
  flex:0 0 auto;font-size:11.5px;font-weight:600;color:#6b7280;background:#f3f4f6;
  padding:2px 7px;border-radius:5px;margin-top:2px;
}
.expline .val{font-size:14.5px;line-height:1.8;color:#111827}
.redo{margin-top:14px;font-size:12.5px;color:#4b5563;background:#f3f4f6;border:0;border-radius:7px;padding:6px 12px;cursor:pointer;font-family:inherit}
.redo:hover{background:#e9ebef}

/* ---------- 底部操作 ---------- */
footer{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));
}
.finner{max-width:820px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
  padding:10px 16px;font-size:14px;font-weight:550;cursor:pointer;font-family:inherit;
  transition:.14s;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:#b9c2d0;background:#fafbfc}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);flex:1}
.btn.primary:hover{background:#000}
.btn.ghost{flex:1}
.btn.icon{padding:10px 13px}

/* ---------- 答题卡 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,18,25,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex;animation:fade .18s ease}
.sheet{
  background:#fff;width:100%;max-width:820px;border-radius:18px 18px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;
}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;padding-bottom:2px;z-index:2}
.sheet h3{margin:0;font-size:15px;font-weight:650}
.sheet .close{font-size:12.5px;color:#4b5563;background:#f3f4f6;border-radius:7px;padding:5px 11px;cursor:pointer;user-select:none}
.sheet .close:hover{background:#e9ebef}
.sheet .legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin:8px 0 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.cell{
  position:relative;aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:#fbfbfc;
  font-size:12px;color:#6b7280;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-variant-numeric:tabular-nums;transition:.12s;
}
.cell:hover{transform:translateY(-1px)}
.cell.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok);font-weight:600}
.cell.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad);font-weight:600}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.fav::after{content:'★';position:absolute;top:0;right:2px;font-size:7.5px;color:#f59e0b;line-height:1.4}
.sheetbar{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:0;background:#fff;padding:12px 0 2px;box-shadow:0 -10px 18px 6px #fff}
.sheetbar .btn{flex:1;justify-content:center}
.hint{text-align:center;font-size:11.5px;color:#9ca3af;margin-top:14px;line-height:1.7}

@media (max-width:560px){
  .qcard{padding:18px 16px 14px;border-radius:14px}
  .qtext{font-size:16px}
  .opt{font-size:15px;padding:11px 12px}
  .grid{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>

</div>

澳大湾区","q":"按照《粤港澳大湾区发展规划纲要》，澳门的定位是（　）。","opts":["世界旅游休闲中心、中国与葡语国家商贸合作服务平台","国际金融中心和全球离岸人民币业务枢纽","国际科技创新中心和综合性国家科学中心","国际航运中心和国际贸易中心"],"ans":"A","tag":"澳门定位","exp":"澳门是“一中心、一平台、一基地”：世界旅游休闲中心、中国与葡语国家商贸合作服务平台、多元文化交流合作基地。"},{"n":15,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"关于中国（广东）自由贸易试验区，下列表述正确的是（　）。","opts":["2015 年 4 月挂牌，设南沙、前海蛇口、横琴三个片区","2013 年 9 月挂牌，设南沙、前海、横琴三个片区","2015 年 4 月挂牌，设南沙、前海、横琴、白云机场四个片区","2018 年 4 月挂牌，设广州、深圳、珠海三个片区"],"ans":"A","tag":"广东自贸区挂牌","exp":"广东自贸区 2014 年 12 月经国务院批准设立、2015 年 4 月挂牌，三个片区共 116.2 平方公里。"},{"n":16,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"2021 年 9 月《全面深化前海深港现代服务业合作区改革开放方案》实施后，前海合作区面积由 14.92 平方公里扩大到（　）。","opts":["120.56 平方公里","100.56 平方公里","150.56 平方公里","220.56 平方公里"],"ans":"A","tag":"前海扩区面积","exp":"前海扩区后总面积 120.56 平方公里，是原来的 8 倍，为深港现代服务业合作提供更大空间。"},{"n":17,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"关于横琴“澳门新街坊”项目，下列表述错误的是（　）。","opts":["是首个为澳门居民建设的综合民生项目","位于横琴粤澳深度合作区","项目内公共服务按澳门标准运营","项目由香港特别行政区政府主导建设"],"ans":"D","tag":"澳门新街坊","exp":"“澳门新街坊”由澳门特别行政区政府主导、在横琴建设，面向澳门居民，与香港无关。"},{"n":18,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"关于澳门大学横琴校区，下列表述正确的是（　）。","opts":["校区内适用澳门法律，由澳门特别行政区依照澳门法律实施管辖","校区内完全适用内地法律，由珠海市管理","校区由粤澳双方共同管理，适用国际条约","校区仅为教学场所，不涉及法律适用安排"],"ans":"A","tag":"澳大横琴校区","exp":"全国人大常委会决定授权澳门特别行政区对横琴校区实行管辖，校区内适用澳门法律，是“一国两制”在横琴的具体实践。"},{"n":19,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"香港科技大学（广州）的办学地点和开办时间是（　）。","opts":["广州南沙，2022 年 9 月","广州黄埔，2020 年 9 月","深圳前海，2022 年 9 月","珠海横琴，2023 年 9 月"],"ans":"A","tag":"港科大（广州）","exp":"香港科技大学（广州）2022 年 9 月在广州南沙开学，是《粤港澳大湾区发展规划纲要》发布后首个内地与香港合作办学机构。"},{"n":20,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"关于广深港高铁香港段，下列表述正确的是（　）。","opts":["2018 年 9 月 23 日通车，西九龙站实行“一地两检”","2016 年 9 月 23 日通车，深圳湾口岸实行“一地两检”","2018 年 9 月 23 日通车，皇岗口岸实行“一地两检”","2020 年 9 月 23 日通车，西九龙站实行“两地两检”"],"ans":"A","tag":"广深港高铁","exp":"广深港高铁香港段 2018 年 9 月 23 日通车，西九龙站实行“一地两检”，是粤港澳大湾区硬联通的关键工程。"},{"n":21,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"关于“港车北上”“澳车北上”，下列表述正确的是（　）。","opts":["“港车北上”2023 年 7 月 1 日起实施，“澳车北上”2022 年 12 月起实施","“港车北上”2022 年 12 月起实施，“澳车北上”2023 年 7 月 1 日起实施","两者均自 2023 年 7 月 1 日起实施","两者均自 2024 年 1 月 1 日起实施"],"ans":"A","tag":"港车澳车北上","exp":"“澳车北上”先行，2022 年 12 月起实施；“港车北上”2023 年 7 月 1 日起实施，两者顺序不能颠倒。"},{"n":22,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"关于深港通与债券通，下列表述正确的是（　）。","opts":["深港通 2016 年 12 月开通，债券通“北向通”2017 年 7 月上线","深港通 2014 年 11 月开通，债券通“北向通”2016 年 7 月上线","深港通 2017 年 7 月开通，债券通“北向通”2018 年 3 月上线","深港通 2016 年 12 月开通，债券通“南向通”2017 年 7 月上线"],"ans":"A","tag":"深港通与债券通","exp":"深港通 2016 年 12 月 5 日开通；2017 年 7 月上线的是债券通“北向通”，“南向通”2021 年 9 月才开通。"},{"n":23,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广州期货交易所的揭牌时间和交易所序列是（　）。","opts":["2021 年 4 月揭牌，是我国第五家期货交易所","2019 年 4 月揭牌，是我国第四家期货交易所","2021 年 4 月揭牌，是我国第一家期货交易所","2023 年 4 月揭牌，是我国第六家期货交易所"],"ans":"A","tag":"广州期货交易所","exp":"广期所 2021 年 4 月 19 日揭牌，是继上海、大连、郑州、中金所之后的第五家期货交易所。"},{"n":24,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"内地与香港、澳门签署《关于建立更紧密经贸关系的安排》（CEPA）的时间是（　）。","opts":["2003 年","1997 年","2008 年","2010 年"],"ans":"A","tag":"CEPA","exp":"CEPA 于 2003 年签署，此后每年签署补充协议，是内地与港澳经贸合作的基础性制度安排。"},{"n":25,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"关于粤港澳大湾区境外高端人才和紧缺人才个人所得税优惠政策，下列说法正确的是（　）。","opts":["其在珠三角九市缴纳的个人所得税已缴税额超过按应纳税所得额 15% 计算税额的部分，由财政给予补贴","其个人所得税一律按 15% 征收，不设补贴环节","该政策仅适用于香港、澳门居民，不适用于外籍人才","该政策适用于大湾区全部城市，包括港澳"],"ans":"A","tag":"大湾区个税优惠","exp":"政策采取“先征后补”：税负超过 15% 的部分由珠三角九市财政补贴，港澳不适用内地税制，故不在补贴范围。"},{"n":26,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"2022 年广东设立的中国（广东）自由贸易试验区联动发展区共有（　）。","opts":["13 个","9 个","21 个","6 个"],"ans":"A","tag":"自贸区联动发展区","exp":"2022 年 6 月广东在 13 个地市设立自贸试验区联动发展区，推动制度创新成果向全省复制推广。"},{"n":27,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"关于“数字湾区”建设，下列表述正确的是（　）。","opts":["推动粤港澳跨境数据验证平台建设，促进三地规则衔接","以大湾区数据完全自由流动为唯一目标，不再区分数据类别","仅覆盖广州、深圳两市","主要任务是建设跨海光缆，不涉及数据规则"],"ans":"A","tag":"数字湾区","exp":"“数字湾区”以数据跨境流动规则衔接、跨境数据验证平台等为抓手，强调安全有序流动，而非无差别自由流动。"},{"n":28,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东省现有地级市数量及其中副省级城市是（　）。","opts":["21 个地级市，广州、深圳为副省级市","19 个地级市，广州、深圳为副省级市","21 个地级市，广州、珠海为副省级市","23 个地级市，深圳、汕头为副省级市"],"ans":"A","tag":"广东地级市","exp":"广东辖 21 个地级市，其中广州、深圳为副省级市，深圳还是计划单列市和经济特区。"},{"n":29,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"2024 年 5 月大湾区城际铁路“四线贯通”，贯通后的线路全长约（　）。","opts":["258 公里","158 公里","358 公里","458 公里"],"ans":"A","tag":"大湾区城际四线贯通","exp":"广佛南环、佛莞城际开通后与佛肇、莞惠城际贯通，形成横跨广州、佛山、肇庆、东莞、惠州 5 市、全长 258 公里的城际铁路。"},{"n":30,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东服务港澳青年创新创业的基地体系可概括为（　）。","opts":["“1+12+N”","“1+9+N”","“2+12+N”","“1+21+N”"],"ans":"A","tag":"港澳青年双创基地","exp":"广东构建“1+12+N”港澳青年创新创业基地体系：1 个省级平台、12 个市级基地、N 个特色基地。"},{"n":31,"part":"常识判断","sec":"法律常识","q":"按照修订后的行政复议法，行政复议职责主要由（　）统一行使。","opts":["县级以上地方各级人民政府","县级以上地方各级人民政府工作部门","各级人民法院","各级人民代表大会常务委员会"],"ans":"A","tag":"复议机关集中","exp":"修法后实行“一级政府一个复议机关”，行政复议职责由县级以上地方各级人民政府统一行使，部门原则上不再作为复议机关。"},{"n":32,"part":"常识判断","sec":"法律常识","q":"下列情形中，属于行政复议前置（应当先申请行政复议）的是（　）。","opts":["对当场作出的行政处罚决定不服","对行政机关作出的行政调解行为不服","对行政机关内部的人事处理决定不服","对行政机关制定的规范性文件不服"],"ans":"A","tag":"复议前置","exp":"修订后的行政复议法扩大了复议前置范围，对当场作出的行政处罚决定不服即属其一；行政调解、内部人事处理不属于复议范围。"},{"n":33,"part":"常识判断","sec":"法律常识","q":"行政复议机关收到行政复议申请后，审查决定是否受理的期限是（　）。","opts":["5 日","7 日","10 日","15 日"],"ans":"A","tag":"复议受理审查期限","exp":"行政复议机关应当自收到申请之日起 5 日内进行审查，决定是否受理。"},{"n":34,"part":"常识判断","sec":"法律常识","q":"行政复议机关审理行政复议案件，一般应当自受理之日起（　）内作出行政复议决定。","opts":["60 日","30 日","90 日","6 个月"],"ans":"A","tag":"复议审理期限","exp":"一般期限为 60 日；情况复杂经批准可以延长，延长期限最多不超过 30 日。"},{"n":35,"part":"常识判断","sec":"法律常识","q":"适用简易程序审理的行政复议案件，行政复议机关应当自受理之日起（　）内作出决定。","opts":["30 日","60 日","20 日","45 日"],"ans":"A","tag":"复议简易程序期限","exp":"简易程序 30 日、普通程序 60 日（可延长 30 日），两个期限不要混。"},{"n":36,"part":"常识判断","sec":"法律常识","q":"下列事项中，行政复议机关可以调解的是（　）。","opts":["行政机关行使自由裁量权作出的行政行为引发的争议","行政机关对民事纠纷作出的调解","行政机关内部的层级监督争议","行政机关制定规范性文件的争议"],"ans":"A","tag":"复议调解","exp":"对自由裁量权行使、行政赔偿和补偿纠纷，复议机关可以调解；羁束性行政行为原则上不适用调解。"},{"n":37,"part":"常识判断","sec":"法律常识","q":"关于行政复议费用，下列表述正确的是（　）。","opts":["行政复议机关受理行政复议申请，不得向申请人收取任何费用","申请人应按件缴纳复议受理费","复议收费按争议标的额比例收取","只有复议机关维持原行为时才收取费用"],"ans":"A","tag":"复议不收费","exp":"行政复议不收费，所需经费列入本机关行政经费，由本级财政予以保障。"},{"n":38,"part":"常识判断","sec":"法律常识","q":"关于行政复议期间行政行为的执行，下列表述正确的是（　）。","opts":["一律停止执行","原则上不停止执行，法律规定停止执行的除外","由申请人自行决定是否停止执行","一律继续执行，没有任何例外"],"ans":"B","tag":"复议不停止执行","exp":"行政复议期间行政行为不停止执行，但被申请人认为需要停止、复议机关认为需要停止、申请人申请且复议机关认为合理决定停止等情形除外。"},{"n":39,"part":"常识判断","sec":"法律常识","q":"下列不属于行政复议决定种类的是（　）。","opts":["维持决定","决定行政处罚","撤销决定","确认违法决定"],"ans":"B","tag":"复议决定种类","exp":"复议决定包括维持、责令履行、撤销、变更、确认违法、驳回申请等。复议机关是审查者，不能代替行政机关作出处罚决定。"},{"n":40,"part":"常识判断","sec":"法律常识","q":"行政复议机关维持原行政行为，当事人提起行政诉讼的，被告是（　）。","opts":["仅复议机关为被告","作出原行政行为的行政机关和复议机关为共同被告","仅作出原行政行为的机关为被告","由原告在两者中选择其一"],"ans":"B","tag":"复议共同被告","exp":"复议维持时，原行为机关和复议机关为共同被告；复议改变时，复议机关为被告。"},{"n":41,"part":"常识判断","sec":"法律常识","q":"某企业同一个违法行为，已被市场监管部门处以罚款，其他行政机关又依据同一事实对其再次处以罚款。该做法违反（　）。","opts":["比例原则","一事不再罚原则","信赖保护原则","处罚法定原则"],"ans":"B","tag":"一事不再罚","exp":"行政处罚法规定，对当事人的同一个违法行为，不得给予两次以上罚款的行政处罚。"},{"n":42,"part":"常识判断","sec":"法律常识","q":"行政许可所依据的法律、法规、规章修改或者废止，为了公共利益需要，行政机关可以依法（　）已经生效的行政许可。","opts":["一律撤销并追缴全部收益","变更或者撤回","宣布无效并处罚","自行转让给他人"],"ans":"B","tag":"许可撤回与补偿","exp":"此种情形属于撤回而非撤销，由此给公民、法人或者其他组织造成财产损失的，行政机关应当依法给予补偿。"},{"n":43,"part":"常识判断","sec":"法律常识","q":"行政机关依法作出要求当事人排除妨碍、恢复原状的决定，当事人经催告仍不履行，后果已经或者将要危害交通安全、造成环境污染或者破坏自然资源的，行政机关可以（　）。","opts":["直接冻结当事人账户","代履行","自行决定行政拘留","将案件退回不予处理"],"ans":"B","tag":"行政强制代履行","exp":"代履行是间接强制执行方式，由行政机关或委托无利害关系的第三人代为履行，费用由当事人承担。"},{"n":44,"part":"常识判断","sec":"法律常识","q":"在行政诉讼中，对作出的行政行为承担举证责任的是（　）。","opts":["原告","被告行政机关","人民法院","第三人"],"ans":"B","tag":"行政诉讼举证责任","exp":"行政诉讼实行被告负举证责任，被告应当提供作出该行政行为的证据和所依据的规范性文件。"},{"n":45,"part":"常识判断","sec":"法律常识","q":"行政机关及其工作人员行使职权侵犯公民合法权益造成损害的，赔偿义务机关一般是（　）。","opts":["本级人民政府财政部门","作出侵权行为的行政机关","同级人民法院","上级主管机关"],"ans":"B","tag":"国家赔偿义务机关","exp":"谁侵权谁赔偿；两个以上机关共同行使职权造成损害的，共同行使职权的机关为共同赔偿义务机关。"},{"n":46,"part":"常识判断","sec":"法律常识","q":"合同成立后，合同的基础条件发生了当事人在订立合同时无法预见的、不属于商业风险的重大变化，继续履行合同对于当事人一方明显不公平的，受不利影响的当事人可以（　）。","opts":["直接通知对方解除合同，无需任何程序","请求人民法院或者仲裁机构变更或者解除合同","主张合同自始无效","自行停止履行且不承担任何责任"],"ans":"B","tag":"情势变更","exp":"情势变更需通过协商或请求人民法院、仲裁机构变更或解除合同，不能单方直接解除，也不属于无效情形。"},{"n":47,"part":"常识判断","sec":"法律常识","q":"关于正当防卫，下列表述正确的是（　）。","opts":["只要造成不法侵害人损害，一律不负刑事责任","正当防卫明显超过必要限度造成重大损害的，应当负刑事责任，但是应当减轻或者免除处罚","防卫行为超过必要限度的一律按故意犯罪处理","对正在进行的不法侵害，只能先报警不能防卫"],"ans":"B","tag":"正当防卫限度","exp":"防卫过当应负刑事责任但应当减轻或免除处罚；对严重危及人身安全的暴力犯罪进行防卫致人伤亡的，不属于防卫过当。"},{"n":48,"part":"常识判断","sec":"法律常识","q":"按照宪法规定，任何公民，非经（　）批准或者决定或者人民法院决定，并由公安机关执行，不受逮捕。","opts":["人民政府","人民检察院","公安机关","监察委员会"],"ans":"B","tag":"宪法人身自由","exp":"宪法规定逮捕须经人民检察院批准或者决定、或者人民法院决定，并由公安机关执行，这是人身自由的重要保障。"},{"n":49,"part":"常识判断","sec":"法律常识","q":"《关于加强党建带团建工作的意见》明确，共青团受同级党委和上级团组织双重领导，其中（　）。","opts":["以上级团组织领导为主","以同级党委领导为主","两者完全对等，不分主次","由共青团中央直接领导为主"],"ans":"B","tag":"党建带团建","exp":"意见强调坚持党管青年工作原则，共青团实行双重领导、以同级党委领导为主，讲义把“以上级团组织领导为主”标注为错误方向。"},{"n":50,"part":"常识判断","sec":"法律常识","q":"按照《党政领导干部生态环境损害责任追究办法》，下列表述错误的是（　）。","opts":["责任追究方式可以单独使用，也可以依据规定合并使用","责任追究方式包括谈话提醒、批评教育、责令检查、诫勉","责任追究方式包括组织调整或者组织处理、党纪政务处分","责任追究方式只能单独使用，不得合并"],"ans":"D","tag":"生态环境损害追责","exp":"三种追究方式既可以单独使用，也可以依据规定合并使用；“只能单独使用”是讲义标注的错误方向。"},{"n":51,"part":"常识判断","sec":"经济常识","q":"消费者愿意为某商品支付的最高价格高于实际支付价格时，二者之间的差额称为（　）。","opts":["生产者剩余","消费者剩余","边际效用","机会成本"],"ans":"B","tag":"消费者剩余","exp":"消费者剩余是买者愿意支付的最高价格与实际支付价格之差，反映消费者从交易中获得的福利。"},{"n":52,"part":"常识判断","sec":"经济常识","q":"某商品价格下降后，消费者用更便宜的商品替代其他商品，从而增加对该商品的购买，这属于（　）。","opts":["收入效应","替代效应","示范效应","棘轮效应"],"ans":"B","tag":"替代效应","exp":"替代效应指商品相对价格变化引起的购买量变化；收入效应指实际购买力变化引起的购买量变化，二者共同构成价格变动的总效应。"},{"n":53,"part":"常识判断","sec":"经济常识","q":"同一商品对不同购买者或不同购买量收取不同价格，这种定价方式称为（　）。","opts":["价格联盟","价格歧视","倾销","捆绑销售"],"ans":"B","tag":"价格歧视","exp":"价格歧视须具备市场分割和防止转售条件，常见于学生票、分时段电价等；倾销是跨国低价销售，性质不同。"},{"n":54,"part":"常识判断","sec":"经济常识","q":"只要交易成本为零且产权界定清晰，当事人通过自愿协商就能解决外部性问题，这一观点来自（　）。","opts":["庇古税理论","科斯定理","萨伊定律","李嘉图等价定理"],"ans":"B","tag":"科斯定理","exp":"科斯定理强调产权与交易成本，主张通过市场协商内部化外部性；庇古税则主张政府征税纠正外部性。"},{"n":55,"part":"常识判断","sec":"经济常识","q":"在法定存款准备金率为 10%、且不考虑现金漏损的简单模型中，基础货币 100 亿元可派生的存款总额约为（　）。","opts":["100 亿元","1000 亿元","110 亿元","900 亿元"],"ans":"B","tag":"货币乘数","exp":"简单货币乘数为准备金率的倒数，即 1÷10%＝10，100 亿元基础货币可派生 1000 亿元存款。"},{"n":56,"part":"常识判断","sec":"经济常识","q":"我国货币供应量层次中，M2 等于（　）。","opts":["流通中现金加单位活期存款","M1 加准货币","M0 加外汇储备","各项存款加债券发行"],"ans":"B","tag":"M2 构成","exp":"M1 为 M0 加单位活期存款；M2 为 M1 加准货币（单位定期存款、居民储蓄存款、其他存款等）。"},{"n":57,"part":"常识判断","sec":"经济常识","q":"名义利率、实际利率与通货膨胀率的关系可近似表示为（　）。","opts":["实际利率约等于名义利率加通货膨胀率","实际利率约等于名义利率减通货膨胀率","名义利率约等于实际利率减通货膨胀率","三者始终相等"],"ans":"B","tag":"费雪效应","exp":"这就是费雪方程式：名义利率＝实际利率＋预期通胀率，通胀上升时名义利率随之上升。"},{"n":58,"part":"常识判断","sec":"经济常识","q":"两国货币之间的汇率长期趋向于使两国货币购买力相等的水平，这一理论是（　）。","opts":["利率平价理论","购买力平价理论","国际收支说","货币主义汇率理论"],"ans":"B","tag":"购买力平价","exp":"购买力平价以“一价定律”为基础，解释长期汇率趋势；短期汇率更多受利率和资本流动影响。"},{"n":59,"part":"常识判断","sec":"经济常识","q":"地方政府专项债券的基本特征是（　）。","opts":["用于弥补一般公共预算收支缺口，以税收偿还","对应具体项目、以项目收益偿还，不纳入赤字","由中央银行直接认购，计入基础货币投放","只能用于人员经费和日常运转支出"],"ans":"B","tag":"地方政府专项债","exp":"专项债“资金跟着项目走”，要求项目收益与融资自求平衡；一般债券用于弥补一般公共预算缺口。"},{"n":60,"part":"常识判断","sec":"经济常识","q":"税率提高到一定程度后，继续提高反而会使税收总额下降，这一现象常被称为（　）。","opts":["菲利普斯曲线","拉弗曲线","洛伦兹曲线","恩格尔曲线"],"ans":"B","tag":"拉弗曲线","exp":"拉弗曲线说明税率与税收收入并非线性关系，过高税率抑制税基，反而减少税收。"},{"n":61,"part":"常识判断","sec":"科技与生活","q":"新型电力系统区别于传统电力系统的最主要特征是（　）。","opts":["以煤电为唯一支撑电源","新能源占比高、源网荷储协同互动","电网结构以分散孤立供电为主","用电负荷完全不可调节"],"ans":"B","tag":"新型电力系统","exp":"新型电力系统以新能源为主体电源，强调源网荷储一体化、数字化智能调度和需求侧灵活调节。"},{"n":62,"part":"常识判断","sec":"科技与生活","q":"被称为第三代光伏技术、理论效率上限较高且可做成柔性组件的电池是（　）。","opts":["多晶硅电池","钙钛矿太阳能电池","碲化镉薄膜电池","铜铟镓硒电池"],"ans":"B","tag":"钙钛矿电池","exp":"钙钛矿电池转换效率提升快、成本低、可柔性化，是当前光伏技术竞争的焦点方向。"},{"n":63,"part":"常识判断","sec":"科技与生活","q":"利用电网低谷电能压缩空气储存于盐穴或储气罐，高峰时释放发电，这种储能方式是（　）。","opts":["飞轮储能","压缩空气储能","超级电容储能","抽水蓄能"],"ans":"B","tag":"压缩空气储能","exp":"压缩空气储能为大规模长时储能技术，我国已有盐穴压缩空气储能电站投运；抽水蓄能则依靠上下水库落差。"},{"n":64,"part":"常识判断","sec":"科技与生活","q":"把分散的可调节负荷、储能和分布式电源聚合起来参与电网调度和市场交易的主体，称为（　）。","opts":["增量配电网","微电网","虚拟电厂","储能电站"],"ans":"C","tag":"虚拟电厂","exp":"虚拟电厂本身不发电，通过聚合与协调用户侧资源形成可调容量，参与削峰填谷和辅助服务。"},{"n":65,"part":"常识判断","sec":"科技与生活","q":"2025 年全国碳排放权交易市场扩围，新增纳入的行业是（　）。","opts":["汽车、船舶、航空","造纸、纺织、家电","钢铁、水泥、铝冶炼","餐饮、住宿、零售"],"ans":"C","tag":"碳市场扩围","exp":"全国碳市场在发电行业基础上扩围至钢铁、水泥、铝冶炼三个行业，覆盖排放量显著上升。"},{"n":66,"part":"常识判断","sec":"科技与生活","q":"可再生能源绿色电力证书的作用是（　）。","opts":["作为企业排污许可的替代文件","证明电力价格低于燃煤基准价","证明电力来自可再生能源，并作为消费认证凭证","作为电网接入的技术许可证"],"ans":"C","tag":"绿证","exp":"绿证是可再生能源电量环境属性的唯一证明，用于绿电消费认证、抵扣能耗和碳排放核算。"},{"n":67,"part":"常识判断","sec":"科技与生活","q":"全国温室气体自愿减排交易机制产生的减排量称为（　）。","opts":["GEC","CEA","CCER","REC"],"ans":"C","tag":"CCER","exp":"CCER 是国家核证自愿减排量，可用于重点排放单位履约抵销；CEA 是碳排放配额。"},{"n":68,"part":"常识判断","sec":"科技与生活","q":"以氢气替代焦炭作为还原剂炼铁，从源头减少碳排放的工艺称为（　）。","opts":["转炉吹炼","电炉短流程","氢冶金","球团焙烧"],"ans":"C","tag":"氢冶金","exp":"氢冶金用绿氢还原铁矿石，产物为水，是钢铁行业深度脱碳的主要技术路线之一。"},{"n":69,"part":"常识判断","sec":"科技与生活","q":"我国“沙戈荒”大型风电光伏基地主要分布在（　）。","opts":["东北平原耕地","东南沿海滩涂","西北荒漠、戈壁、荒漠化地区","西南喀斯特山区"],"ans":"C","tag":"沙戈荒基地","exp":"“沙戈荒”指沙漠、戈壁、荒漠地区，土地资源丰富、风光条件好，是大型新能源基地布局重点。"},{"n":70,"part":"常识判断","sec":"科技与生活","q":"我国“西电东送”工程的主要作用是（　）。","opts":["替代全国电网的配电网改造","把东部电力输送到西部矿区","把西部能源资源转化为电力输送到东部负荷中心","仅输送火电，不涉及水电和新能源"],"ans":"C","tag":"西电东送","exp":"西电东送依托特高压等通道，将西部水电、煤电、风光电力送往东部，优化全国能源资源配置。"},{"n":71,"part":"常识判断","sec":"科技与生活","q":"电动汽车在停驶时向电网反向送电、参与调峰的技术路线称为（　）。","opts":["OBC","BMS","V2G","PHEV"],"ans":"C","tag":"V2G","exp":"V2G 即车辆到电网，把动力电池作为分布式储能参与调峰调频；BMS 是电池管理系统。"},{"n":72,"part":"常识判断","sec":"科技与生活","q":"我国核能供热示范工程的意义在于（　）。","opts":["以核能制氢完全取代电解水制氢","用核能直接发电替代全部火电","利用核电机组抽汽为城市集中供暖，替代燃煤锅炉","把核废料转化为民用燃料"],"ans":"C","tag":"核能供热","exp":"核能供热把低品位抽汽用于城市供暖，可大幅降低供暖季煤炭消耗和碳排放，我国已在山东海阳等地投运。"},{"n":73,"part":"常识判断","sec":"人文历史","q":"流行于广东潮汕地区的英歌舞，其表演形式主要融合了（　）。","opts":["花鼓灯与皮影","评弹与昆曲唱腔","武术、舞蹈与戏曲脸谱","木偶与杂技"],"ans":"C","tag":"英歌舞","exp":"英歌舞取材于《水浒传》梁山好汉故事，融武术、舞蹈、戏剧于一体，2006 年列入首批国家级非物质文化遗产。"},{"n":74,"part":"常识判断","sec":"人文历史","q":"广东传统丝织品“香云纱”的独特工艺是（　）。","opts":["用矿物颜料手工绘制图案","以蚕丝与棉纱混纺织造后蜡染","用薯莨汁反复浸染并以河泥覆涂晒制","以植物靛蓝多次套染"],"ans":"C","tag":"香云纱","exp":"香云纱又称莨绸，用薯莨汁浸染、珠三角河泥覆涂、日晒而成，正面棕红、反面乌黑，是岭南特色染整技艺。"},{"n":75,"part":"常识判断","sec":"人文历史","q":"佛山祖庙供奉的主神是（　）。","opts":["关帝","妈祖","北帝（真武大帝）","城隍"],"ans":"C","tag":"佛山祖庙","exp":"佛山祖庙始建于北宋，供奉北帝，是岭南现存规模较大、保存较完整的庙宇建筑群，以三雕两塑著称。"},{"n":76,"part":"常识判断","sec":"人文历史","q":"广州南海神庙在古代的主要功能是（　）。","opts":["作为驻军的海防要塞","作为科举考试的场所","祭祀海神、祈佑海上贸易平安","作为皇家行宫"],"ans":"C","tag":"南海神庙","exp":"南海神庙又称波罗庙，是古代海上丝绸之路的重要史迹，历代海船出海前在此祭拜海神。"},{"n":77,"part":"常识判断","sec":"人文历史","q":"被周恩来总理誉为“中国巾帼英雄第一人”的岭南历史人物是（　）。","opts":["花木兰","文成公主","冼夫人","梁红玉"],"ans":"C","tag":"冼夫人","exp":"冼夫人是南朝至隋初岭南俚人首领，维护国家统一和民族团结，岭南多地建有冼太庙。"},{"n":78,"part":"常识判断","sec":"人文历史","q":"近代“诗界革命”的代表人物、著有《人境庐诗草》的广东人是（　）。","opts":["梁启超","康有为","黄遵宪","丘逢甲"],"ans":"C","tag":"黄遵宪","exp":"黄遵宪是梅州人，主张“我手写我口”，《人境庐诗草》为其代表作，是诗界革命旗帜性人物。"},{"n":79,"part":"常识判断","sec":"人文历史","q":"战国时期在秦国推行变法、确立军功爵制和废井田开阡陌的是（　）。","opts":["吴起","李悝","商鞅","申不害"],"ans":"C","tag":"商鞅变法","exp":"商鞅变法奖励耕战、推行县制、废井田开阡陌，为秦统一奠定制度基础；李悝在魏国、吴起在楚国有变法。"},{"n":80,"part":"常识判断","sec":"人文历史","q":"战国时期修建、至今仍发挥灌溉作用的都江堰，其主持修建者是（　）。","opts":["西门豹","郑国","李冰","史禄"],"ans":"C","tag":"都江堰","exp":"秦国蜀郡守李冰主持修建都江堰，以鱼嘴、飞沙堰、宝瓶口三大工程实现分水排沙灌溉。"},{"n":81,"part":"常识判断","sec":"人文历史","q":"世界上最早的纸币“交子”出现于（　）。","opts":["南宋临安","唐代长安","北宋四川地区","元代大都"],"ans":"C","tag":"交子","exp":"交子出现于北宋四川，最初由民间商户发行，后由官府设交子务管理，是世界货币史上的重要创新。"},{"n":82,"part":"常识判断","sec":"人文历史","q":"清朝在西南少数民族地区废除土司制度、改设流官的政策称为（　）。","opts":["更名田","摊丁入亩","改土归流","滋生人丁永不加赋"],"ans":"C","tag":"改土归流","exp":"改土归流始于明代、盛于清代雍正年间，以流官取代世袭土司，强化中央对西南地区的治理。"},{"n":83,"part":"常识判断","sec":"人文历史","q":"明成祖时期编纂、被称为中国古代最大类书的是（　）。","opts":["《古今图书集成》","《四库全书》","《永乐大典》","《太平御览》"],"ans":"C","tag":"永乐大典","exp":"《永乐大典》是类书，按韵目编排；《四库全书》是丛书，按经史子集编排，二者性质不同。"},{"n":84,"part":"常识判断","sec":"人文历史","q":"近代中国第一部系统介绍世界地理历史、提出“师夷长技以制夷”的著作是（　）。","opts":["《瀛寰志略》","《天演论》","《海国图志》","《劝学篇》"],"ans":"C","tag":"海国图志","exp":"魏源编撰《海国图志》，提出“师夷长技以制夷”，对洋务运动和日本明治维新均有影响。"},{"n":85,"part":"常识判断","sec":"地理国情","q":"我国四大海域中属于内海的是（　）。","opts":["东海","黄海","渤海","南海"],"ans":"C","tag":"渤海为内海","exp":"渤海被辽东半岛和山东半岛环抱，通过渤海海峡与黄海相连，是我国唯一的内海。"},{"n":86,"part":"常识判断","sec":"地理国情","q":"我国面积最大的岛屿和第二大岛依次是（　）。","opts":["台湾岛、崇明岛","海南岛、台湾岛","台湾岛、海南岛","海南岛、舟山岛"],"ans":"C","tag":"岛屿排序","exp":"台湾岛约 3.6 万平方公里居首，海南岛约 3.4 万平方公里居次，崇明岛是我国第三大岛。"},{"n":87,"part":"常识判断","sec":"地理国情","q":"桂林山水、云南石林所属的地貌类型是（　）。","opts":["丹霞地貌","雅丹地貌","喀斯特地貌","冰川地貌"],"ans":"C","tag":"喀斯特地貌","exp":"喀斯特地貌由可溶性岩石受流水溶蚀形成，峰林、溶洞、石林是典型形态，我国以西南地区最典型。"},{"n":88,"part":"常识判断","sec":"地理国情","q":"新疆罗布泊地区风蚀形成的垄槽相间地貌称为（　）。","opts":["火山地貌","丹霞地貌","黄土地貌","雅丹地貌"],"ans":"D","tag":"雅丹地貌","exp":"雅丹是干旱区风蚀地貌，表现为与主导风向平行的土墩与凹槽相间；“雅丹”源于维吾尔语。"},{"n":89,"part":"常识判断","sec":"地理国情","q":"被称为“中华水塔”、长江黄河澜沧江发源地的地区是（　）。","opts":["祁连山地","河西走廊","河套平原","三江源"],"ans":"D","tag":"三江源","exp":"三江源位于青海，是长江、黄河、澜沧江的发源地，是我国重要的水源涵养区和国家公园。"},{"n":90,"part":"常识判断","sec":"地理国情","q":"河西走廊位于（　）之间。","opts":["太行山与燕山","天山与昆仑山","秦岭与大巴山","祁连山与北山（合黎山、龙首山）"],"ans":"D","tag":"河西走廊","exp":"河西走廊是祁连山北麓的狭长地带，因位于黄河以西而得名，是古丝绸之路的重要通道。"},{"n":91,"part":"常识判断","sec":"地理国情","q":"我国 400 毫米年等降水量线大致是（　）。","opts":["热带与亚热带的分界线","湿润区与半湿润区的分界线","干旱区与极端干旱区的分界线","半湿润区与半干旱区的分界线"],"ans":"D","tag":"400 毫米等降水量线","exp":"800 毫米线是湿润与半湿润分界（秦岭—淮河），400 毫米线是半湿润与半干旱分界，也是农牧交错带。"},{"n":92,"part":"常识判断","sec":"地理国情","q":"我国气候类型中，海南岛、雷州半岛南部属于（　）。","opts":["热带草原气候","亚热带季风气候","温带季风气候","热带季风气候"],"ans":"D","tag":"热带季风气候","exp":"我国热带季风气候主要分布在海南岛、雷州半岛南部、台湾南部和云南南部，全年高温、分旱雨两季。"},{"n":93,"part":"常识判断","sec":"公文与管理","q":"机关负责人对来文提出办理意见后，交由承办部门具体办理的环节称为（　）。","opts":["催办","承办","拟办","批办"],"ans":"D","tag":"批办与承办","exp":"拟办是承办部门提出初步处理意见，批办是负责人签署意见，承办是按批办意见具体办理，催办是督促办理。"},{"n":94,"part":"常识判断","sec":"公文与管理","q":"公文的紧急程度分为（　）。","opts":["紧急、较急、一般","特急、急件、平件","加急、平急、普通","特急、加急"],"ans":"D","tag":"紧急程度","exp":"党的机关公文紧急程度为“特急”“加急”；行政机关电报分为“特提”“特急”“加急”“平急”，注意区分。"},{"n":95,"part":"常识判断","sec":"公文与管理","q":"公务员年度考核的结果分为（　）四个等次。","opts":["优秀、合格、基本合格、不合格","优秀、良好、合格、不合格","一等、二等、三等、四等","优秀、称职、基本称职、不称职"],"ans":"D","tag":"公务员考核等次","exp":"公务员法规定年度考核结果分为优秀、称职、基本称职、不称职四个等次，作为调整职务、工资的依据。"},{"n":96,"part":"常识判断","sec":"公文与管理","q":"在层级组织中，每个成员趋向于晋升到自己不能胜任的职位，这一现象称为（　）。","opts":["奥卡姆剃刀","帕金森定律","马太效应","彼得原理"],"ans":"D","tag":"彼得原理","exp":"彼得原理揭示晋升与胜任能力错配；帕金森定律讲的是机构膨胀、人浮于事。"},{"n":97,"part":"常识判断","sec":"公文与管理","q":"质量管理中“计划—执行—检查—处理”的循环称为（　）。","opts":["六西格玛 DMAIC","SWOT 分析","波士顿矩阵","PDCA 循环"],"ans":"D","tag":"PDCA","exp":"PDCA 由戴明推广，是持续改进的基本方法；DMAIC 是六西格玛的界定、测量、分析、改进、控制流程。"},{"n":98,"part":"常识判断","sec":"公文与管理","q":"公文核稿的重点不包括（　）。","opts":["审核文字表述和格式是否规范","审核行文方式是否恰当","审核内容是否符合法律法规和政策","核定公文密级和印发范围以外的干部任免事项"],"ans":"D","tag":"公文核稿","exp":"核稿重点是把关行文方式、内容合法性、文字格式、文种选用等，不涉及决定干部任免这类实体事项。"},{"n":99,"part":"常识判断","sec":"公文与管理","q":"关于会议纪要，下列表述正确的是（　）。","opts":["纪要只能由主持会议的领导个人签发并对外发布","纪要必须加盖发文机关印章方才有效","纪要与会议记录性质完全相同","纪要具有记载和传达会议议定事项的功能，属于法定公文文种"],"ans":"D","tag":"会议纪要","exp":"纪要属 15 种法定文种之一，传达议定事项、要求共同遵守；会议记录是原始记录，二者性质不同。"},{"n":100,"part":"常识判断","sec":"公文与管理","q":"机构编制管理中的“三定”是指（　）。","opts":["定目标、定考核、定奖惩","定人员、定经费、定岗位","定职责、定权限、定流程","定职能、定机构、定编制"],"ans":"D","tag":"三定","exp":"“三定”规定即定职能、定机构、定编制，是机构编制管理的基础性制度安排。"},{"n":101,"part":"政治理论","sec":"最新时政","q":"关于新时代卫生与健康工作方针，下列表述错误的是（　）。","opts":["以基层为重点","以改革创新为动力","以治疗为中心","中西医并重"],"ans":"C","tag":"C5-05 卫生与健康工作方针","exp":"2016 年中央明确的新时代卫生与健康工作方针是：以基层为重点，以改革创新为动力，预防为主，中西医并重，把健康融入所有政策，人民共建共享。“以治疗为中心”与“预防为主”正相反。"},{"n":102,"part":"政治理论","sec":"最新时政","q":"2026 年 8 月 1 日第 15 期《求是》发表《加快建设健康中国》，文中强调的基本医疗卫生事业属性是（　）。","opts":["公益性","营利性","竞争性","产业化"],"ans":"A","tag":"C5-04 健康中国道路","exp":"文章强调坚持人民至上、生命至上，坚持健康优先发展战略，坚持基本医疗卫生事业的公益性；“营利性”是讲义标注的错误方向。"},{"n":103,"part":"政治理论","sec":"最新时政","q":"关于 2026 年 8 月的纪念活动，下列表述错误的是（　）。","opts":["纪念江泽民同志诞辰 100 周年大会在北京隆重举行","2026 年是江泽民同志诞辰 100 周年","纪念大会在上海举行","2026 年 8 月为纪念活动举办时间"],"ans":"C","tag":"C5-01 江泽民诞辰百年","exp":"纪念江泽民同志诞辰 100 周年大会 2026 年 8 月在京隆重举行，地点是北京不是上海。孙中山诞辰 160 周年是 2026 年另一重要纪念，两者不要混。"},{"n":104,"part":"政治理论","sec":"最新时政","q":"关于 2026 年 8 月西藏日喀则市吉隆县泥石流灾害，下列表述错误的是（　）。","opts":["灾害发生于 8 月 26 日 10 时 30 分许","起因是尼泊尔一侧发生泥石流造成吉隆口岸重大人员伤亡失联","8 月 28 日中共中央政治局召开会议研究部署抢险救援","起因是西藏一侧发生特大暴雨引发山体滑坡"],"ans":"D","tag":"C5-03 吉隆泥石流","exp":"灾害起因是尼泊尔一侧发生泥石流，冲击吉隆口岸；8 月 28 日中央政治局召开会议研究部署抢险救援，不是国务院常务会议。"},{"n":105,"part":"政治理论","sec":"最新时政","q":"按照《2025 年我国卫生健康事业发展统计公报》，下列表述错误的是（　）。","opts":["2025 年末人均预期寿命为 79.25 岁","社区卫生服务中心次均门诊费用 150.1 元、同比降 11.7%","乡镇卫生院次均门诊费用 79.4 元、同比降 9.4%","2025 年末人均预期寿命已突破 80 岁"],"ans":"D","tag":"C5-14 卫健统计公报","exp":"公报数据为 79.25 岁，尚未突破 80 岁；两个次均费用数字与降幅要成对记：社区 150.1 元降 11.7%，乡镇 79.4 元降 9.4%。"},{"n":106,"part":"政治理论","sec":"最新时政","q":"关于做好防灾减灾救灾工作必须坚持的原则，下列不属于其内容的是（　）。","opts":["坚持救治为主","坚持预防为主","坚持系统观念","坚持社会共治"],"ans":"A","tag":"C18-04 防灾七个坚持","exp":"第 16 期《求是》提出坚持党的全面领导、人民至上生命至上、尊重自然规律、预防为主、改革创新、系统观念、社会共治，“救治为主”与“预防为主”正好相反。"},{"n":107,"part":"政治理论","sec":"最新时政","q":"关于防灾减灾救灾，下列表述错误的是（　）。","opts":["基层是抵御自然灾害的第一线","要坚持源头管控，将安全韧性要求贯穿国土空间规划及各类建设规划","要坚持过程控制，以高速高效为第一要求","要有效规避自然灾害风险"],"ans":"C","tag":"C18-04 源头管控","exp":"原文是“坚持源头管控”，把安全韧性要求前移到规划和建设环节；讲义把“过程控制”“高速高效要求”标注为错误方向。"},{"n":108,"part":"政治理论","sec":"最新时政","q":"关于《中华人民共和国农业法》，下列表述错误的是（　）。","opts":["自 2027 年 1 月 1 日起施行","坚持农业农村优先发展，把农业放在发展国民经济的首位","统筹发展科技农业、绿色农业、质量农业、品牌农业","自 2026 年 1 月 1 日起施行"],"ans":"D","tag":"C18-03 农业法施行与定位","exp":"农业法自 2027 年 1 月 1 日起施行，不是 2026 年；同时明确农业农村优先发展，把农业放在发展国民经济的首位。"},{"n":109,"part":"政治理论","sec":"最新时政","q":"按照《农业法》，我国国家粮食安全战略的完整表述是（　）。","opts":["以我为主、立足国内、确保产能、适度进口、科技支撑","以进口为主、立足国际、确保供给、适度自给、市场调节","以我为主、扩大进口、确保产量、适度储备、科技支撑","立足国内、全面自给、确保产能、限制进口、政策扶持"],"ans":"A","tag":"C18-03 粮食安全战略","exp":"原文为“以我为主、立足国内、确保产能、适度进口、科技支撑”，坚持藏粮于地、藏粮于技，确保谷物基本自给、口粮绝对安全；“扩大进口”是讲义标注的错误方向。"},{"n":110,"part":"政治理论","sec":"最新时政","q":"关于《全民医疗保障“十五五”规划》对基金预算管理和结算的要求，下列表述错误的是（　）。","opts":["坚持以收定支、收支平衡，科学编制预算，增强预算刚性约束","全面扩大即时结算范围，协同推进直接结算、同步结算","深入实施全民参保计划，巩固拓展基本医疗保险覆盖面","坚持以收定支、弹性平衡，弱化预算约束"],"ans":"D","tag":"C18-02 医保收支原则","exp":"原文是“以收定支、收支平衡，增强预算刚性约束”，“弹性平衡、弱化约束”是讲义标注的错误方向；即时结算范围是“全面扩大”而非“适当缩小”。"},{"n":111,"part":"政治理论","sec":"马克思主义基本原理","q":"马克思主义哲学与具体科学的关系是（　）。","opts":["哲学以具体科学为基础，又为具体科学提供世界观和方法论指导","哲学可以代替具体科学的研究","哲学与具体科学互不相关","具体科学是哲学的分支学科"],"ans":"A","tag":"哲学与具体科学","exp":"哲学揭示世界普遍规律，具体科学研究特殊规律；哲学依赖具体科学成果，又对具体科学有指导作用，不能相互替代。"},{"n":112,"part":"政治理论","sec":"马克思主义基本原理","q":"把世界的本原归结为某种主观精神（如“心”“感觉”）的观点属于（　）。","opts":["主观唯心主义","客观唯心主义","机械唯物主义","朴素唯物主义"],"ans":"A","tag":"唯心主义两种形式","exp":"主观唯心主义以人的主观精神为本原；客观唯心主义以“绝对精神”“理”等独立于人之外的精神为本原。"},{"n":113,"part":"政治理论","sec":"马克思主义基本原理","q":"辩证唯物主义认为，时间和空间是（　）。","opts":["运动着的物质的存在形式","人类主观的先验形式","独立于物质之外的绝对容器","物质运动的根本动力"],"ans":"A","tag":"时空观","exp":"时间和空间是运动着的物质的存在形式，具有客观性；把时空看作先验形式是唯心主义观点。"},{"n":114,"part":"政治理论","sec":"马克思主义基本原理","q":"下列不属于意识能动作用表现的是（　）。","opts":["意识可以直接创造物质财富","意识活动具有目的性和计划性","意识活动具有主动创造性","意识对人的生理活动具有调节控制作用"],"ans":"A","tag":"意识能动作用","exp":"意识不能直接创造物质，必须通过实践才能改造世界；意识的能动性表现为目的性、创造性、指导实践和调节生理活动。"},{"n":115,"part":"政治理论","sec":"马克思主义基本原理","q":"“城门失火，殃及池鱼”蕴含的哲理是（　）。","opts":["事物之间的联系是有条件的、普遍的","事物的发展是前进性与曲折性的统一","量变必然引起质变","矛盾双方在一定条件下相互转化"],"ans":"A","tag":"联系的条件性","exp":"城门与池鱼通过“救火取水”这一条件建立联系，说明联系具有普遍性，但具体联系都是有条件的。"},{"n":116,"part":"政治理论","sec":"马克思主义基本原理","q":"系统优化的方法要求我们（　）。","opts":["着眼于事物的整体性，注重结构优化和要素协同","把整体拆成部分逐一处理，不必考虑相互关联","只关注关键要素，忽略其他要素","用要素的功能简单相加代替整体功能"],"ans":"A","tag":"系统优化","exp":"系统优化强调整体性、有序性和内部结构优化趋向，追求整体功能大于部分功能之和。"},{"n":117,"part":"政治理论","sec":"马克思主义基本原理","q":"事物量变到质变的飞跃形式，可区分为（　）。","opts":["爆发式飞跃和非爆发式飞跃","前进式飞跃和倒退式飞跃","内部飞跃和外部飞跃","自然飞跃和社会飞跃"],"ans":"A","tag":"质变飞跃形式","exp":"质变通过飞跃实现，形式分为爆发式（如社会革命）和非爆发式（如语言渐变、物种演化），由事物内部矛盾性质决定。"},{"n":118,"part":"政治理论","sec":"马克思主义基本原理","q":"“前途是光明的，道路是曲折的”，这一判断的哲学依据是（　）。","opts":["事物发展是前进性与曲折性的统一","事物发展是周而复始的循环","事物发展是直线上升的","事物发展完全由偶然性支配"],"ans":"A","tag":"前进性与曲折性","exp":"否定之否定规律揭示发展总趋势是前进上升，道路则表现为曲折，是新事物的成长过程。"},{"n":119,"part":"政治理论","sec":"马克思主义基本原理","q":"认为人的认识先于经验、与生俱来的观点属于（　）。","opts":["唯心主义先验论","唯物主义反映论","不可知论","经验一元论"],"ans":"A","tag":"反映论与先验论","exp":"唯物主义反映论主张认识是对客观世界的反映；先验论主张认识先天具有，是唯心主义认识论的根本错误。"},{"n":120,"part":"政治理论","sec":"马克思主义基本原理","q":"实践是检验真理的唯一标准，但这一标准既是确定的又是不确定的，原因在于（　）。","opts":["一定历史阶段的实践不能完全证实或驳倒一切认识，实践本身也在发展","实践有时无法检验任何认识","真理不需要实践检验","检验标准可以随人的意愿改变"],"ans":"A","tag":"实践标准的确定性","exp":"确定性指最终只能由实践检验、实践最终能检验一切认识；不确定性指具体实践的局限性和历史性。"},{"n":121,"part":"政治理论","sec":"马克思主义基本原理","q":"真理与价值的关系是（　）。","opts":["真理原则要求尊重客观规律，价值原则要求满足主体需要，二者在实践中统一","真理与价值互相排斥，不可兼顾","价值判断可以取代真理判断","凡有用的就是真理"],"ans":"A","tag":"真理与价值","exp":"真理尺度与价值尺度是人类活动的两个尺度，成功的实践是二者的统一；“有用即真理”是实用主义真理观。"},{"n":122,"part":"政治理论","sec":"马克思主义基本原理","q":"社会形态更替的统一性表现在（　）。","opts":["人类社会总体上都经历由低级向高级的发展序列","每个国家都必须依次经历完全相同的社会形态","社会形态更替没有任何规律可循","社会形态可以跳过生产力发展阶段"],"ans":"A","tag":"社会形态统一性与多样性","exp":"统一性指五种社会形态依次更替的总趋势，多样性指不同民族国家可跨越某些阶段，二者是统一的。"},{"n":123,"part":"政治理论","sec":"马克思主义基本原理","q":"马克思主义关于人的全面发展学说认为，人的全面发展的实质是（　）。","opts":["人的体力和智力获得充分自由的发展和运用","人只发展自己的专业特长","人摆脱一切社会关系的约束","人获得尽可能多的物质财富"],"ans":"A","tag":"人的全面发展","exp":"人的全面发展指德智体美劳等方面充分自由发展，其实现以消灭私有制、教育与生产劳动相结合为条件。"},{"n":124,"part":"政治理论","sec":"马克思主义基本原理","q":"在群众、阶级、政党、领袖的关系中，正确的理解是（　）。","opts":["群众是划分阶级的基础，阶级通常由政党领导，政党由领袖集团主持","领袖决定一切，群众只是被动的执行者","政党可以脱离阶级独立存在","阶级利益与群众利益始终对立"],"ans":"A","tag":"群众政党领袖关系","exp":"列宁指出群众是划分为阶级的，阶级通常由政党领导，政党由比较稳定的领袖集团主持，四者是辩证统一关系。"},{"n":125,"part":"政治理论","sec":"马克思主义基本原理","q":"单位商品的价值量与生产该商品的劳动生产率的关系是（　）。","opts":["劳动生产率提高，单位商品价值量降低，价值总量不变","劳动生产率提高，单位商品价值量提高","劳动生产率与单位商品价值量同方向变动","劳动生产率变化不影响价值量"],"ans":"A","tag":"价值量与劳动生产率","exp":"社会劳动生产率与单位商品价值量成反比，与同一时间创造的价值总量无关；个别劳动生产率提高则使个别价值低于社会价值。"},{"n":126,"part":"政治理论","sec":"马克思主义基本原理","q":"流通中所需要的货币量取决于（　）。","opts":["待售商品价格总额与货币流通速度","待售商品数量与国家人口","银行准备金率与利率","财政支出规模与税率"],"ans":"A","tag":"货币流通规律","exp":"货币流通规律：流通中所需货币量＝待售商品价格总额÷同一单位货币流通速度。纸币发行超过需要量会引起贬值。"},{"n":127,"part":"政治理论","sec":"马克思主义基本原理","q":"随着部门之间竞争和资本转移，利润率趋于平均化，商品价值转化为（　）。","opts":["生产价格","垄断价格","市场价格","成本价格"],"ans":"A","tag":"生产价格","exp":"平均利润率形成后，价值转化为生产价格（成本价格＋平均利润），市场价格围绕生产价格波动。"},{"n":128,"part":"政治理论","sec":"马克思主义基本原理","q":"借贷资本家贷出货币资本所获得的利息，其本质是（　）。","opts":["平均利润的一部分，来源于产业工人创造的剩余价值","货币自身产生的价值","对借贷资本家勤劳经营的报酬","流通领域中贱买贵卖的结果"],"ans":"A","tag":"借贷资本与利息","exp":"利息是职能资本家让渡给借贷资本家的一部分平均利润，本质仍是剩余价值的转化形式。"},{"n":129,"part":"政治理论","sec":"马克思主义基本原理","q":"股票价格的高低主要取决于（　）。","opts":["股息与利息率的对比","股票的面额","公司的注册资本","发行时的政策规定"],"ans":"A","tag":"股票价格","exp":"股票价格＝股息÷利息率，与股息成正比、与利息率成反比，此外还受供求和预期影响。"},{"n":130,"part":"政治理论","sec":"马克思主义基本原理","q":"金融资本是由（　）融合而成的。","opts":["工业垄断资本与银行垄断资本","商业资本与借贷资本","国家财政与银行信贷","产业资本与商业资本"],"ans":"A","tag":"金融资本","exp":"金融资本是工业垄断资本和银行垄断资本融合形成的，在此基础上产生金融寡头，通过“参与制”实现经济统治。"},{"n":131,"part":"政治理论","sec":"毛泽东思想","q":"毛泽东在《中国社会各阶级的分析》中首先解决的问题是（　）。","opts":["分清敌友","土地分配","武装斗争形式","党的建设方法"],"ans":"A","tag":"《中国社会各阶级的分析》","exp":"该文开篇即提出“谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题”，解决革命领导权和同盟军问题。"},{"n":132,"part":"政治理论","sec":"毛泽东思想","q":"“工农武装割据”思想的主要内容是（　）。","opts":["武装斗争、土地革命、根据地建设三者结合","城市暴动、工人罢工、地下工作三者结合","统一战线、武装斗争、党的建设三者结合","减租减息、生产自救、军民联防三者结合"],"ans":"A","tag":"工农武装割据","exp":"工农武装割据以土地革命为中心内容、武装斗争为主要形式、农村根据地为战略阵地，三者互为条件。"},{"n":133,"part":"政治理论","sec":"毛泽东思想","q":"抗日民族统一战线的策略总方针是（　）。","opts":["依靠贫农、联合中农、限制富农","发展进步势力、争取中间势力、孤立顽固势力","团结一切可以团结的力量，不区分左中右","以斗争求团结，放弃必要妥协"],"ans":"B","tag":"抗日统一战线策略","exp":"该方针由毛泽东在抗战时期提出，进步势力是基础，中间势力是关键，对顽固势力实行又联合又斗争。"},{"n":134,"part":"政治理论","sec":"毛泽东思想","q":"毛泽东在《〈共产党人〉发刊词》中提出的“伟大的工程”指的是（　）。","opts":["建设一支现代化正规化的革命军队","建设一个全国范围的、广大群众性的、思想上政治上组织上完全巩固的党","建立抗日民族统一战线","开展大生产运动"],"ans":"B","tag":"党的建设伟大工程","exp":"1939 年《〈共产党人〉发刊词》把党的建设称为“伟大的工程”，并把统一战线、武装斗争、党的建设称为三大法宝。"},{"n":135,"part":"政治理论","sec":"毛泽东思想","q":"中国共产党在长期革命斗争中形成的“生命线”是指（　）。","opts":["经济建设","思想政治工作","军事斗争","组织建设"],"ans":"B","tag":"思想政治工作生命线","exp":"思想政治工作是一切工作的生命线，是经济工作和其他一切工作的可靠保证，这是我们党的重要政治优势。"},{"n":136,"part":"政治理论","sec":"毛泽东思想","q":"毛泽东强调的中国革命和建设的基本立足点是（　）。","opts":["争取外援、依赖国际","独立自主、自力更生","对外开放、引进外资","分工协作、区域联合"],"ans":"B","tag":"独立自主自力更生","exp":"独立自主、自力更生是毛泽东思想活的灵魂之一，强调从中国实际出发，主要依靠本国力量进行革命和建设。"},{"n":137,"part":"政治理论","sec":"毛泽东思想","q":"中国共产党处理与民主党派关系的基本方针是（　）。","opts":["团结、教育、改造","长期共存、互相监督","又团结又斗争","民主协商、自我教育"],"ans":"B","tag":"长期共存互相监督","exp":"1956 年毛泽东提出“长期共存、互相监督”，1982 年党的十二大增加“肝胆相照、荣辱与共”，形成十六字方针。"},{"n":138,"part":"政治理论","sec":"毛泽东思想","q":"我国解决民族问题的基本政治制度是（　）。","opts":["民族共治制度","民族区域自治制度","联邦制","民族自治共和国制度"],"ans":"B","tag":"民族区域自治","exp":"民族区域自治是在国家统一领导下，各少数民族聚居地方实行区域自治、设立自治机关、行使自治权，是我国的一项基本政治制度。"},{"n":139,"part":"政治理论","sec":"毛泽东思想","q":"我国农业社会主义改造采取的原则和步骤是（　）。","opts":["强制入社、统一经营，一步到位建立高级社","自愿互利、典型示范、国家帮助，由互助组到初级社再到高级社","先机械化后合作化，机械化为前提","保留土地私有，只实行生产合作"],"ans":"B","tag":"农业合作化","exp":"农业改造遵循自愿互利、典型示范、国家帮助的原则，采取互助组—初级社—高级社三步走的过渡形式。"},{"n":140,"part":"政治理论","sec":"毛泽东思想","q":"毛泽东在《论十大关系》中重点讨论的前三对关系是（　）。","opts":["国家、生产单位和生产者个人的关系，中央和地方的关系，汉族和少数民族的关系","重工业和轻工业、农业的关系，沿海工业和内地工业的关系，经济建设和国防建设的关系","党和非党的关系，革命和反革命的关系，是非关系","中国和外国的关系，城市和乡村的关系，工业和农业的关系"],"ans":"B","tag":"《论十大关系》","exp":"《论十大关系》以重工业与轻工业农业、沿海与内地工业、经济与国防建设三对关系开篇，核心是调动一切积极因素为社会主义事业服务。"},{"n":141,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"邓小平提出的教育“三个面向”是（　）。","opts":["面向市场、面向世界、面向未来","面向现代化、面向世界、面向未来","面向现代化、面向农村、面向基层","面向科技、面向经济、面向社会"],"ans":"B","tag":"三个面向","exp":"1983 年邓小平为景山学校题词“教育要面向现代化，面向世界，面向未来”，成为教育改革发展的指导方针。"},{"n":142,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"“没有民主就没有社会主义，就没有社会主义的现代化”这一论断强调的是（　）。","opts":["民主可以先于经济建设","民主是社会主义的本质要求和内在属性","民主就是实行多党制","民主与法治相互对立"],"ans":"B","tag":"社会主义民主","exp":"邓小平这一论断把民主提到社会主义本质的高度，同时强调民主必须与法制相结合，制度化、法律化。"},{"n":143,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"我国社会主义初级阶段的基本分配制度是（　）。","opts":["按需分配为主体","按劳分配为主体、多种分配方式并存","按生产要素分配为主体","平均分配与按劳分配并重"],"ans":"B","tag":"分配制度","exp":"党的十五大明确坚持按劳分配为主体、多种分配方式并存的制度，把按劳分配和按生产要素分配结合起来。"},{"n":144,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"“三个代表”重要思想的集中概括是中国共产党必须始终代表（　）。","opts":["中国先进生产力、中国先进文化、中国工人阶级","中国先进生产力的发展要求、中国先进文化的前进方向、中国最广大人民的根本利益","先进生产方式、先进意识形态、全体人民利益","经济发展要求、政治文明方向、社会和谐目标"],"ans":"B","tag":"三个代表内容","exp":"三句话各有侧重：生产力是物质基础，先进文化是精神旗帜，最广大人民根本利益是出发点和落脚点。"},{"n":145,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"“三个代表”重要思想被称为党的（　）。","opts":["立国之本、强国之路、富民之道","立党之本、执政之基、力量之源","执政之要、兴国之魂、强军之基","生存之本、发展之基、胜利之源"],"ans":"B","tag":"立党之本","exp":"“立党之本、执政之基、力量之源”是“三个代表”重要思想的定位表述，注意与“一个中心两个基本点”的表述区分。"},{"n":146,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"科学发展观的科学内涵是（　）。","opts":["第一要义是以人为本，核心是发展，基本要求是统筹兼顾，根本方法是全面协调","第一要义是发展，核心是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾","主题是发展，主线是转变方式，动力是改革，目标是小康","以经济建设为中心，以改革开放为动力，以共同富裕为目标"],"ans":"B","tag":"科学发展观内涵","exp":"四句话位置固定：第一要义—发展，核心—以人为本，基本要求—全面协调可持续，根本方法—统筹兼顾。"},{"n":147,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"2005 年党的十六届五中全会提出的社会主义新农村建设总要求是（　）。","opts":["生产发展、生活富裕、乡风文明、村容整洁、管理科学","生产发展、生活宽裕、乡风文明、村容整洁、管理民主","产业兴旺、生态宜居、乡风文明、治理有效、生活富裕","生产发展、共同富裕、乡风文明、村容整洁、民主管理"],"ans":"B","tag":"社会主义新农村","exp":"二十字总要求为生产发展、生活宽裕、乡风文明、村容整洁、管理民主；乡村振兴二十字方针则是产业兴旺、生态宜居、乡风文明、治理有效、生活富裕。"},{"n":148,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"2006 年全国科技大会提出到 2020 年使我国进入（　）行列。","opts":["世界科技强国","创新型国家","制造强国","人才强国"],"ans":"B","tag":"创新型国家","exp":"2006 年国家提出自主创新、建设创新型国家，目标是到 2020 年进入创新型国家行列；2035 年目标是建成科技强国。"},{"n":149,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"“两型社会”指的是（　）。","opts":["学习型社会、创新型社会","资源节约型社会、环境友好型社会","节约型社会、和谐型社会","法治型社会、服务型社会"],"ans":"B","tag":"两型社会","exp":"“两型社会”即资源节约型、环境友好型社会，是科学发展观在生态文明建设方面的具体目标。"},{"n":150,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"社会主义核心价值体系的基本内容不包括（　）。","opts":["马克思主义指导思想","社会主义荣辱观以外的个人主义价值观","中国特色社会主义共同理想","以爱国主义为核心的民族精神和以改革创新为核心的时代精神"],"ans":"B","tag":"核心价值体系","exp":"核心价值体系包括马克思主义指导思想、中国特色社会主义共同理想、民族精神和时代精神、社会主义荣辱观四方面，个人主义价值观不在其中。"},{"n":151,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"习近平指出，文化自信是（　）的自信。","opts":["更基本、更深远、更持久","更基础、更广泛、更深厚","更基础、更持久、更深刻","更广泛、更深厚、更持久"],"ans":"B","tag":"习思想·文化自信","exp":"文化自信是更基础、更广泛、更深厚的自信，是更基本、更深沉、更持久的力量。两个表述不要混。"},{"n":152,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"关于“第二个结合”，下列表述正确的是（　）。","opts":["是对“第一个结合”的替代","是又一次的思想解放，让我们能够在更广阔的文化空间中充分运用中华优秀传统文化的宝贵资源","是简单地把传统文化搬用到现实中","只涉及文化领域，与经济政治无关"],"ans":"B","tag":"习思想·第二个结合","exp":"“第二个结合”是马克思主义基本原理同中华优秀传统文化相结合，是又一次思想解放，拓展了中国特色社会主义道路的文化根基。"},{"n":153,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"习近平用“明体达用、体用贯通”概括习近平文化理论的特点，其中“体”指的是（　）。","opts":["具体的文化工作举措","文化理论的根本立场、核心观点和方法","文化产业的经济效益","对外传播的话语方式"],"ans":"B","tag":"习思想·明体达用","exp":"“明体”指明确文化理论的根本立场、核心观点和方法，“达用”指把理论转化为实践举措，体用贯通即理论与实践统一。"},{"n":154,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"宣传思想文化工作被概括为“三个事关”，即事关党的前途命运、事关国家长治久安、事关（　）。","opts":["经济发展速度","民族凝聚力和向心力","国际话语权","文化产业发展"],"ans":"B","tag":"习思想·三个事关","exp":"“三个事关”为事关党的前途命运、事关国家长治久安、事关民族凝聚力和向心力，是宣传思想文化工作的战略定位。"},{"n":155,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"宣传思想文化工作的“七个着力”中，居于首位的是（　）。","opts":["着力培育和践行社会主义核心价值观","着力加强党对宣传思想文化工作的全面领导","着力提升新闻舆论传播力引导力影响力公信力","着力加强国际传播能力建设"],"ans":"B","tag":"习思想·七个着力","exp":"“七个着力”以加强党的全面领导打头，其余依次为意识形态、核心价值观、新闻舆论、赓续文脉、文化事业产业、国际传播。"},{"n":156,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"我国文艺工作的“二为”方向是（　）。","opts":["为经济建设服务、为政治建设服务","为人民服务、为社会主义服务","为市场服务、为群众服务","为现代化服务、为世界服务"],"ans":"B","tag":"习思想·二为方向","exp":"“二为”方向与“双百”方针（百花齐放、百家争鸣）配套，是党领导文艺工作的基本方针。"},{"n":157,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"社会主义文艺的根本立场是（　）。","opts":["以市场为导向的创作导向","以人民为中心的创作导向","以评奖为导向的创作导向","以技术为导向的创作导向"],"ans":"B","tag":"习思想·创作导向","exp":"社会主义文艺是人民的文艺，必须坚持以人民为中心的创作导向，把满足人民精神文化需求作为出发点和落脚点。"},{"n":158,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"新时代文物工作要求可概括为“保护第一、加强管理、挖掘价值、有效利用、（　）”。","opts":["让文物进市场","让文物走出去","让文物活起来","让文物数字化"],"ans":"C","tag":"习思想·文物工作","exp":"十六字要求为保护第一、加强管理、挖掘价值、有效利用、让文物活起来，强调保护优先、合理利用。"},{"n":159,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"“文化主体性”的集中体现是（　）。","opts":["文化遗产的数量优势","文化产业的规模优势","中国共产党、中国人民的文化自信","对外文化贸易的顺差"],"ans":"C","tag":"习思想·文化主体性","exp":"有了文化主体性，就有了文化意义上坚定的自我，文化自信就有了根本依托，其集中体现是党领导人民的文化自信。"},{"n":160,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"“第二个结合”能够实现的前提是（　）。","opts":["两者互不干涉","两者完全相同","马克思主义与中华优秀传统文化彼此契合","以传统文化取代马克思主义"],"ans":"C","tag":"习思想·彼此契合","exp":"“结合”的前提是彼此契合，结果是互相成就；马克思主义激活了中华文明的现代力量，中华优秀传统文化充实了马克思主义的文化生命。"},{"n":161,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"“两个巩固”指的是巩固马克思主义在意识形态领域的指导地位，巩固（　）。","opts":["基层党组织的战斗堡垒作用","公有制经济的主体地位","全党全国人民团结奋斗的共同思想基础","中华民族的文化遗产"],"ans":"C","tag":"习思想·两个巩固","exp":"“两个巩固”是宣传思想工作的根本任务，前者管方向，后者管凝聚。"},{"n":162,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"意识形态工作责任制的要求是（　）。","opts":["集体负责、无人负责","属地管理、分级负责","谁主管谁负责、谁主办谁负责","上级主管、下级执行"],"ans":"C","tag":"习思想·意识形态责任制","exp":"意识形态工作实行责任制，党委（党组）负主体责任，党委书记是第一责任人，做到守土有责、守土负责、守土尽责。"},{"n":163,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"网络综合治理体系的基本要求是（　）。","opts":["行业自律为主、政府监管为辅","技术管网、行政办网、实名上网","依法管网、依法办网、依法上网","以平台自治替代法律监管"],"ans":"C","tag":"习思想·网络综合治理","exp":"网络综合治理坚持系统治理、依法治理、综合治理、源头治理，形成党委领导、政府管理、企业履责、社会监督、网民自律的格局。"},{"n":164,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"新时代文明实践中心的首要任务是（　）。","opts":["开展商业活动","发展文化产业","学习传播科学理论","组织文艺演出"],"ans":"C","tag":"习思想·文明实践中心","exp":"新时代文明实践中心以学习传播科学理论为首要任务，同时开展志愿服务、移风易俗等群众性活动。"},{"n":165,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"加强国际传播能力建设的核心要求是（　）。","opts":["增加外语类媒体数量","扩大对外文化产品出口规模","讲好中国故事、传播好中国声音，展示真实、立体、全面的中国","以宣传口径统一对外表达"],"ans":"C","tag":"习思想·国际传播","exp":"国际传播能力建设重在讲好中国故事，提升话语权和影响力，构建中国话语和中国叙事体系。"},{"n":166,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"文明交流互鉴主张“以文明交流超越文明隔阂、以文明互鉴超越文明冲突、（　）”。","opts":["以文明输出超越文明封闭","以文明融合超越文明差异","以文明共存超越文明优越","以文明竞争超越文明合作"],"ans":"C","tag":"习思想·文明交流互鉴","exp":"三句话构成文明观的核心：交流超越隔阂、互鉴超越冲突、共存超越优越。"},{"n":167,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"建设中华民族现代文明，其根本途径是（　）。","opts":["依靠恢复传统礼制实现","通过文化产业化实现","在推进中国式现代化进程中建设","通过引进外来文明实现"],"ans":"C","tag":"习思想·中华民族现代文明","exp":"建设中华民族现代文明是新时代新的文化使命，必须在推进中国式现代化进程中，坚持“两个结合”来创造。"},{"n":168,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"推动文化事业和文化产业发展，要把握的原则是（　）。","opts":["只讲社会效益，不讲经济效益","把经济效益放在首位，兼顾社会效益","把社会效益放在首位，社会效益和经济效益相统一","由市场完全决定文化资源配置"],"ans":"C","tag":"习思想·两个效益","exp":"文化产品具有意识形态属性，必须把社会效益放在首位，同时实现社会效益和经济效益相统一。"},{"n":169,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"新质生产力的形成，主要靠“三要素”的跃升，即技术革命性突破、生产要素创新性配置和（　）。","opts":["劳动力数量增长","资本大规模投入","产业深度转型升级","土地资源扩张"],"ans":"C","tag":"习思想·新质生产力","exp":"新质生产力以技术革命性突破、生产要素创新性配置、产业深度转型升级为形成路径，特点是高科技、高效能、高质量。"},{"n":170,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"“两个毫不动摇”是指毫不动摇巩固和发展公有制经济，毫不动摇（　）。","opts":["限制外资进入关键领域","扩大国有经济比重","鼓励、支持、引导非公有制经济发展","推行全面私有化"],"ans":"C","tag":"习思想·两个毫不动摇","exp":"“两个毫不动摇”是基本经济制度的重要内容，公有制经济和非公有制经济都是社会主义市场经济的重要组成部分。"},{"n":171,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"共同富裕在社会主义发展史上的定位是（　）。","opts":["单纯的收入分配政策","社会主义初级阶段的阶段性目标","社会主义的本质要求，中国式现代化的重要特征","市场经济自然演化的结果"],"ans":"C","tag":"习思想·共同富裕","exp":"共同富裕是社会主义的本质要求，是中国式现代化的重要特征，要分阶段促进，不是同步富裕、同等富裕。"},{"n":172,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"全过程人民民主的特点可概括为（　）。","opts":["最规范、最严格、最统一","最直接、最简便、最经济","最广泛、最真实、最管用","最自由、最多元、最灵活"],"ans":"C","tag":"习思想·全过程人民民主","exp":"全过程人民民主是全链条、全方位、全覆盖的民主，特点是最广泛、最真实、最管用。"},{"n":173,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"法治政府建设在全面依法治国中的地位是（　）。","opts":["可有可无的组成部分","辅助性环节","重点任务和主体工程","仅涉及行政执法环节"],"ans":"C","tag":"习思想·法治政府","exp":"法治政府建设是全面依法治国的重点任务和主体工程，要率先突破；法治社会是基础工程。"},{"n":174,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"总体国家安全观以（　）为宗旨。","opts":["经济安全","政治安全","人民安全","军事安全"],"ans":"C","tag":"习思想·总体国家安全观","exp":"总体国家安全观以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事科技文化社会安全为保障、以促进国际安全为依托。"},{"n":175,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"推动构建人类命运共同体，要建设“五个世界”，其中包括持久和平、普遍安全、共同繁荣、开放包容和（　）。","opts":["公平正义","自由平等","清洁美丽","和谐稳定"],"ans":"C","tag":"习思想·五个世界","exp":"“五个世界”为持久和平、普遍安全、共同繁荣、开放包容、清洁美丽，分别对应政治、安全、经济、文化、生态五个维度。"},{"n":176,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"共建“一带一路”坚持的原则是（　）。","opts":["开放包容、互学互鉴","互利共赢、共同发展","共商共建共享","平等自愿、协商一致"],"ans":"C","tag":"习思想·一带一路","exp":"共商共建共享是“一带一路”的原则，互利共赢是目标，开放包容、互学互鉴是理念内涵，注意区分。"},{"n":177,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"我国提出的三大全球倡议是（　）。","opts":["全球安全倡议、全球治理倡议、全球合作倡议","全球发展倡议、全球治理倡议、全球文明倡议","全球发展倡议、全球安全倡议、全球文明倡议","全球发展倡议、全球安全倡议、全球生态倡议"],"ans":"C","tag":"习思想·三大全球倡议","exp":"三大倡议依次为发展（2021）、安全（2022）、文明（2023）；全球治理倡议是 2025 年提出的另一重要倡议。"},{"n":178,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"党在新时代的强军目标是（　）。","opts":["建设世界一流海军","建设一支规模化、机械化、信息化的军队","建设一支听党指挥、能打胜仗、作风优良的人民军队","实现军队全面职业化"],"ans":"C","tag":"习思想·强军目标","exp":"强军目标是听党指挥（灵魂）、能打胜仗（要害）、作风优良（保证），并明确到 2027 年实现建军一百年奋斗目标。"},{"n":179,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"教育的“三大属性”是指（　）。","opts":["基础属性、先导属性、全局属性","公益属性、产业属性、社会属性","政治属性、人民属性、战略属性","民族属性、时代属性、世界属性"],"ans":"C","tag":"习思想·教育属性","exp":"教育的政治属性、人民属性、战略属性，是建设教育强国的根本遵循。"},{"n":180,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"乡村振兴的“五个振兴”是产业振兴、人才振兴、文化振兴、生态振兴和（　）。","opts":["基础设施振兴","治理振兴","科技振兴","组织振兴"],"ans":"D","tag":"习思想·五个振兴","exp":"“五个振兴”为产业、人才、文化、生态、组织振兴，其中产业振兴是重中之重，组织振兴是保障。"},{"n":181,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"下列不属于国家区域重大战略的是（　）。","opts":["粤港澳大湾区建设","京津冀协同发展","长江经济带发展","西部大开发战略"],"ans":"D","tag":"习思想·区域战略","exp":"京津冀、长江经济带、粤港澳大湾区、长三角一体化、黄河流域生态保护为区域重大战略；西部大开发属于区域协调发展战略的组成部分。"},{"n":182,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"我国推进高水平对外开放，稳步扩大的是（　）。","opts":["补贴型开放","规模型开放","资源型开放","制度型开放"],"ans":"D","tag":"习思想·制度型开放","exp":"高水平对外开放以制度型开放为重点，对接高标准国际经贸规则，稳步扩大规则、规制、管理、标准等制度型开放。"},{"n":183,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"“江山就是人民，人民就是江山”体现的根本立场是（　）。","opts":["稳定压倒一切","经济发展优先","效率优先兼顾公平","人民至上"],"ans":"D","tag":"习思想·人民至上","exp":"人民至上是习近平新时代中国特色社会主义思想的世界观和方法论的重要内容，体现党的根本政治立场。"},{"n":184,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"新时代新征程党和国家的中心任务是（　）。","opts":["全面深化改革、完善社会主义市场经济体制","全面建成小康社会","基本实现社会主义现代化","团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴"],"ans":"D","tag":"习思想·中心任务","exp":"党的二十大明确，新时代新征程党的中心任务是以中国式现代化全面推进强国建设、民族复兴伟业。"},{"n":185,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"加快构建新发展格局，关键在于（　）。","opts":["扩大政府直接投资","持续扩大出口规模","提高居民储蓄率","经济循环的畅通无阻"],"ans":"D","tag":"习思想·新发展格局","exp":"构建新发展格局的关键在于经济循环的畅通无阻，要打通生产、分配、流通、消费各环节，不是关起门来搞循环。"},{"n":186,"part":"政治理论","sec":"党史党建","q":"1925 年爆发、持续时间达 16 个月、被称为世界工人运动史上时间最长的罢工是（　）。","opts":["开滦煤矿工人大罢工","安源路矿工人大罢工","京汉铁路工人大罢工","省港大罢工"],"ans":"D","tag":"党史·省港大罢工","exp":"省港大罢工 1925 年 6 月开始，广州、香港两地工人参加，坚持 16 个月，沉重打击了英帝国主义在香港的统治。"},{"n":187,"part":"政治理论","sec":"党史党建","q":"1927 年 11 月，在广东海丰、陆丰建立的全国第一个县级苏维埃政权，主要领导人是（　）。","opts":["杨殷","苏兆征","邓中夏","彭湃"],"ans":"D","tag":"党史·海陆丰苏维埃","exp":"彭湃领导海陆丰农民运动，1927 年 11 月建立海陆丰苏维埃政府，是中国第一个县级苏维埃政权，被誉为“农民运动大王”。"},{"n":188,"part":"政治理论","sec":"党史党建","q":"第一次国共合作正式形成的标志是（　）。","opts":["1926 年北伐战争开始","1923 年中共三大在广州召开","1925 年五卅运动爆发","1924 年国民党一大在广州召开"],"ans":"D","tag":"党史·国民党一大","exp":"1924 年 1 月国民党一大在广州召开，确立联俄、联共、扶助农工三大政策，标志第一次国共合作正式形成。"},{"n":189,"part":"政治理论","sec":"党史党建","q":"1924 年在广州创办、培养农民运动骨干的学校是（　）。","opts":["岭南大学","黄埔军校","广东大学","广州农民运动讲习所"],"ans":"D","tag":"党史·农讲所","exp":"广州农民运动讲习所 1924 年开办，彭湃、毛泽东先后主持，第六届由毛泽东任所长，为各地培养了大批农运干部。"},{"n":190,"part":"政治理论","sec":"党史党建","q":"抗战时期活跃在广东的著名人民抗日武装是（　）。","opts":["八路军","琼崖纵队","新四军","东江纵队"],"ans":"D","tag":"党史·东江纵队","exp":"东江纵队是抗日战争时期中国共产党在广东东江地区领导的人民抗日武装，琼崖纵队在海南，两者不要混。"},{"n":191,"part":"政治理论","sec":"党史党建","q":"1945 年党 章规定，党的全国代表大会和它所产生的中央委员会是党的最高领导机关；中央政治局和它的常务委员会在全国代表大会闭会期间行使中央委员会职权。"}]};

const KEY = 'gdquiz-' + QUIZ.meta.id;
const $ = s => document.querySelector(s);

const FKEY = KEY + '-fav';

let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ answers = {}; }

let favs = {};
try { favs = JSON.parse(localStorage.getItem(FKEY) || '{}'); } catch(e){ favs = {}; }

let list = QUIZ.questions.slice();   // 当前筛选后的题序
let pos = 0;                          // 在 list 中的位置
let filter = 'all';                   // all / 小节名 / fav
let favTab = null;

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(answers)); }catch(e){} }
function saveFav(){ try{ localStorage.setItem(FKEY, JSON.stringify(favs)); }catch(e){} }

function stats(){
  const total = QUIZ.questions.length;
  let done = 0, right = 0;
  QUIZ.questions.forEach(q => {
    const a = answers[q.n];
    if(a){ done++; if(a === q.ans) right++; }
  });
  return {total, done, right, rate: done ? Math.round(right/done*100) : null};
}

function refreshHeader(){
  const s = stats();
  $('#totalN').textContent = s.total;
  $('#doneN').textContent = s.done;
  const r = $('#rate');
  if(s.rate === null){ r.textContent = '—'; r.style.color = '#9ca3af'; }
  else {
    r.textContent = s.rate + '%';
    r.style.color = s.rate >= 80 ? '#15803d' : (s.rate >= 60 ? '#b45309' : '#b91c1c');
  }
  $('#pbar').style.width = (s.done / s.total * 100).toFixed(1) + '%';
  if(favTab){ favTab.textContent = '★ 收藏 ' + Object.keys(favs).length; }
}

function buildTabs(){
  const box = $('#tabs');
  const all = document.createElement('button');
  all.className = 'tab on'; all.textContent = '全部 ' + QUIZ.questions.length;
  all.onclick = () => { filter = 'all'; list = QUIZ.questions.slice(); pos = 0; render(); markTab(all); };
  box.appendChild(all);

  favTab = document.createElement('button');
  favTab.className = 'tab';
  favTab.textContent = '★ 收藏 ' + Object.keys(favs).length;
  favTab.onclick = () => {
    filter = 'fav';
    list = QUIZ.questions.filter(q => favs[q.n]);
    pos = 0; render(); markTab(favTab);
  };
  box.appendChild(favTab);

  QUIZ.sections.forEach(sec => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.textContent = sec.short;
    b.onclick = () => {
      filter = sec.name;
      list = QUIZ.questions.filter(q => q.sec === sec.name);
      pos = 0; render(); markTab(b);
    };
    box.appendChild(b);
  });
}
function markTab(el){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === el));
}

function renderEmpty(){
  $('#qno').textContent = '—';
  $('#qsec').textContent = '暂无题目';
  $('#qtext').textContent = '这里还没有题目。点题卡右上角的 ☆ 可以把想反复看的题收藏起来，之后在这里集中复习。';
  $('#opts').innerHTML = '';
  $('#exp').classList.remove('show');
  $('#star').style.visibility = 'hidden';
  $('#prev').disabled = true;
  $('#next').disabled = true;
  refreshHeader();
  buildGrid();
}

function render(){
  if(!list.length){ renderEmpty(); return; }
  const q = list[pos];
  const sel = answers[q.n];

  const st = $('#star');
  st.style.visibility = 'visible';
  const isFav = !!favs[q.n];
  st.textContent = isFav ? '★' : '☆';
  st.classList.toggle('on', isFav);
  st.onclick = () => {
    if(favs[q.n]) delete favs[q.n]; else favs[q.n] = 1;
    saveFav();
    if(filter === 'fav'){
      list = QUIZ.questions.filter(x => favs[x.n]);
      if(pos > list.length - 1) pos = Math.max(0, list.length - 1);
    }
    render();
  };

  $('#qno').textContent = '第 ' + q.n + ' 题';
  $('#qsec').textContent = q.sec;
  $('#qtext').textContent = q.q;

  const box = $('#opts');
  box.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((text, i) => {
    const k = letters[i];
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="k">' + k + '</span><span class="t"></span>';
    b.querySelector('.t').textContent = text;
    if(sel){
      b.classList.add('done');
      if(k === q.ans) b.classList.add('correct');
      else if(k === sel) b.classList.add('wrong');
      else b.classList.add('dim');
    } else {
      b.onclick = () => choose(k);
    }
    box.appendChild(b);
  });

  const exp = $('#exp');
  if(sel){
    exp.classList.add('show');
    const ok = sel === q.ans;
    const v = $('#verdict');
    v.className = 'verdict ' + (ok ? 'ok' : 'bad');
    v.innerHTML = (ok ? '✓ 回答正确' : '✗ 回答错误')
      + '<span class="badge">正确答案 ' + q.ans + '</span>';
    $('#tag').textContent = q.tag || '—';
    $('#expl').textContent = q.exp || '';
  } else {
    exp.classList.remove('show');
  }

  $('#redo').onclick = () => { delete answers[q.n]; save(); render(); };

  $('#prev').disabled = pos === 0;
  $('#next').disabled = pos === list.length - 1;
  $('#sheetBtn').textContent = '答题卡 ' + stats().done + '/' + stats().total;
  refreshHeader();
  buildGrid();
  window.scrollTo({top:0, behavior:'smooth'});
}

function choose(k){
  const q = list[pos];
  if(answers[q.n]) return;
  answers[q.n] = k;
  save();
  render();
}

function go(d){
  const np = pos + d;
  if(np < 0 || np >= list.length) return;
  pos = np; render();
}

function buildGrid(){
  const g = $('#grid');
  if(!g.dataset.built){
    g.dataset.built = '1';
  }
  g.innerHTML = '';
  const cur = list[pos] ? list[pos].n : -1;
  list.forEach(q => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.textContent = q.n;
    const a = answers[q.n];
    if(a) c.classList.add(a === q.ans ? 'ok' : 'bad');
    if(favs[q.n]) c.classList.add('fav');
    if(q.n === cur) c.classList.add('cur');
    c.onclick = () => { pos = list.findIndex(x => x.n === q.n); render(); closeSheet(); };
    g.appendChild(c);
  });
}

function openSheet(){ $('#mask').classList.add('show'); document.body.style.overflow='hidden'; buildGrid(); }
function closeSheet(){ $('#mask').classList.remove('show'); document.body.style.overflow=''; }

$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#sheetBtn').onclick = openSheet;
$('#closeSheet').onclick = closeSheet;
$('#closeTop').onclick = closeSheet;
$('#mask').onclick = e => { if(e.target === $('#mask')) closeSheet(); };

$('#jumpWrong').onclick = () => {
  const wrongIdx = list.findIndex((q, i) => i > pos && answers[q.n] && answers[q.n] !== q.ans);
  if(wrongIdx >= 0){ pos = wrongIdx; render(); closeSheet(); }
  else {
    const any = list.findIndex(q => answers[q.n] && answers[q.n] !== q.ans);
    if(any >= 0){ pos = any; render(); closeSheet(); }
    else alert('当前范围内没有错题。');
  }
};

$('#resetAll').onclick = () => {
  if(confirm('清空本期的全部答题记录？')){
    answers = {}; save(); pos = 0; render();
  }
};

document.addEventListener('keydown', e => {
  const k = e.key.toUpperCase();
  if(['1','2','3','4'].includes(k)) choose(['A','B','C','D'][+k - 1]);
  else if(['A','B','C','D'].includes(k)) choose(k);
  else if(k === 'F'){ const b = $('#star'); if(b && b.style.visibility !== 'hidden') b.click(); }
  else if(e.key === 'ArrowLeft') go(-1);
  else if(e.key === 'ArrowRight') go(1);
  else if(e.key === 'Escape') closeSheet();
});

$('#sub').textContent = QUIZ.meta.label;
buildTabs();
render();
</script>
</body>
</html>
