<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>广东省考刷题 第010期 · 2026-11-23</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#15181f; --sub:#6b7280; --line:#e6e8ec;
  --primary:#2563eb; --primary-soft:#eff4ff;
  --ok:#15803d; --ok-bg:#f0fdf4; --ok-line:#86efac;
  --bad:#b91c1c; --bad-bg:#fef2f2; --bad-line:#fca5a5;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.6;
  font-family:"Microsoft YaHei","微软雅黑",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:30;background:rgba(244,245,247,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
}
.htop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{font-size:16px;font-weight:650;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:2px;letter-spacing:0}
.hstat{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.hstat b{font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.hstat .rate{font-weight:600;font-variant-numeric:tabular-nums}
.pbar{height:3px;background:#e3e5ea;border-radius:0 0 3px 3px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--primary);transition:width .35s ease}

/* ---------- 分组 ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#4b5563;
  padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;
  transition:.15s;
}
.tab:hover{border-color:#c9ced8}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- 题目卡 ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 22px 18px}
.qmeta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin-bottom:12px}
.qmeta .no{font-weight:600;color:var(--primary);background:var(--primary-soft);padding:2px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
.qmeta .sec{padding:2px 9px;background:#f3f4f6;border-radius:6px}
.star{
  margin-left:auto;background:none;border:0;padding:2px 6px;border-radius:7px;
  font-size:19px;line-height:1;color:#c3c8d2;cursor:pointer;transition:.15s;
  font-family:inherit;
}
.star:hover{background:#f3f4f6;color:#f59e0b}
.star.on{color:#f59e0b}
.qtext{font-size:17px;line-height:1.8;font-weight:500;letter-spacing:.1px;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:#fff;border:1.5px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:15.5px;line-height:1.65;color:var(--ink);
  cursor:pointer;transition:.14s;font-family:inherit;
}
.opt:hover:not(.done){border-color:#b9c2d0;background:#fafbfc}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:50%;background:#f1f2f4;color:#4b5563;
  font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;
  margin-top:1px;transition:.14s;
}
.opt .t{flex:1}
.opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.62}
.opt.done{cursor:default}

/* ---------- 解析 ---------- */
.exp{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px;display:none}
.exp.show{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.verdict{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:10px;padding:6px 11px;border-radius:8px;width:fit-content}
.verdict.ok{color:#166534;background:#dcfce7}
.verdict.bad{color:#b91c1c;background:#fee2e2}
.verdict .badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.75);color:#4b5563}
.expline{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.expline .lbl{
  flex:0 0 auto;font-size:11.5px;font-weight:600;color:#6b7280;background:#f3f4f6;
  padding:2px 7px;border-radius:5px;margin-top:2px;
}
.expline .val{font-size:14.5px;line-height:1.8;color:#111827}
.redo{margin-top:14px;font-size:12.5px;color:#4b5563;background:#f3f4f6;border:0;border-radius:7px;padding:6px 12px;cursor:pointer;font-family:inherit}
.redo:hover{background:#e9ebef}

/* ---------- 底部操作 ---------- */
footer{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));
}
.finner{max-width:820px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
  padding:10px 16px;font-size:14px;font-weight:550;cursor:pointer;font-family:inherit;
  transition:.14s;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:#b9c2d0;background:#fafbfc}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);flex:1}
.btn.primary:hover{background:#000}
.btn.ghost{flex:1}
.btn.icon{padding:10px 13px}

/* ---------- 答题卡 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,18,25,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex;animation:fade .18s ease}
.sheet{
  background:#fff;width:100%;max-width:820px;border-radius:18px 18px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;
}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;padding-bottom:2px;z-index:2}
.sheet h3{margin:0;font-size:15px;font-weight:650}
.sheet .close{font-size:12.5px;color:#4b5563;background:#f3f4f6;border-radius:7px;padding:5px 11px;cursor:pointer;user-select:none}
.sheet .close:hover{background:#e9ebef}
.sheet .legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin:8px 0 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.cell{
  position:relative;aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:#fbfbfc;
  font-size:12px;color:#6b7280;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-variant-numeric:tabular-nums;transition:.12s;
}
.cell:hover{transform:translateY(-1px)}
.cell.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok);font-weight:600}
.cell.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad);font-weight:600}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.fav::after{content:'★';position:absolute;top:0;right:2px;font-size:7.5px;color:#f59e0b;line-height:1.4}
.sheetbar{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:0;background:#fff;padding:12px 0 2px;box-shadow:0 -10px 18px 6px #fff}
.sheetbar .btn{flex:1;justify-content:center}
.hint{text-align:center;font-size:11.5px;color:#9ca3af;margin-top:14px;line-height:1.7}

@media (max-width:560px){
  .qcard{padding:18px 16px 14px;border-radius:14px}
  .qtext{font-size:16px}
  .opt{font-size:15px;padding:11px 12px}
  .grid{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>

"sec":"广东省情与粤港澳大湾区","q":"粤剧被列入联合国教科文组织人类非物质文化遗产代表作名录的年份是（　）。","opts":["2001 年","2006 年","2009 年","2011 年"],"ans":"C","tag":"广东 粤剧","exp":"粤剧于 2009 年入选联合国教科文组织人类非物质文化遗产代表作名录。"},{"n":15,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东省内被列入《世界遗产名录》的文化遗产是（　）。","opts":["开平碉楼与村落","潮州广济桥","广州陈家祠","梅州围龙屋"],"ans":"A","tag":"广东 世界遗产","exp":"开平碉楼与村落 2007 年列入世界文化遗产；丹霞山 2010 年作为“中国丹霞”组成部分列入世界自然遗产。"},{"n":16,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东“侨批档案”入选的国际名录是（　）。","opts":["《世界记忆名录》","《世界遗产名录》","《世界非物质文化遗产名录》","《世界自然保护联盟名录》"],"ans":"A","tag":"广东 侨批档案","exp":"“侨批档案——海外华侨银信”2013 年入选联合国教科文组织《世界记忆名录》，广东潮汕、五邑侨批是主体。"},{"n":17,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"岭南禅宗的实际创立者是（　）。","opts":["慧远","惠能","神秀","道一"],"ans":"B","tag":"广东 惠能","exp":"六祖惠能是广东新兴人，主张直指人心、见性成佛，是禅宗南宗创立者，代表作《坛经》。"},{"n":18,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"明代广东籍思想家陈白沙（陈献章）的学术地位是（　）。","opts":["程朱理学的集大成者","明代心学的先声","乾嘉学派的代表","今文经学的开创者"],"ans":"B","tag":"广东 陈白沙","exp":"陈白沙为江门新会人，主张“静中养出端倪”“学贵自得”，开明代心学先河，影响湛若水、王阳明。"},{"n":19,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"康有为、梁启超在广东传播维新思想的重要讲学场所是（　）。","opts":["万木草堂","学海堂","广雅书院","菊坡精舍"],"ans":"A","tag":"广东 万木草堂","exp":"1891 年康有为在广州开办万木草堂，梁启超等人就学于此，成为维新变法思想的重要策源地。"},{"n":20,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"下列曲目属于广东音乐代表作的是（　）。","opts":["《二泉映月》","《雨打芭蕉》","《十面埋伏》","《春江花月夜》"],"ans":"B","tag":"广东 广东音乐","exp":"《雨打芭蕉》《步步高》《旱天雷》《赛龙夺锦》为广东音乐代表曲目；《二泉映月》为二胡曲，《十面埋伏》为琵琶曲。"},{"n":21,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"“端砚”的产地是广东（　）。","opts":["肇庆","韶关","梅州","潮州"],"ans":"A","tag":"广东 端砚","exp":"端砚产于肇庆（古称端州），为中国四大名砚之首，与歙砚、洮砚、澄泥砚并称。"},{"n":22,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"潮州广济桥俗称湘子桥，其最突出的建筑特点是（　）。","opts":["全石拱结构","梁桥与浮桥相结合，可开合通航","纯木结构廊桥","铁索吊桥"],"ans":"B","tag":"广东 广济桥","exp":"广济桥东西两段为梁桥、中间以梭船连接成浮桥，可开合通航，素有“十八梭船廿四洲”之说。"},{"n":23,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"中国（深圳）国际文化产业博览交易会的举办城市和频率是（　）。","opts":["广州，每年一届","深圳，每年一届","广州，每两年一届","深圳，每两年一届"],"ans":"B","tag":"广东 文博会","exp":"中国（深圳）国际文化产业博览交易会自 2004 年创办，每年 5 月在深圳举行，是我国文化产业领域国家级展会。"},{"n":24,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"粤港澳大湾区规划纲要提出共建“人文湾区”。其核心指向是（　）。","opts":["统一三地行政体制","增强文化认同，共建共享文化资源","合并三地文化产业统计口径","统一使用同一种方言"],"ans":"B","tag":"大湾区 人文湾区","exp":"“共建人文湾区”重在增强文化认同、塑造湾区人文精神、推动三地文化合作与公共文化资源共享。"},{"n":25,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东推进文化强省建设，对岭南文化的基本态度是（　）。","opts":["坚持创造性转化、创新性发展","以保护为主，不作开发利用","以引进外来文化为主","仅限于非物质文化遗产记录保存"],"ans":"A","tag":"广东 文化强省 双创","exp":"文化强省建设坚持“两创”方针，推动岭南文化创造性转化、创新性发展，同时保护传承与活化利用并重。"},{"n":26,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"下列属于广东公共文化服务创新品牌的是（　）。","opts":["“粤书吧”","“城市书房”省级统建","“农家书屋”全省统一连锁","“文化礼堂”全覆盖"],"ans":"A","tag":"广东 公共文化服务","exp":"广东打造“粤书吧”等新型阅读空间，推动公共文化服务进景区、进社区、进园区，形成城乡一体的服务网络。"},{"n":27,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东抓好文化数字化，主要着力点是（　）。","opts":["把全部文化遗产迁入博物馆","推动文化资源数字化采集与线上传播","限制线上文化消费","以纸质出版物替代数字出版"],"ans":"B","tag":"广东 文化数字化","exp":"文化数字化重在抢救性采集、数据库建设和数字内容生产传播，让岭南文化资源可及可用。"},{"n":28,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"粤港澳三地文化同源，下列最能体现三地共同文化纽带的是（　）。","opts":["粤剧、醒狮、龙舟等民俗","京剧与昆曲","秦腔与花儿","二人转与秧歌"],"ans":"A","tag":"大湾区 文化同源","exp":"粤剧、醒狮、龙舟、飘色等民俗在粤港澳三地广泛流传，是三地共同的文化记忆和情感纽带。"},{"n":29,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广州陈家祠（陈氏书院）以精美的建筑装饰著称，其代表性装饰工艺合称（　）。","opts":["三雕两塑","三彩两绣","四雕一塑","两雕三彩"],"ans":"A","tag":"广东 陈家祠","exp":"陈家祠集木雕、砖雕、石雕（三雕）与灰塑、陶塑（两塑）于一体，被誉为岭南建筑艺术明珠。"},{"n":30,"part":"常识判断","sec":"广东省情与粤港澳大湾区","q":"广东的国家历史文化名城不包括（　）。","opts":["广州","潮州","肇庆","深圳"],"ans":"D","tag":"广东 历史文化名城","exp":"广东国家历史文化名城包括广州、潮州、肇庆、佛山、梅州、雷州、中山、惠州，深圳不在其中。"},{"n":31,"part":"常识判断","sec":"法律常识","q":"下列不属于《行政强制法》规定的行政强制措施种类的是（　）。","opts":["限制公民人身自由","查封场所、设施或者财物","扣押财物","责令停产停业"],"ans":"D","tag":"行政强制法 强制措施种类","exp":"行政强制措施包括限制人身自由、查封、扣押、冻结存款汇款等；责令停产停业属于行政处罚。"},{"n":32,"part":"常识判断","sec":"法律常识","q":"关于行政强制措施的设定权限，下列表述正确的是（　）。","opts":["地方性法规可以设定查封场所、设施或者财物和扣押财物","地方政府规章可以设定查封、扣押","行政法规可以设定冻结存款、汇款","部门规章可以设定限制人身自由的强制措施"],"ans":"A","tag":"行政强制法 设定权限","exp":"法律可设定各类强制措施；行政法规不得设定限制人身自由和冻结存款汇款；地方性法规只能设定查封、扣押；规章及其他规范性文件一律不得设定。"},{"n":33,"part":"常识判断","sec":"法律常识","q":"行政强制执行由（　）设定。","opts":["法律","行政法规","地方性法规","省级政府规章"],"ans":"A","tag":"行政强制法 强制执行设定","exp":"行政强制执行只能由法律设定，行政法规、地方性法规、规章均无权设定。"},{"n":34,"part":"常识判断","sec":"法律常识","q":"行政机关查封、扣押的期限一般不得超过 30 日；情况复杂的，经批准可以延长，但延长期限不得超过（　）。","opts":["10 日","15 日","30 日","60 日"],"ans":"C","tag":"行政强制法 查封扣押期限","exp":"查封、扣押期限不得超过 30 日，情况复杂经行政机关负责人批准可延长，延长期限不得超过 30 日。"},{"n":35,"part":"常识判断","sec":"法律常识","q":"冻结存款、汇款的期限为 30 日，情况复杂经批准可以延长，延长期限不得超过（　）。","opts":["15 日","30 日","45 日","60 日"],"ans":"B","tag":"行政强制法 冻结期限","exp":"冻结存款、汇款期限 30 日，自冻结之日起计算；情况复杂经批准可延长，延长期限不得超过 30 日。"},{"n":36,"part":"常识判断","sec":"法律常识","q":"行政机关对逾期不履行金钱给付义务的当事人加处罚款或者滞纳金，其数额（　）。","opts":["可以超过金钱给付义务的数额","不得超出金钱给付义务的数额","按日 3% 且不设上限","由行政机关自由裁量，法律不作限制"],"ans":"B","tag":"行政强制法 加处罚款上限","exp":"加处罚款或者滞纳金的数额不得超出金钱给付义务的数额，防止“天价滞纳金”。"},{"n":37,"part":"常识判断","sec":"法律常识","q":"关于代履行，下列表述错误的是（　）。","opts":["代履行的费用由当事人承担","代履行前应送达代履行决定书","需要立即清除道路障碍物的，行政机关可以立即实施代履行","代履行只能由行政机关工作人员亲自实施"],"ans":"D","tag":"行政强制法 代履行","exp":"代履行可以由行政机关自行实施，也可以委托没有利害关系的第三人实施，并非只能由工作人员亲自实施。"},{"n":38,"part":"常识判断","sec":"法律常识","q":"行政机关实施行政强制执行，下列做法符合《行政强制法》规定的是（　）。","opts":["在夜间实施查封以避开当事人阻挠","对居民生活采取停止供水方式迫使履行","在法定节假日实施，但情况紧急的除外","扣押当事人唯一住房内的生活必需品"],"ans":"C","tag":"行政强制法 执行时间与方式","exp":"行政机关不得在夜间或者法定节假日实施行政强制执行，情况紧急的除外；不得对居民生活停水、停电、停热、停气迫使履行。"},{"n":39,"part":"常识判断","sec":"法律常识","q":"关于行政强制的实施主体，下列表述正确的是（　）。","opts":["行政强制措施权可以委托给社会组织行使","行政强制措施应由两名以上行政执法人员实施","一名执法人员实施即可，无需出示证件","行政强制执行必须由人民法院实施"],"ans":"B","tag":"行政强制法 实施主体","exp":"行政强制措施权不得委托，须由两名以上行政执法人员实施并出示执法身份证件；有强制执行权的行政机关可自行执行。"},{"n":40,"part":"常识判断","sec":"法律常识","q":"当事人在法定期限内不申请行政复议、不提起行政诉讼又不履行行政决定的，无强制执行权的行政机关可以自期限届满之日起（　）内申请人民法院强制执行。","opts":["1 个月","2 个月","3 个月","6 个月"],"ans":"C","tag":"行政强制法 申请法院执行","exp":"无行政强制执行权的行政机关应自当事人法定起诉期限届满之日起 3 个月内申请人民法院强制执行。"},{"n":41,"part":"常识判断","sec":"法律常识","q":"行政机关查封、扣押财物时，下列做法错误的是（　）。","opts":["查封、扣押限于涉案的场所、设施或者财物","可以查封、扣押公民个人及其所扶养家属的生活必需品","不得查封、扣押与违法行为无关的财物","对扣押财物应出具清单并妥善保管"],"ans":"B","tag":"行政强制法 查封扣押范围","exp":"行政机关不得查封、扣押公民个人及其所扶养家属的生活必需品，这是生存权保障的底线要求。"},{"n":42,"part":"常识判断","sec":"法律常识","q":"《监察工作信息公开条例》规定，下列信息中属于不得公开情形的是（　）。","opts":["监察机关机构设置和职责","正在调查处理过程中的过程性信息","监察法规制度","年度监察工作总体情况"],"ans":"B","tag":"监察信息公开条例","exp":"条例明确国家秘密与工作秘密、过程性信息、可能影响国家安全或妨害监察执法的信息等不予公开。"},{"n":43,"part":"常识判断","sec":"法律常识","q":"《党委（党组）对下级党组织“一把手”开展监督谈话工作办法》规定，被谈话人应当在谈话结束后（　）内提出整改措施。","opts":["15 日","1 个月","2 个月","3 个月"],"ans":"B","tag":"监督谈话工作办法","exp":"被谈话人应在谈话结束后 1 个月内提出整改措施，并按要求报告整改情况，形成监督闭环。"},{"n":44,"part":"常识判断","sec":"法律常识","q":"关于行政处罚与行政强制的区别，下列表述正确的是（　）。","opts":["罚款属于行政强制措施","责令停产停业属于行政强制执行","行政处罚是对违法行为的制裁，行政强制是迫使义务履行或维护状态的手段","两者均由行政法规设定即可"],"ans":"C","tag":"行政法 处罚与强制","exp":"行政处罚以制裁违法行为为目的，行政强制包括强制措施与强制执行，以预防危害、迫使履行义务为目的。"},{"n":45,"part":"常识判断","sec":"法律常识","q":"下列不属于政务处分种类的是（　）。","opts":["警告","记过","降级","留党察看"],"ans":"D","tag":"政务处分种类","exp":"政务处分为警告、记过、记大过、降级、撤职、开除；留党察看是党纪处分。"},{"n":46,"part":"常识判断","sec":"法律常识","q":"行政机关及其工作人员违法行使职权造成损害的，赔偿请求人应当向（　）提出赔偿请求。","opts":["作出侵权行为的行政机关","同级人民法院","同级人民检察院","上级人民政府"],"ans":"A","tag":"国家赔偿 义务机关","exp":"国家赔偿由侵权的行政机关作为赔偿义务机关；经复议机关复议的，复议机关对加重损害部分承担赔偿责任。"},{"n":47,"part":"常识判断","sec":"法律常识","q":"公民申请政府信息公开，行政机关不能当场答复的，应当自收到申请之日起（　）内予以答复。","opts":["7 个工作日","15 个工作日","20 个工作日","30 个工作日"],"ans":"C","tag":"政府信息公开 答复期限","exp":"行政机关应自收到申请之日起 20 个工作日内答复；需延长的经负责人同意可延长，延长不超过 20 个工作日。"},{"n":48,"part":"常识判断","sec":"法律常识","q":"行政机关作出行政许可决定，一般应当自受理申请之日起（　）内作出。","opts":["10 日","20 日","30 日","60 日"],"ans":"B","tag":"行政许可 决定期限","exp":"一般应自受理之日起 20 日内作出行政许可决定；20 日内不能作出、经批准可延长 10 日。"},{"n":49,"part":"常识判断","sec":"法律常识","q":"下列不属于全国人民代表大会职权的是（　）。","opts":["修改宪法","制定和修改基本法律","决定战争和和平的问题","解释法律"],"ans":"D","tag":"宪法 全国人大职权","exp":"解释法律是全国人大常委会的职权；全国人大行使修宪、制定基本法律、选举国家领导人、决定战争和和平等职权。"},{"n":50,"part":"常识判断","sec":"法律常识","q":"关于监察委员会，下列表述正确的是（　）。","opts":["监察委员会由同级人民代表大会产生，对它负责并受它监督","监察委员会隶属于同级人民政府","监察委员会主任由本级人大常委会任命","监察委员会行使审判权"],"ans":"A","tag":"宪法 监察委员会","exp":"国家监察委员会由全国人大产生，地方各级监察委员会由本级人大产生，均对本级人大及其常委会负责并受其监督。"},{"n":51,"part":"常识判断","sec":"经济常识","q":"用支出法核算国内生产总值，其构成不包括（　）。","opts":["最终消费支出","资本形成总额","货物和服务净出口","居民储蓄存款余额"],"ans":"D","tag":"经济 支出法 GDP","exp":"支出法 GDP＝最终消费支出＋资本形成总额＋货物和服务净出口，居民储蓄属于收入使用，不进入支出法核算。"},{"n":52,"part":"常识判断","sec":"经济常识","q":"下列属于财政政策工具的是（　）。","opts":["调整存款准备金率","发行国债","公开市场操作","调整再贴现率"],"ans":"B","tag":"经济 财政政策工具","exp":"财政政策工具包括税收、政府支出、国债、转移支付；存款准备金率、公开市场操作、再贴现率属于货币政策工具。"},{"n":53,"part":"常识判断","sec":"经济常识","q":"通货膨胀对下列群体最不利的是（　）。","opts":["持有固定利率债权的债权人","持有实物资产的居民","借款人","持有浮动利率债权的债权人"],"ans":"A","tag":"经济 通货膨胀影响","exp":"通货膨胀使货币购买力下降，固定利率债权的实际收益被侵蚀，对债权人不利、对债务人有利。"},{"n":54,"part":"常识判断","sec":"经济常识","q":"其他条件不变，某商品供给增加而需求不变，通常会导致（　）。","opts":["价格上升、成交量减少","价格下降、成交量增加","价格和成交量同时上升","价格和成交量同时下降"],"ans":"B","tag":"经济 供求与价格","exp":"供给曲线右移，均衡价格下降、均衡数量增加。"},{"n":55,"part":"常识判断","sec":"经济常识","q":"“边际效用递减”是指（　）。","opts":["消费越多总效用越低","在一定时间内连续消费同一商品，每增加一单位带来的效用增量递减","商品价格越高效用越低","收入越高效用越低"],"ans":"B","tag":"经济 边际效用","exp":"边际效用递减指同一商品连续消费时新增单位带来的满足感递减，总效用仍可能上升。"},{"n":56,"part":"常识判断","sec":"经济常识","q":"某人放弃年薪 20 万元的工作去读全日制硕士，两年学费 8 万元。其读研的机会成本主要包括（　）。","opts":["8 万元学费","40 万元工资收入","40 万元工资收入与 8 万元学费","生活费支出"],"ans":"C","tag":"经济 机会成本","exp":"机会成本是放弃的最大潜在收益，包括放弃的两年工资收入 40 万元，学费属于显性成本，二者共同构成读研的总经济成本。"},{"n":57,"part":"常识判断","sec":"经济常识","q":"人民币对美元汇率由 7.0 变为 6.8，其他条件不变，这一变化意味着（　）。","opts":["人民币贬值，中国出口商品价格相对下降","人民币升值，中国出口商品价格相对上升","人民币升值，中国出口竞争力增强","人民币贬值，进口商品价格下降"],"ans":"B","tag":"经济 汇率变动","exp":"同样美元兑换更少人民币即人民币升值，以美元计价的中国出口商品价格上升，出口竞争力相对减弱。"},{"n":58,"part":"常识判断","sec":"经济常识","q":"甲国生产 1 单位棉布需 2 小时、1 单位粮食需 4 小时；乙国分别为 3 小时和 9 小时。按比较优势，两国应（　）。","opts":["甲国专产粮食，乙国专产棉布","甲国专产棉布，乙国专产粮食","两国都专产棉布","两国均不参与分工"],"ans":"A","tag":"经济 比较优势","exp":"甲国 1 单位粮食的机会成本为 2 单位棉布，乙国为 3 单位棉布，甲国在粮食上相对优势更大；乙国在棉布上相对劣势更小，故乙国专产棉布。"},{"n":59,"part":"常识判断","sec":"经济常识","q":"衡量居民收入分配差距的常用指标是（　）。","opts":["恩格尔系数","基尼系数","CPI","PPI"],"ans":"B","tag":"经济 基尼系数","exp":"基尼系数衡量收入分配差距，0 为绝对平均、1 为绝对不平均；恩格尔系数衡量食品支出占比，反映生活水平。"},{"n":60,"part":"常识判断","sec":"经济常识","q":"政府为刺激经济扩大支出并减税，同时不增加货币供应，最可能出现的直接结果是（　）。","opts":["财政赤字扩大，利率面临上行压力","财政盈余扩大，利率下行","通货膨胀立即消失","国际收支必然改善"],"ans":"A","tag":"经济 财政赤字与挤出效应","exp":"扩张性财政政策在货币供应不变时推高利率，可能对私人投资产生挤出效应，并使赤字扩大。"},{"n":61,"part":"常识判断","sec":"科技与生活","q":"判断机器是否具备智能的“图灵测试”，其核心思路是（　）。","opts":["测量机器的运算速度","由人类评判者区分机器与人的对话，无法区分即视为具有智能","检测机器是否具备自我意识","比较机器与人的存储容量"],"ans":"B","tag":"科技 图灵测试","exp":"图灵 1950 年提出“模仿游戏”，以人类评判者能否在对话中辨别人与机器作为智能判据。"},{"n":62,"part":"常识判断","sec":"科技与生活","q":"深度学习的三要素通常指（　）。","opts":["数据、算法、算力","芯片、网络、电源","样本、标签、模型","输入、输出、反馈"],"ans":"A","tag":"科技 深度学习三要素","exp":"深度学习依赖海量数据、模型算法与算力支撑，三者缺一不可，这也是大模型训练的基本条件。"},{"n":63,"part":"常识判断","sec":"科技与生活","q":"当前主流大语言模型普遍采用的核心网络结构是（　）。","opts":["卷积神经网络","循环神经网络","基于注意力机制的 Transformer","决策树集成"],"ans":"C","tag":"科技 大模型结构","exp":"Transformer 以自注意力机制为核心，可并行处理长序列，是大语言模型的主流架构。"},{"n":64,"part":"常识判断","sec":"科技与生活","q":"让模型从带标签的数据中学习输入到输出的映射，这种学习方式是（　）。","opts":["监督学习","无监督学习","强化学习","迁移学习"],"ans":"A","tag":"科技 机器学习类型","exp":"监督学习使用带标签样本；无监督学习从无标签数据中发现结构；强化学习通过与环境交互的奖惩信号优化策略。"},{"n":65,"part":"常识判断","sec":"科技与生活","q":"“具身智能”强调的是（　）。","opts":["只进行文本生成的语言模型","智能体通过身体与物理环境交互并在交互中学习","在云端集中训练的算法","仅用于虚拟场景的仿真"],"ans":"B","tag":"科技 具身智能","exp":"具身智能指智能体依托实体形态与环境实时交互、感知、决策和行动，人形机器人是其典型载体。"},{"n":66,"part":"常识判断","sec":"科技与生活","q":"人工智能训练与推理所用的算力芯片，常见类型不包括（　）。","opts":["GPU","NPU","TPU","PLC"],"ans":"D","tag":"科技 算力芯片","exp":"GPU、NPU、TPU 均为面向并行计算或神经网络加速的芯片；PLC 是可编程逻辑控制器，属工业控制设备。"},{"n":67,"part":"常识判断","sec":"科技与生活","q":"“AI 智能体”（Agent）区别于普通对话模型的关键能力是（　）。","opts":["只能被动回答单轮问题","能够自主规划任务、调用工具并根据反馈调整行动","只能处理图像","必须依赖人工逐条指令"],"ans":"B","tag":"科技 AI 智能体","exp":"智能体具备目标分解、工具调用、记忆与环境反馈闭环能力，可在较少人工干预下完成多步任务。"},{"n":68,"part":"常识判断","sec":"科技与生活","q":"不法分子利用生成式人工智能伪造他人面部和声音实施诈骗，这类技术滥用被称为（　）。","opts":["深度伪造","数据脱敏","联邦学习","边缘计算"],"ans":"A","tag":"科技 深度伪造","exp":"深度伪造（Deepfake）利用生成模型合成逼真的音视频，是人工智能治理中重点防范的风险之一。"},{"n":69,"part":"常识判断","sec":"科技与生活","q":"算法在信贷审批中对某类群体系统性给出更低评分，这种问题属于（　）。","opts":["算法歧视","过拟合","数据脱敏","算力不足"],"ans":"A","tag":"科技 算法伦理","exp":"算法歧视源于训练数据偏见或目标函数设计不当，需要通过数据治理、公平性评估和人工复核加以约束。"},{"n":70,"part":"常识判断","sec":"科技与生活","q":"人工智能辅助医学影像诊断的主要价值在于（　）。","opts":["完全替代医师作出诊断","提高病灶筛查效率，减少漏诊，最终诊断仍由医师把关","替代病理切片制作","取代医院信息系统"],"ans":"B","tag":"科技 AI 医疗","exp":"AI 在影像筛查、病灶标注等环节提升效率，属辅助工具，诊断责任仍由医师承担。"},{"n":71,"part":"常识判断","sec":"科技与生活","q":"模型在训练集上表现很好、在新样本上表现明显变差，这种现象是（　）。","opts":["欠拟合","过拟合","梯度消失","数据漂移"],"ans":"B","tag":"科技 过拟合","exp":"过拟合是模型过度记忆训练数据细节、泛化能力下降，可通过正则化、增加数据、简化模型缓解。"},{"n":72,"part":"常识判断","sec":"科技与生活","q":"关于人工智能对就业的影响，比较准确的判断是（　）。","opts":["会替代全部岗位","对就业无任何影响","替代部分重复性岗位，同时创造新岗位，结构性调整压力上升","只影响制造业，不影响服务业"],"ans":"C","tag":"科技 AI 与就业","exp":"人工智能带来岗位替代与岗位创造并存的结构性变化，技能培训和劳动者转岗支持是应对重点。"},{"n":73,"part":"常识判断","sec":"人文历史","q":"郑和下西洋最远到达的地区是（　）。","opts":["印度半岛","波斯湾","非洲东海岸和红海沿岸","地中海沿岸"],"ans":"C","tag":"人文 郑和下西洋","exp":"郑和船队七下西洋，最远到达非洲东海岸和红海沿岸，比欧洲航海家的远航早半个多世纪。"},{"n":74,"part":"常识判断","sec":"人文历史","q":"明代“一条鞭法”的推行者是（　）。","opts":["张居正","海瑞","戚继光","徐阶"],"ans":"A","tag":"人文 一条鞭法","exp":"张居正推行一条鞭法，把田赋、徭役和各种杂税合并折银征收，推动了赋役制度货币化。"},{"n":75,"part":"常识判断","sec":"人文历史","q":"清朝雍正年间设立、标志君主专制达到顶峰的机构是（　）。","opts":["内阁","南书房","军机处","理藩院"],"ans":"C","tag":"人文 军机处","exp":"雍正设军机处，军机大臣跪受笔录、承旨办事，君主专制空前强化。"},{"n":76,"part":"常识判断","sec":"人文历史","q":"明清科举中，由皇帝亲自主持、考中者称进士的考试是（　）。","opts":["乡试","会试","殿试","院试"],"ans":"C","tag":"人文 明清科举","exp":"院试中秀才、乡试中举人、会试中贡士、殿试中进士，殿试一甲三名依次为状元、榜眼、探花。"},{"n":77,"part":"常识判断","sec":"人文历史","q":"《天工开物》的作者是（　）。","opts":["李时珍","宋应星","徐光启","徐霞客"],"ans":"B","tag":"人文 明清科技","exp":"《天工开物》为宋应星所著，被誉为“中国 17 世纪的工艺百科全书”；《本草纲目》李时珍、《农政全书》徐光启、《徐霞客游记》徐霞客。"},{"n":78,"part":"常识判断","sec":"人文历史","q":"郑成功收复台湾的时间是（　）。","opts":["1662 年","1624 年","1683 年","1684 年"],"ans":"A","tag":"人文 郑成功收复台湾","exp":"1662 年郑成功驱逐荷兰殖民者收复台湾；1683 年清军入台，1684 年设台湾府隶属福建。"},{"n":79,"part":"常识判断","sec":"人文历史","q":"清代广州“十三行”的职能是（　）。","opts":["管理广州城市治安","主办科举考试","经营对外贸易，代海关征收关税","负责海防军事"],"ans":"C","tag":"人文 十三行","exp":"十三行是清政府特许经营对外贸易的商行，一口通商时期广州成为对外通商唯一口岸。"},{"n":80,"part":"常识判断","sec":"人文历史","q":"《南京条约》中被割让给英国的是（　）。","opts":["新界","九龙司地方一区","香港岛","澳门"],"ans":"C","tag":"人文 南京条约","exp":"1842 年《南京条约》割香港岛；1860 年《北京条约》割九龙司地方一区；1898 年强租新界。"},{"n":81,"part":"常识判断","sec":"人文历史","q":"洋务运动中创办的近代军事工业代表是（　）。","opts":["开平矿务局","轮船招商局","江南制造总局","汉阳铁厂"],"ans":"C","tag":"人文 洋务运动","exp":"江南制造总局、福州船政局属军事工业；轮船招商局、开平矿务局、汉阳铁厂属民用工业。"},{"n":82,"part":"常识判断","sec":"人文历史","q":"黄埔军校创办于 1924 年，其校址位于（　）。","opts":["佛山","广州黄花岗","广州长洲岛","韶关"],"ans":"C","tag":"岭南 黄埔军校","exp":"1924 年国共合作创办陆军军官学校于广州黄埔长洲岛，培养了大批军事政治人才。"},{"n":83,"part":"常识判断","sec":"人文历史","q":"1911 年黄花岗起义发生的地点是（　）。","opts":["香港","武昌","广州","惠州"],"ans":"C","tag":"岭南 黄花岗起义","exp":"1911 年 4 月同盟会在广州发动起义失败，七十二烈士葬于黄花岗，史称黄花岗起义。"},{"n":84,"part":"常识判断","sec":"人文历史","q":"主持修建京张铁路的广东籍工程师是（　）。","opts":["唐廷枢","冯如","詹天佑","郑观应"],"ans":"C","tag":"岭南 詹天佑","exp":"詹天佑生于广东南海，主持修建京张铁路，创造“人”字形线路，是我国近代铁路工程先驱。"},{"n":85,"part":"常识判断","sec":"地理国情","q":"我国地势总特征是（　）。","opts":["东高西低，呈三级阶梯","南高北低，呈两级阶梯","西高东低，呈三级阶梯","四周高中间低"],"ans":"C","tag":"地理 地势特征","exp":"我国地势西高东低，呈三级阶梯分布，第一级为青藏高原，第二级为高原盆地，第三级为平原丘陵。"},{"n":86,"part":"常识判断","sec":"地理国情","q":"黄河发源于（　）。","opts":["唐古拉山脉","祁连山脉","巴颜喀拉山脉","昆仑山脉"],"ans":"C","tag":"地理 黄河源头","exp":"黄河发源于青海巴颜喀拉山北麓；长江发源于唐古拉山脉各拉丹冬峰。"},{"n":87,"part":"常识判断","sec":"地理国情","q":"我国季风区与非季风区的分界线大致是（　）。","opts":["秦岭—淮河一线","黑河—腾冲一线","大兴安岭—阴山—贺兰山—巴颜喀拉山—冈底斯山","昆仑山—祁连山一线"],"ans":"C","tag":"地理 季风区界线","exp":"季风区与非季风区以大兴安岭—阴山—贺兰山—巴颜喀拉山—冈底斯山为界；黑河—腾冲一线是人口分布界线。"},{"n":88,"part":"常识判断","sec":"地理国情","q":"我国四大地理区域中，以干旱为主要自然特征的是（　）。","opts":["北方地区","南方地区","西北地区","青藏地区"],"ans":"C","tag":"地理 四大地理区域","exp":"西北地区深居内陆、降水稀少，干旱是其突出特征；青藏地区以高寒为特征。"},{"n":89,"part":"常识判断","sec":"地理国情","q":"北回归线穿过广东省的（　）。","opts":["北部","中部偏北","西部","南部沿海"],"ans":"D","tag":"广东地理 北回归线","exp":"北回归线横穿广东南部，汕头、广州从化、封开一线设有北回归线标志塔。"},{"n":90,"part":"常识判断","sec":"地理国情","q":"世界上面积最大的大洋是（　）。","opts":["大西洋","北冰洋","印度洋","太平洋"],"ans":"D","tag":"地理 世界大洋","exp":"太平洋面积约 1.8 亿平方公里，居四大洋之首，也是最深的大洋（马里亚纳海沟）。"},{"n":91,"part":"常识判断","sec":"地理国情","q":"我国陆地邻国中，与我国接壤且面积最大的国家是（　）。","opts":["印度","哈萨克斯坦","蒙古","俄罗斯"],"ans":"D","tag":"地理 邻国","exp":"俄罗斯是我国陆地邻国中面积最大的国家，中俄边界线漫长；蒙古是最大的内陆邻国。"},{"n":92,"part":"常识判断","sec":"地理国情","q":"广东大部分地区的气候类型是（　）。","opts":["热带季风气候","地中海气候","温带季风气候","亚热带季风气候"],"ans":"D","tag":"广东地理 步走”战略。"},{"n":110,"part":"政治理论","sec":"最新时政","q":"关于《做焦裕禄式的县委书记》，下列说法错误的是（　）。","opts":["2026 年 7 月 1 日出版的第 13 期《求是》重新发表","是 2015 年 1 月在中央党校县委书记研修班学员座谈会上的讲话","指出县一级处于社会矛盾的前沿","系首次公开发表"],"ans":"D","tag":"C17 第 13 期求是","exp":"该文是重新发表，并非首次公开发表；文中强调县委书记处在维稳第一线，要履行好责任。"},{"n":111,"part":"政治理论","sec":"马克思主义基本原理","q":"“巧妇难为无米之炊”体现的哲学道理是（　）。","opts":["意识决定物质","物质决定意识，主观能动性受客观条件制约","意识可以脱离物质独立存在","物质与意识互不相干"],"ans":"B","tag":"马原 物质与意识","exp":"发挥主观能动性必须以尊重客观规律和客观条件为前提，体现物质第一性、意识第二性。"},{"n":112,"part":"政治理论","sec":"马克思主义基本原理","q":"“坐地日行八万里”说明（　）。","opts":["运动是绝对的，静止是相对的","静止是绝对的，运动是相对的","运动和静止互不相容","事物只有运动没有静止"],"ans":"A","tag":"马原 运动与静止","exp":"事物处在绝对运动中，同时存在相对静止，静中有动、动中有静，这是运动与静止的辩证关系。"},{"n":113,"part":"政治理论","sec":"马克思主义基本原理","q":"“因地制宜”“对症下药”共同体现的哲学原理是（　）。","opts":["矛盾的普遍性","矛盾的特殊性，具体问题具体分析","量变质变规律","否定之否定规律"],"ans":"B","tag":"马原 矛盾特殊性","exp":"不同事物的矛盾各有特点，要求具体分析矛盾的特殊性，用不同方法解决不同质的矛盾。"},{"n":114,"part":"政治理论","sec":"马克思主义基本原理","q":"“牵牛要牵牛鼻子”蕴含的方法论是（　）。","opts":["抓住主要矛盾","兼顾次要矛盾","坚持两点论","坚持均衡论"],"ans":"A","tag":"马原 主要矛盾","exp":"抓主要矛盾即抓重点、抓关键，同时不忽视次要矛盾，是两点论与重点论的统一。"},{"n":115,"part":"政治理论","sec":"马克思主义基本原理","q":"“千里之堤，溃于蚁穴”体现的哲学道理是（　）。","opts":["量变必然引起质变","量变积累到一定程度会引起质变","质变与量变无关","事物发展是一帆风顺的"],"ans":"B","tag":"马原 量变质变","exp":"量变是质变的必要准备，质变是量变的必然结果，蚁穴之微积累成溃堤之变。"},{"n":116,"part":"政治理论","sec":"马克思主义基本原理","q":"事物发展经过“肯定—否定—否定之否定”三个阶段，这一规律揭示的是（　）。","opts":["事物发展的方向和道路","事物的普遍联系","认识的来源","社会形态的更替动力"],"ans":"A","tag":"马原 否定之否定","exp":"否定之否定规律揭示事物发展的总方向是前进上升、道路是迂回曲折，即螺旋式上升、波浪式前进。"},{"n":117,"part":"政治理论","sec":"马克思主义基本原理","q":"“实践是检验真理的唯一标准”，这是因为（　）。","opts":["实践具有直接现实性，能把主观认识同客观实际相对照","实践是认识的目的","实践是认识的来源","实践具有社会历史性"],"ans":"A","tag":"马原 真理检验标准","exp":"真理是主观与客观相符合，只有具有直接现实性的实践才能把主观认识与客观结果联系起来加以检验。"},{"n":118,"part":"政治理论","sec":"马克思主义基本原理","q":"关于真理的绝对性与相对性，下列理解正确的是（　）。","opts":["真理是绝对的，不存在相对性","任何真理都是绝对性与相对性的统一","真理是相对的，因而不具有客观性","绝对真理与相对真理是两个不同的真理"],"ans":"B","tag":"马原 真理绝对性相对性","exp":"真理的绝对性指其客观性和无限发展的可能性，相对性指其条件性和近似性，二者统一于每一具体真理之中。"},{"n":119,"part":"政治理论","sec":"马克思主义基本原理","q":"感性认识与理性认识的关系是（　）。","opts":["理性认识依赖感性认识，感性认识有待上升为理性认识","二者相互独立","感性认识比理性认识更可靠","理性认识可以脱离感性认识产生"],"ans":"A","tag":"马原 感性理性认识","exp":"感性认识是认识的初级阶段，理性认识是高级阶段，二者在实践基础上相互依赖、相互渗透。"},{"n":120,"part":"政治理论","sec":"马克思主义基本原理","q":"社会存在与社会意识的关系是（　）。","opts":["社会意识决定社会存在","社会存在决定社会意识，社会意识具有相对独立性","二者平行发展互不影响","社会意识总是落后于社会存在"],"ans":"B","tag":"马原 社会存在与社会意识","exp":"社会存在决定社会意识，社会意识反映并反作用于社会存在，具有相对独立性，可能超前或滞后。"},{"n":121,"part":"政治理论","sec":"马克思主义基本原理","q":"生产关系适应生产力状况的规律，其核心内容是（　）。","opts":["生产力决定生产关系，生产关系反作用于生产力","生产关系决定生产力","生产力与生产关系始终一致","生产关系越先进越好"],"ans":"A","tag":"马原 生产力与生产关系","exp":"生产力是最活跃最革命的因素，决定生产关系；适合生产力状况的生产关系会促进生产力发展，反之则阻碍。"},{"n":122,"part":"政治理论","sec":"马克思主义基本原理","q":"经济基础与上层建筑矛盾运动的结果是（　）。","opts":["上层建筑始终不变","社会形态的更替","经济基础消失","阶级消灭"],"ans":"B","tag":"马原 经济基础与上层建筑","exp":"经济基础决定上层建筑，上层建筑反作用于经济基础，二者矛盾运动推动社会形态由低级向高级更替。"},{"n":123,"part":"政治理论","sec":"马克思主义基本原理","q":"“人民是历史的创造者”这一命题的理论依据是（　）。","opts":["人民群众是社会物质财富和精神财富的创造者，是社会变革的决定力量","人民群众人数最多","人民群众掌握国家政权","人民群众的道德水平最高"],"ans":"A","tag":"马原 人民群众","exp":"唯物史观从社会存在决定社会意识出发，认为人民群众的生产实践是社会历史发展的决定力量。"},{"n":124,"part":"政治理论","sec":"马克思主义基本原理","q":"马克思主义政治经济学中，商品的二因素是（　）。","opts":["使用价值和价值","具体劳动和抽象劳动","价值和交换价值","价格和价值"],"ans":"A","tag":"马原 商品二因素","exp":"商品是使用价值和价值的统一体；具体劳动创造使用价值，抽象劳动形成价值，这是劳动二重性。"},{"n":125,"part":"政治理论","sec":"马克思主义基本原理","q":"剩余价值的真正来源是（　）。","opts":["资本家的经营才能","雇佣工人的剩余劳动","机器的效率提升","市场交换的差价"],"ans":"B","tag":"马原 剩余价值来源","exp":"剩余价值由雇佣工人在剩余劳动时间内创造，被资本家无偿占有，这是资本主义剥削的实质。"},{"n":126,"part":"政治理论","sec":"马克思主义基本原理","q":"资本循环要顺利进行，必须具备的条件是（　）。","opts":["三种职能形式在空间上并存、在时间上继起","资本全部投入生产","资本全部停留在流通领域","只保留货币资本形态"],"ans":"A","tag":"马原 资本循环","exp":"产业资本依次经过购买、生产、销售三个阶段，三种职能形式在空间上并存、时间上继起，循环才能连续进行。"},{"n":127,"part":"政治理论","sec":"马克思主义基本原理","q":"平均利润率形成后，商品价值转化为（　）。","opts":["生产价格","垄断价格","市场价格","成本价格"],"ans":"A","tag":"马原 平均利润","exp":"部门之间竞争形成平均利润率，价值转化为生产价格（成本价格＋平均利润），这是资本主义自由竞争阶段的规律。"},{"n":128,"part":"政治理论","sec":"马克思主义基本原理","q":"垄断资本主义阶段，垄断组织获取高额利润的主要手段是（　）。","opts":["垄断价格","自由竞争降价","提高工资","无偿援助"],"ans":"A","tag":"马原 垄断利润","exp":"垄断组织凭借垄断地位制定垄断高价和垄断低价，获取垄断利润，其来源仍是工人阶级创造的剩余价值。"},{"n":129,"part":"政治理论","sec":"马克思主义基本原理","q":"经济全球化的实质是（　）。","opts":["各国经济制度的趋同","资本主义生产关系的全球扩张和资源配置的国际化","发展中国家的自主选择","国际贸易的简单扩大"],"ans":"B","tag":"马原 经济全球化","exp":"经济全球化是生产力发展和资本国际化的结果，实质是资本主义生产关系向全球扩张，同时带来资源全球配置。"},{"n":130,"part":"政治理论","sec":"马克思主义基本原理","q":"“两点论”与“重点论”的统一，要求我们（　）。","opts":["既全面看问题又善于抓主流和关键","只看主流不看支流","平均使用力量","回避矛盾"],"ans":"A","tag":"马原 两点论重点论","exp":"两点论要求全面把握矛盾双方，重点论要求分清主次、抓住主要方面，二者是辩证统一的。"},{"n":131,"part":"政治理论","sec":"毛泽东思想","q":"新民主主义革命的总路线中，革命的领导力量是（　）。","opts":["无产阶级","农民阶级","城市小资产阶级","民族资产阶级"],"ans":"A","tag":"毛概 总路线","exp":"新民主主义革命由无产阶级领导，以工农联盟为基础，反对帝国主义、封建主义、官僚资本主义。"},{"n":132,"part":"政治理论","sec":"毛泽东思想","q":"中国共产党在中国革命中战胜敌人的“三大法宝”是（　）。","opts":["统一战线、武装斗争、党的建设","土地革命、武装斗争、根据地建设","实事求是、群众路线、独立自主","自力更生、艰苦奋斗、勤俭建国"],"ans":"A","tag":"毛概 三大法宝","exp":"统一战线、武装斗争、党的建设是中国革命战胜敌人的三大法宝，其中党的建设是中心环节。"},{"n":133,"part":"政治理论","sec":"毛泽东思想","q":"中国革命走“农村包围城市、武装夺取政权”道路的根本原因是（　）。","opts":["中国是半殖民地半封建社会，政治经济发展不平衡，敌人统治力量集中在城市","农民占人口多数","城市工人力量薄弱","国际援助来自农村地区"],"ans":"A","tag":"毛概 农村包围城市","exp":"半殖民地半封建的中国，内无民主外无独立，敌人力量集中于城市而农村统治薄弱，决定了必须走农村包围城市的道路。"},{"n":134,"part":"政治理论","sec":"毛泽东思想","q":"完整提出新民主主义革命理论、系统阐明新民主主义政治经济文化的著作是（　）。","opts":["《新民主主义论》","《论持久战》","《论联合政府》","《中国革命和中国共产党》"],"ans":"A","tag":"毛概 新民主主义论","exp":"1940 年《新民主主义论》系统阐明新民主主义的政治、经济和文化纲领，标志新民主主义革命理论成熟。"},{"n":135,"part":"政治理论","sec":"毛泽东思想","q":"我国对资本主义工商业进行社会主义改造采取的方式是（　）。","opts":["无偿没收","和平赎买","强制征购","合作化"],"ans":"B","tag":"毛概 三大改造","exp":"对资本主义工商业采取利用、限制、改造的方针，通过国家资本主义形式实行和平赎买；农业和手工业走合作化道路。"},{"n":136,"part":"政治理论","sec":"毛泽东思想","q":"毛泽东提出“以苏为鉴”、探索适合中国国情的社会主义建设道路的著作是（　）。","opts":["《论十大关系》","《关于正确处理人民内部矛盾的问题》","《实践论》","《论人民民主专政》"],"ans":"A","tag":"毛概 论十大关系","exp":"1956 年《论十大关系》提出调动一切积极因素为社会主义事业服务的方针，是探索中国社会主义建设道路的开篇之作。"},{"n":137,"part":"政治理论","sec":"毛泽东思想","q":"毛泽东提出区分和处理两类不同性质社会矛盾的学说出自（　）。","opts":["《关于正确处理人民内部矛盾的问题》","《论十大关系》","《矛盾论》","《为人民服务》"],"ans":"A","tag":"毛概 两类矛盾","exp":"1957 年《关于正确处理人民内部矛盾的问题》提出敌我矛盾和人民内部矛盾两类矛盾，前者用专政方法、后者用民主方法解决。"},{"n":138,"part":"政治理论","sec":"毛泽东思想","q":"毛泽东思想活的灵魂是（　）。","opts":["实事求是、群众路线、独立自主","解放思想、实事求是、与时俱进","自力更生、艰苦奋斗、勤俭节约","理论联系实际、密切联系群众、批评与自我批评"],"ans":"A","tag":"毛概 活的灵魂","exp":"实事求是、群众路线、独立自主是毛泽东思想活的灵魂；理论联系实际、密切联系群众、批评与自我批评是党的三大作风。"},{"n":139,"part":"政治理论","sec":"毛泽东思想","q":"把毛泽东思想确立为党的指导思想并写入党章的是（　）。","opts":["党的六大","党的七大","党的八大","党的九大"],"ans":"B","tag":"毛概 七大","exp":"1945 年党的七大确立毛泽东思想为党的指导思想并写入党章，是党在政治上思想上成熟的标志。"},{"n":140,"part":"政治理论","sec":"毛泽东思想","q":"中国共产党区别于其他政党的显著标志是（　）。","opts":["党的三大作风","党的组织规模","党的武装力量","党的宣传手段"],"ans":"A","tag":"毛概 三大作风","exp":"理论联系实际、密切联系群众、批评与自我批评三大作风，是中国共产党区别于其他政党的显著标志。"},{"n":141,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"邓小平理论首要的基本理论问题是（　）。","opts":["什么是社会主义、怎样建设社会主义","建设什么样的党、怎样建设党","实现什么样的发展、怎样发展","什么是现代化、怎样实现现代化"],"ans":"A","tag":"中特 邓小平理论","exp":"邓小平理论围绕“什么是社会主义、怎样建设社会主义”展开，核心是社会主义本质论。"},{"n":142,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"社会主义的本质是（　）。","opts":["单一的公有制和按劳分配","解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕","高度集中的计划经济","平均主义分配"],"ans":"B","tag":"中特 社会主义本质","exp":"1992 年南方谈话概括社会主义本质，突出生产力与共同富裕的统一，破除了把计划与市场当作制度属性的错误认识。"},{"n":143,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"“三个有利于”标准是指有利于（　）。","opts":["扩大出口、引进外资、增加外汇","发展社会主义社会的生产力、增强社会主义国家的综合国力、提高人民的生活水平","稳定物价、增加就业、平衡收支","发展重工业、轻工业、农业"],"ans":"B","tag":"中特 三个有利于","exp":"“三个有利于”是判断改革和各方面工作是非得失的根本标准，核心是生产力标准。"},{"n":144,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"我国现代化建设“三步走”战略中，第一步目标是（　）。","opts":["达到小康水平","解决人民温饱问题","基本实现现代化","建成中等发达国家"],"ans":"B","tag":"中特 三步走","exp":"三步走：第一步 1990 年解决温饱，第二步 20 世纪末达到小康，第三步 21 世纪中叶基本实现现代化。"},{"n":145,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"“三个代表”重要思想的集中概括是党必须始终代表（　）。","opts":["工人阶级、农民阶级、知识分子的利益","中国先进生产力的发展要求、中国先进文化的前进方向、中国最广大人民的根本利益","先进制造业、现代服务业、现代农业的发展方向","国家利益、集体利益、个人利益"],"ans":"B","tag":"中特 三个代表","exp":"“三个代表”回答建设什么样的党、怎样建设党的问题，本质是立党为公、执政为民。"},{"n":146,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"科学发展观的第一要义是（　）。","opts":["以人为本","发展","全面协调可持续","统筹兼顾"],"ans":"B","tag":"中特 科学发展观","exp":"科学发展观第一要义是发展，核心是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。"},{"n":147,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"明确提出建立社会主义市场经济体制改革目标的会议是（　）。","opts":["党的十二大","党的十三大","党的十四大","党的十五大"],"ans":"C","tag":"中特 市场经济体制","exp":"1992 年党的十四大明确提出我国经济体制改革的目标是建立社会主义市场经济体制。"},{"n":148,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"“一国两制”构想最初是为解决（　）问题提出的。","opts":["香港","台湾","澳门","香港和澳门"],"ans":"B","tag":"中特 一国两制","exp":"“一国两制”最早为解决台湾问题提出，首先运用于香港、澳门回归实践。"},{"n":149,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"党在社会主义初级阶段基本路线的核心内容是（　）。","opts":["三个有利于","一个中心、两个基本点","四项基本原则","改革开放"],"ans":"B","tag":"中特 基本路线","exp":"基本路线即以经济建设为中心，坚持四项基本原则、坚持改革开放，简称“一个中心、两个基本点”。"},{"n":150,"part":"政治理论","sec":"中国特色社会主义理论体系","q":"社会主义核心价值体系的基本内容不包括（　）。","opts":["马克思主义指导思想","中国特色社会主义共同理想","以爱国主义为核心的民族精神和以改革创新为核心的时代精神","按劳分配为主体"],"ans":"D","tag":"中特 核心价值体系","exp":"社会主义核心价值体系包括马克思主义指导思想、中国特色社会主义共同理想、民族精神与时代精神、社会主义荣辱观。"},{"n":151,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"新时代我国社会主要矛盾是（　）。","opts":["人民日益增长的物质文化需要同落后的社会生产之间的矛盾","人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","经济发展与生态保护之间的矛盾","城乡差距与区域差距之间的矛盾"],"ans":"B","tag":"习思想 主要矛盾","exp":"党的十九大作出转化判断：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。"},{"n":152,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"中国特色社会主义最本质的特征是（　）。","opts":["共同富裕","中国共产党领导","公有制为主体","人民当家作主"],"ans":"B","tag":"习思想 最本质特征","exp":"中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导。"},{"n":153,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"中国特色社会主义事业“五位一体”总体布局是（　）。","opts":["经济建设、政治建设、文化建设、社会建设、党的建设","经济建设、政治建设、文化建设、社会建设、生态文明建设","物质文明、精神文明、政治文明、社会文明、生态文明","工业化、信息化、城镇化、农业现代化、绿色化"],"ans":"B","tag":"习思想 五位一体","exp":"“五位一体”总体布局为经济建设、政治建设、文化建设、社会建设、生态文明建设，其中生态文明建设是新增内容。"},{"n":154,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"“四个全面”战略布局中居于引领地位的是（　）。","opts":["全面深化改革","全面建设社会主义现代化国家","全面依法治国","全面从严治党"],"ans":"B","tag":"习思想 四个全面","exp":"“四个全面”为全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党，前者是战略目标、居于引领地位。"},{"n":155,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"新发展理念的内容是（　）。","opts":["创新、协调、开放、共享、安全","创新、协调、绿色、开放、共享","高质量、高效率、公平、可持续、安全","改革、发展、稳定、和谐、共享"],"ans":"B","tag":"习思想 新发展理念","exp":"创新是引领发展的第一动力，协调是内生特点，绿色是普遍形态，开放是必由之路，共享是根本目的。"},{"n":156,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"构建新发展格局，其战略基点是（　）。","opts":["扩大出口","扩大内需","增加投资","引进外资"],"ans":"B","tag":"习思想 新发展格局","exp":"构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，坚持扩大内需这个战略基点。"},{"n":157,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"推动高质量发展的核心标志是（　）。","opts":["GDP 增速领先","全要素生产率大幅提升","出口规模扩大","固定资产投资增加"],"ans":"B","tag":"习思想 高质量发展","exp":"高质量发展以全要素生产率大幅提升为核心标志，坚持创新成为第一动力、协调成为内生特点。"},{"n":158,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"共同富裕的实现路径强调（　）。","opts":["同步富裕、同等富裕","在高质量发展中促进共同富裕，分阶段推进","一次分配即平均分配","由市场自发实现"],"ans":"B","tag":"习思想 共同富裕","exp":"共同富裕是全体人民共同富裕、人民群众物质生活和精神生活都富裕，在高质量发展中分阶段促进，不是同步富裕、平均主义。"},{"n":159,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"全过程人民民主的本质属性是（　）。","opts":["基层自治","协商民主","人民当家作主","依法治国"],"ans":"C","tag":"习思想 全过程人民民主","exp":"全过程人民民主是社会主义民主政治的本质属性，人民当家作主是其本质与核心。"},{"n":160,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"全面依法治国的总目标是（　）。","opts":["建立完备的法律条文体系","实现司法独立","建设中国特色社会主义法治体系、建设社会主义法治国家","扩大行政处罚范围"],"ans":"C","tag":"习思想 全面依法治国","exp":"全面依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家，坚持依法治国、依法执政、依法行政共同推进。"},{"n":161,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"“两个结合”是指把马克思主义基本原理同（　）相结合。","opts":["中国发展阶段、社会主义市场经济","中国传统文化、世界先进文明","中国具体实际、中华优秀传统文化","中国国情、国际形势"],"ans":"C","tag":"习思想 两个结合","exp":"“两个结合”即同中国具体实际相结合、同中华优秀传统文化相结合，是推进马克思主义中国化时代化的根本途径。"},{"n":162,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"对待中华优秀传统文化的方针是（　）。","opts":["全盘否定","原封不动地继承","创造性转化、创新性发展","只作博物馆式保存"],"ans":"C","tag":"习思想 两创方针","exp":"坚持创造性转化、创新性发展，把马克思主义思想精髓同中华优秀传统文化精华贯通起来。"},{"n":163,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"意识形态工作的根本任务是（　）。","opts":["加强网络技术管控","扩大对外宣传规模","建设具有强大凝聚力和引领力的社会主义意识形态","增加文化产品产量"],"ans":"C","tag":"习思想 意识形态","exp":"意识形态工作是为国家立心、为民族立魂的工作，根本任务是建设具有强大凝聚力和引领力的社会主义意识形态。"},{"n":164,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"保障和改善民生坚持的基本方针是（　）。","opts":["效率优先、兼顾公平","全面兜底、一步到位","尽力而为、量力而行","政府包办、社会退出"],"ans":"C","tag":"习思想 民生","exp":"民生建设坚持尽力而为、量力而行，守住底线、突出重点、完善制度、引导预期。"},{"n":165,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"“绿水青山就是金山银山”所体现的核心关系是（　）。","opts":["经济发展必然破坏生态","生态保护优先于一切发展","经济发展与生态保护的辩证统一","生态价值无法转化为经济价值"],"ans":"C","tag":"习思想 两山理念","exp":"“两山”理念揭示保护生态环境就是保护生产力、改善生态环境就是发展生产力，二者辩证统一。"},{"n":166,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"我国“双碳”目标是（　）。","opts":["2035 年前碳达峰、2060 年前碳中和","2025 年前碳达峰、2050 年前碳中和","2030 年前碳达峰、2060 年前碳中和","2030 年前碳中和、2060 年前碳达峰"],"ans":"C","tag":"习思想 双碳目标","exp":"我国承诺二氧化碳排放力争 2030 年前达到峰值、努力争取 2060 年前实现碳中和。"},{"n":167,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"总体国家安全观以（　）为宗旨。","opts":["经济安全","政治安全","人民安全","军事安全"],"ans":"C","tag":"习思想 总体国家安全观","exp":"总体国家安全观以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事科技文化社会安全为保障。"},{"n":168,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"人类命运共同体理念的核心内涵是（　）。","opts":["输出中国模式","建立世界政府","建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界","实行贸易保护"],"ans":"C","tag":"习思想 人类命运共同体","exp":"人类命运共同体主张建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界，推动构建新型国际关系。"},{"n":169,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"我国提出的三大全球倡议不包括（　）。","opts":["全球发展倡议","全球安全倡议","全球文明倡议","全球货币倡议"],"ans":"D","tag":"习思想 三大全球倡议","exp":"三大全球倡议为全球发展倡议、全球安全倡议、全球文明倡议，不包含“全球货币倡议”。"},{"n":170,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"共建“一带一路”坚持的原则是（　）。","opts":["竞争优先、效率至上","独立自主、自力更生","共商共建共享","封闭排他"],"ans":"C","tag":"习思想 一带一路","exp":"共建“一带一路”秉持共商共建共享原则，坚持开放、绿色、廉洁理念，实现高标准、惠民生、可持续。"},{"n":171,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"党的自我革命跳出历史周期率的答案是（　）。","opts":["经济发展","群众运动","自我革命","制度建设"],"ans":"C","tag":"习思想 自我革命","exp":"党找到的第二个答案是自我革命，以刀刃向内的勇气解决自身问题，永葆先进性和纯洁性。"},{"n":172,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"新时代党的建设总要求以（　）为统领。","opts":["党的组织建设","党的思想建设","党的政治建设","党的作风建设"],"ans":"C","tag":"习思想 党的建设总要求","exp":"新时代党的建设总要求以党的政治建设为统领，全面推进政治、思想、组织、作风、纪律建设，把制度建设贯穿其中。"},{"n":173,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"一体推进“三不腐”是指（　）。","opts":["不敢腐、不会腐、不屑腐","不能腐、不愿腐、不必腐","不敢腐、不能腐、不想腐","不想腐、不需腐、不敢腐"],"ans":"C","tag":"习思想 三不腐","exp":"一体推进不敢腐、不能腐、不想腐，是反腐败斗争的基本方针和全面从严治党的重要方略。"},{"n":174,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"党在新时代的强军目标是（　）。","opts":["实现军队经商自养","扩大军队规模","建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队","以数量优势取胜"],"ans":"C","tag":"习思想 强军目标","exp":"强军目标是建设听党指挥、能打胜仗、作风优良的人民军队，到本世纪中叶把人民军队全面建成世界一流军队。"},{"n":175,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"军民融合发展的核心是（　）。","opts":["军工企业全部民营化","军队全面参与市场竞争","把国防和军队建设融入国家经济社会发展体系","地方承担全部国防任务"],"ans":"C","tag":"习思想 军民融合","exp":"军民融合重在需求牵引、国家主导、市场运作，把国防和军队现代化建设融入经济社会发展体系。"},{"n":176,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"实现高水平科技自立自强的关键是（　）。","opts":["增加论文数量","扩大技术引进规模","坚决打赢关键核心技术攻坚战","依赖国际分工"],"ans":"C","tag":"习思想 科技自立自强","exp":"科技自立自强是国家发展的战略支撑，必须坚决打赢关键核心技术攻坚战，把创新主动权掌握在自己手中。"},{"n":177,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"人才强国战略强调（　）。","opts":["资金是第一资源","人才是第二资源","人才是第一资源","土地是第一资源"],"ans":"C","tag":"习思想 人才强国","exp":"人才是第一资源，创新是第一动力，科技是第一生产力，三者对应关系不可互换。"},{"n":178,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"教育的根本任务是（　）。","opts":["扩大招生规模","提高升学率","立德树人","培养技能工人"],"ans":"C","tag":"习思想 教育强国","exp":"教育的根本任务是立德树人，培养德智体美劳全面发展的社会主义建设者和接班人。"},{"n":179,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"全面推进乡村振兴，必须坚持（　）作为全党工作重中之重。","opts":["发展重工业","扩大城市规模","解决好“三农”问题","增加耕地面积"],"ans":"C","tag":"习思想 乡村振兴","exp":"坚持把解决好“三农”问题作为全党工作重中之重，促进城乡融合发展，加快建设农业强国。"},{"n":180,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"促进区域协调发展，我国实施的重大战略不包括（　）。","opts":["京津冀协同发展","长江经济带发展","粤港澳大湾区建设","东部地区单极优先发展"],"ans":"D","tag":"习思想 区域协调","exp":"区域重大战略包括京津冀协同发展、长江经济带发展、粤港澳大湾区建设、长三角一体化发展、黄河流域生态保护和高质量发展等。"},{"n":181,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"坚持“两个毫不动摇”是指（　）。","opts":["毫不动摇扩大对外开放，毫不动摇保护国内市场","毫不动摇发展国有经济，毫不动摇限制民营经济","毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展","毫不动摇按劳分配，毫不动摇按资分配"],"ans":"C","tag":"习思想 两个毫不动摇","exp":"“两个毫不动摇”是社会主义基本经济制度的重要内容，公有制经济与非公有制经济都是社会主义市场经济的重要组成部分。"},{"n":182,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"新时代解决台湾问题的基本方针是（　）。","opts":["一国两府","武力解决","和平统一、一国两制","先经济后政治"],"ans":"C","tag":"习思想 祖国统一","exp":"坚持一个中国原则和“九二共识”，坚持和平统一、一国两制基本方针，推动两岸关系和平发展。"},{"n":183,"part":"政治理论","sec":"习近平新时代中国特色社会主义思想","q":"新时代党的民族工作主线是（　）。","opts":["推广通用语言文字","加快民族地区经济增长","铸牢中华民族共同体意识","发展民族特色产业"],"ans":"C","tag":"习思想 民族工作","exp":"铸牢中华民族共同体意识是新时代党的民族工作主线，也是 const KEY = 'gdquiz-' + QUIZ.meta.id;
const $ = s => document.querySelector(s);

const FKEY = KEY + '-fav';

let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ answers = {}; }

let favs = {};
try { favs = JSON.parse(localStorage.getItem(FKEY) || '{}'); } catch(e){ favs = {}; }

let list = QUIZ.questions.slice();   // 当前筛选后的题序
let pos = 0;                          // 在 list 中的位置
let filter = 'all';                   // all / 小节名 / fav
let favTab = null;

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(answers)); }catch(e){} }
function saveFav(){ try{ localStorage.setItem(FKEY, JSON.stringify(favs)); }catch(e){} }

function stats(){
  const total = QUIZ.questions.length;
  let done = 0, right = 0;
  QUIZ.questions.forEach(q => {
    const a = answers[q.n];
    if(a){ done++; if(a === q.ans) right++; }
  });
  return {total, done, right, rate: done ? Math.round(right/done*100) : null};
}

function refreshHeader(){
  const s = stats();
  $('#totalN').textContent = s.total;
  $('#doneN').textContent = s.done;
  const r = $('#rate');
  if(s.rate === null){ r.textContent = '—'; r.style.color = '#9ca3af'; }
  else {
    r.textContent = s.rate + '%';
    r.style.color = s.rate >= 80 ? '#15803d' : (s.rate >= 60 ? '#b45309' : '#b91c1c');
  }
  $('#pbar').style.width = (s.done / s.total * 100).toFixed(1) + '%';
  if(favTab){ favTab.textContent = '★ 收藏 ' + Object.keys(favs).length; }
}

function buildTabs(){
  const box = $('#tabs');
  const all = document.createElement('button');
  all.className = 'tab on'; all.textContent = '全部 ' + QUIZ.questions.length;
  all.onclick = () => { filter = 'all'; list = QUIZ.questions.slice(); pos = 0; render(); markTab(all); };
  box.appendChild(all);

  favTab = document.createElement('button');
  favTab.className = 'tab';
  favTab.textContent = '★ 收藏 ' + Object.keys(favs).length;
  favTab.onclick = () => {
    filter = 'fav';
    list = QUIZ.questions.filter(q => favs[q.n]);
    pos = 0; render(); markTab(favTab);
  };
  box.appendChild(favTab);

  QUIZ.sections.forEach(sec => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.textContent = sec.short;
    b.onclick = () => {
      filter = sec.name;
      list = QUIZ.questions.filter(q => q.sec === sec.name);
      pos = 0; render(); markTab(b);
    };
    box.appendChild(b);
  });
}
function markTab(el){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === el));
}

function renderEmpty(){
  $('#qno').textContent = '—';
  $('#qsec').textContent = '暂无题目';
  $('#qtext').textContent = '这里还没有题目。点题卡右上角的 ☆ 可以把想反复看的题收藏起来，之后在这里集中复习。';
  $('#opts').innerHTML = '';
  $('#exp').classList.remove('show');
  $('#star').style.visibility = 'hidden';
  $('#prev').disabled = true;
  $('#next').disabled = true;
  refreshHeader();
  buildGrid();
}

function render(){
  if(!list.length){ renderEmpty(); return; }
  const q = list[pos];
  const sel = answers[q.n];

  const st = $('#star');
  st.style.visibility = 'visible';
  const isFav = !!favs[q.n];
  st.textContent = isFav ? '★' : '☆';
  st.classList.toggle('on', isFav);
  st.onclick = () => {
    if(favs[q.n]) delete favs[q.n]; else favs[q.n] = 1;
    saveFav();
    if(filter === 'fav'){
      list = QUIZ.questions.filter(x => favs[x.n]);
      if(pos > list.length - 1) pos = Math.max(0, list.length - 1);
    }
    render();
  };

  $('#qno').textContent = '第 ' + q.n + ' 题';
  $('#qsec').textContent = q.sec;
  $('#qtext').textContent = q.q;

  const box = $('#opts');
  box.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((text, i) => {
    const k = letters[i];
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="k">' + k + '</span><span class="t"></span>';
    b.querySelector('.t').textContent = text;
    if(sel){
      b.classList.add('done');
      if(k === q.ans) b.classList.add('correct');
      else if(k === sel) b.classList.add('wrong');
      else b.classList.add('dim');
    } else {
      b.onclick = () => choose(k);
    }
    box.appendChild(b);
  });

  const exp = $('#exp');
  if(sel){
    exp.classList.add('show');
    const ok = sel === q.ans;
    const v = $('#verdict');
    v.className = 'verdict ' + (ok ? 'ok' : 'bad');
    v.innerHTML = (ok ? '✓ 回答正确' : '✗ 回答错误')
      + '<span class="badge">正确答案 ' + q.ans + '</span>';
    $('#tag').textContent = q.tag || '—';
    $('#expl').textContent = q.exp || '';
  } else {
    exp.classList.remove('show');
  }

  $('#redo').onclick = () => { delete answers[q.n]; save(); render(); };

  $('#prev').disabled = pos === 0;
  $('#next').disabled = pos === list.length - 1;
  $('#sheetBtn').textContent = '答题卡 ' + stats().done + '/' + stats().total;
  refreshHeader();
  buildGrid();
  window.scrollTo({top:0, behavior:'smooth'});
}

function choose(k){
  const q = list[pos];
  if(answers[q.n]) return;
  answers[q.n] = k;
  save();
  render();
}

function go(d){
  const np = pos + d;
  if(np < 0 || np >= list.length) return;
  pos = np; render();
}

function buildGrid(){
  const g = $('#grid');
  if(!g.dataset.built){
    g.dataset.built = '1';
  }
  g.innerHTML = '';
  const cur = list[pos] ? list[pos].n : -1;
  list.forEach(q => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.textContent = q.n;
    const a = answers[q.n];
    if(a) c.classList.add(a === q.ans ? 'ok' : 'bad');
    if(favs[q.n]) c.classList.add('fav');
    if(q.n === cur) c.classList.add('cur');
    c.onclick = () => { pos = list.findIndex(x => x.n === q.n); render(); closeSheet(); };
    g.appendChild(c);
  });
}

function openSheet(){ $('#mask').classList.add('show'); document.body.style.overflow='hidden'; buildGrid(); }
function closeSheet(){ $('#mask').classList.remove('show'); document.body.style.overflow=''; }

$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#sheetBtn').onclick = openSheet;
$('#closeSheet').onclick = closeSheet;
$('#closeTop').onclick = closeSheet;
$('#mask').onclick = e => { if(e.target === $('#mask')) closeSheet(); };

$('#jumpWrong').onclick = () => {
  const wrongIdx = list.findIndex((q, i) => i > pos && answers[q.n] && answers[q.n] !== q.ans);
  if(wrongIdx >= 0){ pos = wrongIdx; render(); closeSheet(); }
  else {
    const any = list.findIndex(q => answers[q.n] && answers[q.n] !== q.ans);
    if(any >= 0){ pos = any; render(); closeSheet(); }
    else alert('当前范围内没有错题。');
  }
};

$('#resetAll').onclick = () => {
  if(confirm('清空本期的全部答题记录？')){
    answers = {}; save(); pos = 0; render();
  }
};

document.addEventListener('keydown', e => {
  const k = e.key.toUpperCase();
  if(['1','2','3','4'].includes(k)) choose(['A','B','C','D'][+k - 1]);
  else if(['A','B','C','D'].includes(k)) choose(k);
  else if(k === 'F'){ const b = $('#star'); if(b && b.style.visibility !== 'hidden') b.click(); }
  else if(e.key === 'ArrowLeft') go(-1);
  else if(e.key === 'ArrowRight') go(1);
  else if(e.key === 'Escape') closeSheet();
});

$('#sub').textContent = QUIZ.meta.label;
buildTabs();
render();
</script>
</body>
</html>
